<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512" role="img" aria-label="OmniView">
  <!--
    OmniView app mark — source of truth for app-icon-*.png.
    An "OV" monogram: the O is a compass ring (360° visibility), the V a rising
    arrow (insight / growth). Regenerate the PNGs from this file after editing.
    The same artwork is inlined in index.html three times (navbar Logo, boot
    splash, in-app loading screen) on a 36-unit tile — keep them in sync.
  -->
  <defs>
    <linearGradient id="ovG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset=".55" stop-color="#2da6e0"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="40" height="40" rx="12.8" fill="url(#ovG)"/>
  <rect x="0" y="0" width="40" height="18.9" rx="12.8" fill="#fff" opacity=".10"/>
  <g transform="translate(20,20) scale(1.1111) translate(-20,-20)">
    <circle cx="14.8" cy="20" r="6.2" fill="none" stroke="#fff" stroke-width="2.4"/>
    <path d="M18.19 16.61 L16.14 21.34 L13.46 18.66 Z" fill="#fff"/>
    <path d="M11.41 23.39 L16.14 21.34 L13.46 18.66 Z" fill="#fff" fill-opacity=".5"/>
    <path d="M23.6 14 L27.2 26.5 L32.6 12.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34.01 8.46 L35.48 12.21 L30.42 10.31 Z" fill="#fff"/>
  </g>
</svg>

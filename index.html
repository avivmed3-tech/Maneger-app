// ═══ YIELD DASHBOARD ════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function YieldDashboard({orders,projects,stages,workLogs}){
  const yC=p=>p>=95?"#10b981":p>=85?"#3b82f6":p>=70?"#f59e0b":"#ef4444";
  const yL=p=>p>=95?"מצוין":p>=85?"טוב":p>=70?"בינוני":"נמוך";
  const typL={quality:"איכות",process:"תהליך",material:"חומר גלם",equipment:"ציוד",human:"גורם אנושי",other:"אחר"};
  // ── Filters: פרויקט · מק"ט (P/N) · פק"ע ─────────────────────────────────
  // Each filter narrows the options of the ones after it, so a chosen פרויקט
  // only offers its own מק"טים, and a chosen מק"ט only offers its own פק"עים.
  const [fProj,setFProj]=useState("all");
  const [fPn,setFPn]=useState("all");
  const [fWo,setFWo]=useState("all");
  const allOrders=orders||[];
  const byProj=useMemo(()=>allOrders.filter(o=>fProj==="all"||o.projectId===fProj),[allOrders,fProj]);
  const pnOpts=useMemo(()=>[...new Set(byProj.map(o=>o.pn).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"he")),[allOrders,fProj]);
  const woOpts=useMemo(()=>byProj.filter(o=>fPn==="all"||o.pn===fPn).sort((a,b)=>String(a.woNumber||"").localeCompare(String(b.woNumber||""),"he")),[allOrders,fProj,fPn]);
  // Keep a narrower filter from sticking around once a wider one excluded it.
  useEffect(()=>{if(fPn!=="all"&&!pnOpts.includes(fPn))setFPn("all")},[pnOpts]);
  useEffect(()=>{if(fWo!=="all"&&!woOpts.some(o=>o.id===fWo))setFWo("all")},[woOpts]);
  const fOrders=useMemo(()=>woOpts.filter(o=>fWo==="all"||o.id===fWo),[woOpts,fWo]);
  const nFilters=(fProj!=="all"?1:0)+(fPn!=="all"?1:0)+(fWo!=="all"?1:0);
  const clearFilters=()=>{setFProj("all");setFPn("all");setFWo("all")};

  // Memoised, and the project looked up through a Map: this walks every פק"ע and
  // used to re-run on every render of the screen, scanning the project list once
  // per order and the whole order list once per defect type.
  const projMapY=useMemo(()=>new Map((projects||[]).map(p=>[p.id,p])),[projects]);
  const oY=useMemo(()=>fOrders.filter(o=>(o.serials||[]).length>0).map(o=>{
    const sn=(o.serials||[]).length,df=(o.defects||[]).filter(d=>d.status!=="closed").length;
    const yP=sn>0?Math.max(0,(1-df/sn)*100):100;
    return{...o,sn,df,yP,proj:projMapY.get(o.projectId)};
  }).sort((a,b)=>a.yP-b.yP),[fOrders,projMapY]);
  const avg=oY.length?oY.reduce((s,o)=>s+o.yP,0)/oY.length:100;
  const worst=oY.filter(o=>o.yP<90).slice(0,5);
  // One pass over the defects, tallied by type, instead of a pass per type.
  const typeDonut=useMemo(()=>{
    const n={};
    fOrders.forEach(o=>(o.defects||[]).forEach(d=>{if(d.status!=="closed")n[d.type]=(n[d.type]||0)+1}));
    return Object.entries(typL).map(([k,l])=>({label:l,value:n[k]||0})).filter(d=>d.value>0);
  },[fOrders]);
  const selLabel=[fProj!=="all"?(projects.find(p=>p.id===fProj)?.name||"פרויקט"):null,fPn!=="all"?`מק"ט ${fPn}`:null,fWo!=="all"?(allOrders.find(o=>o.id===fWo)?.woNumber||'פק"ע'):null].filter(Boolean).join(" · ");
  return(
    <div className="fade-in">
      <h2 style={{margin:"0 0 14px",fontSize:18}}>📉 Yield — ניתוח תקלות</h2>
      <Card style={{padding:"12px 14px",marginBottom:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{display:"flex",flexDirection:"column",gap:3,flex:"1 1 150px",minWidth:140}}>
          <label style={{fontSize:11,color:"var(--c-dim)"}}>פרויקט</label>
          <select value={fProj} onChange={e=>setFProj(e.target.value)} style={{padding:"7px 8px",fontSize:12}}>
            <option value="all">כל הפרויקטים</option>
            {(projects||[]).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:3,flex:"1 1 150px",minWidth:140}}>
          <label style={{fontSize:11,color:"var(--c-dim)"}}>מק"ט (P/N)</label>
          <select value={fPn} onChange={e=>{setFPn(e.target.value);setFWo("all")}} style={{padding:"7px 8px",fontSize:12}}>
            <option value="all">כל המק"טים</option>
            {pnOpts.map(pn=><option key={pn} value={pn}>{pn}</option>)}
          </select>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:3,flex:"1 1 150px",minWidth:140}}>
          <label style={{fontSize:11,color:"var(--c-dim)"}}>פק"ע</label>
          <select value={fWo} onChange={e=>setFWo(e.target.value)} style={{padding:"7px 8px",fontSize:12}}>
            <option value="all">כל הפק"עים</option>
            {woOpts.map(o=><option key={o.id} value={o.id}>{o.woNumber}{o.pn?` · ${o.pn}`:""}</option>)}
          </select>
        </div>
        {nFilters>0&&<Btn small color="#374151" onClick={clearFilters}>✕ נקה סינון</Btn>}
        <div style={{fontSize:12,color:"var(--c-dim)",paddingBottom:6}}>{fOrders.length} פק"ע בתצוגה</div>
      </Card>
      {nFilters>0&&<div style={{fontSize:11,color:"#06b6d4",marginBottom:10}}>🔍 מסונן: {selLabel}</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:14}}>
        <Tile icon="📊" label="Yield ממוצע" value={avg.toFixed(1)+"%"} color={yC(avg)} warn={avg<70}/>
        <Tile icon="🔧" label="תקלות פתוחות" value={fOrders.flatMap(o=>(o.defects||[]).filter(d=>d.status!=="closed")).length} color="#ef4444"/>
        <Tile icon="✅" label="נסגרו" value={fOrders.flatMap(o=>(o.defects||[]).filter(d=>d.status==="closed")).length} color="#10b981"/>
        <Tile icon="📋" label='פק"ע עם תקלות' value={fOrders.filter(o=>(o.defects||[]).some(d=>d.status!=="closed")).length} color="#f59e0b"/>
      </div>

      {/* Table - mobile friendly */}
      <Card style={{marginBottom:14}}>
        <div style={{fontWeight:700,marginBottom:12,fontSize:14}}>Yield לפי פק"ע</div>
        {oY.length===0?<EmptyState icon="📊" title={nFilters>0?"אין נתונים לסינון הזה":"אין נתונים"} subtitle={nFilters>0?"נסה לשנות את הפרויקט / המק\"ט / הפק\"ע, או לנקות את הסינון":"נתוני תפוקה יופיעו אחרי שיירשמו הזמנות"} action={nFilters>0?clearFilters:null} actionLabel="נקה סינון"/>:(
          // Virtualised — this is a row per פק"ע in the company, and every one of
          // them was built into the page whether or not it was ever scrolled to.
          <VirtualList items={oY} estimate={92} gap={6} renderRow={o=>(
              <div key={o.id} style={{background:"var(--c-deep)",borderRadius:8,padding:"10px 12px",border:`1px solid ${yC(o.yP)}22`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:4}}>
                  <div><span style={{fontWeight:700,color:"#60a5fa",fontSize:13}}>{o.woNumber}</span><span style={{fontSize:11,color:"#a78bfa",marginRight:6}}> {o.pn||""}</span></div>
                  <span style={{background:yC(o.yP)+"22",color:yC(o.yP),padding:"2px 8px",borderRadius:12,fontSize:11,fontWeight:700}}>{yL(o.yP)}</span>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{flex:1,height:8,background:"var(--c-border)",borderRadius:4,overflow:"hidden"}}><div style={{width:o.yP+"%",height:"100%",background:yC(o.yP),borderRadius:4}}/></div>
                  <span style={{fontWeight:800,color:yC(o.yP),fontSize:14,minWidth:50,textAlign:"left"}}>{o.yP.toFixed(1)}%</span>
                </div>
                <div style={{display:"flex",gap:12,fontSize:11,color:"var(--c-muted)",marginTop:4}}>
                  <span>{o.sn} יחידות</span>
                  <span style={{color:o.df>0?"#ef4444":"#10b981"}}>{o.df} תקלות</span>
                  {o.proj&&<span style={{color:"var(--c-tag-blue)"}}>{o.proj.name}</span>}
                </div>
              </div>
          )}/>
        )}
      </Card>

      {/* Donut */}
      <Card style={{marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:14}}>תקלות לפי סוג</div>
          <ChartInfo title="תקלות לפי סוג"
            shows="טבעת (Donut) שמפלגת את התקלות הפתוחות לפי סוג התקלה. כל פלח הוא סוג תקלה אחר."
            data="מספר התקלות הפתוחות (שאינן בסטטוס 'סגור') מכל סוג."
            how="המערכת עוברת על כל פקודות העבודה, מסננת את התקלות לפי סוג ולפי סטטוס שאינו 'סגור', וסופרת כמה יש מכל סוג."
            tip="הפלח הגדול ביותר הוא סוג התקלה הנפוץ ביותר — מועמד מוביל לבדיקת שורש ולשיפור תהליך."/>
        </div>
        <DonutChart data={typeDonut} size={160}/>
      </Card>

      {worst.length>0&&(<Card style={{border:"1px solid #ef444433"}}>
        <div style={{fontWeight:700,fontSize:14,color:"#ef4444",marginBottom:10}}>🚨 Yield נמוך ביותר</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {worst.map(o=>(<div key={o.id} style={{background:"var(--c-deep)",borderRadius:8,padding:"10px 12px",border:`1px solid ${yC(o.yP)}33`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><span style={{fontWeight:700,color:"#60a5fa",fontSize:13}}>{o.woNumber}</span>{o.proj&&<span style={{fontSize:11,color:"var(--c-tag-blue)",marginRight:6}}> {o.proj.name}</span>}</div>
            <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:11,background:yC(o.yP)+"22",color:yC(o.yP),padding:"2px 8px",borderRadius:12,fontWeight:600}}>{o.yP.toFixed(1)}%</span><span style={{fontSize:22,fontWeight:800,color:yC(o.yP)}}>{o.yP.toFixed(0)}%</span></div>
          </div>))}
        </div>
      </Card>)}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ TEAM REPORTS (דוח עובדים לפי תאריכים) ═══════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// A team lead / department manager picks a period (יומי · שבועי · חודשי · טווח)
// and gets, per worker and per day, every action that was signed off: which
// פק"ע, which מק"ט, which S/N, which פעולה, when it started and ended, how long
// it actually took and how that compares with the time the price list sold for
// it (זמן מכירה) — i.e. עמידה מול תקן. The report is previewed exactly as it
// will print, and only then sent to the printer.
const HEB_DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
// Local (not UTC) calendar day — an evening shift must not roll over to tomorrow.
const isoOf=d=>{const t=new Date(d);return new Date(t.getTime()-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDaysISO=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return isoOf(d)};
const weekRangeOf=iso=>{const d=new Date(iso+"T00:00:00");const from=addDaysISO(iso,-d.getDay());return{from,to:addDaysISO(from,6)}};
const monthRangeOf=iso=>{const[y,m]=iso.split("-").map(Number);const p=n=>String(n).padStart(2,"0");return{from:`${y}-${p(m)}-01`,to:`${y}-${p(m)}-${p(new Date(y,m,0).getDate())}`}};
const fmtDateHeb=iso=>iso?new Date(iso+"T00:00:00").toLocaleDateString("he-IL"):"—";
const fmtDayHeb=iso=>{if(!iso)return"—";const d=new Date(iso+"T00:00:00");return`יום ${HEB_DAYS[d.getDay()]} · ${d.toLocaleDateString("he-IL")}`};
const fmtClock=t=>{if(!t)return"—";const d=new Date(t);return isNaN(d)?"—":d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const hrs=m=>Math.round((Number(m)||0)/60*10)/10;

// ── Report model ──────────────────────────────────────────────────────────
// One flat row per completed work log in range, already normalised against the
// sold time, then grouped worker → day.
function buildTeamReport(opt){
  const {from,to,ptype,users=[],workLogs=[],orders=[],stages=[],stageBlocks=[],projects=[],customTasks=[],dailyPlans=[],pnStandards=[],manager,scopeLabel,showEmpty}=opt||{};
  const stdIdx=pnStdIndex(pnStandards);
  const oMap=new Map(orders.map(o=>[o.id,o]));
  const sMap=new Map(stages.map(s=>[s.id,s]));
  const pMap=new Map(projects.map(p=>[p.id,p.name]));
  const ids=new Set(users.map(u=>u.id));
  const inR=iso=>!!iso&&iso>=from&&iso<=to;

  const rows=[];
  (workLogs||[]).forEach(w=>{
    if(!w.completed||!ids.has(w.userId))return;
    const when=w.endTime||w.startTime;if(!when)return;
    const day=isoOf(new Date(when));if(!inR(day))return;
    const o=oMap.get(w.orderId),st=sMap.get(w.stageId);
    // A bulk log records the same elapsed time on every serial of the group, so the
    // sold time it has to cover is the stage time × the size of the group.
    const units=w.bulk&&Number(w.bulkCount)>1?Number(w.bulkCount):1;
    const actual=Number(w.durationMin||0);
    const salePer=o&&st?stageMinutesFor(o,st,stageBlocks):Number(st?.minutes||0);
    const saleTot=salePer*units;
    const pn=(o?.pn||"").trim()||"—";
    // The standard defined for this מק"ט+שלב, scaled to the units of this log.
    const stdPer=st?stdStageMin(stdIdx.get(pnKey(pn)),st.id):0;
    const stdTot=stdPer*units;
    const comparable=saleTot>0&&actual>0;   // a sign-off (0 דק') carries no timing
    const stdCmp=stdTot>0&&actual>0;
    rows.push({
      id:w.id,userId:w.userId,userName:w.userName||"—",day,
      wo:o?.woNumber||"—",pn,desc:o?.description||"",
      project:pMap.get(o?.projectId)||"—",sn:w.serialSn||"—",
      stage:st?.name||"—",color:st?.color||"#64748b",
      start:w.startTime,end:w.endTime,units,actual,pause:Number(w.totalPauseMin||0),
      perUnit:units>0?actual/units:actual,salePer,saleTot,stdPer,stdTot,
      gap:comparable?actual-saleTot:null,eff:comparable?saleTot/actual*100:null,
      stdGap:stdCmp?actual-stdTot:null,adh:stdCmp?stdTot/actual*100:null,
      signOff:!(actual>0),kind:w.bulk?"קבוצתי":(actual>0?"עבודה":"חתימה")
    });
  });
  rows.sort((a,b)=>a.day.localeCompare(b.day)||String(a.start||"").localeCompare(String(b.start||"")));

  const tasks=(customTasks||[]).filter(t=>ids.has(t.userId)&&(t.completed||t.partial)&&(t.endTime||t.startTime))
    .map(t=>({userId:t.userId,userName:t.userName||"—",day:isoOf(new Date(t.endTime||t.startTime)),name:t.name||"—",
      desc:t.description||"",start:t.startTime,end:t.endTime,min:Number(t.durationMin||0),partial:!!t.partial,price:Number(t.price||0)}))
    .filter(t=>inR(t.day)).sort((a,b)=>a.day.localeCompare(b.day));

  const plans=(dailyPlans||[]).filter(p=>ids.has(p.userId)&&inR(p.date)).map(p=>{
    const o=oMap.get(p.orderId),st=sMap.get(p.stageId);
    return{userId:p.userId,day:p.date,wo:o?.woNumber||"—",pn:(o?.pn||"").trim()||"—",stage:st?.name||"—",
      target:Number(p.targetQty||0),serials:(p.serialIds||[]).length,done:!!p.done,note:p.note||"",by:p.createdByName||""};
  }).sort((a,b)=>a.day.localeCompare(b.day));

  const workers=users.map(u=>{
    const wr=rows.filter(r=>r.userId===u.id);
    const wt=tasks.filter(t=>t.userId===u.id);
    const wp=plans.filter(p=>p.userId===u.id);
    const days=[...new Set([...wr.map(r=>r.day),...wt.map(t=>t.day)])].sort();
    const workMin=wr.reduce((s,r)=>s+r.actual,0);
    const taskMin=wt.reduce((s,t)=>s+t.min,0);
    const cmp=wr.filter(r=>r.eff!=null);
    const mAct=cmp.reduce((s,r)=>s+r.actual,0),mSale=cmp.reduce((s,r)=>s+r.saleTot,0);
    const sCmp=wr.filter(r=>r.adh!=null);
    const sAct=sCmp.reduce((s,r)=>s+r.actual,0),sStd=sCmp.reduce((s,r)=>s+r.stdTot,0);
    return{user:u,rows:wr,tasks:wt,plans:wp,days,workMin,taskMin,totalMin:workMin+taskMin,
      sale:wr.reduce((s,r)=>s+r.saleTot,0),mAct,mSale,cmpN:cmp.length,
      sAct,sStd,stdN:sCmp.length,stdGap:sCmp.length?sAct-sStd:null,adh:sAct>0?sStd/sAct*100:null,
      gap:cmp.length?mAct-mSale:null,eff:mAct>0?mSale/mAct*100:null,
      units:wr.reduce((s,r)=>s+r.units,0),actions:wr.length,signs:wr.filter(r=>r.signOff).length,
      orders:new Set(wr.map(r=>r.wo)).size,pns:new Set(wr.filter(r=>r.pn!=="—").map(r=>r.pn)).size,
      planTotal:wp.length,planDone:wp.filter(p=>p.done).length};
  }).filter(w=>showEmpty||w.rows.length||w.tasks.length||w.plans.length)
    .sort((a,b)=>b.totalMin-a.totalMin||String(a.user.name||"").localeCompare(String(b.user.name||""),"he"));

  const mAct=workers.reduce((s,w)=>s+w.mAct,0),mSale=workers.reduce((s,w)=>s+w.mSale,0);
  const sAct=workers.reduce((s,w)=>s+w.sAct,0),sStd=workers.reduce((s,w)=>s+w.sStd,0);
  const totals={
    workers:workers.length,actions:workers.reduce((s,w)=>s+w.actions,0),
    signs:workers.reduce((s,w)=>s+w.signs,0),units:workers.reduce((s,w)=>s+w.units,0),
    workMin:workers.reduce((s,w)=>s+w.workMin,0),taskMin:workers.reduce((s,w)=>s+w.taskMin,0),
    totalMin:workers.reduce((s,w)=>s+w.totalMin,0),sale:workers.reduce((s,w)=>s+w.sale,0),
    sAct,sStd,stdN:workers.reduce((s,w)=>s+w.stdN,0),
    stdGap:sAct>0?sAct-sStd:null,adh:sAct>0?sStd/sAct*100:null,
    mAct,mSale,gap:mAct>0?mAct-mSale:null,eff:mAct>0?mSale/mAct*100:null,
    tasks:workers.reduce((s,w)=>s+w.tasks.length,0),
    planTotal:workers.reduce((s,w)=>s+w.planTotal,0),planDone:workers.reduce((s,w)=>s+w.planDone,0),
    days:[...new Set(workers.flatMap(w=>w.days))].length
  };
  return{from,to,ptype,scopeLabel:scopeLabel||"",manager,workers,totals,generatedAt:new Date()};
}

const reportPeriodLabel=m=>{
  if(!m)return"";
  if(m.from===m.to)return fmtDayHeb(m.from);
  if(m.ptype==="month"){const[y,mo]=m.from.split("-");return`${HEB_MONTHS[Number(mo)]||mo} ${y}`}
  return`${fmtDateHeb(m.from)} עד ${fmtDateHeb(m.to)}`;
};
const reportPeriodKind=t=>t==="day"?"דוח יומי":t==="week"?"דוח שבועי":t==="month"?"דוח חודשי":"דוח לתקופה";

// ── Printable HTML (the preview and the printout are the same document) ────
function reportHTML(m){
  const T=m.totals;
  const effCls=e=>e==null?"":e>=110?"g":e>=95?"b":e>=80?"w":"r";
  const effTxt=e=>e==null?"—":Math.round(e)+"%";
  // A signed number inside an RTL line has to be isolated, otherwise the sign
  // flips to the wrong visual side ("55− דק'" instead of "−55 דק'").
  const gapTxt=g=>{
    if(g==null)return"—";
    const a=Math.abs(g);
    return`<span class="num">${g>0?"+":g<0?"−":""}${a>=100?Math.round(a):Math.round(a*10)/10}</span> דק'`;
  };
  const gapCls=g=>g==null?"":g<=-0.5?"g":g<0.5?"b":"w";
  // `v` may already carry markup (an isolated signed number) — it is always
  // generated here, never user text, so it is inserted as-is.
  const kpi=(v,l,c)=>`<div class="kpi"><div class="kv" style="color:${c}">${v}</div><div class="kl">${esc(l)}</div></div>`;

  const summaryRows=m.workers.map(w=>`<tr>

  const dayTable=rs=>`<table class="det"><thead><tr>

  const taskTable=ts=>`<table class="det tsk"><thead><tr>

// ── XLSX on demand ─────────────────────────────────────────────────────────
// The Excel library (xlsx-js-style, ~1 MB) used to be a render-blocking
// <script> in <head>, paid by every device on every load — including the
// factory tablets that never export anything. Now it is fetched the first
// time an Excel feature is actually about to run (and warmed in the
// background when a screen with Excel buttons mounts, so the click itself
// doesn't wait). One in-flight promise, shared by every caller; a failed
// load clears it so the next click can retry.
let _xlsxPromise=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(_xlsxPromise)return _xlsxPromise;
  _xlsxPromise=new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js";
    s.onload=()=>window.XLSX?resolve(window.XLSX):(_xlsxPromise=null,reject(new Error("XLSX did not initialize")));
    s.onerror=()=>{_xlsxPromise=null;s.remove();reject(new Error("XLSX load failed"))};
    document.head.appendChild(s);
  });
  return _xlsxPromise;
}
const XLSX_LOAD_ERR="טעינת רכיב ה-Excel נכשלה — בדקו את החיבור לרשת ונסו שוב";

// Same numbers as the printed report, as a workbook — for whoever wants to slice
// the period further in Excel.
function exportTeamReportXlsx(m){
  const wb=XLSX.utils.book_new();
  const effStyle=v=>(v===""||v==null)?null:(v>=110?XL_OK:v>=95?XL_INFO:v>=80?XL_WARN:XL_BAD);
  const h1=['עובד','תפקיד','ימי עבודה','פעולות','יחידות','פק"ע','זמן בפועל (שע\')','מתוכו נמדד (שע\')','זמן תקן (שע\')','פער מול תקן (שע\')','עמידה בתקן %','זמן מכירה (שע\')','פער מכירה (שע\')','ניצול %','משימות','זמן משימות (שע\')','תוכנית בוצעה','תוכנית סה"כ'];
  const r1=m.workers.map(w=>[w.user.name||"—",ROLES[w.user.role]?.label||w.user.role||"",w.days.length,w.actions,w.units,w.orders,
    hrs(w.totalMin),w.cmpN?hrs(w.mAct):"",w.stdN?hrs(w.sStd):"",w.stdGap==null?"":hrs(w.stdGap),w.adh==null?"":Math.round(w.adh),
    w.cmpN?hrs(w.mSale):"",w.gap==null?"":hrs(w.gap),w.eff==null?"":Math.round(w.eff),
    w.tasks.length,hrs(w.taskMin),w.planDone,w.planTotal]);
  addSheet(wb,"סיכום לפי עובד",h1,r1,[18,14,10,10,10,10,14,15,13,15,12,14,15,10,10,14,12,12],
    (ri,c,row)=>(c===10||c===13)?effStyle(row[c]):null);
  const h2=['תאריך','יום','עובד','פק"ע','מק"ט','S/N','פעולה','פרויקט','התחלה','סיום','יחידות','זמן תקן (דק\')','זמן בפועל (דק\')','פער מול תקן (דק\')','עמידה בתקן %','זמן מכירה (דק\')','פער מכירה (דק\')','ניצול %','סוג רישום'];
  const r2=m.workers.flatMap(w=>w.rows.map(r=>[r.day,HEB_DAYS[new Date(r.day+"T00:00:00").getDay()],r.userName,r.wo,r.pn,r.sn,r.stage,r.project,
    fmtClock(r.start),fmtClock(r.end),r.units,r.stdTot>0?Math.round(r.stdTot*10)/10:"",Math.round(r.actual*10)/10,
    r.stdGap==null?"":Math.round(r.stdGap*10)/10,r.adh==null?"":Math.round(r.adh),
    r.eff==null?"":Math.round(r.saleTot*10)/10,r.gap==null?"":Math.round(r.gap*10)/10,r.eff==null?"":Math.round(r.eff),r.kind]));
  addSheet(wb,"פירוט פעולות",h2,r2,[12,9,16,14,14,18,18,14,10,10,9,13,14,15,12,14,15,10,11],
    (ri,c,row)=>(c===14||c===17)?effStyle(row[c]):null);
  const h3=['תאריך','עובד','משימה','תיאור','התחלה','סיום','זמן (דק\')','סטטוס','מחיר'];
  const r3=m.workers.flatMap(w=>w.tasks.map(t=>[t.day,t.userName,t.name,t.desc,fmtClock(t.start),fmtClock(t.end),Math.round(t.min),t.partial?"חלקית":"הושלמה",t.price]));
  addSheet(wb,"משימות",h3,r3,[12,16,24,30,10,10,11,11,10]);
  XLSX.writeFile(wb,`דוח_עובדים_${m.from}_${m.to}.xlsx`);
}

function TeamReports({users,workLogs,orders,stages,stageBlocks,projects,customTasks,dailyPlans,departments,pnStandards}){
  const {currentUser}=useAuth();
  const {toast}=useToast();
  // This screen has an "ייצוא לאקסל" button — warm the on-demand Excel library
  // in the background so that click is instant. Failures surface on the click.
  useEffect(()=>{loadXLSX().catch(()=>{})},[]);
  const isAdmin=currentUser?.role==="admin";
  const myDept=(departments||[]).find(d=>d.id===currentUser?.departmentId||d.managerId===currentUser?.id);
  // A department manager's report really is the department's; a team lead's covers
  // only their own reports, so it must not be labelled with the whole department.
  const scopeLabel=isAdmin?"כלל המפעל"
    :currentUser?.role==="dept_manager"?(myDept?.name||"המחלקה שלי")
    :`הצוות של ${currentUser?.name||""}`.trim()+(myDept?.name?` · ${myDept.name}`:"");
  // The report covers the people this user oversees — App already scoped `users`
  // to that set; system admins are dropped because a report is about the floor.
  const team=useMemo(()=>(users||[]).filter(u=>u.active!==false&&u.role!=="admin")
    .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"he")),[users]);
  const [ptype,setPtype]=useState("day");
  const [anchor,setAnchor]=useState(todays());
  const [cFrom,setCFrom]=useState(addDaysISO(todays(),-6));
  const [cTo,setCTo]=useState(todays());
  const [sel,setSel]=useState([]);           // empty = all of my people
  const [showEmpty,setShowEmpty]=useState(false);
  const frameRef=useRef(null);

  const range=useMemo(()=>{
    if(ptype==="week")return weekRangeOf(anchor);
    if(ptype==="month")return monthRangeOf(anchor);
    if(ptype==="range")return cFrom<=cTo?{from:cFrom,to:cTo}:{from:cTo,to:cFrom};
    return{from:anchor,to:anchor};
  },[ptype,anchor,cFrom,cTo]);

  const selUsers=useMemo(()=>sel.length?team.filter(u=>sel.includes(u.id)):team,[sel,team]);
  const model=useMemo(()=>buildTeamReport({from:range.from,to:range.to,ptype,users:selUsers,workLogs,orders,stages,stageBlocks,
    projects,customTasks,dailyPlans,pnStandards,manager:currentUser,scopeLabel,showEmpty}),
    [range,ptype,selUsers,workLogs,orders,stages,stageBlocks,projects,customTasks,dailyPlans,pnStandards,currentUser,scopeLabel,showEmpty]);
  const html=useMemo(()=>reportHTML(model),[model]);

  const shiftPeriod=dir=>{
    if(ptype==="day")return setAnchor(a=>addDaysISO(a,dir));
    if(ptype==="week")return setAnchor(a=>addDaysISO(a,dir*7));
    if(ptype==="month")return setAnchor(a=>{const[y,mo]=a.split("-").map(Number);const d=new Date(y,mo-1+dir,1);return isoOf(d)});
    const span=Math.max(1,Math.round((new Date(range.to)-new Date(range.from))/864e5)+1);
    setCFrom(f=>addDaysISO(f,dir*span));setCTo(t=>addDaysISO(t,dir*span));
  };
  const printWindow=()=>{
    const w=window.open("","_blank");
    if(!w){toast("הדפדפן חסם את חלון ההדפסה — אפשר חלונות קופצים ונסה שוב","error");return false}
    w.document.open();w.document.write(html);w.document.close();
    let fired=false;const go=()=>{if(fired)return;fired=true;try{w.focus();w.print()}catch{}};
    w.onload=go;setTimeout(go,700);
    return true;
  };
  const doPrint=()=>{
    const f=frameRef.current;
    try{if(f&&f.contentWindow){f.contentWindow.focus();f.contentWindow.print();return}}catch{}
    printWindow();
  };
  const doDownload=()=>{
    const blob=new Blob(["﻿"+html],{type:"text/html;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`דוח_עובדים_${model.from}_${model.to}.html`;a.click();URL.revokeObjectURL(a.href);
    toast("הדוח הורד כקובץ HTML","success");
  };
  const toggleUser=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const T=model.totals;
  const inp={padding:"8px 10px",fontSize:13,fontWeight:600};

  return(
    <div className="fade-in">
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <h2 style={{margin:0}}>📄 דוחות עובדים</h2>
        {myDept&&<span style={{fontSize:12,background:myDept.color+"22",color:myDept.color,padding:"3px 12px",borderRadius:14,fontWeight:700,border:`1px solid ${myDept.color}44`}}>{myDept.name}</span>}
      </div>
      <div style={{fontSize:12.5,color:"var(--c-muted)",marginBottom:14}}>
        בחר תקופה ועובדים — הדוח מציג לכל עובד, יום אחר יום, אילו פק"ע ומק"ט הוא עבד עליהם, אילו פעולות נחתמו, הזמנים שנמדדו והעמידה מול זמן התקן והמכירה. התצוגה שלמטה זהה למה שיודפס.
      </div>

      <Card style={{marginBottom:12}}>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div>
            <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600,display:"block",marginBottom:5}}>סוג דוח</label>
            <SegBtn options={[["day","יומי"],["week","שבועי"],["month","חודשי"],["range","טווח"]]} value={ptype} onChange={setPtype}/>
          </div>
          {ptype==="range"?(
            <>
              <Field label="מתאריך" type="date" value={cFrom} onChange={setCFrom} style={{minWidth:150}}/>
              <Field label="עד תאריך" type="date" value={cTo} onChange={setCTo} style={{minWidth:150}}/>
            </>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:170}}>
              <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>{ptype==="month"?"חודש":ptype==="week"?"שבוע (בחר יום בתוכו)":"תאריך"}</label>
              <input type={ptype==="month"?"month":"date"} value={ptype==="month"?anchor.slice(0,7):anchor}
                onChange={e=>setAnchor(ptype==="month"?`${e.target.value}-01`:e.target.value)} style={inp}/>
            </div>
          )}
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <Btn small onClick={()=>shiftPeriod(-1)} color="var(--c-border2)">▶ הקודם</Btn>
            <Btn small onClick={()=>{setAnchor(todays());setCFrom(addDaysISO(todays(),-6));setCTo(todays())}} color="var(--c-border2)">היום</Btn>
            <Btn small onClick={()=>shiftPeriod(1)} color="var(--c-border2)">הבא ◀</Btn>
          </div>
          <div style={{marginRight:"auto",fontSize:12.5,color:"var(--c-muted)",fontWeight:600}}>
            📅 {range.from===range.to?fmtDateHeb(range.from):`${fmtDateHeb(range.from)} — ${fmtDateHeb(range.to)}`}
          </div>
        </div>

        <div style={{marginTop:14,borderTop:"1px solid var(--c-border)",paddingTop:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:8}}>
            <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>עובדים בדוח {sel.length?`(${sel.length} נבחרו)`:"(כל העובדים שלי)"}</label>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {sel.length>0&&<button onClick={()=>setSel([])} style={{background:"none",border:"none",color:"var(--c-accent)",fontSize:12,fontWeight:600,fontFamily:"inherit"}}>נקה בחירה</button>}
              <label style={{fontSize:12,color:"var(--c-muted)",display:"flex",alignItems:"center",gap:6}}>
                <input type="checkbox" checked={showEmpty} onChange={e=>setShowEmpty(e.target.checked)}/> הצג גם עובדים ללא פעילות
              </label>
            </div>
          </div>
          {team.length===0?(
            <EmptyState icon="👥" title="לא שויכו אליך עובדים" subtitle="מנהל המערכת יכול לשייך אליך עובדים (מנהל ישיר / מחלקה)"/>
          ):(
            <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
              {team.map(u=>{const on=sel.includes(u.id);const c=ROLES[u.role]?.color||"#3b82f6";return(
                <button key={u.id} onClick={()=>toggleUser(u.id)} style={{background:on?c+"22":"var(--c-deep)",border:`1px solid ${on?c:"var(--c-border)"}`,color:on?c:"var(--c-muted)",borderRadius:18,padding:"5px 12px",fontSize:12,fontWeight:on?700:500,fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
                  <span>{ROLES[u.role]?.icon||"👷"}</span>{u.name}
                </button>
              )})}
            </div>
          )}
        </div>
      </Card>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(128px,1fr))",gap:9,marginBottom:12}}>
        <KpiBox i="👥" v={T.workers} label="עובדים בדוח" c="#3b82f6"/>
        <KpiBox i="✅" v={T.actions} label="פעולות שנחתמו" c="#a78bfa" sub={T.signs?`${T.signs} חתימות ללא מדידה`:null}/>
        <KpiBox i="📦" v={T.units} label="יחידות שטופלו" c="#06b6d4"/>
        <KpiBox i="⏱️" v={fmtTime(T.totalMin)} label="זמן עבודה בפועל" c="#e2e8f0" sub={T.mAct?`מתוכו נמדד מול תקן ${fmtTime(T.mAct)}`:null}/>
        <KpiBox i="💰" v={fmtTime(T.mSale)} label="זמן מכירה (תקן)" c="#10b981"/>
        <KpiBox i="📐" v={T.gap==null?"—":<span style={{direction:"ltr",unicodeBidi:"isolate",display:"inline-block"}}>{fmtSigned(T.gap)}</span>} label="פער מול התקן" c={T.gap==null?"#8b95a8":T.gap>0?"#f59e0b":"#10b981"}/>
        <KpiBox i="⚡" v={T.eff==null?"—":Math.round(T.eff)+"%"} label="יעילות ממוצעת" c={T.eff==null?"#8b95a8":effColor(T.eff)} sub={T.eff==null?null:effLabel(T.eff)}/>
        <KpiBox i="📌" v={T.tasks} label="משימות שהושלמו" c="#ec4899"/>
      </div>

      <Card style={{padding:0,overflow:"hidden"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",padding:"12px 16px",borderBottom:"1px solid var(--c-border)"}}>
          <div style={{fontWeight:700,fontSize:14}}>👁️ תצוגה מקדימה להדפסה</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <Btn small color="#3b82f6" onClick={doPrint} disabled={!T.actions&&!T.tasks&&!model.workers.length}>🖨️ הדפס</Btn>
            <Btn small color="#0ea5e9" onClick={printWindow}>🗔 פתח בחלון חדש</Btn>
            <Btn small color="#10b981" onClick={()=>loadXLSX().then(()=>exportTeamReportXlsx(model)).catch(()=>toast(XLSX_LOAD_ERR,"error"))}>📊 ייצוא לאקסל</Btn>
            <Btn small color="#8b5cf6" onClick={doDownload}>⬇️ שמור HTML</Btn>
          </div>
        </div>
        {model.workers.length===0?(
          <EmptyState icon="📭" title="אין פעילות בתקופה שנבחרה" subtitle="נסה תקופה אחרת, או סמן ״הצג גם עובדים ללא פעילות״"/>
        ):(
          <iframe ref={frameRef} srcDoc={html} title="תצוגה מקדימה של הדוח"
            style={{width:"100%",height:"78vh",minHeight:520,border:"none",background:"#fff",display:"block"}}/>
        )}
      </Card>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ EXCEL EXPORT / IMPORT ══════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// The export holds the whole picture in one workbook — orders, serials, defects,
// shortages, the raw work log, tasks, daily plans, worker performance, measured
// standard times and the configuration behind them (stages, blocks, people).
// The import accepts that same workbook, and — more importantly — the empty
// template the app hands out, so anyone can fill in a file and load it back.
const XL_FONT="Segoe UI";
const XL_BD={top:{style:"thin",color:{rgb:"D1D9E0"}},bottom:{style:"thin",color:{rgb:"D1D9E0"}},left:{style:"thin",color:{rgb:"D1D9E0"}},right:{style:"thin",color:{rgb:"D1D9E0"}}};
const xlHead=(bg="1E3A5F")=>({font:{name:XL_FONT,sz:11.5,bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:bg}},alignment:{horizontal:"center",vertical:"center",wrapText:true,readingOrder:2},border:XL_BD});
const xlCell=even=>({font:{name:XL_FONT,sz:11,color:{rgb:"1E293B"}},fill:{fgColor:{rgb:even?"EBF3FB":"FFFFFF"}},alignment:{horizontal:"center",vertical:"center",readingOrder:2},border:XL_BD});
const xlTag=(fg,bg)=>({font:{name:XL_FONT,sz:11,bold:true,color:{rgb:fg}},fill:{fgColor:{rgb:bg}},alignment:{horizontal:"center",vertical:"center",readingOrder:2},border:XL_BD});
const XL_OK=xlTag("065F46","D1FAE5"),XL_BAD=xlTag("991B1B","FEE2E2"),XL_WARN=xlTag("92400E","FEF3C7"),XL_INFO=xlTag("1E40AF","DBEAFE");
// A styled RTL sheet with a frozen, filterable header row. `spFn(rowIdx,colIdx,row)`
// may return a style for one cell (status colouring); otherwise zebra striping.
function xlSheet(headers,rows,cw,spFn,headBg){
  const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
  headers.forEach((_,c)=>{const a=XLSX.utils.encode_cell({r:0,c});if(ws[a])ws[a].s=xlHead(headBg)});
  ws["!rows"]=[{hpx:30}];
  rows.forEach((row,ri)=>{const even=ri%2===0;row.forEach((_,c)=>{const a=XLSX.utils.encode_cell({r:ri+1,c});if(!ws[a])return;ws[a].s=spFn?.(ri,c,row)||xlCell(even)});ws["!rows"].push({hpx:20})});
  ws["!cols"]=(cw&&cw.length?cw:headers.map(()=>16)).map(w=>({wch:w}));
  ws["!freeze"]={xSplit:"0",ySplit:"1",topLeftCell:"A2",activePane:"bottomLeft",state:"frozen"};
  ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length,1),c:Math.max(headers.length-1,0)}})};
  if(!ws["!opts"])ws["!opts"]={};ws["!opts"].rightToLeft=true;
  return ws;
}
const addSheet=(wb,name,headers,rows,cw,spFn,headBg)=>
  XLSX.utils.book_append_sheet(wb,xlSheet(headers,rows&&rows.length?rows:[headers.map(()=>"")],cw,spFn,headBg),name);
const XL_SEV={critical:"קריטית",high:"גבוהה",medium:"בינונית",low:"נמוכה"};
const XL_TYP={quality:"איכות",process:"תהליך",material:"חומר גלם",equipment:"ציוד",human:"גורם אנושי",other:"אחר"};
const xlRound=(n,d=1)=>{const p=Math.pow(10,d);return Math.round((Number(n)||0)*p)/p};

function doExport(ctx){
  const {orders=[],projects=[],stages=[],stageBlocks=[],workLogs=[],users=[],customTasks=[],dailyPlans=[],departments=[],pnStandards=[]}=ctx||{};
  const stdIdx=pnStdIndex(pnStandards);
  const wb=XLSX.utils.book_new();
  const pMap=new Map(projects.map(p=>[p.id,p.name]));
  const sMap=new Map(stages.map(s=>[s.id,s]));
  const oMap=new Map(orders.map(o=>[o.id,o]));
  const uMap=new Map(users.map(u=>[u.id,u]));
  const dMap=new Map(departments.map(d=>[d.id,d.name]));
  const bMap=new Map(stageBlocks.map(b=>[b.id,b.name]));
  const done=workLogs.filter(w=>w.completed);
  const unitsOf=w=>w.bulk&&Number(w.bulkCount)>1?Number(w.bulkCount):1;
  const byOrder=new Map(),bySerial=new Map(),byUser=new Map();
  done.forEach(w=>{
    if(!byOrder.has(w.orderId))byOrder.set(w.orderId,[]);byOrder.get(w.orderId).push(w);
    if(!bySerial.has(w.serialId))bySerial.set(w.serialId,[]);bySerial.get(w.serialId).push(w);
    if(!byUser.has(w.userId))byUser.set(w.userId,[]);byUser.get(w.userId).push(w);
  });
  // Sold minutes a single log had to cover (stage time × the units it closed).
  // A sign-off carries no measured time, so it contributes no sold time either —
  // otherwise every efficiency figure would be inflated by work that wasn't timed.
  const saleOf=(o,w)=>{const st=sMap.get(w.stageId);if(!o||!st||!(Number(w.durationMin||0)>0))return 0;return stageMinutesFor(o,st,stageBlocks)*unitsOf(w)};
  const effOf=(act,sale)=>act>0&&sale>0?Math.round(sale/act*100):"";
  const effStyle=v=>(v===""||v==null)?null:(v>=110?XL_OK:v>=95?XL_INFO:v>=80?XL_WARN:XL_BAD);

  // ── 0: סיכום כללי ───────────────────────────────────────────────────────
  const totMin=done.reduce((s,w)=>s+Number(w.durationMin||0),0);
  const totSale=done.reduce((s,w)=>s+saleOf(oMap.get(w.orderId),w),0);
  // Standard time only counts where a standard exists, so the actual time it is
  // compared against is summed over exactly the same logs.
  const stdPairs=done.reduce((a,w)=>{
    const m=Number(w.durationMin||0);if(!(m>0))return a;
    const st=stdStageMin(stdIdx.get(pnKey(oMap.get(w.orderId)?.pn)),w.stageId);
    if(!(st>0))return a;
    a.std+=st*unitsOf(w);a.act+=m;return a;
  },{std:0,act:0});
  const openDef=orders.reduce((s,o)=>s+(o.defects||[]).filter(d=>d.status!=="closed").length,0);
  const openSh=orders.reduce((s,o)=>s+(o.shortages||[]).filter(h=>!h.received).length,0);
  const sumRows=[
    ["תאריך הפקה",new Date().toLocaleString("he-IL")],
    ["גרסת מערכת",APP_VERSION],
    ['פקודות עבודה',orders.length],
    ["סידוריים",orders.reduce((s,o)=>s+(o.serials||[]).length,0)],
    ["סידוריים שנמסרו",orders.reduce((s,o)=>s+(o.deliveredSerials||[]).length,0)],
    ["פעולות שנרשמו",done.length],
    ["שעות עבודה בפועל",xlRound(totMin/60)],

// ── Import ────────────────────────────────────────────────────────────────
// Sheets are matched by name (so the guide/example sheets in the template are
// skipped), with a fall back to "the first sheet that looks like orders" for
// files produced before the template existed.
const xlNorm=s=>String(s==null?"":s).replace(/['"׳״‘’“”]/g,"").replace(/\s+/g," ").trim().toLowerCase();
const xlRow=r=>{const o={};Object.keys(r).forEach(k=>{o[xlNorm(k)]=r[k]});return o};
const xlGet=(r,...keys)=>{for(const k of keys){const v=r[xlNorm(k)];if(v!==undefined&&v!==null&&String(v).trim()!=="")return v}return""};
const xlNum=v=>{const n=Number(String(v==null?"":v).replace(/[^\d.\-]/g,""));return isFinite(n)?n:0};
const xlBool=v=>/^(כן|נמסר|התקבל|בוצע|yes|y|true|1|v|✓)$/i.test(String(v==null?"":v).trim());
function xlDate(v){
  if(v==null||v==="")return"";
  // An empty date cell in an ERP export often arrives as a time-only value,
  // which is Excel serial 0 — the last day of 1899, not a real date.
  if(v instanceof Date)return(!isNaN(v)&&v.getFullYear()>1900)?isoOf(v):"";
  // Priority writes "no date" as a plain 0, and a bare "0" would otherwise be
  // parsed by Date() as the year 2000 — anything non-positive is simply empty.
  if(typeof v==="number")return(isFinite(v)&&v>0)?new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10):"";
  const s=String(v).trim();
  // A date column that arrived as text still holds an Excel serial (roughly 1900-2064)
  if(/^-?\d+(\.\d+)?$/.test(s)){const n=Number(s);return(n>0&&n<60000)?new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5).toISOString().slice(0,10):""}
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(m)return`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if(m){let y=Number(m[3]);if(y<100)y+=2000;return`${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`}
  const d=new Date(s);return isNaN(d)?"":isoOf(d);
}
function xlPickSheet(wb,names){
  const map=new Map(wb.SheetNames.map(n=>[xlNorm(n),n]));
  for(const n of names){const hit=map.get(xlNorm(n));if(hit)return wb.Sheets[hit]}
  return null;
}

// ═══ PRIORITY (פריוריטי) ROUTE EXPORT ════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// The ERP hands out one flat sheet where every row is a single *operation* of a
// work order, so a פק"ע with an 8-step route arrives as 8 rows that repeat all of
// its header fields. The app's model is the other way round — one order carrying
// its route as a list of stages — so the import folds the rows back up: group by
// פק"ע, take the header fields from the group, and turn the distinct תאור פעולה
// values into that order's stages.
//
// This is the interim path until Priority is wired up through Engini; nothing
// here writes back to the ERP.
const PRI_H={wo:'מספר פק"ע',pn:'מק"ט',desc:'תיאור מוצר',branch:'סניף',project:'פרויקט',qty:'כמות',
  price:"מחיר אלת'א בש'ח",release:'תאריך שחרור',endDate:'ת. סיום יצור',
  // Priority spelled this header שלה before it was corrected to שלב; both are read.
  seq:'שלב בפק"ע',seqAlt:'שלה בפק"ע',op:'פעולה',
  opDesc:'תאור פעולה',wc:'מרכז עבודה',reported:'כמות מדווחת',remain:'יתרה לבצוע',
  stdPn:"ז.תקן ליח' בדק' למקט",stdWo:"ז.תקן ליח' בדק' בפקע",status:'סטטוס פק"ע'};

// and the header it carries it under differs between reports, so every spelling
// seen so far is tried. Whatever it holds is shown on a stuck פק"ע next to the
// status that stopped it.
const PRI_NOTE_H=["סיבת עיכוב","סיבת העיכוב","סיבת תקיעה","סיבת התקיעה","סיבה","סיבת עצירה",
  "הערת סטטוס",'הערות פק"ע',"הערות","הערה","פירוט","תיאור סטטוס","status note","remark","remarks"];
// ── סטטוס פק"ע של Priority — המילון המלא ──────────────────────────────────
// Every value Priority's סטטוס פק"ע column carries, written out in full: what it
// actually means on the floor, which of the app's four statuses it folds onto,
// and — the part those four cannot say — where the פק"ע stands relative to the
// production line itself.
//
// The phase is the distinction a floor manager asks for first and the status
// hides: "פתוחה" and "שוחררה" are both open, and both mean nobody has touched
// the work — the פק"ע is on paper, not on the line. Lumping them together with

// unreadable, so the phase is carried beside the status and filtered on its own.
//
//   pre        תהליך הייצור לא התחיל — פתוחה או שוחררה, ותו לא
//   line       בתהליך ייצור, מהדפסת התיק ועד ההמתנה לאריזה
//   stuck      בתהליך, אבל נעצרה מסיבה מזוהה; הסטטוס עצמו הוא הסיבה
//   done       הסתיימה — דווח אחרון, נסגרה, COC

// Priority statuses get renamed and added to over time, so an unfamiliar one is
// still placed sensibly instead of silently landing on "open" — and the guess
// says which phase it belongs to as well, because that is what the filters read.
function priStatus(raw){
  const s=String(raw==null?"":raw).trim();
  const out=(st,phase,guessed,desc,official)=>({st,phase,guessed,official:!!official,desc:desc||"",raw:s});
  if(!s)return out("open","pre",false,'הקובץ לא נשא סטטוס פק"ע לשורה הזו — היא נכנסת כפתוחה שתהליך הייצור שלה לא התחיל.');
  const hit=PRI_STATUS_INFO[s];
  if(hit)return out(hit.st,hit.phase,false,hit.desc,hit.official);
  const g='הסטטוס הזה אינו ברשימת הסטטוסים המוכרים של Priority — הוא שויך לפי הניסוח שלו. אפשר לעדכן את הפק"ע ידנית אם השיוך שגוי.';
  if(/בוטל|מבוטל/.test(s))return out("complete","cancelled",true,g);
  if(/בעי|חוסר|חסר|הוקפא|מוקפא|תקוע|עיכוב/.test(s))return out("blocked","stuck",true,g);
  if(/coc|נסגר|הושלמ|דווח אחרון/i.test(s))return out("complete","done",true,g);
  // Only פתוחה and שוחררה are before the process starts — everything else that
  // sounds early (הודפסה, ממתין ליצור, קדם יצור) is already inside it.
  if(/שוחרר|פתוח|טרם/.test(s))return out("open","pre",true,g);
  return out("partial","line",true,g);
}
// A פק"ע the ERP calls מבוטלת is not history to browse — the process says do not
// show it. It is skipped on import, and one already in the app is kept (so the
// hours somebody reported against it are not silently erased) but held out of
// every list and every figure unless it is asked for by name.
const isCancelled=o=>orderPhase(o)==="cancelled";
// The phase a פק"ע is in, from whatever the ERP said about it. Orders imported
// before the raw status was kept have nothing to read, so the app status stands
// in: "פתוחה" there means nothing was reported, which is the pre-line case.
function orderPhase(order){
  const raw=String(order?.erpStatus||"").trim();
  if(raw)return priStatus(raw).phase;
  const st=order?.status||"open";
  return st==="blocked"?"stuck":st==="complete"?"done":st==="partial"?"line":"pre";
}
// What the ERP said, spelled out — the label, its explanation, and the free-text
// note the file carried beside it (when it did). This is what the פק"ע card shows
// under "סיבת התקיעה" for a blocked order.
function orderErpInfo(order){
  const raw=String(order?.erpStatus||"").trim();
  const note=String(order?.erpNote||"").trim();
  if(!raw)return note?{raw:"",desc:"",note,guessed:false}:null;
  const i=priStatus(raw);
  return{raw,desc:i.desc,note,guessed:i.guessed};
}
const priNum=v=>{const n=Number(String(v==null?"":v).replace(/[^\d.\-]/g,""));return isFinite(n)?n:0};
// Priority writes a literal 0 into its code columns (סניף / פרויקט) for "none".
const priTxt=v=>{const s=String(v==null?"":v).trim();return(s==="0"||s==="-")?"":s};
// The second sheet of the export: the serial numbers Priority already issued,
// one row per unit. Its headers use a geresh where the route sheet uses a
// gershayim, which xlNorm strips either way.
const PRI_S={wo:"פק'ע",pn:"מק'ט",sn:"SN",qty:"כ. הפק'ע",status:"סטטוס פק'ע"};
const PRI_SKIP="__skip",PRI_NEW="__new",PRI_MAP_LS="priorityStageMap";
// Progress imported from the ERP is booked against a stand-in "worker" so it never
// lands in anybody's performance report — no person did this work in the app.
const PRI_LOG_USER="priority_import",PRI_LOG_NAME="ייבוא Priority",XL_LOG_NAME="ייבוא Excel";
// Imported history is dated by the פק"ע's release date, so it falls in the right
// year in the dashboards instead of all landing on the day of the import.
const priStamp=iso=>{
  const d=String(iso||"").slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=todays()?`${d}T08:00:00.000Z`:nowISO();
};

// Is this a Priority export? Judged on the header rows alone, so a renamed sheet
// or an extra column at the end still matches. Returns the route sheet and, when
// the export carries one, the serials sheet beside it.
function priDetect(wb){
  const headOf=n=>(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""})[0]||[]).map(xlNorm);
  let routes=null,serials=null;
  for(const n of wb.SheetNames){
    const head=headOf(n),has=k=>head.includes(xlNorm(k));
    const wo=has(PRI_H.wo)||has(PRI_S.wo);
    if(!wo)continue;
    if(!routes&&has(PRI_H.opDesc)&&(has(PRI_H.wc)||has(PRI_H.op)))routes=wb.Sheets[n];
    else if(!serials&&(has(PRI_S.sn)||has("S/N")))serials=wb.Sheets[n];
  }
  return routes?{routes,serials}:null;
}

// Pass 1 — fold the operation rows into orders and collect the distinct
// operations, without yet deciding which app stage each one becomes. That
// decision belongs to the user, and changing it must not re-read the file.
function priScan(rows,serialRows){
  const wos=new Map(),ops=new Map();
  let skipped=0;
  rows.forEach((r,i)=>{
    const wo=String(xlGet(r,PRI_H.wo)||"").trim();
    if(!wo){skipped++;return}
    let o=wos.get(wo);
    if(!o){
      o={wo,pn:String(xlGet(r,PRI_H.pn)||"").trim(),desc:String(xlGet(r,PRI_H.desc)||"").trim(),
        project:priTxt(xlGet(r,PRI_H.project)),branch:branchCode(xlGet(r,PRI_H.branch)),
        qty:priNum(xlGet(r,PRI_H.qty)),price:priNum(xlGet(r,PRI_H.price)),
        release:xlDate(xlGet(r,PRI_H.release)),endDate:xlDate(xlGet(r,PRI_H.endDate)),
        statusRaw:String(xlGet(r,PRI_H.status)||"").trim(),
        note:String(xlGet(r,...PRI_NOTE_H)||"").trim(),row:i+2,ops:[],sns:[]};
      wos.set(wo,o);
    }
    // The note lives on the פק"ע, but the export repeats the header fields on
    // every operation row and only some of them carry it — so the first row that
    // has one wins rather than only the first row of the group.
    if(!o.note){const n=String(xlGet(r,...PRI_NOTE_H)||"").trim();if(n)o.note=n}
    const name=String(xlGet(r,PRI_H.opDesc)||"").trim();
    const code=String(xlGet(r,PRI_H.op)||"").trim();
    const wc=String(xlGet(r,PRI_H.wc)||"").trim();
    const seq=priNum(xlGet(r,PRI_H.seq,PRI_H.seqAlt));
    // The מק"ט-level standard is the one the app stores; the פק"ע-level column
    // only fills in where Priority has no standard for the part itself.
    const std=priNum(xlGet(r,PRI_H.stdPn))||priNum(xlGet(r,PRI_H.stdWo));
    o.ops.push({key:xlNorm(name),name,seq,std,code,wc,
      reported:priNum(xlGet(r,PRI_H.reported)),remain:priNum(xlGet(r,PRI_H.remain))});
    if(!name)return;
    let op=ops.get(xlNorm(name));
    if(!op){op={key:xlNorm(name),name,count:0,seqs:[],codes:new Set(),centers:new Set()};ops.set(op.key,op)}
    op.count++;
    if(seq)op.seqs.push(seq);
    if(code)op.codes.add(code);
    if(wc)op.centers.add(wc);
  });
  // Serial numbers come from the export's second sheet, matched to their פק"ע.
  // Priority only reuses a serial across different פק"ע, never inside one, so the
  // duplicate check is per order.
  let snOrphan=0,snDup=0,snPn=0,snRows=0;
  (serialRows||[]).forEach(r=>{
    const wo=String(xlGet(r,PRI_S.wo,PRI_H.wo,"WO")||"").trim();
    const sn=String(xlGet(r,PRI_S.sn,"S/N",'מס"ד',"סידורי")||"").trim();
    if(!wo&&!sn)return;
    snRows++;
    const o=wos.get(wo);
    if(!o||!sn){snOrphan++;return}
    if(o.sns.some(x=>x.sn===sn)){snDup++;return}
    const pn=String(xlGet(r,PRI_S.pn,PRI_H.pn)||"").trim();
    if(pn&&o.pn&&pn!==o.pn)snPn++;
    o.sns.push({sn});
  });

  // A new stage's place in the route is the sequence number Priority gives that
  // operation most often — the median, so one odd route can't drag it out of line.
  const list=[...ops.values()].map(o=>{
    const s=o.seqs.slice().sort((a,b)=>a-b);
    return{key:o.key,name:o.name,count:o.count,codes:[...o.codes],centers:[...o.centers],
      seq:s.length?s[Math.floor(s.length/2)]:0};
  }).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
  return{wos:[...wos.values()],ops:list,skipped,rows:rows.length,
    serials:{rows:snRows,orphan:snOrphan,dup:snDup,pnMismatch:snPn,
      wos:[...wos.values()].filter(w=>w.sns.length).length}};
}

// The global running order for the operations in the file.
//
// Priority numbers the steps *within* each route (שלה בפק"ע), and those numbers
// don't line up between routes — the military route counts 20,30,40 over the same
// ground the civil one calls 10..220. Ordering the new stages by their own numbers
// would therefore shuffle the families into each other. What every route does
// agree on is which operation comes *before* which, so the order is read off that:
// a topological sort of "A precedes B", with the typical step number breaking ties
// (and freeing the earliest operation whenever routes genuinely contradict).
function priOpOrder(scan){
  const keys=scan.ops.map(o=>o.key);
  const pos=new Map(keys.map((k,i)=>[k,i]));
  const seqOf=new Map(scan.ops.map(o=>[o.key,o.seq||9999]));
  const next=new Map();
  scan.wos.forEach(w=>{
    const route=[];
    w.ops.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach(op=>{if(op.key&&!route.includes(op.key))route.push(op.key)});
    for(let i=0;i+1<route.length;i++){
      let set=next.get(route[i]);if(!set){set=new Set();next.set(route[i],set)}
      set.add(route[i+1]);
    }
  });
  const left=new Set(keys),out=[];
  while(left.size){
    const deg=new Map([...left].map(k=>[k,0]));
    left.forEach(a=>(next.get(a)||[]).forEach(b=>{if(deg.has(b))deg.set(b,deg.get(b)+1)}));
    let pool=[...left].filter(k=>!deg.get(k));
    if(!pool.length)pool=[...left];                     // routes disagree — take the earliest step
    pool.sort((a,b)=>(seqOf.get(a)-seqOf.get(b))||(pos.get(a)-pos.get(b)));
    left.delete(pool[0]);out.push(pool[0]);
  }
  return out;
}

// Suggested operation → stage mapping: an existing stage of the same name wins,
// otherwise the operation becomes a new stage. Whatever the user chose on an
// earlier import beats both — that is the point of saving it.
function priAutoMap(ops,stages,saved){
  const byName=new Map((stages||[]).map(s=>[xlNorm(s.name),s.id]));
  const live=new Set((stages||[]).map(s=>s.id));
  const m={};
  (ops||[]).forEach(o=>{
    const prev=saved&&saved[o.key];
    if(prev===PRI_SKIP||prev===PRI_NEW||(prev&&live.has(prev))){m[o.key]=prev;return}
    m[o.key]=byName.get(o.key)||PRI_NEW;
  });
  return m;
}

// Pass 2 — turn the scan plus the user's choices into everything that has to be
// created: the orders, the stages and projects that don't exist yet, and one
// זמן תקן record per מק"ט built from the ז.תקן column.
function priBuild(scan,ctx,map,opts){
  const {projects=[],stages=[],pnStandards=[]}=ctx||{};
  const {onlyOpen=false,skipCancelled=true,makeStages=true,makeProjects=true,importStd=true,fillSerials=false,serialMax=100,importProgress=true}=opts||{};
  const issues=[],addIssue=(level,msg)=>{if(issues.length<300)issues.push({level,msg})};

  // ── stages ────────────────────────────────────────────────────────────
  // Existing stages keep their configured order untouched; new ones are appended
  // after them, among themselves in Priority's own sequence.
  const newStages=[];
  const stageOf=new Map();                                  // op key → stage id
  const maxOrder=stages.reduce((m,s)=>Math.max(m,Number(s.order)||0),0);
  const byKey=new Map(scan.ops.map(o=>[o.key,o]));
  if(makeStages)priOpOrder(scan).filter(k=>map[k]===PRI_NEW).forEach((k,i)=>{
    const st={id:uid(),name:byKey.get(k).name,order:maxOrder+i+1,
      color:COLORS[(stages.length+i)%COLORS.length],price:0,hourlyRate:0,roleId:"",minutes:0};
    newStages.push(st);stageOf.set(k,st.id);
  });
  scan.ops.forEach(o=>{const c=map[o.key];if(c&&c!==PRI_NEW&&c!==PRI_SKIP)stageOf.set(o.key,c)});

  // ── projects ──────────────────────────────────────────────────────────
  const projByName=new Map(projects.map(p=>[xlNorm(p.name),p.id]));
  const newProjects=[];
  const projectOf=code=>{
    if(!code)return"";
    const hit=projByName.get(xlNorm(code));
    if(hit)return hit;
    if(!makeProjects)return"";
    const p={id:uid(),name:code};
    newProjects.push(p);projByName.set(xlNorm(code),p.id);
    return p.id;
  };

  // ── orders ────────────────────────────────────────────────────────────
  const orders=[];let closedSkipped=0,cancelledSkipped=0,noStage=0,guessed=0,serialTotal=0,serialCapped=0,noQty=0,serialFilled=0,fromSheet=0;
  // Skipped מבוטלת are still reported by number: a פק"ע that is already in the
  // app and has since been cancelled has to be marked, or it lingers in the list
  // looking live because the file that cancelled it left it out.
  const cancelledWos=[];
  // Progress carried over from the ERP — see the block inside the loop.
  const logs=[];let progWos=0,progQtyWos=0,progNoSerials=0,progClamped=0;
  scan.wos.forEach(w=>{
    const s=priStatus(w.statusRaw);
    if(s.guessed)guessed++;
    // מבוטלת means "do not show" — so by default it does not come in at all.
    if(s.phase==="cancelled"){if(skipCancelled){cancelledSkipped++;cancelledWos.push({wo:w.wo,statusRaw:w.statusRaw});return}}
    else if(onlyOpen&&s.st==="complete"){closedSkipped++;return}
    // The route is this פק"ע's own, in its own order: the stages it actually has,
    // sequenced by שלב בפק"ע. Not a subset of one company-wide route — two פק"ע
    // can run the same two operations in opposite order, and both are right.
    const ids=[];
    w.ops.slice().sort((a,b)=>(a.seq||0)-(b.seq||0))
      .forEach(op=>{const sid=stageOf.get(op.key);if(sid&&!ids.includes(sid))ids.push(sid)});
    if(!ids.length)noStage++;
    if(!w.qty)noQty++;
    // Ids are derived from the order's own id, so a bulk run can't collide.
    const oid=uid(),serials=[];
    if(w.sns.length){
      // The real serial numbers Priority issued — used as they are.
      w.sns.forEach((x,k)=>serials.push({id:`${oid}s${k+1}`,sn:x.sn,createdAt:nowISO()}));
      fromSheet++;
    }else if(fillSerials&&w.qty>0){
      // Nothing issued for this פק"ע yet: stand-in serials so work can be logged.
      const cap=Number(serialMax)||0,n=cap>0?Math.min(w.qty,cap):w.qty;
      if(n<w.qty)serialCapped++;
      const prefix=w.pn||w.wo;
      for(let k=1;k<=n;k++)serials.push({id:`${oid}s${k}`,sn:`${prefix}-${String(k).padStart(4,"0")}`,createdAt:nowISO()});
      serialFilled++;
    }
    serialTotal+=serials.length;

    // ── progress ────────────────────────────────────────────────────────
    // Priority already knows how far each operation got: כמות מדווחת is how many
    // units were reported through it, יתרה לבצוע how many are still owed. The app
    // holds the same fact in a different shape — one completed work log per unit
    // per stage — and *that* is what every progress bar, unit count, WIP figure
    // and remaining-work estimate reads. Without this translation a פק"ע that is
    // three quarters built arrives looking untouched, and a whole ERP's worth of
    // history reads as "everything is open".
    //
    // Which physical unit did what is not in the file; how many did, is. So the
    // units are taken from the front of the list — operations report
    // non-increasing counts down the route, which makes unit #1 the furthest
    // along and keeps the picture consistent from stage to stage.
    if(importProgress&&(s.st==="complete"||w.ops.some(op=>op.reported>0||op.remain>0))){
      // What the progress can be spread over: the serials the פק"ע has, or — when
      // it has none — the quantity it was opened for, recorded as a quantity
      // signature instead. A פק"ע that is not managed serially used to lose its
      // ERP progress entirely here and arrive looking untouched.
      const cap=serials.length||(Number(w.qty)||0);
      if(!cap)progNoSerials++;
      else{
        const perStage=new Map();
        w.ops.forEach(op=>{
          const sid=stageOf.get(op.key);if(!sid)return;
          // The reported count is the direct answer. Where Priority left it blank
          // but did fill in a remainder, "ordered minus what is left" says the
          // same thing; a remainder of zero is too often an empty cell to trust.
          let n=op.reported>0?op.reported:((w.qty>0&&op.remain>0&&op.remain<w.qty)?w.qty-op.remain:0);
          n=Math.floor(n);
          if(!(n>0))return;
          if(n>cap)progClamped++;
          perStage.set(sid,Math.max(perStage.get(sid)||0,Math.min(n,cap)));
        });
        // A פק"ע Priority calls closed has, by definition, been through its whole
        // route — even when the operation counters in the export are blank.
        if(s.st==="complete")ids.forEach(sid=>perStage.set(sid,cap));
        let k=0;
        perStage.forEach((n,sid)=>{
          // No serials — one signature for the stage, carrying the count. Which
          // physical unit did what is not invented, because the file never said.
          if(!serials.length){
            logs.push({id:`${oid}q${k++}`,userId:PRI_LOG_USER,userName:PRI_LOG_NAME,
              serialId:null,serialSn:null,stageId:sid,orderId:oid,
              startTime:priStamp(w.release),endTime:priStamp(w.release),completed:true,
              durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[],
              bulk:true,bulkGroupId:null,bulkCount:n});
            return;
          }
          for(let u=0;u<n;u++){
            const sr=serials[u];
            logs.push({id:`${oid}p${k++}`,userId:PRI_LOG_USER,userName:PRI_LOG_NAME,
              serialId:sr.id,serialSn:sr.sn,stageId:sid,orderId:oid,
              startTime:priStamp(w.release),endTime:priStamp(w.release),completed:true,
              // Deliberately zero: the file says a unit passed the stage, never how
              // long it took, and a made-up duration would poison זמן בפועל.
              durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[],
              bulk:false,bulkGroupId:null,bulkCount:null});
          }
        });
        if(k){progWos++;if(!serials.length)progQtyWos++}
      }
    }

    orders.push({id:oid,woNumber:w.wo,pn:w.pn,description:w.desc,qty:w.qty,unitPrice:w.price,
      projectId:projectOf(w.project),branch:branchCode(w.branch),receivedDate:w.release,targetDate:w.endDate,status:s.st,
      // The ERP's own wording, kept. The four app statuses cannot tell "שוחררה"
      // from "הועבר לייצור", nor say *why* a פק"ע is stuck — this can.
      erpStatus:w.statusRaw||"",erpNote:w.note||"",
      stageIds:ids,serials,shortages:[],defects:[],deliveredSerials:[],
      // Preview only — stripped before the order reaches the app's state.
      _pri:{statusRaw:w.statusRaw,project:w.project,ops:w.ops.length,
        reported:w.ops.length?Math.min(...w.ops.map(o=>o.reported)):0,
        remain:w.ops.length?Math.max(...w.ops.map(o=>o.remain)):0}});
  });

  // ── זמן תקן per מק"ט ──────────────────────────────────────────────────
  // Priority's ז.תקן ליח' is standard minutes per unit per operation, which is
  // exactly the shape of a pn_standards record. Stages the file says nothing
  // about keep whatever the app already had.
  const stds=[];let stdConflicts=0;
  if(importStd){
    const perPn=new Map();
    scan.wos.forEach(w=>{
      if(!w.pn)return;
      let m=perPn.get(w.pn);if(!m){m=new Map();perPn.set(w.pn,m)}
      w.ops.forEach(op=>{
        const sid=stageOf.get(op.key);
        if(!sid||!(op.std>0))return;
        const cur=m.get(sid);
        if(cur===undefined){m.set(sid,op.std);return}
        if(Math.abs(cur-op.std)>0.001){stdConflicts++;m.set(sid,Math.max(cur,op.std))}
      });
    });
    const existing=pnStdIndex(pnStandards);
    perPn.forEach((m,pn)=>{
      if(!m.size)return;
      const prev=existing.get(pnKey(pn));
      const stageMin={...(prev?.stageMin||{})};
      m.forEach((v,sid)=>{stageMin[sid]=Math.round(v*10)/10});
      stds.push({id:prev?.id||uid(),pn:pnKey(pn),stageMin,total:Number(prev?.total||0),
        note:prev?.note||"",updatedBy:"Priority",updatedAt:nowISO()});
    });
    if(stdConflicts)addIssue("info",`${stdConflicts} זמני תקן נתנו ערך שונה לאותו מק"ט ושלב בפק"ע שונות — נלקח הגבוה`);
  }

  const unmapped=scan.ops.filter(o=>!stageOf.has(o.key));
  if(unmapped.length)addIssue("info",`${unmapped.length} פעולות אינן משויכות לשלב — ${unmapped.slice(0,4).map(o=>o.name).join(" · ")}${unmapped.length>4?" ...":""}`);
  if(noStage)addIssue("warn",`${noStage} פק"ע ללא שלבים — כל הפעולות שלהן לא שויכו`);
  if(noQty)addIssue("warn",`${noQty} פק"ע ללא כמות`);
  if(guessed)addIssue("info",`${guessed} פק"ע עם סטטוס Priority שאינו ברשימה — שויך לפי הדמיון`);
  if(closedSkipped)addIssue("info",`${closedSkipped} פק"ע סגורות (COC / נסגרה / דווח אחרון) לא יובאו`);
  if(cancelledSkipped)addIssue("info",`${cancelledSkipped} פק"ע מבוטלות לא יובאו — לפי הגדרת התהליך הן לא מוצגות`);
  if(scan.skipped)addIssue("info",`${scan.skipped} שורות ללא מספר פק"ע — דולגו`);
  if(serialCapped)addIssue("warn",`${serialCapped} פק"ע קיבלו פחות סידוריים מהכמות בגלל התקרה`);
  if(progQtyWos)addIssue("info",`${progQtyWos} פק"ע ללא סידוריים קיבלו את ההתקדמות שלהן כחתימה לפי כמות — אפשר להמשיך לחתום עליהן בכרטיס הפק"ע`);
  if(progNoSerials)addIssue("warn",`${progNoSerials} פק"ע עם התקדמות בקובץ אך ללא סידוריים וללא כמות — ההתקדמות לא נרשמה`);
  if(progClamped)addIssue("info",`${progClamped} פעולות דיווחו יותר יחידות ממספר הסידוריים בפק"ע — נרשמו עד מספר הסידוריים`);
  const sn=scan.serials||{};
  if(sn.orphan)addIssue("warn",`${sn.orphan} שורות בגיליון הסידוריים ללא פק"ע מתאימה — דולגו`);
  if(sn.dup)addIssue("warn",`${sn.dup} סידוריים כפולים באותה פק"ע — דולגו`);
  if(sn.pnMismatch)addIssue("info",`${sn.pnMismatch} סידוריים עם מק"ט שונה מזה שבגיליון הפעולות — נלקח המק"ט של הפק"ע`);

  return{mode:"priority",orders,newStages,newProjects,stds,logs,issues,cancelledWos,opStage:Object.fromEntries(stageOf),
    stats:{orders:orders.length,rows:scan.rows,ops:scan.ops.length,mapped:stageOf.size,
      byBranch:orders.reduce((m,o)=>{const c=branchCode(o.branch)||"—";m[c]=(m[c]||0)+1;return m},{}),
      serials:serialTotal,serialWos:fromSheet,serialFilled,sheetSerials:(scan.serials||{}).rows||0,
      defects:0,shortages:0,logs:logs.length,progWos,progQtyWos,progNoSerials,
      byStatus:orders.reduce((m,o)=>{m[o.status]=(m[o.status]||0)+1;return m},{}),
      byPhase:orders.reduce((m,o)=>{const p=orderPhase(o);m[p]=(m[p]||0)+1;return m},{}),
      // Every distinct סטטוס פק"ע the file actually carried, with its count — the
      // legend the import screen prints so nobody has to guess what a status meant.
      byRaw:(()=>{const m=new Map();orders.forEach(o=>{const k=String(o.erpStatus||"").trim()||"(ריק)";
        const e=m.get(k)||{raw:k,n:0,st:o.status,phase:orderPhase(o)};e.n++;m.set(k,e)});
        return[...m.values()].sort((a,b)=>PHASE_ORDER.indexOf(a.phase)-PHASE_ORDER.indexOf(b.phase)||b.n-a.n)})(),
      newStages:newStages.length,newProjects:newProjects.length,stds:stds.length,closedSkipped,cancelledSkipped,
      // How many מבוטלת the file carries at all, whether or not they are skipped.
      cancelledInFile:scan.wos.filter(w=>priStatus(w.statusRaw).phase==="cancelled").length}};
}
// ── ייבוא חוזר: עדכון במקום כפילות ────────────────────────────────────────
// The Priority report is a snapshot of everything currently open, so the same
// פק"ע comes back in every file that is pulled. "הוסף לקיימים" used to append it
// a second time, and the list filled with pairs of the same order whose route,
// serial numbers and progress were split between two rows.
//
// It now matches on מספר פק"ע and updates the row that is already there. Who owns
// what is the whole of the rule:
//
//   the ERP owns   סטטוס · כמות · מחיר · פרויקט · סניף · תאריכים · מסלול הפעולות
//   the app owns   הסידוריים שעבדו עליהם · תקלות · חוסרים · אספקות · דיווחי העובדים
//
// A פק"ע whose ERP fields and reported progress are identical to what is already
// stored is left alone entirely — not rewritten, not re-synced — which is what
// makes a monthly file of thousands of orders land as the handful that moved.
const MERGE_FIELDS=[
  ["status","סטטוס"],["erpStatus",'סטטוס פק"ע'],["erpNote","הערת סטטוס"],
  ["qty","כמות"],["unitPrice","מחיר ליחידה"],["projectId","פרויקט"],["branch","סניף"],
  ["receivedDate","תאריך שחרור"],["targetDate","תאריך סיום ייצור"],
  ["description","תיאור"],["pn",'מק"ט']
];
const woKey=w=>String(w==null?"":w).trim().toLowerCase();
const snKey=s=>String(s==null?"":s).trim().toLowerCase();
// stageId → units, from a set of import logs. Per-unit records count one each,
// a quantity signature carries its count.
function progPerStage(logs){
  const m=new Map();
  (logs||[]).forEach(w=>{if(!w.stageId)return;m.set(w.stageId,(m.get(w.stageId)||0)+(isQtyLog(w)?(Number(w.bulkCount)||0):1))});
  return m;
}
const progSig=m=>[...m.entries()].filter(([,n])=>n>0).sort((a,b)=>a[0]<b[0]?-1:1).map(([k,n])=>k+":"+n).join("|");
// The import's progress records for one order, drawn against the serials that
// order actually ends up with. Regenerated rather than re-pointed, because the
// order the file describes and the order already stored can differ in whether
// they are managed serially at all.
function priRelog(order,perStage,stamp){
  const out=[],serials=order.serials||[],cap=serials.length||(Number(order.qty)||0);
  if(!cap)return out;
  let k=0;
  perStage.forEach((n0,sid)=>{
    const n=Math.min(Math.floor(n0)||0,cap);
    if(!(n>0))return;
    if(!serials.length){
      out.push({id:`${order.id}q${k++}`,userId:PRI_LOG_USER,userName:PRI_LOG_NAME,
        serialId:null,serialSn:null,stageId:sid,orderId:order.id,
        startTime:stamp,endTime:stamp,completed:true,
        durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[],
        bulk:true,bulkGroupId:null,bulkCount:n});
      return;
    }
    for(let u=0;u<n;u++){
      const sr=serials[u];
      out.push({id:`${order.id}p${k++}`,userId:PRI_LOG_USER,userName:PRI_LOG_NAME,
        serialId:sr.id,serialSn:sr.sn,stageId:sid,orderId:order.id,
        startTime:stamp,endTime:stamp,completed:true,
        durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[],
        bulk:false,bulkGroupId:null,bulkCount:null});
    }
  });
  return out;
}
// Plans a "הוסף לקיימים" run without applying it: which orders are new, which
// change and in what, which are already up to date, and the exact logs to write
// and to drop. `built` is what priBuild produced; `existing` the app's orders;
// `workLogs` everything reported so far, app and ERP alike.
function priMergePlan(built,existing,workLogs){
  const byWo=new Map();
  (existing||[]).forEach(o=>{const k=woKey(o.woNumber);if(k&&!byWo.has(k))byWo.set(k,o)});
  const logsByOrder=new Map();
  (built.logs||[]).forEach(w=>{const a=logsByOrder.get(w.orderId);a?a.push(w):logsByOrder.set(w.orderId,[w])});
  // Only the ERP's own records are replaced on a re-import — a person's reported
  // work is never touched by a file.
  const erpByOrder=new Map();
  (workLogs||[]).forEach(w=>{if(w.userId!==PRI_LOG_USER)return;const a=erpByOrder.get(w.orderId);a?a.push(w):erpByOrder.set(w.orderId,[w])});

  const added=[],updated=[],changes=[],logs=[],dropLogIds=[];
  let unchanged=0,newSerials=0,progressChanged=0;

  (built.orders||[]).forEach(b=>{
    const {_pri,...bo}=b;
    const prev=byWo.get(woKey(bo.woNumber));
    const bLogs=logsByOrder.get(b.id)||[];
    const stamp=(bLogs[0]&&bLogs[0].startTime)||nowISO();
    const perStage=progPerStage(bLogs);
    if(!prev){
      added.push(bo);
      logs.push(...bLogs);
      return;
    }
    // ── the row already exists: update it in place ────────────────────────
    const fields=[];
    const next={...prev};
    MERGE_FIELDS.forEach(([k,label])=>{
      const v=bo[k];
      // A field the file left empty is not an instruction to erase what is stored.
      if(v===""||v===null||v===undefined)return;
      const a=k==="qty"||k==="unitPrice"?Number(prev[k]||0):String(prev[k]||"");
      const c=k==="qty"||k==="unitPrice"?Number(v||0):String(v||"");
      if(a===c)return;
      next[k]=v;fields.push(label);
    });
    // A reason belongs to the stoppage that caused it. Once the ERP says the פק"ע
    // is moving again, last month's "ממתין לנגדים מהספק" is not a fact any more —
    // it is a stale line on the card that reads as current. It goes with the
    // stoppage, unless the file supplied a new one.
    if(prev.erpNote&&!bo.erpNote&&orderPhase(prev)==="stuck"&&orderPhase(next)!=="stuck"){
      next.erpNote="";fields.push("סיבת התקיעה נוקתה");
    }
    // The route belongs to the ERP, but an empty one in the file means "no
    // operation was mapped to a stage", not "this פק"ע has no route".
    if((bo.stageIds||[]).length&&String((prev.stageIds||[]).join(","))!==String(bo.stageIds.join(","))){
      next.stageIds=bo.stageIds;fields.push("מסלול");
    }
    // Serial numbers are added, never removed — a unit somebody already reported
    // work on does not disappear because this month's report stopped listing it.
    const have=new Map((prev.serials||[]).map(sr=>[snKey(sr.sn),sr]));
    const addSn=(bo.serials||[]).filter(sr=>sr.sn&&!have.has(snKey(sr.sn)));
    if(addSn.length){
      next.serials=[...(prev.serials||[]),...addSn.map((sr,i)=>({id:`${prev.id}n${Date.now().toString(36)}${i}`,sn:sr.sn,createdAt:nowISO()}))];
      fields.push(`${addSn.length} סידוריים חדשים`);
      newSerials+=addSn.length;
    }
    // Defects and shortages a filled-in template carries are added, never used to
    // wipe what the floor already recorded — matched on their own wording so the
    // same row in next month's file does not become a second open תקלה.
    const dKey=d=>[String(d.title||"").trim(),String(d.discoveredDate||"").slice(0,10)].join("|");
    const shKey=x=>[String(x.item||"").trim(),String(x.sku||"").trim()].join("|");
    const addDef=(bo.defects||[]).filter(d=>!(prev.defects||[]).some(p2=>dKey(p2)===dKey(d)));
    if(addDef.length){next.defects=[...(prev.defects||[]),...addDef];fields.push(`${addDef.length} תקלות`)}
    const addSh=(bo.shortages||[]).filter(x=>!(prev.shortages||[]).some(p2=>shKey(p2)===shKey(x)));
    if(addSh.length){next.shortages=[...(prev.shortages||[]),...addSh];fields.push(`${addSh.length} חוסרים`)}
    // Progress: compare what the file now says against what the last import left.
    const prevErp=erpByOrder.get(prev.id)||[];
    const sigNew=progSig(perStage),sigOld=progSig(progPerStage(prevErp));
    const progMoved=sigNew!==sigOld;
    if(!fields.length&&!progMoved){unchanged++;return}
    if(progMoved||next.serials!==prev.serials){
      // Redrawn against the serials this order ends up with, so a פק"ע that
      // gained serial numbers stops carrying its progress as a bare quantity.
      if(prevErp.length)dropLogIds.push(...prevErp.map(w=>w.id));
      logs.push(...priRelog(next,perStage,stamp));

// three rows, each with its own serial numbers and its own slice of the reported
// work. Folding them back together is not a delete: the rows that go have to hand
// their units, their תקלות, their חוסרים and above all their דיווחי עבודה to the
// row that stays, or the progress leaves with them.

    // counted twice when the duplicate's copy of it arrives.

        // from two copies of the same פק"ע is one fact stated twice.

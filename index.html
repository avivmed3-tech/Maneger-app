function validatePassword(pw){
  const p=PASSWORD_POLICY;const errors=[];
  if(pw.length<p.minLength)errors.push(`מינימום ${p.minLength} תווים`);
  if(p.requireUppercase&&!/[A-Z]/.test(pw))errors.push("אות גדולה באנגלית");
  if(p.requireNumber&&!/[0-9]/.test(pw))errors.push("ספרה");
  if(p.requireSpecial&&!/[!@#$%^&*()_+\-=\[\]{};':"|,.<>?]/.test(pw))errors.push("תו מיוחד (!@#$...)");
  return errors;
}

// ── SHA-256 password hashing ────────────────────────────────────────────────
async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const SB={
  async get(table,params=""){
    const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{headers:{...sbHeaders(),"Range":"0-9999"}});
    if(!r.ok)throw new Error(await r.text());return r.json();
  },
  async upsert(table,data){
    const arr=Array.isArray(data)?data:[data];
    if(arr.length===0)return; // Skip empty upserts
    const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:"POST",headers:{...sbHeaders(),"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(arr)});
    if(!r.ok)throw new Error(await r.text());
  },
  async del(table,match){
    const q=Object.entries(match).map(([k,v])=>`${k}=eq.${v}`).join("&");
    const r=await fetch(`${SB_URL}/rest/v1/${table}?${q}`,{method:"DELETE",headers:sbHeaders()});
    if(!r.ok)throw new Error(await r.text());
  },
  async patch(table,match,data){
    const q=Object.entries(match).map(([k,v])=>`${k}=eq.${v}`).join("&");
    const r=await fetch(`${SB_URL}/rest/v1/${table}?${q}`,{method:"PATCH",headers:{...sbHeaders(),"Prefer":"return=minimal"},body:JSON.stringify(data)});
    if(!r.ok)throw new Error(await r.text());
  }
};

    // Save audit to DB asynchronously (non-blocking)
    SB.upsert("audit_log",{id:e.id,user_id:e.userId||null,username:e.username||null,
      name:e.name||null,action:e.action,target:e.target||null,details:e.details||null,
      reverted:false,can_undo:e.canUndo||false}).catch(()=>{});
  }catch{}
}

const ToastCtx=React.createContext({toast:()=>{}});
const useToast=()=>React.useContext(ToastCtx);
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const toast=useCallback((msg,type="info",duration=3500)=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,msg,type,leaving:false}]);
    setTimeout(()=>setToasts(p=>p.map(t=>t.id===id?{...t,leaving:true}:t)),duration);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),duration+250);
  },[]);
  const colors={success:{bg:"#052e16",border:"#10b981",icon:"✅",text:"#6ee7b7"},error:{bg:"#450a0a",border:"#ef4444",icon:"❌",text:"#fca5a5"},warning:{bg:"#451a03",border:"#f59e0b",icon:"⚠️",text:"#fcd34d"},info:{bg:"#0c1e3a",border:"#3b82f6",icon:"ℹ️",text:"#93c5fd"}};
  const colorsLight={success:{bg:"#f0fdf4",border:"#16a34a",icon:"✅",text:"#15803d"},error:{bg:"#fef2f2",border:"#dc2626",icon:"❌",text:"#dc2626"},warning:{bg:"#fffbeb",border:"#d97706",icon:"⚠️",text:"#92400e"},info:{bg:"#eff6ff",border:"#2563eb",icon:"ℹ️",text:"#1d4ed8"}};
  const lm=document.body.classList.contains("light-mode");
  const cm=lm?colorsLight:colors;
  return(
    <ToastCtx.Provider value={{toast}}>
      {children}
      <div style={{position:"fixed",top:12,left:"50%",transform:"translateX(-50%)",zIndex:9999,display:"flex",flexDirection:"column",gap:8,width:"90%",maxWidth:400,pointerEvents:"none"}}>
        {toasts.map(t=>{const c=cm[t.type]||cm.info;return(
          <div key={t.id} className={t.leaving?"toast-out":"toast-in"} style={{background:c.bg,border:`1px solid ${c.border}`,borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,boxShadow:"0 8px 24px #0004",pointerEvents:"auto"}}>
            <span style={{fontSize:18,flexShrink:0}}>{c.icon}</span>
            <span style={{fontSize:13,color:c.text,flex:1,lineHeight:1.4}}>{t.msg}</span>
          </div>
        )})}
      </div>
    </ToastCtx.Provider>
  );
}

// ── Simple Bar Chart (SVG) ─────────────────────────────────────────────────
function BarChart({data,color,formatVal,height=130}){
  const [hov,setHov]=useState(null);
  if(!data||!data.length)return<div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--c-dim)",fontSize:13}}>אין נתונים</div>;
  const padL=36,padR=12,padT=20,padB=44,W=480,H=height+padT+padB;
  const maxV=Math.max(...data.map(d=>d.value),1);
  const mag=Math.pow(10,Math.floor(Math.log10(maxV)));
  const niceMax=Math.ceil(maxV/mag)*mag;
  const grids=[0,.25,.5,.75,1].map(f=>Math.round(niceMax*f));
  const slotW=(W-padL-padR)/data.length;
  const bw=Math.min(40,slotW*.55);
  const bx=i=>padL+i*slotW+slotW/2-bw/2;
  const bh=v=>Math.max((v/niceMax)*height,2);
  const by=v=>padT+height-bh(v);
  const fmtA=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(0)+"K":""+v;
  const MN=["","ינו","פבר","מרץ","אפר","מאי","יונ","יול","אוג","ספט","אוק","נוב","דצמ"];
  const fmtL=l=>{if(/^\d{4}-\d{2}$/.test(l)){const[y,m]=l.split("-");return MN[+m]+"'"+y.slice(2)}return l};
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
      {grids.map((v,i)=>{const y=padT+height-(v/niceMax)*height;return(<g key={i}><line x1={padL} y1={y} x2={W-padR} y2={y} stroke="var(--c-chart-grid)" strokeWidth={i===0?1.5:1} strokeDasharray={i===0?"":"3 3"} opacity={i===0?1:.4}/><text x={padL-6} y={y+4} textAnchor="end" fill="var(--c-chart-label)" fontSize={10} fontFamily="sans-serif">{fmtA(v)}</text></g>)})}
      {data.map((d,i)=>{const x=bx(i),h=bh(d.value),y=by(d.value),isH=hov===i;return(
        <g key={i} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)} style={{cursor:"pointer"}}>
          {isH&&<rect x={x-3} y={y-3} width={bw+6} height={h+3} rx={5} fill={color} opacity={0.12}/>}
          <rect x={x} y={y} width={bw} height={h} rx={4} fill={isH?color:color+"bb"}/>
          {isH&&(()=>{const tw=80,tx=Math.min(Math.max(bx(i)+bw/2-tw/2,padL),W-padR-tw);return(<g><rect x={tx} y={y-34} width={tw} height={26} rx={5} fill="var(--c-chart-tooltip)" stroke={color} strokeWidth={1}/><text x={tx+tw/2} y={y-17} textAnchor="middle" fill={color} fontSize={11} fontWeight="700" fontFamily="sans-serif">{formatVal(d.value)}</text></g>)})()}
        </g>
      )})}
      <line x1={padL} y1={padT+height} x2={W-padR} y2={padT+height} stroke="var(--c-chart-grid)" strokeWidth={1.5}/>
      {data.map((d,i)=><text key={i} x={bx(i)+bw/2} y={padT+height+20} textAnchor="middle" fill="var(--c-chart-label)" fontSize={11} fontWeight="600" fontFamily="sans-serif">{fmtL(d.label)}</text>)}
    </svg>
  );
}

// ── Line Chart (dual series) ─────────────────────────────────────────
function LineChart({series,height=160,labels}){
  const[hov,setHov]=useState(null);
  if(!labels||!labels.length)return<div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--c-dim)",fontSize:13}}>אין נתונים</div>;
  const padL=44,padR=16,padT=20,padB=48,W=560,H=height+padT+padB;
  const MN=["","ינו","פבר","מרץ","אפר","מאי","יונ","יול","אוג","ספט","אוק","נוב","דצמ"];
  const fmtL=l=>{if(/^\d{4}-\d{2}$/.test(l)){const[y,m]=l.split("-");return MN[+m]+"'"+y.slice(2)}if(/^\d{4}-Q\d/.test(l)){const p=l.split("-");return p[1]+"'"+p[0].slice(2)}return l};
  const fmtA=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(0)+"K":""+v;
  const allVals=series.flatMap(s=>s.data);const maxV=Math.max(...allVals,1);
  const mag=Math.pow(10,Math.floor(Math.log10(maxV)));const niceMax=Math.ceil(maxV/mag)*mag;
  const grids=[0,.25,.5,.75,1].map(f=>Math.round(niceMax*f));
  const slotW=(W-padL-padR)/(labels.length-1||1);
  const px=i=>padL+i*slotW;const py=v=>padT+height-(v/niceMax)*height;
  const makePath=(data)=>{if(data.length<2)return"";let d=`M${px(0)},${py(data[0])}`;for(let i=1;i<data.length;i++){const x0=px(i-1),y0=py(data[i-1]),x1=px(i),y1=py(data[i]);const cx=(x0+x1)/2;d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`}return d};
  const makeArea=(data)=>{if(data.length<2)return"";return makePath(data)+` L${px(data.length-1)},${padT+height} L${px(0)},${padT+height} Z`};
  return(
    <div>
      <div style={{display:"flex",gap:16,justifyContent:"flex-end",marginBottom:6}}>
        {series.map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}><div style={{width:16,height:3,borderRadius:2,background:s.color}}/><span style={{color:s.color}}>{s.label}</span></div>))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
        {grids.map((v,i)=>{const y=padT+height-(v/niceMax)*height;return(<g key={i}><line x1={padL} y1={y} x2={W-padR} y2={y} stroke="var(--c-chart-grid)" strokeWidth={i===0?1.5:1} strokeDasharray={i===0?"":"3 3"} opacity={i===0?1:.3}/><text x={padL-8} y={y+4} textAnchor="end" fill="var(--c-chart-label)" fontSize={10} fontFamily="sans-serif">{fmtA(v)}</text></g>)})}
        {series.map((s,si)=>(<g key={si}><path d={makeArea(s.data)} fill={s.color} opacity={.08}/><path d={makePath(s.data)} fill="none" stroke={s.color} strokeWidth={2.5} strokeLinecap="round"/>{s.data.map((v,i)=>(<circle key={i} cx={px(i)} cy={py(v)} r={hov===i?5:3} fill={s.color} stroke="var(--c-bg)" strokeWidth={2} style={{cursor:"pointer"}} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}/>))}</g>))}
        {hov!==null&&(<g><line x1={px(hov)} y1={padT} x2={px(hov)} y2={padT+height} stroke="var(--c-chart-label)" strokeWidth={1} strokeDasharray="3 3" opacity={.5}/>{(()=>{const tw=100,tx=Math.min(Math.max(px(hov)-tw/2,padL),W-padR-tw);return(<><rect x={tx} y={padT-2} width={tw} height={14+series.length*16} rx={5} fill="var(--c-chart-tooltip)" stroke="var(--c-chart-grid)" strokeWidth={1}/><text x={tx+tw/2} y={padT+10} textAnchor="middle" fill="var(--c-chart-label)" fontSize={10} fontFamily="sans-serif">{fmtL(labels[hov])}</text>{series.map((s,si)=>(<text key={si} x={tx+tw/2} y={padT+10+16*(si+1)} textAnchor="middle" fill={s.color} fontSize={11} fontWeight="700" fontFamily="sans-serif">{s.formatVal?s.formatVal(s.data[hov]):s.data[hov]?.toLocaleString()}</text>))}</>)})()}</g>)}
        <line x1={padL} y1={padT+height} x2={W-padR} y2={padT+height} stroke="var(--c-chart-grid)" strokeWidth={1.5}/>
        {labels.map((l,i)=>(<text key={i} x={px(i)} y={padT+height+22} textAnchor="middle" fill="var(--c-chart-label)" fontSize={10} fontWeight="600" fontFamily="sans-serif" transform={labels.length>8?`rotate(-25,${px(i)},${padT+height+22})`:""}>{fmtL(l)}</text>))}
      </svg>
    </div>
  );
}

// ── Donut Chart ────────────────────────────────────────────────────────────
function DonutChart({data,size=180}){
  const [hov,setHov]=useState(null);
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total||!data.length)return<div style={{height:size,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--c-dim)",flexDirection:"column",gap:8}}><span style={{fontSize:28}}>📊</span><span style={{fontSize:13}}>אין נתונים</span></div>;
  const R=size/2-10,r=R*.58,cx=size/2,cy=size/2;
  let angle=-Math.PI/2;
  const slices=data.map((d,i)=>{
    const pct=d.value/total,start=angle;angle+=pct*2*Math.PI;const end=angle,large=pct>.5?1:0;
    const x1=cx+R*Math.cos(start),y1=cy+R*Math.sin(start),x2=cx+R*Math.cos(end),y2=cy+R*Math.sin(end);
    const xi=cx+r*Math.cos(start),yi=cy+r*Math.sin(start),xo=cx+r*Math.cos(end),yo=cy+r*Math.sin(end);
    const path=pct>=.9999?`M${cx},${cy-R} A${R},${R} 0 1,1 ${cx-.001},${cy-R} Z`:`M${xi},${yi} L${x1},${y1} A${R},${R} 0 ${large},1 ${x2},${y2} L${xo},${yo} A${r},${r} 0 ${large},0 ${xi},${yi} Z`;
    return{...d,path,color:d.color||COLORS[i%COLORS.length],pct};
  });
  const hS=hov!=null?slices[hov]:null;
  return(
    <div style={{display:"flex",gap:16,alignItems:"center",justifyContent:"center",flexWrap:"wrap"}}>
      <svg width={size} height={size} style={{flexShrink:0}}>
        {slices.map((s,i)=>(<path key={i} d={s.path} fill={s.color} opacity={hov===null||hov===i?1:.4} stroke="var(--c-bg)" strokeWidth={2} style={{cursor:"pointer",transition:"opacity .2s"}} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}/>))}
        <circle cx={cx} cy={cy} r={r-2} fill="var(--c-card)"/>
        {hS?(<><text x={cx} y={cy-8} textAnchor="middle" fill={hS.color} fontSize={13} fontWeight="700" fontFamily="sans-serif">{hS.label.length>12?hS.label.slice(0,11)+"…":hS.label}</text><text x={cx} y={cy+10} textAnchor="middle" fill="var(--c-text)" fontSize={11} fontFamily="sans-serif">{hS.value.toLocaleString()}</text><text x={cx} y={cy+26} textAnchor="middle" fill="var(--c-muted)" fontSize={10} fontFamily="sans-serif">{Math.round(hS.pct*100)}%</text></>):(<><text x={cx} y={cy-2} textAnchor="middle" fill="var(--c-muted)" fontSize={10} fontFamily="sans-serif">סה"כ</text><text x={cx} y={cy+14} textAnchor="middle" fill="var(--c-text)" fontSize={13} fontWeight="700" fontFamily="sans-serif">{total.toLocaleString()}</text></>)}
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:5,minWidth:100}}>
        {slices.map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",opacity:hov===null||hov===i?1:.4,transition:"opacity .2s"}} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}><div style={{width:9,height:9,borderRadius:2,background:s.color,flexShrink:0}}/><span style={{fontSize:11,color:"var(--c-muted)",flex:1}}>{s.label}</span><span style={{fontSize:11,fontWeight:700,color:s.color}}>{Math.round(s.pct*100)}%</span></div>))}
      </div>
    </div>
  );
}

// ── Login Screen ───────────────────────────────────────────────────────────
function LoginScreen({onLogin,lightMode,toggleLight}){
  const {toast}=useToast();
  const [mode,setMode]=useState("login"); // "login" | "register"
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [err,setErr]=useState("");
  const [showPass,setShowPass]=useState(false);
  const [loading,setLoading]=useState(false);
  // Registration fields
  const [regStep,setRegStep]=useState(1);
  const [companyName,setCompanyName]=useState("");
  const [adminName,setAdminName]=useState("");
  const [regUser,setRegUser]=useState("");
  const [regPass,setRegPass]=useState("");
  const [regPass2,setRegPass2]=useState("");

  const doRegister=async()=>{
    if(regStep===1){
      if(!companyName.trim())return setErr("יש להזין שם חברה");
      if(!adminName.trim())return setErr("יש להזין שם מלא");
      setErr("");setRegStep(2);return;
    }
    if(!regUser.trim()||!regPass.trim())return setErr("יש למלא שם משתמש וסיסמה");
    if(regPass!==regPass2)return setErr("הסיסמאות לא תואמות");
    const pwErrors=validatePassword(regPass);
    if(pwErrors.length>0)return setErr("הסיסמה חייבת לכלול: "+pwErrors.join(", "));
    setLoading(true);setErr("");
    try{
      // Check if username exists
      const existing=await SB.get("app_users",`username=eq.${encodeURIComponent(regUser.trim())}`);
      if(existing&&existing.length>0){setErr("שם משתמש תפוס");setLoading(false);return}
      // Create company
      const compId=genuuid();
      await SB.upsert("companies",[{id:compId,name:companyName.trim(),slug:companyName.trim().toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9\u0590-\u05ff-]/g,"")}]);
      // Create free subscription
      await SB.upsert("subscriptions",[{id:genuuid(),company_id:compId,plan:"free",status:"trial",trial_ends_at:new Date(Date.now()+14*24*3600000).toISOString(),max_users:3,max_orders:10}]);
      // Create admin user
      const hash=await sha256(regPass);
      const adminUser={id:uid(),username:regUser.trim(),password_hash:hash,role:"admin",name:adminName.trim(),project_access:"all",stage_access:"all",can_edit:true,can_view:true,active:true,hourly_rate:0,company_id:compId};
      await SB.upsert("app_users",[adminUser]);
      // Create default stages for this company
      const defStages=DEF_STAGES.map(s=>({...stageToDb(s),company_id:compId}));
      await SB.upsert("stages",defStages);
      // Create default projects
      const defProjects=DEF_PROJ.map(p=>({...projectToDb(p),company_id:compId}));
      await SB.upsert("projects",defProjects);
      toast("החברה נוצרה בהצלחה! 14 יום ניסיון חינם","success",5000);
      // Auto login
      const u=dbToUser({...adminUser,login_attempts:0,locked_until:null,last_login:new Date().toISOString()});
      LS.set("users",[u]);
      onLogin(u);
    }catch(e){setErr("שגיאה ביצירת חשבון: "+(e.message||e))}
    setLoading(false);
  };

  const attempt=async()=>{
    if(!username.trim()||!password.trim()){setErr("יש למלא שם משתמש וסיסמה");return}
    setLoading(true);setErr("");
    try{
      const hash=await sha256(password);
      const rows=await SB.get("app_users",`username=eq.${encodeURIComponent(username.trim())}&active=eq.true`);
      if(!rows||rows.length===0){setErr("שם משתמש לא נמצא במערכת");setLoading(false);return}
      const row=rows[0];
      if(row.locked_until&&new Date(row.locked_until)>new Date()){
        const minsLeft=Math.ceil((new Date(row.locked_until)-new Date())/60000);
        setErr(`החשבון נעול. נסה שוב בעוד ${minsLeft} דקות`);setLoading(false);return;
      }
      if(row.password_hash!==hash){
        const attempts=(row.login_attempts||0)+1;
        const lockData={login_attempts:attempts};
        if(attempts>=MAX_LOGIN_ATTEMPTS){
          lockData.locked_until=new Date(Date.now()+LOCKOUT_MIN*60000).toISOString();
          setErr(`סיסמה שגויה. החשבון ננעל ל-${LOCKOUT_MIN} דקות`);
        }else{
          setErr(`סיסמה שגויה (${attempts}/${MAX_LOGIN_ATTEMPTS} ניסיונות)`);
        }
        try{await SB.patch("app_users",{id:row.id},lockData)}catch{}
        setLoading(false);return;
      }
      try{await SB.patch("app_users",{id:row.id},{login_attempts:0,locked_until:null,last_login:new Date().toISOString()})}catch{}
      const u=dbToUser(row);
      const cached=getUsers();
      const upd=cached.some(c=>c.id===u.id)?cached.map(c=>c.id===u.id?u:c):[...cached,u];
      LS.set("users",upd);
      addAuditEntry({userId:u.id,username:u.username,name:u.name,action:"התחברות",target:"",details:""});
      onLogin(u);
    }catch(e){
      try{
        const hash=await sha256(password);
        const users=getUsers();
        const u=users.find(u=>u.username===username.trim()&&(u.password_hash===hash||u.password===password)&&u.active!==false);
        if(!u){setErr("אין חיבור לשרת ולא נמצא משתמש מקומי");setLoading(false);return}
        addAuditEntry({userId:u.id,username:u.username,name:u.name,action:"התחברות (offline)",target:"",details:""});
        onLogin(u);
      }catch(e2){setErr(`שגיאה: ${e.message||e}`)}
    }
    setLoading(false);
  };
  const lm=lightMode;
  return(
    <div style={{minHeight:"100vh",minHeight:"100dvh",background:lm?"#f0f2f5":"#0a0e1a",display:"flex",alignItems:"center",justifyContent:"center",padding:16,transition:"background .3s"}}>
      <div style={{position:"fixed",top:16,left:16,zIndex:10}}>
        <button onClick={toggleLight} style={{background:lm?"#e2e8f0":"#131829",border:`1px solid ${lm?"#e2e8f0":"#1e2a42"}`,borderRadius:8,padding:"7px 14px",fontSize:15,color:lm?"#1a1f2e":"#8b95a8"}}>{lm?"🌙":"☀️"}</button>
      </div>
      <div style={{background:lm?"#ffffff":"#131829",borderRadius:20,padding:"clamp(24px,6vw,44px) clamp(20px,6vw,40px)",maxWidth:420,width:"100%",border:`1px solid ${lm?"#dde1e8":"#1e2a42"}`,boxShadow:lm?"0 8px 40px #0001":"0 20px 60px #000a"}}>
        <div style={{textAlign:"center",marginBottom:32}}><div style={{fontSize:52,marginBottom:10}}>⚙️</div><div style={{fontSize:24,fontWeight:800,color:lm?"#1a1f2e":"#e2e8f0",letterSpacing:-.5}}>ניהול קו ייצור</div><div style={{fontSize:13,color:lm?"#5a6478":"#8b95a8",marginTop:6}}>{mode==="login"?"כניסה למערכת":"הרשמת חברה חדשה"}</div></div>

        {mode==="login"?(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div><label htmlFor="login-user" style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>שם משתמש</label><input id="login-user" autoComplete="username" value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="הכנס שם משתמש"/></div>
            <div><label htmlFor="login-pass" style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>סיסמה</label>
              <div style={{position:"relative"}}><input id="login-pass" autoComplete="current-password" type={showPass?"text":"password"} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="הכנס סיסמה" style={{paddingLeft:44}}/><button onClick={()=>setShowPass(p=>!p)} aria-label={showPass?"הסתר סיסמה":"הצג סיסמה"} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",fontSize:18,color:"var(--c-muted)",lineHeight:1}}>{showPass?"🙈":"👁️"}</button></div>
            </div>
            {err&&<div style={{background:lm?"#fee2e2":"#450a0a",color:lm?"#dc2626":"#fca5a5",borderRadius:8,padding:"10px 14px",fontSize:13,border:lm?"1px solid #fecaca":"1px solid #7f1d1d"}}>❌ {err}</div>}
            <button onClick={attempt} disabled={loading} style={{background:loading?"#2563eb99":"var(--c-accent)",color:"#fff",border:"none",borderRadius:10,padding:"13px",fontWeight:700,fontSize:16,marginTop:4,fontFamily:"inherit"}}>{loading?"⏳ מתחבר...":"כניסה למערכת"}</button>
            <div style={{textAlign:"center",marginTop:4}}><span style={{fontSize:13,color:lm?"#5a6478":"#8b95a8"}}>אין לך חשבון? </span><button onClick={()=>{setMode("register");setErr("");setRegStep(1)}} style={{background:"none",border:"none",color:"var(--c-accent)",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer",textDecoration:"underline"}}>הרשמה חינם</button></div>
            <div style={{position:"relative",textAlign:"center",margin:"8px 0"}}><div style={{position:"absolute",top:"50%",left:0,right:0,height:1,background:lm?"#dde1e8":"#1e2a42"}}/><span style={{position:"relative",padding:"0 12px",background:lm?"#ffffff":"#131829",fontSize:11,color:lm?"#9ca3af":"#5a6478"}}>או</span></div>
            <button onClick={()=>onLogin({id:"demo_user",username:"demo",role:"admin",name:"משתמש דמו",projectAccess:"all",stageAccess:"all",canEdit:true,canView:true,active:true,hourlyRate:0,companyId:DEFAULT_COMPANY_ID,isDemo:true})} style={{background:"none",border:`1px solid ${lm?"#06b6d4":"#06b6d433"}`,borderRadius:10,padding:"11px",color:lm?"#0891b2":"#06b6d4",fontWeight:600,fontSize:14,fontFamily:"inherit"}}>🔍 נסה דמו — בלי הרשמה</button>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            {/* Step indicator */}
            <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:4}}>
              <div style={{width:32,height:4,borderRadius:2,background:regStep>=1?"var(--c-accent)":"var(--c-border)"}}/>
              <div style={{width:32,height:4,borderRadius:2,background:regStep>=2?"var(--c-accent)":"var(--c-border)"}}/>
            </div>
            {regStep===1?(
              <>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>שם החברה / המפעל</label><input value={companyName} onChange={e=>setCompanyName(e.target.value)} placeholder='למשל: "תעשיות אלפא בע"מ"'/></div>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>השם המלא שלך</label><input value={adminName} onChange={e=>setAdminName(e.target.value)} placeholder="שם פרטי ומשפחה"/></div>
              </>
            ):(
              <>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>שם משתמש (לכניסה)</label><input value={regUser} onChange={e=>setRegUser(e.target.value)} placeholder="בחר שם משתמש" autoComplete="username"/></div>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>סיסמה</label><input type="password" value={regPass} onChange={e=>setRegPass(e.target.value)} placeholder="מינימום 8 תווים, אות גדולה, ספרה, תו מיוחד" autoComplete="new-password"/></div>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>אימות סיסמה</label><input type="password" value={regPass2} onChange={e=>setRegPass2(e.target.value)} placeholder="הזן שוב" autoComplete="new-password"/></div>
              </>
            )}
            {err&&<div style={{background:lm?"#fee2e2":"#450a0a",color:lm?"#dc2626":"#fca5a5",borderRadius:8,padding:"10px 14px",fontSize:13,border:lm?"1px solid #fecaca":"1px solid #7f1d1d"}}>❌ {err}</div>}
            <div style={{display:"flex",gap:10}}>
              {regStep===2&&<button onClick={()=>{setRegStep(1);setErr("")}} style={{flex:1,background:"var(--c-card)",color:"var(--c-text)",border:"1px solid var(--c-border)",borderRadius:10,padding:"13px",fontWeight:600,fontSize:14,fontFamily:"inherit"}}>→ חזרה</button>}
              <button onClick={doRegister} disabled={loading} style={{flex:1,background:loading?"#2563eb99":"var(--c-accent)",color:"#fff",border:"none",borderRadius:10,padding:"13px",fontWeight:700,fontSize:16,fontFamily:"inherit"}}>{loading?"⏳ יוצר חשבון...":regStep===1?"← המשך":"צור חשבון"}</button>
            </div>
            <div style={{textAlign:"center",marginTop:4}}><span style={{fontSize:13,color:lm?"#5a6478":"#8b95a8"}}>כבר יש לך חשבון? </span><button onClick={()=>{setMode("login");setErr("")}} style={{background:"none",border:"none",color:"var(--c-accent)",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer",textDecoration:"underline"}}>כניסה</button></div>
            <div style={{textAlign:"center",fontSize:11,color:lm?"#9ca3af":"#5a6478"}}>🎁 14 יום ניסיון חינם — ללא כרטיס אשראי</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══ DASHBOARD ═══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function Dashboard({orders,projects,stages,users,workLogs}){
  const [period,setPeriod]=useState("month");
  const [selYear,setSelYear]=useState("all");
  const [selProj,setSelProj]=useState("all");
  const [donutSlice,setDonutSlice]=useState("status");

  // Compute all years from workLogs
  const allYears=useMemo(()=>[...new Set(workLogs.filter(w=>w.completed&&w.endTime).map(w=>yK(w.endTime)).filter(Boolean))].sort().reverse(),[workLogs]);

  // Filter orders by project
  const fOrders=useMemo(()=>orders.filter(o=>selProj==="all"||o.projectId===selProj),[orders,selProj]);

  // Filter workLogs by year
  const fLogs=useMemo(()=>workLogs.filter(w=>{if(!w.completed||!w.endTime)return false;if(selYear!=="all"&&yK(w.endTime)!==selYear)return false;return true}),[workLogs,selYear]);

  // Helper: is serial done
  const isSerDone=(o,s)=>{const st=o.stageIds||[];return st.length>0&&st.every(sid=>workLogs.some(w=>w.serialId===s.id&&w.stageId===sid&&w.completed))};

  // KPIs
  const totalSerials=fOrders.reduce((s,o)=>s+(o.serials||[]).length,0);
  const completedSerials=fOrders.reduce((s,o)=>s+(o.serials||[]).filter(sr=>isSerDone(o,sr)).length,0);
  const actualRev=fOrders.reduce((s,o)=>{const done=(o.serials||[]).filter(sr=>isSerDone(o,sr)).length;return s+done*Number(o.unitPrice||0)},0);
  const totalWorkMins=fLogs.reduce((s,w)=>s+(w.durationMin||0),0);
  const totalWorkCost=fLogs.reduce((s,w)=>{const u=users.find(u2=>u2.id===w.userId);return s+(w.durationMin||0)*(Number(u?.hourlyRate||0)/60)},0);
  const openDefects=fOrders.flatMap(o=>(o.defects||[]).filter(d=>d.status!=="closed")).length;
  const openOrders=fOrders.filter(o=>{const sers=o.serials||[];return sers.length===0||sers.some(s=>!isSerDone(o,s))}).length;
  const openShortages=fOrders.flatMap(o=>(o.shortages||[]).filter(s2=>!s2.received)).length;
  const forecastRev=fOrders.reduce((s,o)=>{const remaining=Math.max(0,(o.serials||[]).length-(o.serials||[]).filter(sr=>isSerDone(o,sr)).length);return s+remaining*Number(o.unitPrice||0)},0);

  // Revenue by period
  const keyFn=d=>period==="year"?yK(d):period==="quarter"?qK(d):mkKey(d);
  const revByPeriod={};
  const counted=new Set();
  fLogs.forEach(w=>{
    const k=keyFn(w.endTime);if(!k)return;
    if(!revByPeriod[k])revByPeriod[k]={rev:0,qty:0,cost:0};
    // Cost: always add worker cost per log
    const u2=users.find(u3=>u3.id===w.userId);
    revByPeriod[k].cost+=(w.durationMin||0)*(Number(u2?.hourlyRate||0)/60);
    // Revenue: only when serial is fully done
    const o=fOrders.find(o2=>(o2.serials||[]).some(s=>s.id===w.serialId));if(!o)return;
    if(!isSerDone(o,{id:w.serialId}))return;
    const ck=w.serialId+"|"+k;if(counted.has(ck))return;counted.add(ck);
    revByPeriod[k].rev+=Number(o.unitPrice||0);revByPeriod[k].qty+=1;
  });
  const pKeys=Object.keys(revByPeriod).sort().slice(-10);

  // Donut data
  let donutData=[];
  if(donutSlice==="status"){
    donutData=[{label:"הושלמו",value:completedSerials},{label:"בתהליך",value:totalSerials-completedSerials}].filter(d=>d.value>0);
  }else if(donutSlice==="project"){
    donutData=projects.map(p=>{const po=fOrders.filter(o=>o.projectId===p.id);const done=po.reduce((s,o)=>(o.serials||[]).filter(sr=>isSerDone(o,sr)).length+s,0);return{label:p.name,value:done}}).filter(d=>d.value>0);
  }else{
    donutData=stages.map(st=>({label:st.name,value:fLogs.filter(w=>w.stageId===st.id).length,color:st.color})).filter(d=>d.value>0);
  }

  // Worker stats — revenue by stage price, units = serials fully done by worker
  const workerStats=users.filter(u=>u.role!=="admin"&&u.active!==false).map(u=>{
    const logs=fLogs.filter(w=>w.userId===u.id&&w.durationMin);
    const totalMin=logs.reduce((s,w)=>s+w.durationMin,0);
    const cost=totalMin*(Number(u.hourlyRate||0)/60);
    // Revenue: sum stage prices for each completed log
    const rev=logs.reduce((s,w)=>{const st=stages.find(s2=>s2.id===w.stageId);return s+Number(st?.price||0)},0);
    // Units: count serials where this worker completed ALL stages assigned to them
    const workerStageAccess=u.stageAccess==="all"?stages.map(s2=>s2.id):(Array.isArray(u.stageAccess)?u.stageAccess:[]);
    const serialsDone=new Set();
    logs.forEach(w=>{
      const o=fOrders.find(o2=>(o2.serials||[]).some(sr=>sr.id===w.serialId));
      if(!o)return;
      const myStagesInOrder=(o.stageIds||[]).filter(sid=>workerStageAccess.includes(sid));
      const allMyDone=myStagesInOrder.every(sid=>fLogs.some(l=>l.userId===u.id&&l.serialId===w.serialId&&l.stageId===sid&&l.completed));
      if(allMyDone)serialsDone.add(w.serialId);
    });
    const units=serialsDone.size;
    return{...u,totalMin,units,cost,revenue:rev,profit:rev-cost,uph:totalMin>0?(units/(totalMin/60)):0};
  }).sort((a,b)=>b.uph-a.uph);

  // Overdue
  const overdue=fOrders.filter(o=>o.targetDate&&new Date(o.targetDate)<new Date()&&(o.serials||[]).some(s=>!isSerDone(o,s)));

  return(
    <div className="fade-in">
      {/* Filter bar */}
      <div className="dash-filter-sticky" style={{position:"sticky",zIndex:40,background:"var(--c-bg)",paddingTop:8,paddingBottom:4,marginBottom:8}}>
        <Card style={{padding:"10px 14px",display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end",boxShadow:"0 2px 8px #0003"}}>
          <span style={{fontSize:13,color:"var(--c-dim)",fontWeight:600,paddingBottom:2}}>🔍</span>
          <div style={{display:"flex",flexDirection:"column",gap:3,minWidth:140}}><label style={{fontSize:11,color:"var(--c-dim)"}}>פרויקט</label><select value={selProj} onChange={e=>setSelProj(e.target.value)} style={{padding:"5px 8px",fontSize:12}}><option value="all">כל הפרויקטים</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
          <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:11,color:"var(--c-dim)"}}>שנה</label><select value={selYear} onChange={e=>setSelYear(e.target.value)} style={{padding:"5px 8px",fontSize:12}}><option value="all">כל השנים</option>{allYears.map(y=><option key={y} value={y}>{y}</option>)}</select></div>
          <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:11,color:"var(--c-dim)"}}>תקופה</label><SegBtn options={[["month","חודשי"],["quarter","רבעוני"],["year","שנתי"]]} value={period} onChange={setPeriod}/></div>
          {(selProj!=="all"||selYear!=="all")&&<button onClick={()=>{setSelProj("all");setSelYear("all")}} style={{background:"#374151",color:"#e2e8f0",border:"none",borderRadius:6,padding:"5px 10px",fontSize:12,fontFamily:"inherit"}}>✕ נקה</button>}
        </Card>
      </div>

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:9,marginBottom:14}}>
        <KpiBox i="📋" v={openOrders} label='פק"ע פתוחות' c="#f59e0b"/>
        <KpiBox i="🔢" v={totalSerials.toLocaleString()} label='סה"כ יחידות' c="#60a5fa"/>
        <KpiBox i="✅" v={completedSerials.toLocaleString()} label="הושלמו" c="#10b981"/>
        <KpiBox i="💰" v={fmtMoney(actualRev)} label="הכנסה ממומשת" c="#a78bfa"/>
        <KpiBox i="🔮" v={fmtMoney(forecastRev)} label="צפי הכנסות" c="#06b6d4"/>

        <Card>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>💰 הכנסות לפי {period==="month"?"חודש":period==="quarter"?"רבעון":"שנה"}</div>
          <BarChart data={pKeys.map(k=>({label:k,value:revByPeriod[k].rev}))} color="#a78bfa" formatVal={v=>fmtMoney(v)} height={130}/>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontWeight:700,fontSize:14}}>📊 התפלגות</div><select value={donutSlice} onChange={e=>setDonutSlice(e.target.value)} style={{padding:"3px 6px",fontSize:11,width:"auto"}}><option value="status">סטטוס</option><option value="project">פרויקטים</option><option value="stage">שלבים</option></select></div>
          <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><DonutChart data={donutData} size={170}/></div>

            {label:"הוצאות",color:"#3b82f6",data:pKeys.map(k=>Math.round(revByPeriod[k].cost)),formatVal:v=>fmtMoney(v)}

          <span>הכנסות: <b style={{color:"#10b981"}}>{fmtMoney(pKeys.reduce((s,k)=>s+revByPeriod[k].rev,0))}</b></span>
          <span>הוצאות: <b style={{color:"#3b82f6"}}>{fmtMoney(pKeys.reduce((s,k)=>s+revByPeriod[k].cost,0))}</b></span>
          <span>רווח: <b style={{color:pKeys.reduce((s,k)=>s+revByPeriod[k].rev-revByPeriod[k].cost,0)>=0?"#10b981":"#ef4444"}}>{fmtMoney(pKeys.reduce((s,k)=>s+revByPeriod[k].rev-revByPeriod[k].cost,0))}</b></span>
        </div>
      </Card>

      {/* Project progress */}
      <Card>
        <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>🏗️ התקדמות לפי פרויקט</div>
        {projects.map((p,idx)=>{
          const po=fOrders.filter(o=>o.projectId===p.id);const totalSer=po.reduce((s,o)=>s+(o.serials||[]).length,0);
          const completeSer=po.reduce((s,o)=>(o.serials||[]).filter(sr=>isSerDone(o,sr)).length+s,0);
          const pct=totalSer?Math.round(completeSer/totalSer*100):0;const c=COLORS[idx%COLORS.length];
          if(totalSer===0)return null;
          return(<div key={p.id} style={{background:"var(--c-deep)",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><div style={{display:"flex",alignItems:"center",gap:7}}><div style={{width:9,height:9,borderRadius:2,background:c}}/><span style={{fontWeight:600,fontSize:13}}>{p.name}</span></div><span style={{fontSize:14,fontWeight:800,color:c}}>{pct}%</span></div>
            <PBar pct={pct} h={7} color={c}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--c-dim)",marginTop:4}}><span>{completeSer}/{totalSer} יחידות</span><span>{po.length} פק"ע</span></div>
          </div>);
        })}
      </Card>
    </div>
  );
}

function OrderForm({initial,projects,stages,stageBlocks,onSave,onClose}){
  const {toast}=useToast();
  const [f,setF]=useState({
    woNumber:initial?.woNumber||"",description:initial?.description||"",pn:initial?.pn||"",
    qty:initial?.qty||"",unitPrice:initial?.unitPrice||"",projectId:initial?.projectId||"",
    receivedDate:initial?.receivedDate||todays(),targetDate:initial?.targetDate||"",
    stageIds:initial?.stageIds||stages.map(s=>s.id),
    blockId:initial?.blockId||""
  });
  const [genSerials,setGenSerials]=useState(!initial);
  const [snPrefix,setSnPrefix]=useState(initial?.pn||"");
  const [snStart,setSnStart]=useState(1);
  const s=(k,v)=>{setF(p=>({...p,[k]:v}));if(k==="pn"&&!initial)setSnPrefix(v)};
  const toggleStage=sid=>setF(p=>({...p,stageIds:p.stageIds.includes(sid)?p.stageIds.filter(i=>i!==sid):[...p.stageIds,sid],blockId:""}));
  const selectBlock=blockId=>{
    if(!blockId){setF(p=>({...p,blockId:"",stageIds:stages.map(s2=>s2.id)}));return}
    const block=(stageBlocks||[]).find(b=>b.id===blockId);
    if(!block)return;
    // Map block stages to global stage IDs by name match
    const ids=block.stages.map(bs=>{const match=stages.find(s2=>s2.name===bs.name);return match?.id}).filter(Boolean);
    setF(p=>({...p,blockId,stageIds:ids}));
  };
  const handleSave=()=>{
    if(!f.woNumber||!f.qty)return toast('יש למלא מספר פק"ע וכמות',"warning");
    let serials=initial?.serials||[];
    if(genSerials&&!initial){
      const prefix=snPrefix||f.pn||f.woNumber;
      const count=Number(f.qty)||0;
      serials=[];
      for(let i=0;i<count;i++){
        serials.push({id:uid(),sn:`${prefix}-${String(snStart+i).padStart(4,"0")}`,createdAt:nowISO()});
      }
    }
    onSave({...f,_serials:serials});
  };
  return(
    <div>
      <h3 style={{margin:"0 0 16px",fontSize:18}}>{initial?'עריכת פק"ע':'פק"ע חדשה'}</h3>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
        <Field label='מספר פק"ע *' value={f.woNumber} onChange={v=>s("woNumber",v)}/>
        <Field label="P/N (מק״ט)" value={f.pn} onChange={v=>s("pn",v)}/>
        <Field label="תיאור" value={f.description} onChange={v=>s("description",v)}/>
        <Field label="כמות יחידות *" type="number" value={f.qty} onChange={v=>s("qty",v)}/>
        <Field label="מחיר ליחידה (₪)" type="number" value={f.unitPrice} onChange={v=>s("unitPrice",v)}/>
        <div style={{display:"flex",flexDirection:"column",gap:4}}><label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>פרויקט</label><select value={f.projectId} onChange={e=>s("projectId",e.target.value)}><option value="">-- בחר פרויקט --</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        <Field label="תאריך קבלה" type="date" value={f.receivedDate} onChange={v=>s("receivedDate",v)}/>
        <Field label="יעד אספקה" type="date" value={f.targetDate} onChange={v=>s("targetDate",v)}/>
      </div>
      {/* Serial number generation */}
      {!initial&&(
        <div style={{marginTop:14,background:"var(--c-deep)",borderRadius:10,padding:14,border:"1px solid var(--c-border)"}}>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:genSerials?10:0}}>
            <input type="checkbox" checked={genSerials} onChange={e=>setGenSerials(e.target.checked)}/>
            🔢 צור מספרים סידוריים אוטומטית
          </label>
          {genSerials&&(
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <Field label="קידומת S/N" value={snPrefix} onChange={setSnPrefix} placeholder={f.pn||f.woNumber} style={{minWidth:120}}/>
              <Field label="מספר התחלתי" type="number" value={snStart} onChange={v=>setSnStart(Number(v))} style={{minWidth:80}}/>
              <div style={{fontSize:12,color:"var(--c-muted)",paddingBottom:8}}>
                {f.qty?`ייווצרו ${f.qty} סידוריים: ${snPrefix||f.pn||f.woNumber}-${String(snStart).padStart(4,"0")} עד ${snPrefix||f.pn||f.woNumber}-${String(snStart+Number(f.qty)-1).padStart(4,"0")}`:"הזן כמות"}
              </div>
            </div>
          )}
        </div>
      )}
      <div style={{marginTop:14}}>
        <label style={{fontSize:12,color:"var(--c-dim)",fontWeight:600,display:"block",marginBottom:6}}>שלבי עבודה לפק"ע זו:</label>
        {(stageBlocks||[]).length>0&&(
          <div style={{marginBottom:10}}>
            <label style={{fontSize:11,color:"#8b5cf6",fontWeight:600,display:"block",marginBottom:4}}>📦 בחר בלוק מוכן:</label>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <button onClick={()=>selectBlock("")} style={{background:!f.blockId?"var(--c-accent)22":"var(--c-deep)",border:`1px solid ${!f.blockId?"var(--c-accent)":"var(--c-border)"}`,borderRadius:8,padding:"5px 10px",fontSize:12,color:!f.blockId?"var(--c-accent)":"var(--c-muted)",fontFamily:"inherit",cursor:"pointer"}}>ללא בלוק</button>
              {(stageBlocks||[]).map(b=>(
                <button key={b.id} onClick={()=>selectBlock(b.id)} style={{background:f.blockId===b.id?"#8b5cf622":"var(--c-deep)",border:`1px solid ${f.blockId===b.id?"#8b5cf6":"var(--c-border)"}`,borderRadius:8,padding:"5px 10px",fontSize:12,color:f.blockId===b.id?"#8b5cf6":"var(--c-muted)",fontFamily:"inherit",cursor:"pointer"}}>
                  📦 {b.name} <span style={{fontSize:10,color:"var(--c-dim)"}}>({b.stages.length} שלבים, ₪{b.stages.reduce((s2,st)=>s2+(st.price||0),0)})</span>
                </button>
              ))}
            </div>
          </div>
        )}
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {stages.map(st=>(
            <label key={st.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",background:f.stageIds.includes(st.id)?st.color+"22":"var(--c-deep)",border:`1px solid ${f.stageIds.includes(st.id)?st.color+"66":"var(--c-border)"}`,borderRadius:8,padding:"6px 10px",color:f.stageIds.includes(st.id)?st.color:"var(--c-muted)"}}>
              <input type="checkbox" checked={f.stageIds.includes(st.id)} onChange={()=>toggleStage(st.id)} style={{width:"auto"}}/>
              {st.name}
            </label>
          ))}
        </div>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:16}}>
        <Btn onClick={onClose}>ביטול</Btn>
        <Btn color="#10b981" onClick={handleSave}>שמור</Btn>
      </div>
    </div>
  );
}

function SerialsManager({order,stages,onUpdate,workLogs,onSignOff}){
  const {canEdit,currentUser}=useAuth();
  const isAdmin=currentUser?.role==="admin";
  const [addCount,setAddCount]=useState(1);
  const [prefix,setPrefix]=useState(order.pn||order.woNumber);
  const [startNum,setStartNum]=useState((order.serials||[]).length+1);
  const serials=order.serials||[];

  const addSerials=()=>{
    const newSerials=[];
    for(let i=0;i<addCount;i++){
      newSerials.push({id:uid(),sn:`${prefix}-${String(startNum+i).padStart(4,"0")}`,createdAt:nowISO()});
    }
    onUpdate({...order,serials:[...serials,...newSerials]});
    setStartNum(startNum+addCount);
  };

  const removeSn=id=>{
    if(!confirm("למחוק יחידה זו?"))return;
    onUpdate({...order,serials:serials.filter(s=>s.id!==id)});
  };

  const getStageStatus=(serialId,stageId)=>{
    const log=workLogs.find(w=>w.serialId===serialId&&w.stageId===stageId&&w.completed);
    if(log)return{done:true,user:log.userName,time:log.endTime,duration:log.durationMin};
    const active=workLogs.find(w=>w.serialId===serialId&&w.stageId===stageId&&!w.completed);
    if(active)return{active:true,user:active.userName,startTime:active.startTime};
    return{pending:true};
  };

  const adminSignOff=(serialId,stageId)=>{
    if(!isAdmin)return;
    const serial=serials.find(s=>s.id===serialId);
    if(!serial)return;
    const stage=stages.find(s=>s.id===stageId);
    if(onSignOff)onSignOff({id:uid(),userId:currentUser.id,userName:currentUser.name,serialId,serialSn:serial.sn,stageId,orderId:order.id,startTime:nowISO(),endTime:nowISO(),completed:true,durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[]});
  };

  const oStages=(order.stageIds||[]).map(sid=>stages.find(s=>s.id===sid)).filter(Boolean).sort((a,b)=>a.order-b.order);

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <h3 style={{margin:0,fontSize:15}}>🔢 מספרים סידוריים ({serials.length})</h3>
      </div>
      {canEdit&&(
        <div style={{background:"var(--c-deep)",borderRadius:8,padding:12,marginBottom:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <Field label="קידומת" value={prefix} onChange={setPrefix} style={{minWidth:100}}/>
          <Field label="מספר התחלתי" type="number" value={startNum} onChange={v=>setStartNum(Number(v))} style={{minWidth:80}}/>
          <Field label="כמות להוספה" type="number" value={addCount} onChange={v=>setAddCount(Math.max(1,Number(v)))} style={{minWidth:80}}/>
          <Btn color="var(--c-accent)" onClick={addSerials}>+ הוסף {addCount} יחידות</Btn>
        </div>
      )}
      {serials.length===0?<div style={{color:"var(--c-dim)",textAlign:"center",padding:20}}>לא הוזנו מספרים סידוריים</div>:(
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>S/N</th>{oStages.map(st=><th key={st.id} style={{color:st.color}}>{st.name}</th>)}<th>סטטוס</th>{canEdit&&<th></th>}</tr></thead>
            <tbody>
              {serials.map(s=>{
                const allDone=oStages.every(st=>getStageStatus(s.id,st.id).done);
                const anyActive=oStages.some(st=>getStageStatus(s.id,st.id).active);
                return(
                  <tr key={s.id}>
                    <td style={{fontWeight:700,fontSize:12,color:"#7eb8ff"}}>{s.sn}</td>
                    {oStages.map(st=>{
                      const status=getStageStatus(s.id,st.id);
                      if(status.done)return<td key={st.id} style={{textAlign:"center"}}><span title={`${status.user} — ${fmtTime(status.duration)}`} style={{color:"#10b981",fontSize:16}}>✅</span></td>;
                      if(status.active)return<td key={st.id} style={{textAlign:"center"}}><span style={{animation:"pulse 1.5s infinite",color:"#f59e0b",fontSize:13}}>🔄 {status.user}</span></td>;
                      return<td key={st.id} style={{textAlign:"center"}}>{isAdmin?<button onClick={()=>adminSignOff(s.id,st.id)} style={{background:"none",border:"1px dashed var(--c-border2)",borderRadius:6,padding:"2px 8px",fontSize:11,color:"var(--c-dim)",cursor:"pointer",fontFamily:"inherit"}} title="חתום כמנהל">✍️</button>:<span style={{color:"var(--c-dim)"}}>—</span>}</td>;
                    })}
                    <td style={{textAlign:"center"}}>{allDone?<span style={{color:"#10b981",fontWeight:700,fontSize:12}}>📦 סופק</span>:anyActive?<span style={{color:"#f59e0b",fontSize:12}}>🔄 בתהליך</span>:<span style={{color:"var(--c-dim)",fontSize:12}}>ממתין</span>}</td>
                    {canEdit&&<td><IBtn onClick={()=>removeSn(s.id)}>🗑️</IBtn></td>}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

              <select value={deff.severity} onChange={e=>setDeff(p=>({...p,severity:e.target.value}))}><option value="low">נמוכה</option><option value="medium">בינונית</option><option value="high">גבוהה</option><option value="critical">קריטית</option></select>
            </div>
            <Field label="אחראי" value={deff.responsible} onChange={v=>setDeff(p=>({...p,responsible:v}))}/>
            <Field label="תיאור" value={deff.description} onChange={v=>setDeff(p=>({...p,description:v}))} style={{minWidth:200}}/>
            <Btn color="#f97316" onClick={addDef}>שמור</Btn>
            <Btn onClick={()=>setShowDef(false)}>ביטול</Btn>
          </div>
        </div>
      )}
      {(order.defects||[]).length===0?<EmptyState icon="✅" title="אין תקלות" subtitle="לא דווחו תקלות להזמנה זו"/>:(
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {(order.defects||[]).map(d=>{const sc=sevColor[d.severity];const serial=(order.serials||[]).find(s=>s.id===d.serialId);return(
            <div key={d.id} style={{background:"var(--c-deep)",borderRadius:8,padding:"10px 14px",border:`1px solid ${d.status==="closed"?"#10b98133":sc+"44"}`,opacity:d.status==="closed"?.6:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,fontSize:13}}>{d.title}</span>
                    <span style={{fontSize:11,background:sc+"22",color:sc,padding:"2px 8px",borderRadius:12,border:`1px solid ${sc}44`}}>{sevLabel[d.severity]}</span>
                    <span style={{fontSize:11,background:"var(--c-card)",color:"#7eb8ff",padding:"2px 8px",borderRadius:12}}>{typeLabel[d.type]||d.type}</span>
                    {serial&&<span style={{fontSize:11,background:"#152240",color:"#7eb8ff",padding:"2px 8px",borderRadius:12}}>S/N: {serial.sn}</span>}
                    {d.status==="closed"&&<span style={{fontSize:11,background:"#052e16",color:"#6ee7b7",padding:"2px 8px",borderRadius:12}}>✅ נסגרה</span>}
                  </div>
                  {d.description&&<div style={{fontSize:12,color:"var(--c-muted)",marginBottom:3}}>{d.description}</div>}
                  <div style={{fontSize:11,color:"var(--c-dim)",display:"flex",gap:10,flexWrap:"wrap"}}>
                    {d.discoveredDate&&<span>גולתה: {fmt(d.discoveredDate)}</span>}
                    {d.responsible&&<span style={{color:"#a78bfa"}}>אחראי: {d.responsible}</span>}
                  </div>
                </div>
                {canEdit&&<div style={{display:"flex",gap:4}}>{d.status!=="closed"&&<IBtn onClick={()=>closeDef(d.id)} title="סגור">✅</IBtn>}<IBtn onClick={()=>remDef(d.id)}>🗑️</IBtn></div>}
              </div>
            </div>
          )})}
        </div>
      )}
    </Card>
  );
}

// ── Shortages inside an Order (add/manage) ────────────────────────
function ShortagesInOrder({order,onUpdate}){
  const {canEdit}=useAuth();
  const [show,setShow]=useState(false);
  const [f,setF]=useState({item:"",sku:"",missing:"",reason:"",responsible:"",orderedDate:todays(),note:""});
  const [partialModal,setPartialModal]=useState(null);
  const [partialQty,setPartialQty]=useState("");
  const shortages=order.shortages||[];
  const addSh=()=>{if(!f.item)return;onUpdate({...order,shortages:[...shortages,{id:uid(),...f,received:false,receivedDate:null,receivedQty:0}]});setF({item:"",sku:"",missing:"",reason:"",responsible:"",orderedDate:todays(),note:""});setShow(false)};
  const markRec=id=>onUpdate({...order,shortages:shortages.map(s=>s.id===id?{...s,received:true,receivedDate:todays(),receivedQty:Number(s.missing||0)}:s)});
  const markRecPartial=(id,qty)=>{onUpdate({...order,shortages:shortages.map(s=>{if(s.id!==id)return s;const nq=Number(s.receivedQty||0)+Number(qty),tot=Number(s.missing||0);return{...s,receivedQty:nq,received:tot>0&&nq>=tot,receivedDate:todays()}})});setPartialModal(null);setPartialQty("")};
  const remSh=id=>onUpdate({...order,shortages:shortages.filter(s=>s.id!==id)});
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h3 style={{margin:0,fontSize:15,color:"#f87171"}}>⚠️ חוסרים ({shortages.filter(s=>!s.received).length})</h3>
        {canEdit&&<Btn color="#ef4444" small onClick={()=>setShow(p=>!p)}>+ הוסף חוסר</Btn>}
      </div>
      {show&&(
        <div style={{background:"var(--c-deep)",borderRadius:8,padding:12,marginBottom:10,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <Field label="פריט חסר *" value={f.item} onChange={v=>setF(p=>({...p,item:v}))} style={{minWidth:160}}/>
          <Field label='מק"ט' value={f.sku} onChange={v=>setF(p=>({...p,sku:v}))}/>
          <Field label="כמות" type="number" value={f.missing} onChange={v=>setF(p=>({...p,missing:v}))}/>
          <Field label="סיבה" value={f.reason} onChange={v=>setF(p=>({...p,reason:v}))}/>
          <Field label="אחראי" value={f.responsible} onChange={v=>setF(p=>({...p,responsible:v}))}/>
          <Field label="תאריך הזמנה" type="date" value={f.orderedDate} onChange={v=>setF(p=>({...p,orderedDate:v}))}/>
          <Field label="הערה" value={f.note} onChange={v=>setF(p=>({...p,note:v}))}/>
          <Btn color="#ef4444" onClick={addSh} small>שמור</Btn>
          <Btn onClick={()=>setShow(false)} small>ביטול</Btn>
        </div>
      )}
      {shortages.length===0?<EmptyState icon="✅" title="אין חוסרים" subtitle="כל החומרים זמינים"/>:(
        <div style={{overflowX:"auto"}}><table><thead><tr><th>פריט</th><th>מק"ט</th><th>כמות</th><th>התקבל</th><th>אחראי</th><th>סטטוס</th>{canEdit&&<th></th>}</tr></thead><tbody>
          {shortages.map(s=>{const rq=Number(s.receivedQty||0),tot=Number(s.missing||0),isPar=rq>0&&!s.received;return(
            <tr key={s.id} style={{opacity:s.received?.6:1}}>
              <td style={{fontWeight:600}}>{s.item}</td>
              <td style={{color:"#7eb8ff",fontSize:12}}>{s.sku||"—"}</td>
              <td>{tot||"—"}</td>
              <td style={{color:s.received?"#10b981":isPar?"#f59e0b":"var(--c-dim)",fontWeight:600}}>{s.received?tot:isPar?`${rq}/${tot}`:"—"}</td>
              <td style={{color:"#a78bfa",fontSize:12}}>{s.responsible||"—"}</td>
              <td>{s.received?<span style={{color:"#10b981",fontSize:12}}>✅</span>:isPar?<span style={{color:"#f59e0b",fontSize:12}}>📦</span>:<span style={{color:"#ef4444",fontSize:12}}>❌</span>}</td>
              {canEdit&&<td><div style={{display:"flex",gap:2}}>
                {!s.received&&<><IBtn onClick={()=>{setPartialModal(s.id);setPartialQty("")}} title="קבלה חלקית">📦</IBtn><IBtn onClick={()=>markRec(s.id)} title="התקבל">✅</IBtn></>}
                <IBtn onClick={()=>remSh(s.id)}>🗑️</IBtn>
              </div></td>}
            </tr>
          )})}
        </tbody></table></div>
      )}
      {partialModal&&(<div onClick={()=>setPartialModal(null)} style={{position:"fixed",inset:0,background:"#000c",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div onClick={e=>e.stopPropagation()} style={{background:"var(--c-card)",borderRadius:12,padding:24,minWidth:280,border:"1px solid var(--c-border2)"}}><div style={{fontWeight:700,fontSize:16,marginBottom:12,color:"#f59e0b"}}>📦 קבלה חלקית</div><Field label="כמות שהתקבלה" type="number" value={partialQty} onChange={setPartialQty}/><div style={{display:"flex",gap:8,marginTop:14}}><Btn color="#f59e0b" onClick={()=>partialQty&&markRecPartial(partialModal,partialQty)}>שמור</Btn><Btn onClick={()=>setPartialModal(null)}>ביטול</Btn></div></div></div>)}
    </div>
  );
}

function OrderDetail({order,projects,stages,onClose,onUpdate,workLogs,onWorkLog}){
  const {canEdit,currentUser}=useAuth();
  const isAdmin=currentUser?.role==="admin";
  const proj=projects.find(p=>p.id===order.projectId);
  const serials=order.serials||[];
  const oStages=(order.stageIds||[]).map(sid=>stages.find(s=>s.id===sid)).filter(Boolean).sort((a,b)=>a.order-b.order);
  const totalCompleted=serials.filter(s=>oStages.every(st=>workLogs.some(w=>w.serialId===s.id&&w.stageId===st.id&&w.completed))).length;
  const pct=serials.length?Math.round(totalCompleted/serials.length*100):0;
  const [editDates,setEditDates]=useState(false);
  const [dates,setDates]=useState({receivedDate:order.receivedDate||"",targetDate:order.targetDate||"",deliveryDate:order.deliveryDate||"",deliveryStatus:order.deliveryStatus||"pending",deliveryNotes:order.deliveryNotes||""});
  const saveDates=()=>{onUpdate({...order,...dates});setEditDates(false)};
  const deliveredCount=Number(order.deliveredQty||0);

  return(
    <div className="fade-in">
      <Btn onClick={onClose} style={{marginBottom:12}}>← חזרה</Btn>
      <Card style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div>
            <h2 style={{margin:"0 0 3px",color:"#60a5fa"}}>{order.woNumber}</h2>
            {order.pn&&<div style={{color:"#a78bfa",fontSize:13}}>P/N: {order.pn}</div>}
            {order.description&&<div style={{color:"var(--c-muted)"}}>{order.description}</div>}
            <div style={{marginTop:3,fontSize:13,color:proj?"#7eb8ff":"var(--c-dim)"}}>{proj?`📂 ${proj.name}`:"📂 ללא פרויקט"}</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:14,fontWeight:700,color:"#10b981"}}>{totalCompleted}/{serials.length} הושלמו</span>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8,marginTop:10}}>
          {(()=>{const isW=currentUser?.role==="worker";const items=[["כמות",serials.length],["הושלמו",totalCompleted],["תאריך קבלה",fmt(order.receivedDate)],["יעד אספקה",fmt(order.targetDate)]];if(!isW){items.splice(2,0,["מחיר ליחידה",fmtMoney(order.unitPrice)],["הכנסה ממומשת",fmtMoney(totalCompleted*Number(order.unitPrice||0))]);} return items.map(([l,v])=>(
            <div key={l} style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>{l}</div><div style={{fontWeight:700,fontSize:12,wordBreak:"break-word"}}>{v}</div></div>
          ))})()}
        </div>
        <div style={{marginTop:12}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--c-muted)",marginBottom:3}}><span>התקדמות</span><span>{pct}%</span></div>
          <PBar pct={pct} h={10}/>
        </div>
      </Card>

      {/* Delivery & Dates Management (admin only) */}
      {isAdmin&&(
        <Card style={{marginBottom:14,border:"1px solid #06b6d433"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <h3 style={{margin:0,fontSize:15,color:"#06b6d4"}}>📦 אספקה ותאריכים</h3>
            <Btn color="#06b6d4" small onClick={()=>setEditDates(p=>!p)}>{editDates?"סגור":"✏️ ערוך"}</Btn>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8,marginBottom:editDates?12:0}}>
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>סטטוס אספקה</div><div style={{fontWeight:700,fontSize:12,color:order.deliveryStatus==="delivered"?"#10b981":order.deliveryStatus==="partial"?"#f59e0b":"var(--c-muted)"}}>{order.deliveryStatus==="delivered"?"✅ סופק":order.deliveryStatus==="partial"?`📦 חלקי (${deliveredCount}/${serials.length})`:"⏳ ממתין"}</div></div>
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>תאריך אספקה</div><div style={{fontWeight:700,fontSize:12}}>{order.deliveryDate?fmt(order.deliveryDate):"—"}</div></div>
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>תאריך קבלה</div><div style={{fontWeight:700,fontSize:12}}>{fmt(order.receivedDate)}</div></div>
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>יעד</div><div style={{fontWeight:700,fontSize:12,color:order.targetDate&&new Date(order.targetDate)<new Date()?"#ef4444":"var(--c-text)"}}>{fmt(order.targetDate)}</div></div>
          </div>
          {order.deliveryNotes&&<div style={{fontSize:12,color:"var(--c-muted)",marginTop:6}}>📝 {order.deliveryNotes}</div>}
          {editDates&&(
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:120}}>
                <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>סטטוס אספקה</label>
                <select value={dates.deliveryStatus} onChange={e=>setDates(p=>({...p,deliveryStatus:e.target.value}))}>
                  <option value="pending">⏳ ממתין</option>
                  <option value="partial">📦 חלקי</option>
                  <option value="delivered">✅ סופק</option>
                </select>
              </div>
              {dates.deliveryStatus==="partial"&&<Field label="כמות שסופקה" type="number" value={order.deliveredQty||""} onChange={v=>onUpdate({...order,deliveredQty:Number(v)})} style={{minWidth:80}}/>}
              <Field label="תאריך קבלה" type="date" value={dates.receivedDate} onChange={v=>setDates(p=>({...p,receivedDate:v}))} style={{minWidth:120}}/>
              <Field label="יעד אספקה" type="date" value={dates.targetDate} onChange={v=>setDates(p=>({...p,targetDate:v}))} style={{minWidth:120}}/>
              <Field label="תאריך אספקה" type="date" value={dates.deliveryDate} onChange={v=>setDates(p=>({...p,deliveryDate:v}))} style={{minWidth:120}}/>
              <Field label="הערות אספקה" value={dates.deliveryNotes} onChange={v=>setDates(p=>({...p,deliveryNotes:v}))} style={{minWidth:200}}/>
              <Btn color="#06b6d4" onClick={saveDates} small>💾 שמור</Btn>
            </div>
          )}
        </Card>
      )}

      {/* Serials Manager */}
      <Card style={{marginBottom:14}}>
        <SerialsManager order={order} stages={stages} onUpdate={onUpdate} workLogs={workLogs} onSignOff={onWorkLog}/>
      </Card>

      {/* Shortages inside order */}
      <Card style={{marginBottom:14,border:"1px solid #ef444433"}}>
        <ShortagesInOrder order={order} onUpdate={onUpdate}/>
      </Card>

      {/* Defects */}
      <DefectsSection order={order} onUpdate={onUpdate}/>
    </div>
  );
}

function Orders({orders,projects,stages,stageBlocks,updO,workLogs,onWorkLog}){
  const {canEdit}=useAuth();
  const [showForm,setShowForm]=useState(false);
  const [editing,setEditing]=useState(null);
  const [detail,setDetail]=useState(null);
  const [search,setSearch]=useState("");
  const [filterProj,setFilterProj]=useState("all");

  const filtered=useMemo(()=>{
    return orders.filter(o=>{
      if(filterProj!=="all"&&o.projectId!==filterProj)return false;
      if(search&&!o.woNumber?.toLowerCase().includes(search.toLowerCase())&&!o.description?.toLowerCase().includes(search.toLowerCase())&&!o.pn?.toLowerCase().includes(search.toLowerCase()))return false;
      return true;
    });
  },[orders,filterProj,search]);

  const del=id=>{if(!confirm('למחוק פק"ע זו?'))return;updO(prev=>prev.filter(o=>o.id!==id));if(detail?.id===id)setDetail(null)};
  const handleUpd=(upd)=>{updO(prev=>prev.map(o=>o.id===upd.id?upd:o));setDetail(upd)};

  // Always get fresh order from state
  const detailOrder=detail?orders.find(o=>o.id===detail.id)||detail:null;

  if(detailOrder)return<OrderDetail order={detailOrder} projects={projects} stages={stages} onClose={()=>setDetail(null)} onUpdate={handleUpd} workLogs={workLogs} onWorkLog={onWorkLog}/>;

  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:10}}>
        <h2 style={{margin:0}}>📋 פקודות עבודה</h2>
        {canEdit&&<Btn color="var(--c-accent)" onClick={()=>{setEditing(null);setShowForm(true)}}>+ פק"ע חדשה</Btn>}
      </div>
      <Card style={{padding:"12px 14px",marginBottom:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{display:"flex",flexDirection:"column",gap:3,flex:"1 1 150px"}}><label style={{fontSize:11,color:"var(--c-dim)"}}>חיפוש</label><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="חיפוש לפי מספר / תיאור / P/N..."/></div>
        <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:11,color:"var(--c-dim)"}}>פרויקט</label><select value={filterProj} onChange={e=>setFilterProj(e.target.value)} style={{padding:"7px 8px",fontSize:12}}><option value="all">כל הפרויקטים</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        <div style={{fontSize:12,color:"var(--c-dim)",paddingBottom:4}}>{filtered.length} פק"ע</div>
      </Card>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {filtered.length===0&&<EmptyState icon="📋" title='אין פק"ע להצגה' subtitle="צור הזמנה חדשה כדי להתחיל"/>}
        {filtered.map(o=>{
          const serials=o.serials||[];
          const oStages=(o.stageIds||[]).map(sid=>stages.find(s=>s.id===sid)).filter(Boolean);
          const completed=serials.filter(s=>oStages.every(st=>workLogs.some(w=>w.serialId===s.id&&w.stageId===st.id&&w.completed))).length;
          const pct=serials.length?Math.round(completed/serials.length*100):0;
          const proj=projects.find(p=>p.id===o.projectId);
          const openDef=(o.defects||[]).filter(d=>d.status!=="closed").length;
          return(
            <div key={o.id} style={{background:"var(--c-card)",borderRadius:10,padding:"12px 14px",border:"1px solid var(--c-border)",cursor:"pointer",transition:"border-color .15s"}}
              onClick={()=>setDetail(o)}
              onMouseEnter={e=>e.currentTarget.style.borderColor="var(--c-accent)"}
              onMouseLeave={e=>e.currentTarget.style.borderColor="var(--c-border)"}
            >
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700,fontSize:15}}>{o.woNumber}</span>
                  {o.pn&&<span style={{fontSize:11,color:"#a78bfa"}}>P/N: {o.pn}</span>}
                  {proj?<span style={{fontSize:11,background:"var(--c-tag-blue-bg)",color:"var(--c-tag-blue)",padding:"2px 7px",borderRadius:20}}>{proj.name}</span>:<span style={{fontSize:11,background:"var(--c-border)",color:"var(--c-dim)",padding:"2px 7px",borderRadius:20}}>ללא פרויקט</span>}
                  {openDef>0&&<span style={{fontSize:11,background:"#450a0a",color:"#fca5a5",padding:"2px 7px",borderRadius:20}}>🔧 {openDef}</span>}
                </div>
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  <span style={{fontSize:12,fontWeight:700,color:pct>=100?"#10b981":"var(--c-muted)"}}>{completed}/{serials.length}</span>
                  {canEdit&&<><IBtn onClick={e=>{e.stopPropagation();setEditing(o);setShowForm(true)}}>✏️</IBtn><IBtn onClick={e=>{e.stopPropagation();del(o.id)}}>🗑️</IBtn></>}
                </div>
              </div>
              {o.description&&<div style={{fontSize:13,color:"var(--c-muted)",marginBottom:4}}>{o.description}</div>}
              <div style={{display:"flex",gap:10,fontSize:12,color:"var(--c-dim)",marginBottom:5,flexWrap:"wrap"}}>
                <span>יחידות: <b style={{color:"var(--c-text)"}}>{serials.length}</b></span>
                {canEdit&&<span>מחיר: <b style={{color:"#a78bfa"}}>{fmtMoney(o.unitPrice)}</b></span>}
                <span>שלבים: <b>{(o.stageIds||[]).length}</b></span>
              </div>
              <PBar pct={pct}/>
            </div>
          );
        })}
      </div>
      {showForm&&(<Modal onClose={()=>setShowForm(false)}><OrderForm initial={editing} projects={projects} stages={stages} stageBlocks={stageBlocks} onSave={data=>{
        const{_serials,...rest}=data;
        if(editing){
          updO(prev=>prev.map(o=>o.id===editing.id?{...editing,...rest}:o));
        }else{
          updO(prev=>[...prev,{...rest,id:uid(),serials:_serials||[],shortages:[],defects:[]}]);
        }
        setShowForm(false);
      }} onClose={()=>setShowForm(false)}/></Modal>)}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ SHORTAGES (חוסרים) ═════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function Shortages({orders,updO,projects}){
  const {canEdit}=useAuth();
  const [filter,setFilter]=useState("open");
  const [filterProj,setFilterProj]=useState("all");
  const [partialModal,setPartialModal]=useState(null);
  const [partialQty,setPartialQty]=useState("");
  const all=orders.flatMap(o=>(o.shortages||[]).map(s=>({...s,order:o,proj:projects.find(p=>p.id===o.projectId)}))).filter(s=>{
    if(filterProj!=="all"&&s.order.projectId!==filterProj)return false;
    return filter==="all"||(filter==="open"&&!s.received)||(filter==="received"&&s.received);
  });
  const markRec=(oid,sid)=>{updO(prev=>prev.map(o=>{if(o.id!==oid)return o;const sh=o.shortages.map(s=>s.id===sid?{...s,received:true,receivedDate:todays(),receivedQty:Number(s.missing||0)}:s);return{...o,shortages:sh}}))};
  const markRecPartial=(oid,sid,qty)=>{updO(prev=>prev.map(o=>{if(o.id!==oid)return o;const sh=o.shortages.map(s=>{if(s.id!==sid)return s;const nq=Number(s.receivedQty||0)+Number(qty),tot=Number(s.missing||0);return{...s,receivedQty:nq,received:tot>0&&nq>=tot,receivedDate:todays()}});return{...o,shortages:sh}}));setPartialModal(null);setPartialQty("")};
  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:10}}>
        <h2 style={{margin:0,fontSize:22,color:"#f87171"}}>⚠️ חוסרים</h2>
        <SegBtn options={[["open","פתוחים"],["received","שהתקבלו"],["all","הכל"]]} value={filter} onChange={setFilter}/>
      </div>
      <Card style={{padding:"10px 14px",marginBottom:12,display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap"}}>
        <div style={{display:"flex",flexDirection:"column",gap:3,minWidth:160}}><label style={{fontSize:11,color:"var(--c-dim)"}}>פרויקט</label><select value={filterProj} onChange={e=>setFilterProj(e.target.value)} style={{padding:"6px 8px",fontSize:12}}><option value="all">הכל</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        <div style={{fontSize:12,color:"var(--c-dim)",paddingBottom:4}}>{all.length} חוסרים</div>
      </Card>
      {all.length===0?<EmptyState icon={filter==="open"?"🎉":"📭"} title={filter==="open"?"אין חוסרים פתוחים!":"אין נתונים"} subtitle={filter==="open"?"כל החומרים זמינים":"נסה לשנות את הסינון"}/>:(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {all.map(s=>{const rq=Number(s.receivedQty||0),tot=Number(s.missing||0),isPar=rq>0&&!s.received;return(
            <div key={s.id} style={{background:"var(--c-card)",borderRadius:10,padding:"12px 14px",border:`1px solid ${s.received?"#10b98133":isPar?"#f59e0b33":"#ef444433"}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,color:s.received?"#10b981":isPar?"#f59e0b":"#f87171",marginBottom:3}}>{s.item}{s.sku&&<span style={{fontSize:11,color:"#7eb8ff",marginRight:8,fontWeight:400}}>מק"ט: {s.sku}</span>}</div>
                <div style={{fontSize:12,color:"var(--c-muted)",display:"flex",gap:10,flexWrap:"wrap"}}>
                  <span style={{color:"#60a5fa"}}>{s.order.woNumber}</span>
                  {tot>0&&<span>נדרש: {tot}{isPar?` | התקבל: ${rq}`:""}</span>}
                  <span>הוזמן: {fmt(s.orderedDate)}</span>
                  {s.received&&s.orderedDate&&s.receivedDate&&<span style={{color:"#a78bfa"}}>⏱ {daysBetween(s.orderedDate,s.receivedDate)} ימים</span>}
                </div>
                {(s.reason||s.responsible)&&<div style={{fontSize:11,color:"var(--c-dim)",marginTop:3,display:"flex",gap:10,flexWrap:"wrap"}}>{s.reason&&<span>סיבה: {s.reason}</span>}{s.responsible&&<span style={{color:"#a78bfa"}}>אחראי: {s.responsible}</span>}</div>}
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                {canEdit&&!s.received&&<><Btn color="#f59e0b" small onClick={()=>{setPartialModal({oid:s.order.id,sid:s.id,item:s.item});setPartialQty("")}}>📦 חלקי</Btn><Btn color="#10b981" small onClick={()=>markRec(s.order.id,s.id)}>✅ הכל</Btn></>}
                {s.received?<span style={{fontSize:11,background:"#052e16",color:"#6ee7b7",padding:"3px 9px",borderRadius:20}}>✅ הושלם</span>:isPar?<span style={{fontSize:11,background:"#451a0344",color:"#fbbf24",padding:"3px 9px",borderRadius:20}}>📦 חלקי</span>:<span style={{fontSize:11,background:"#450a0a",color:"#fca5a5",padding:"3px 9px",borderRadius:20}}>❌ ממתין</span>}
              </div>
            </div>
          )})}
        </div>
      )}
      {partialModal&&(<div onClick={()=>setPartialModal(null)} style={{position:"fixed",inset:0,background:"#000c",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div onClick={e=>e.stopPropagation()} style={{background:"var(--c-card)",borderRadius:12,padding:24,minWidth:280,border:"1px solid var(--c-border2)"}}><div style={{fontWeight:700,fontSize:16,marginBottom:12,color:"#f59e0b"}}>📦 קבלה חלקית</div><div style={{fontSize:13,color:"var(--c-muted)",marginBottom:12}}>{partialModal.item}</div><Field label="כמות שהתקבלה" type="number" value={partialQty} onChange={setPartialQty}/><div style={{display:"flex",gap:8,marginTop:14}}><Btn color="#f59e0b" onClick={()=>partialQty&&markRecPartial(partialModal.oid,partialModal.sid,partialQty)}>שמור</Btn><Btn onClick={()=>setPartialModal(null)}>ביטול</Btn></div></div></div>)}
    </div>
  );
}

// ═══ ADMIN TASKS BOARD ══════════════════════════════════════════════════

function AdminTasksBoard({customTasks,onDeleteTask,onMarkPartialTask,onMarkDoneTask}){

                    <div style={{display:"flex",gap:8,alignItems:"center"}}>

              <IBtn onClick={()=>setDetailTask(null)}>✕</IBtn>

                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>עובד</div><div style={{fontWeight:600,color:"#60a5fa"}}>{detailTask.userName}</div></div>

                <div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>תאריך הקצאה</div><div style={{fontWeight:600}}>{fmt(detailTask.createdAt?.slice(0,10))}</div></div>
                <div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>תאריך סיום</div><div style={{fontWeight:600,color:detailTask.endTime?"#10b981":"var(--c-dim)"}}>{detailTask.endTime?fmt(detailTask.endTime.slice(0,10)):"—"}</div></div>
                {detailTask.durationMin>0&&<div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>זמן ביצוע</div><div style={{fontWeight:600,color:"#a78bfa"}}>{fmtTime(detailTask.durationMin)}</div></div>}
                {(detailTask.pauseLog||[]).length>0&&<div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>הפסקות</div><div style={{fontWeight:600,color:"#f97316"}}>{(detailTask.pauseLog||[]).length} ({fmtTime(detailTask.totalPauseMin||0)})</div></div>}
              </div>
              {!detailTask.completed&&(
                <div style={{display:"flex",gap:8,marginTop:4,flexWrap:"wrap"}}>
                  <Btn color="#3b82f6" small onClick={()=>{onMarkPartialTask&&onMarkPartialTask(detailTask.id);setDetailTask(null)}}>🔄 סמן חלקית</Btn>
                  <Btn color="#10b981" small onClick={()=>{onMarkDoneTask&&onMarkDoneTask(detailTask.id);setDetailTask(null)}}>✅ סמן כבוצע</Btn>
                  <Btn small onClick={()=>{if(confirm("למחוק?"))onDeleteTask(detailTask.id);setDetailTask(null)}}>🗑️ מחק</Btn>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </Card>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ MY WORK (Worker View) — Enhanced with Break, Bulk, Custom Tasks ════
// ══════════════════════════════════════════════════════════════════════════
function MyWork({orders,stages,workLogs,onStartWork,onEndWork,onPauseWork,onResumeWork,customTasks,onAddTask,onStartTask,onEndTask,onPauseTask,onResumeTask,onDeleteTask,onMarkPartialTask,onMarkDoneTask}){
  const {toast}=useToast();
  const {currentUser}=useAuth();
  const myAccess=currentUser.stageAccess==="all"?stages.map(s=>s.id):(Array.isArray(currentUser.stageAccess)?currentUser.stageAccess:[]);
  const myActiveLogs=workLogs.filter(w=>w.userId===currentUser.id&&!w.completed);
  const myActiveLog=myActiveLogs[0];
  const [bulkMode,setBulkMode]=useState(false);
  const [bulkSelected,setBulkSelected]=useState([]);
  const [showTaskForm,setShowTaskForm]=useState(false);
  const [taskName,setTaskName]=useState("");
  const [taskDesc,setTaskDesc]=useState("");

  const accessible=orders.filter(o=>(o.stageIds||[]).some(sid=>myAccess.includes(sid)));

  const startWork=(serialId,stageId,orderId)=>{
    if(myActiveLog&&!myActiveLog.paused){toast("יש לך עבודה פעילה. סיים או עצור לפני שמתחיל חדשה.","warning");return}
    const order=orders.find(o=>o.id===orderId);const serial=(order?.serials||[]).find(s=>s.id===serialId);
    onStartWork({id:uid(),userId:currentUser.id,userName:currentUser.name,serialId,stageId,orderId,serialSn:serial?.sn||"",startTime:nowISO(),endTime:null,completed:false,durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[]});
  };

  const startBulk=(oId)=>{
    if(myActiveLog&&!myActiveLog.paused){toast("יש עבודה פעילה","warning");return}
    const order=orders.find(o=>o.id===oId);
    const allStagesOrdered=(order?.stageIds||[]).map(sid=>stages.find(s2=>s2.id===sid)).filter(Boolean).sort((a,b)=>a.order-b.order);
    const groupId=uid();
    bulkSelected.forEach(sId=>{
      const serial=(order?.serials||[]).find(s=>s.id===sId);
      // Find THIS serial's correct next stage
      const nextSt=allStagesOrdered.find(st=>!workLogs.some(w=>w.serialId===sId&&w.stageId===st.id&&w.completed));
      if(!nextSt||!myAccess.includes(nextSt.id))return;
      onStartWork({id:uid(),userId:currentUser.id,userName:currentUser.name,serialId:sId,stageId:nextSt.id,orderId:oId,serialSn:serial?.sn||"",startTime:nowISO(),endTime:null,completed:false,durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[],bulk:true,bulkGroupId:groupId,bulkCount:bulkSelected.length});
    });
    setBulkSelected([]);setBulkMode(false);
  };

  const endWork=()=>{
    if(!myActiveLog)return;
    const start=new Date(myActiveLog.startTime);
    let dur=Math.round((Date.now()-start.getTime())/60000);
    dur-=(myActiveLog.totalPauseMin||0);
    if(myActiveLog.paused&&myActiveLog.pauseStart)dur-=Math.round((Date.now()-new Date(myActiveLog.pauseStart).getTime())/60000);
    onEndWork(myActiveLog.id,Math.max(0,dur));
    // If bulk, end all
    myActiveLogs.filter(w=>w.bulk&&w.id!==myActiveLog.id).forEach(w=>{
      let d2=Math.round((Date.now()-new Date(w.startTime).getTime())/60000)-(w.totalPauseMin||0);

    if(!myActiveLog)return;

    else{logsToToggle.forEach(w=>onPauseWork(w.id))}

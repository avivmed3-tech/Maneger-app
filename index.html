function overseeingUserIds(currentUser,users,departments){
  if(!currentUser)return [];
  if(currentUser.role==="admin")return null;
  const active=(users||[]).filter(u=>u.active!==false);
  if(currentUser.role==="dept_manager"){
    const dept=(departments||[]).find(d=>d.id===currentUser.departmentId||d.managerId===currentUser.id);
    const ids=new Set([currentUser.id]);
    if(dept)active.forEach(u=>{if(u.departmentId===dept.id)ids.add(u.id)});

  }

    const ids=new Set([currentUser.id]);
    active.forEach(u=>{if(u.managerId===currentUser.id)ids.add(u.id)});

// ── SHA-256 password hashing ────────────────────────────────────────────────
async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// The branch numbers of a department, cleaned and de-duplicated.
const deptBranches=d=>[...new Set(((d&&d.branches)||[]).map(branchCode).filter(Boolean))];

// ── מי רואה איזה סניף ─────────────────────────────────────────────────────
// The number is already the business division; a department is already given the
// numbers it works for. Put those two facts together and the number stops being a
// label and becomes a permission: assign סניף 53 to מחלקת תק"ש and its people stop
// seeing the other three divisions' work — with nobody maintaining a list per
// person, because the department they are already in says it.
//
// A person's own record can widen that, never narrow it: numbers their department
// was not given, פק"ע that carry no number at all, or "כל הסניפים" for someone
// whose job really does span the plant. Narrowing below the department is what the
// department is *for* — a second place to take it away would only ever disagree
// with the first.
//
// null means "no restriction", and that null is why nothing changes until this is
// configured: before any department is given a number every scope is null, and no
// list anywhere is filtered.
function userBranchScope(user,departments){
  if(!user||user.role==="admin")return null;
  if(user.branchAccess==="all")return null;
  const codes=new Set(deptBranches((departments||[]).find(d=>d.id===user.departmentId)));
  (Array.isArray(user.branchAccess)?user.branchAccess:[]).forEach(c=>{const k=branchCode(c);if(k)codes.add(k)});
  const none=user.branchNone===true;
  if(!codes.size&&!none)return null;
  return{codes,none};
}
// Does a scope admit this פק"ע? A null scope admits everything, and a פק"ע that
// carries no number is admitted only by the explicit "ללא סניף" permission —
// otherwise every un-stamped row from before the column existed would leak past
// every restriction.
const branchScopeAllows=(scope,order)=>{
  if(!scope)return true;
  const c=branchCode(order&&order.branch);
  return c?scope.codes.has(c):scope.none;
};
// The numbers that come from the department, as opposed to the ones added by hand
// on the person's own record — the admin screen shows the two apart, so it is
// clear which of them moving the person to another department would change.
const inheritedBranches=(user,departments)=>deptBranches((departments||[]).find(d=>d.id===(user&&user.departmentId)));
// One line of "what this person may see", for the user list and the Excel export.
const branchScopeLabel=(user,departments)=>{
  const sc=userBranchScope(user,departments);
  if(!sc)return "כל הסניפים";
  const codes=sortBranches([...sc.codes]);
  return [codes.length?codes.map(branchLabel).join(" · "):"",sc.none?"ללא סניף":""].filter(Boolean).join(" · ");
};

// ── DB load all ────────────────────────────────────────────────────────────
// A total ordering, so paging cannot overlap or skip: a bulk import writes
// thousands of rows carrying the same created_at, and id breaks the tie.
// Every ordering here ends in id.asc: paging needs a *total* order or two pages
// can return the same row (or skip one), and a bulk import stamps thousands of
// rows with the same created_at / name / מק"ט.
const ORDER_BY={
  orders:"order=created_at.asc,id.asc",work_logs:"order=created_at.asc,id.asc",
  // The delta read filters on updated_at, so it pages on updated_at too: ordering
  // it by created_at instead makes the database walk the whole table and discard
  // everything that did not move. Any total order will do here — the rows are
  // merged by id, not by position.
  work_logs_changed:"order=updated_at.asc,id.asc",
  projects:"order=name.asc,id.asc",stages:"order=stage_order.asc,id.asc",
  stage_blocks:"order=created_at.asc,id.asc",custom_tasks:"order=created_at.asc,id.asc",
  departments:"order=name.asc,id.asc",daily_plans:"order=created_at.asc,id.asc",
  pn_standards:"order=pn.asc,id.asc",app_users:"order=name.asc,id.asc"
};
// ── The one table too big to re-read on a timer ───────────────────────────
// A full read of work_logs is 56,000 rows — fifty-odd round trips, because
// PostgREST caps a page at a thousand. Right on load; wrong every fifteen
// seconds. What can actually change is a small, knowable set: work_logs has no
// updated_at, but a row is created open and later completed in place, so the
// mutable rows are the ones still open plus the ones created recently. Add the
// ids that were open at the last sweep — a job finished since then is in
// neither of the other two sets — and the sweep sees every change without
// re-reading the finished history, which cannot move.
//
// What this does *not* catch is a finished row deleted on another device; the
// periodic full sweep is what reconciles that.
// How far back the sweep looks when it has nothing better to go on. This used to
// be the whole answer, and on real data it is a terrible one: a bulk import stamps
// a day's worth of rows at once, so "the last two days" matched 24,400 of the
// 39,983 rows — twelve megabytes re-read every fifteen seconds to discover that
// nothing had changed. It survives only as the fallback for a database whose
// updated_at migration has not been run.
const HOT_LOG_DAYS=2;
// The newest updated_at this browser has read *and applied*. The sweep asks for
// everything at or after it, which is exactly the set of rows that can have moved.
//
// ">=" and not ">": a batch upsert writes its 200 rows inside one transaction, so
// they share a timestamp to the microsecond, and a strict ">" would step over the
// rest of the batch the watermark was taken from. The overlap that costs is one
// batch; the window it replaces was two days.
let LOG_WATERMARK="";
// Cleared the first time the server refuses a query on updated_at, so a project
// that has not run the migration falls back to the window above instead of failing
// to sync at all.
let LOG_HAS_UPDATED_AT=true;
// The watermark is only ever moved by a caller that actually *applied* what it
// read. A sweep whose data is thrown away — which happens whenever a local edit
// lands mid-fetch — must leave it where it was, or those rows would be skipped by
// every later sweep and not reappear until the next full read.
function commitLogWatermark(data){
  const w=data&&data.logWatermark;
  if(w&&w>LOG_WATERMARK)LOG_WATERMARK=w;
}
const maxUpdatedAt=rows=>{
  let m="";
  for(const r of (rows||[])){const u=r&&r.updated_at;if(u&&u>m)m=u}
  return m;
};
// Every row touched since the watermark, or — with no watermark yet, or no column
// to hang one on — the fixed window. Falling back is a slow path, never a wrong
// one: a wider question always contains the narrower one's answer.
async function dbLoadChangedLogs(cf){
  if(LOG_HAS_UPDATED_AT&&LOG_WATERMARK){
    try{
      return await SB.getAll("work_logs",cf+`updated_at=gte.${encodeURIComponent(LOG_WATERMARK)}&`+ORDER_BY.work_logs_changed);
    }catch(e){
      if(!/updated_at/i.test(String((e&&e.message)||e)))throw e;
      LOG_HAS_UPDATED_AT=false;
      console.warn("[SB] work_logs.updated_at לא קיים במסד — הסנכרון המצטבר חוזר לחלון הזמן הישן");
    }
  }
  const since=new Date(Date.now()-HOT_LOG_DAYS*86400000).toISOString();
  return SB.getAll("work_logs",cf+`created_at=gte.${encodeURIComponent(since)}&`+ORDER_BY.work_logs);
}
async function dbLoadHotLogs(cid,openIds){
  const cf=`company_id=eq.${cid}&`;
  const watched=[...new Set((openIds||[]).filter(Boolean))];
  const byIdQueries=[];
  for(let i=0;i<watched.length;i+=SB_CHUNK){
    const q=watched.slice(i,i+SB_CHUNK).map(id=>`"${String(id).replace(/"/g,'""')}"`).join(",");
    byIdQueries.push(SB.get("work_logs",cf+`id=in.(${q})`));
  }
  const parts=await Promise.all([
    SB.getAll("work_logs",cf+"completed=is.false&"+ORDER_BY.work_logs),
    dbLoadChangedLogs(cf),
    ...byIdQueries,
  ]);
  const rows=[...new Map(parts.flat().map(r=>[r.id,r])).values()];
  const seen=new Set(rows.map(r=>r.id));
  // A watched row that did not come back was deleted.
  return{rows,gone:watched.filter(id=>!seen.has(id))};
}
// `hot` — when given, work_logs is refreshed from the slice above and merged
// into `hot.prev` instead of being read whole. Everything else is always read
// in full; those tables are small enough that a page or three is nothing.
async function dbLoadAll(hot){
  const cid=_companyId||DEFAULT_COMPANY_ID;
  const cf=`company_id=eq.${cid}&`;
  // Every table is read with paging. Which ones "can" outgrow a page is not a
  // judgement worth making: pn_standards was assumed to be small and had 1,763
  // rows, of which the app saw the first thousand.
  const [orders,projects,stages,blocks,logs,tasks,depts,plans,pnStds]=await Promise.all([
    SB.getAll("orders",cf+ORDER_BY.orders),
    SB.getAll("projects",cf+ORDER_BY.projects),
    SB.getAll("stages",cf+ORDER_BY.stages),
    SB.getAll("stage_blocks",cf+ORDER_BY.stage_blocks),
    hot?dbLoadHotLogs(cid,hot.openIds):SB.getAll("work_logs",cf+ORDER_BY.work_logs),
    SB.getAll("custom_tasks",cf+ORDER_BY.custom_tasks),
    SB.getAll("departments",cf+ORDER_BY.departments).catch(()=>[]),
    SB.getAll("daily_plans",cf+ORDER_BY.daily_plans).catch(()=>[]),
    // null (not []) when the table is missing — the caller then keeps whatever
    // standards are cached locally instead of wiping them.
    SB.getAll("pn_standards",cf+ORDER_BY.pn_standards).catch(()=>null),
  ]);
  // In hot mode `logs` is {rows, gone} rather than the whole table.
  const rawLogs=hot?logs.rows:logs;
  // Only a candidate — see commitLogWatermark. Sound either way: a full read covers
  // the whole table, and a hot read covers everything from the current watermark on,
  // so in both cases the rows behind this timestamp have all been seen.
  const logWatermark=maxUpdatedAt(rawLogs);
  const freshLogs=rawLogs.map(dbToLog);
  let workLogs=freshLogs;
  if(hot){
    const gone=new Set(logs.gone);
    const prev=hot.prev||[];
    const byId=new Map(prev.filter(w=>!gone.has(w.id)).map(w=>[w.id,w]));
    // A sweep that changed nothing should hand back the *same array*, not an equal
    // copy: a new identity invalidates every useMemo keyed on the logs and re-renders
    // the app. Only the hot slice can differ, so this is a walk over the handful of
    // rows just read — not over all of them.
    let touched=gone.size>0;
    freshLogs.forEach(w=>{
      const was=byId.get(w.id);
      if(!touched&&!sameVal(was,w))touched=true;
      byId.set(w.id,w);
    });
    workLogs=(!touched&&byId.size===prev.length)?prev:[...byId.values()];
  }
  const out={
    orders:orders.map(dbToOrder),projects:projects.map(dbToProject),
    stages:stages.map(dbToStage),stageBlocks:blocks.map(dbToBlock),
    workLogs,customTasks:tasks.map(dbToTask),
    departments:depts.map(dbToDept),dailyPlans:plans.map(dbToPlan),
    pnStandards:pnStds?pnStds.map(dbToPnStd):null,
    logWatermark
  };
  // Everything just read is, by definition, what the server holds — so the first
  // save after a load sends the one row that changed, not the whole database.
  SYNC.prime("orders",out.orders,orderToDb);
  SYNC.prime("projects",out.projects,projectToDb);
  SYNC.prime("stages",out.stages,stageToDb);
  SYNC.prime("stage_blocks",out.stageBlocks,blockToDb);
  // Only the rows actually read are known to match the server; fingerprinting
  // the whole merged list every sweep is the cost this mode exists to avoid.
  SYNC.prime("work_logs",freshLogs,logToDb);
  if(hot)SYNC.forget("work_logs",logs.gone);
  SYNC.prime("custom_tasks",out.customTasks,taskToDb);
  SYNC.prime("departments",out.departments,deptToDb);
  SYNC.prime("daily_plans",out.dailyPlans,planToDb);
  if(out.pnStandards)SYNC.prime("pn_standards",out.pnStandards,pnStdToDb);
  return out;
}

async function resolveDemoUsers(users,cid){

  let total=0;
  serials.forEach(sr=>oStages.forEach(st=>{

}
// Pretty estimate string: net work-days (at given hours/day) plus the raw hours.

// זמן תקן   = the target minutes defined up-front for a מק"ט, per stage (editable
//             in the app, stored per מק"ט — it does not move when the floor moves).
// זמן בפועל = the time actually measured on the floor, from the workers' logs.
// זמן מכירה = the minutes allocated to a stage by the price list (block/stage).
const TIME_CAT={
  std :{key:"std", label:"זמן תקן",  short:"תקן",  color:"#10b981",text:"#34d399"},
  act :{key:"act", label:"זמן בפועל",short:"בפועל",color:"#3b82f6",text:"#60a5fa"},
  sale:{key:"sale",label:"זמן מכירה",short:"מכירה",color:"#a78bfa",text:"#a78bfa"}
};
// The standard time of a מק"ט, looked up by its (trimmed) part number.
const pnKey=pn=>String(pn||"").trim();
// Two devices can each create a record for the same מק"ט before they sync, so the
// newest edit wins rather than whichever row happened to load last.
function pnStdIndex(pnStandards){
  const m=new Map();
  (pnStandards||[]).forEach(r=>{
    const k=pnKey(r.pn);if(!k)return;
    const cur=m.get(k);
    if(!cur||String(r.updatedAt||"")>=String(cur.updatedAt||""))m.set(k,r);

const stdStageMin=(rec,stageId)=>Number(rec?.stageMin?.[stageId]||0)||0;
// Total standard for a route: the sum over its stages, or the explicit total
// when only a whole-מק"ט standard was entered.
function stdTotalMin(rec,stageIds){
  if(!rec)return 0;
  const ids=(stageIds&&stageIds.length)?stageIds:Object.keys(rec.stageMin||{});
  const per=ids.reduce((s,id)=>s+stdStageMin(rec,id),0);

const stdTotalFor=(pnStdIdx,pn,stageIds)=>stdTotalMin(pnStdIdx?.get(pnKey(pn)),stageIds);

// ── Standard-time analytics (זמן תקן · זמן בפועל · זמן מכירה) ─────────────
// A "sample" is one completed work log normalised to a single unit. Bulk logs
// record the full elapsed time on *every* serial of the group, so the per-unit
// time there is the duration divided by the group size.
const fmtMinP=m=>(m==null||isNaN(m))?"—":(Math.abs(m)>=100?Math.round(m):Math.round(m*10)/10)+" דק'";

function timeSamples(workLogs,orders,stages,stageBlocks,pnStdIdx){
  const oMap=new Map((orders||[]).map(o=>[o.id,o]));
  const sMap=new Map((stages||[]).map(s=>[s.id,s]));
  const out=[];
  (workLogs||[]).forEach(w=>{
    if(!w.completed)return;
    const min=Number(w.durationMin||0);
    if(!(min>0))return;                       // sign-offs and zero-length logs carry no timing information
    const o=oMap.get(w.orderId),st=sMap.get(w.stageId);
    if(!o||!st)return;
    const units=w.bulk&&Number(w.bulkCount)>1?Number(w.bulkCount):1;
    const pn=(o.pn||"").trim()||o.woNumber||"—";
    out.push({
      pn,orderId:o.id,projectId:o.projectId||"",
      stageId:st.id,stageName:st.name,stageColor:st.color,stageOrder:Number(st.order||0),
      userId:w.userId||"",userName:w.userName||"—",
      min:min/units,sale:stageMinutesFor(o,st,stageBlocks),
      std:stdStageMin(pnStdIdx?.get(pnKey(pn)),st.id),
      date:(w.endTime||w.startTime||"").slice(0,10)

  });

}
// Mean / median / sample standard deviation for a list of measured times.
function statsOf(vals){
  const n=vals.length;
  if(!n)return{n:0,mean:0,median:0,sd:0,cv:0,lo:0,hi:0};
  const mean=vals.reduce((s,v)=>s+v,0)/n;
  const srt=[...vals].sort((a,b)=>a-b);
  const median=n%2?srt[(n-1)/2]:(srt[n/2-1]+srt[n/2])/2;
  const sd=n>1?Math.sqrt(vals.reduce((s,v)=>s+(v-mean)*(v-mean),0)/(n-1)):0;
  return{n,mean,median,sd,cv:mean>0?sd/mean*100:0,lo:srt[0],hi:srt[n-1]};
}
// How much to trust a measured time — driven purely by how many times it was sampled.
const CONF_LEVELS=[
  {min:30,label:"גבוהה",color:"#10b981",note:"30+ דגימות — הזמן בפועל יציב"},
  {min:10,label:"בינונית",color:"#3b82f6",note:"10–29 דגימות — אפשר להסתמך בזהירות"},
  {min:4,label:"נמוכה",color:"#f59e0b",note:"4–9 דגימות — נדרשות עוד מדידות"},
  {min:0,label:"ראשונית",color:"#ef4444",note:"פחות מ-4 דגימות — אינדיקציה בלבד"}
];
const confOf=n=>CONF_LEVELS.find(c=>n>=c.min)||CONF_LEVELS[CONF_LEVELS.length-1];
// Spread of the measured time (CV = sd/mean). High spread ⇒ workers differ a lot on this job.
const cvInfo=cv=>cv<15?{label:"יציב",color:"#10b981"}:cv<30?{label:"סביר",color:"#3b82f6"}:cv<50?{label:"מפוזר",color:"#f59e0b"}:{label:"שונות גבוהה",color:"#ef4444"};
// Efficiency = reference time ÷ actual time. 100% = exactly on the reference,
// above = faster. Used both against the price list (ניצול) and against the
// pre-defined standard (עמידה בתקן).
const effColor=e=>e>=110?"#10b981":e>=95?"#3b82f6":e>=80?"#f59e0b":"#ef4444";
const effLabel=e=>e>=110?"מצטיין":e>=95?"בתקן":e>=80?"מתחת לתקן":"זקוק לחיזוק";
// A gap is the measured time minus the reference time — positive means the floor
// is slower than planned (over the standard, or eating the order's margin).
const gapColor=g=>g<=-0.5?"#10b981":g<0.5?"#3b82f6":"#f59e0b";

// ── LocalStorage cache (גיבוי מקומי לעבודה offline) ──────────────────────
// What did not fit last time, and at what size — `workLogs` → 39983. Remembered
// across loads, not just within one: 39,983 progress records serialise to ~19 MB,
// the quota is a few, and so every load re-discovered the same refusal the same
// expensive way — a 19 MB JSON.stringify on the main thread, right in the middle
// of the boot, purely to be told no again.
//
// The size is what makes it safe to remember. A key is skipped only while the value
// is at least as big as the one that was refused, so a collection that has since
// been trimmed gets a fresh try instead of being written off forever.
const LS_FULL_KEY="ls_full";
function loadLsFull(){
  try{
    const raw=JSON.parse(localStorage.getItem(LS_PREFIX+LS_FULL_KEY)||"[]");
    return new Map((Array.isArray(raw)?raw:[])
      .filter(e=>Array.isArray(e)&&typeof e[0]==="string"&&isFinite(e[1])));
  }catch{return new Map()}
}
const LS={
  get:k=>{try{const v=localStorage.getItem(LS_PREFIX+k);return v?JSON.parse(v):null}catch{return null}},
  // Supabase stays the source of truth; what a refused write loses is the offline
  // copy of that one key, and whatever last fitted is left in place rather than
  // deleted.
  set:(k,v)=>{
    const n=Array.isArray(v)?v.length:Infinity;
    const failedAt=LS._full.get(k);
    if(failedAt!==undefined&&n>=failedAt)return false;
    try{
      localStorage.setItem(LS_PREFIX+k,JSON.stringify(v));
      if(failedAt!==undefined){LS._full.delete(k);LS._remember()}
      return true;
    }
    catch(e){
      LS._full.set(k,n);LS._remember();
      console.warn(`אחסון מקומי מלא — ״${k}״ לא נשמר במכשיר לגיבוי לא־מקוון. הנתונים ממשיכים להישמר בענן כרגיל.`,e&&e.name);
      return false;
    }
  },
  _full:loadLsFull(),
  // Tiny, and written only when the set actually changes — which is to say almost
  // never. If even this cannot be stored the behaviour simply falls back to what it
  // was before: rediscovered once per load.
  // Only sized refusals are written down. A value with no length to compare
  // against could never be retried once remembered, and these are the small keys —
  // a session, a flag — that fail only under momentary pressure. Those stay blocked
  // for this load and get another chance on the next, exactly as before.
  _remember(){
    try{
      const durable=[...LS._full].filter(([,n])=>isFinite(n));
      localStorage.setItem(LS_PREFIX+LS_FULL_KEY,JSON.stringify(durable));
    }catch{}
  }
};
function getUsers(){try{const u=localStorage.getItem(LS_PREFIX+"users");return u?JSON.parse(u):FALLBACK_USERS}catch{return FALLBACK_USERS}}

function addAuditEntry(entry){

// ══════════════════════════════════════════════════════════════════════════
// ═══ ACTION JOURNAL (אחזור) ═══════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// The audit log said *that* something happened. The journal also keeps what the
// data looked like before it happened, which is the only thing that makes an
// action reversible — deleting a user, editing a פק"ע, replacing the whole order
// list with an import. An entry holds, per collection it touched, the rows as
// they were (`before`) and the ids that exist after (`after`); reverting writes
// the old rows back and deletes whatever the action created.
//
// Which collections can be restored, and where each one lives on the server.
const UNDO_COLL={
  orders:      {label:'פק"ע',          table:"orders"},
  workLogs:    {label:"רישומי עבודה",  table:"work_logs"},
  customTasks: {label:"משימות",        table:"custom_tasks"},
  stages:      {label:"שלבים",         table:"stages"},
  projects:    {label:"פרויקטים",      table:"projects"},
  stageBlocks: {label:"בלוקים",        table:"stage_blocks"},
  departments: {label:"מחלקות",        table:"departments"},
  dailyPlans:  {label:"תוכניות עבודה", table:"daily_plans"},
  pnStandards: {label:"זמני תקן",      table:"pn_standards"},
  users:       {label:"משתמשים",       table:"app_users"},
};
// Entries kept. Deep enough to walk back a bad afternoon, shallow enough that the
// snapshots stay in localStorage.
const UNDO_MAX=60;
// A single entry bigger than this is kept in memory only: an import snapshot runs
// to megabytes, and writing it would blow the whole cache away rather than just
// itself. Such an entry is still undoable — until the page is reloaded.
const UNDO_LS_MAX=1500000;
const UNDO=(()=>{
  let mem=null;                       // journal for this tab, snapshots included
  let apply=null;                     // set by the App — knows how to write state
  const load=()=>{
    if(mem)return mem;
    const saved=LS.get("undoJournal");
    mem=Array.isArray(saved)?saved:[];
    return mem;
  };
  const save=()=>{
    // Heavy entries are dropped from the persisted copy, not from `mem`.
    const slim=mem.filter(e=>!e.heavy).slice(0,UNDO_MAX);
    LS.set("undoJournal",slim);
  };
  return{
    setApplier(fn){apply=fn},
    ready(){return!!apply},
    // Records the action *and* the audit entry, so callers have one thing to call.
    // `changes` is [{coll, before:[...], after:[ids]}]; either side may be empty
    // (a creation has no `before`, a deletion has no `after`).
    record({user,action,target,details,changes}){
      const list=load();
      const clean=(changes||[]).filter(c=>c&&UNDO_COLL[c.coll]).map(c=>({
        coll:c.coll,
        before:(c.before||[]).map(r=>({...r})),
        after:[...new Set((c.after||[]).map(r=>typeof r==="string"?r:r&&r.id).filter(Boolean))]
      }));
      const id=addAuditEntry({userId:user?.id,username:user?.username,name:user?.name,
        action,target:target||"",details:details||"",canUndo:clean.length>0});
      if(!clean.length)return id;
      const e={id:id||uid(),timestamp:nowISO(),companyId:getCompanyId(),
        userId:user?.id,username:user?.username,name:user?.name,
        action,target:target||"",details:details||"",reverted:false,changes:clean};
      let size=0;try{size=JSON.stringify(e.changes).length}catch{size=UNDO_LS_MAX+1}
      e.heavy=size>UNDO_LS_MAX;
      e.rows=clean.reduce((n,c)=>n+c.before.length+c.after.length,0);
      list.unshift(e);
      if(list.length>UNDO_MAX)list.length=UNDO_MAX;
      save();
      return e.id;
    },
    list(){return load().filter(e=>e.companyId===getCompanyId())},
    get(id){return load().find(e=>e.id===id)||null},
    // Reverts an entry. Returns a short description of what was put back, or
    // throws with a reason a person can act on.
    async revert(id){
      const e=this.get(id);
      if(!e)throw new Error("הפעולה כבר אינה זמינה לאחזור");
      if(e.reverted)throw new Error("הפעולה כבר בוטלה");
      if(e.companyId!==getCompanyId())throw new Error("הפעולה שייכת לחברה אחרת");
      if(!apply)throw new Error("האחזור אינו זמין כרגע");
      const parts=[];
      for(const c of e.changes){
        const beforeIds=new Set(c.before.map(r=>r.id));
        const remove=c.after.filter(x=>!beforeIds.has(x));
        await apply(c.coll,c.before,remove);
        const bits=[];
        if(c.before.length)bits.push(`${c.before.length} שוחזרו`);
        if(remove.length)bits.push(`${remove.length} הוסרו`);
        if(bits.length)parts.push(`${UNDO_COLL[c.coll].label}: ${bits.join(" · ")}`);
      }
      e.reverted=true;save();
      SB.patch("audit_log",{id:e.id},{reverted:true}).catch(()=>{});
      addAuditEntry({userId:e.userId,username:e.username,name:e.name,
        action:"אחזור פעולה",target:e.target,details:`בוטל: ${e.action}${parts.length?" — "+parts.join(" | "):""}`});
      return parts.join(" | ");
    },
    // A company that is being deleted takes its journal with it.
    dropCompany(cid){mem=load().filter(e=>e.companyId!==cid);save()}
  };
})();

// ── Virtualised list ───────────────────────────────────────────────────────
// Only the rows near the viewport are mounted; everything above and below them
// is one spacer of the right height. The page keeps exactly one scrollbar (the
// window's) and dragging it to the middle still lands in the middle — the list
// just stops building ten thousand DOM nodes to get there.
//
// Row heights are not known up front (a פק"ע that carries a description is
// taller than one that doesn't), so every mounted row measures itself and
// replaces the estimate for its own key. Rows never mounted stand in at the
// average of the ones that were — which is what makes the scrollbar the right
// length within the first screenful instead of only once the list has been
// scrolled to the end.
//
// Short lists are handed straight through: below `threshold` rows there is
// nothing to gain, and a plain flex column avoids the measure-then-settle
// flicker entirely.
function VirtualList({items,renderRow,estimate=100,gap=7,overscan=6,threshold=40,style}){
  const hostRef=useRef(null);
  const heights=useRef(new Map());
  const sum=useRef(0);                       // Σ of the measured heights, for the running average
  const pending=useRef(false);
  const [version,setVersion]=useState(0);
  const [range,setRange]=useState({from:0,to:24});
  const on=items.length>threshold;
  const keyOf=(it,i)=>(it&&it.id!=null)?it.id:i;
  const guess=heights.current.size?sum.current/heights.current.size:estimate;

  // Offsets are a prefix sum over the (measured or estimated) row heights. It is
  // arithmetic over an array, not DOM work, so redoing it whenever the data or a
  // measurement changes costs nothing worth saving.
  const {offsets,total}=useMemo(()=>{
    const off=new Array(items.length+1);let acc=0;
    for(let i=0;i<items.length;i++){off[i]=acc;acc+=(heights.current.get(keyOf(items[i],i))||guess)+gap}
    off[items.length]=acc;
    return{offsets:off,total:Math.max(0,acc-gap)};
  },[items,guess,gap,version]);

  // Which rows the viewport covers right now — found by binary search, so the
  // cost of a scroll frame does not grow with the length of the list.
  const recalc=useCallback(()=>{
    const host=hostRef.current;if(!host||!items.length)return;
    const top=host.getBoundingClientRect().top+window.scrollY;
    const start=window.scrollY-top,end=start+window.innerHeight;
    const find=y=>{let lo=0,hi=items.length-1,r=0;
      while(lo<=hi){const m=(lo+hi)>>1;if(offsets[m]<=y){r=m;lo=m+1}else hi=m-1}
      return r};
    const from=Math.max(0,find(start)-overscan);
    const to=Math.min(items.length,find(end)+1+overscan);
    setRange(p=>(p.from===from&&p.to===to)?p:{from,to});
  },[items.length,offsets,overscan]);

  useEffect(()=>{
    if(!on)return;
    recalc();
    let raf=0;
    const onScroll=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;recalc()})};
    window.addEventListener("scroll",onScroll,{passive:true});
    window.addEventListener("resize",onScroll);
    return()=>{if(raf)cancelAnimationFrame(raf);window.removeEventListener("scroll",onScroll);window.removeEventListener("resize",onScroll)};
  },[on,recalc]);

  // A row that turned out taller or shorter than the estimate replaces it, and a
  // frame later the spacers and the scrollbar agree with what is on screen. The
  // bump is batched so a screenful of rows costs one extra render, not thirty.
  const measure=useCallback((key,el)=>{
    if(!el)return;
    const h=el.offsetHeight;
    const prev=heights.current.get(key);
    if(!h||(prev!==undefined&&Math.abs(prev-h)<1))return;
    heights.current.set(key,h);
    sum.current+=h-(prev||0);
    if(pending.current)return;
    pending.current=true;
    requestAnimationFrame(()=>{pending.current=false;setVersion(v=>v+1)});
  },[]);

  if(!on)return<div style={{display:"flex",flexDirection:"column",gap,...style}}>{items.map((it,i)=><div key={keyOf(it,i)}>{renderRow(it,i)}</div>)}</div>;

  const from=Math.max(0,Math.min(range.from,items.length-1));
  const to=Math.min(range.to,items.length);
  return(
    <div ref={hostRef} style={{position:"relative",height:total,...style}}>
      {items.slice(from,to).map((it,i)=>{
        const idx=from+i,key=keyOf(it,idx);
        return(
          <div key={key} ref={el=>measure(key,el)} style={{position:"absolute",top:offsets[idx],left:0,right:0}}>
            {renderRow(it,idx)}
          </div>
        );
      })}
    </div>
  );
}

// ── Fast scroll rail ───────────────────────────────────────────────────────
// Past a few thousand rows the browser's scrollbar is a hairline and the wheel
// is hopeless. This is the shortcut: top, bottom, and — by dragging the rail —
// anywhere in between in one gesture. It rides the window scroller, so it works
// on every screen of the app, and it hides itself whenever the page is short
// enough not to need it.
function FastScroll(){
  const [show,setShow]=useState(false);
  const [pct,setPct]=useState(0);
  const [drag,setDrag]=useState(false);
  const railRef=useRef(null);
  const maxScroll=()=>Math.max(0,document.documentElement.scrollHeight-window.innerHeight);

  useEffect(()=>{
    let raf=0;
    const upd=()=>{raf=0;const max=maxScroll();
      setShow(max>window.innerHeight*1.2);
      setPct(max>0?Math.min(1,Math.max(0,window.scrollY/max)):0)};
    const tick=()=>{if(!raf)raf=requestAnimationFrame(upd)};
    upd();
    window.addEventListener("scroll",tick,{passive:true});
    window.addEventListener("resize",tick);
    // The page grows as virtualised rows mount and filters change; watching the
    // body keeps the rail honest without polling.
    let ro=null;
    if(typeof ResizeObserver!=="undefined"){ro=new ResizeObserver(tick);ro.observe(document.body)}
    return()=>{if(raf)cancelAnimationFrame(raf);if(ro)ro.disconnect();
      window.removeEventListener("scroll",tick);window.removeEventListener("resize",tick)};
  },[]);

  const seek=e=>{
    const r=railRef.current?.getBoundingClientRect();if(!r||!r.height)return;
    const f=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
    window.scrollTo({top:f*maxScroll()});
  };
  const go=top=>window.scrollTo({top,behavior:"smooth"});
  if(!show)return null;
  const btn={width:26,height:22,borderRadius:6,border:"1px solid var(--c-border2)",background:"var(--c-card)",
    color:"var(--c-muted)",fontSize:11,lineHeight:1,padding:0,cursor:"pointer",fontFamily:"inherit",display:"flex",
    alignItems:"center",justifyContent:"center"};
  return(
    <div style={{position:"fixed",left:6,top:"50%",transform:"translateY(-50%)",zIndex:60,
      display:"flex",flexDirection:"column",alignItems:"center",gap:5,opacity:drag?1:.55,transition:"opacity .2s"}}
      onMouseEnter={e=>e.currentTarget.style.opacity="1"}
      onMouseLeave={e=>{if(!drag)e.currentTarget.style.opacity=".55"}}>
      <button style={btn} title="לתחילת הרשימה" aria-label="לתחילת הרשימה" onClick={()=>go(0)}>▲</button>
      <div ref={railRef} title="גרור לגלילה מהירה"
        onPointerDown={e=>{e.currentTarget.setPointerCapture(e.pointerId);setDrag(true);seek(e)}}
        onPointerMove={e=>{if(drag)seek(e)}}
        onPointerUp={e=>{e.currentTarget.releasePointerCapture(e.pointerId);setDrag(false)}}
        onPointerCancel={()=>setDrag(false)}
        style={{width:26,height:"min(46vh,320px)",borderRadius:13,border:"1px solid var(--c-border2)",
          background:"var(--c-card)",position:"relative",cursor:"grab",touchAction:"none",overflow:"hidden"}}>
        <div style={{position:"absolute",left:0,right:0,top:`calc(${pct*100}% - 13px)`,height:26,borderRadius:13,
          background:"var(--c-accent)",opacity:drag?1:.8,display:"flex",alignItems:"center",justifyContent:"center",
          color:"#fff",fontSize:9,fontWeight:700}}>{Math.round(pct*100)}</div>
      </div>
      <button style={btn} title="לסוף הרשימה" aria-label="לסוף הרשימה" onClick={()=>go(maxScroll())}>▼</button>
    </div>
  );
}

// ── Simple Bar Chart (SVG) ─────────────────────────────────────────────────
function BarChart({data,color,formatVal,height=130}){
  const [hov,setHov]=useState(null);
  if(!data||!data.length)return<div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--c-dim)",fontSize:13}}>אין נתונים</div>;
  const padL=36,padR=12,padT=20,padB=44,W=480,H=height+padT+padB;
  const maxV=Math.max(...data.map(d=>d.value),1);
  const mag=Math.pow(10,Math.floor(Math.log10(maxV)));
  const niceMax=Math.ceil(maxV/mag)*mag;
  const grids=[0,.25,.5,.75,1].map(f=>Math.round(niceMax*f));
  const slotW=(W-padL-padR)/data.length;
  const bw=Math.min(40,slotW*.55);
  const bx=i=>padL+i*slotW+slotW/2-bw/2;
  const bh=v=>Math.max((v/niceMax)*height,2);
  const by=v=>padT+height-bh(v);
  const fmtA=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(0)+"K":""+v;
  const MN=["","ינו","פבר","מרץ","אפר","מאי","יונ","יול","אוג","ספט","אוק","נוב","דצמ"];
  const fmtL=l=>{if(/^\d{4}-\d{2}$/.test(l)){const[y,m]=l.split("-");return MN[+m]+"'"+y.slice(2)}return l};
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
      {grids.map((v,i)=>{const y=padT+height-(v/niceMax)*height;return(<g key={i}><line x1={padL} y1={y} x2={W-padR} y2={y} stroke="var(--c-chart-grid)" strokeWidth={i===0?1.5:1} strokeDasharray={i===0?"":"3 3"} opacity={i===0?1:.4}/><text x={padL-6} y={y+4} textAnchor="end" fill="var(--c-chart-label)" fontSize={10} fontFamily="sans-serif">{fmtA(v)}</text></g>)})}
      {data.map((d,i)=>{const x=bx(i),h=bh(d.value),y=by(d.value),isH=hov===i;return(
        <g key={i} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)} style={{cursor:"pointer"}}>
          {isH&&<rect x={x-3} y={y-3} width={bw+6} height={h+3} rx={5} fill={color} opacity={0.12}/>}
          <rect x={x} y={y} width={bw} height={h} rx={4} fill={isH?color:color+"bb"}/>
          {isH&&(()=>{const tw=80,tx=Math.min(Math.max(bx(i)+bw/2-tw/2,padL),W-padR-tw);return(<g><rect x={tx} y={y-34} width={tw} height={26} rx={5} fill="var(--c-chart-tooltip)" stroke={color} strokeWidth={1}/><text x={tx+tw/2} y={y-17} textAnchor="middle" fill={color} fontSize={11} fontWeight="700" fontFamily="sans-serif">{formatVal(d.value)}</text></g>)})()}
        </g>
      )})}
      <line x1={padL} y1={padT+height} x2={W-padR} y2={padT+height} stroke="var(--c-chart-grid)" strokeWidth={1.5}/>
      {data.map((d,i)=><text key={i} x={bx(i)+bw/2} y={padT+height+20} textAnchor="middle" fill="var(--c-chart-label)" fontSize={11} fontWeight="600" fontFamily="sans-serif">{fmtL(d.label)}</text>)}
    </svg>
  );
}

// ── Line Chart (dual series) ─────────────────────────────────────────
function LineChart({series,height=160,labels}){
  const[hov,setHov]=useState(null);
  if(!labels||!labels.length)return<div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--c-dim)",fontSize:13}}>אין נתונים</div>;
  const padL=44,padR=16,padT=20,padB=48,W=560,H=height+padT+padB;
  const MN=["","ינו","פבר","מרץ","אפר","מאי","יונ","יול","אוג","ספט","אוק","נוב","דצמ"];
  const fmtL=l=>{if(/^\d{4}-\d{2}$/.test(l)){const[y,m]=l.split("-");return MN[+m]+"'"+y.slice(2)}if(/^\d{4}-Q\d/.test(l)){const p=l.split("-");return p[1]+"'"+p[0].slice(2)}return l};
  const fmtA=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(0)+"K":""+v;
  const allVals=series.flatMap(s=>s.data);const maxV=Math.max(...allVals,1);
  const mag=Math.pow(10,Math.floor(Math.log10(maxV)));const niceMax=Math.ceil(maxV/mag)*mag;
  const grids=[0,.25,.5,.75,1].map(f=>Math.round(niceMax*f));
  const slotW=(W-padL-padR)/(labels.length-1||1);
  const px=i=>padL+i*slotW;const py=v=>padT+height-(v/niceMax)*height;
  const makePath=(data)=>{if(data.length<2)return"";let d=`M${px(0)},${py(data[0])}`;for(let i=1;i<data.length;i++){const x0=px(i-1),y0=py(data[i-1]),x1=px(i),y1=py(data[i]);const cx=(x0+x1)/2;d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`}return d};
  const makeArea=(data)=>{if(data.length<2)return"";return makePath(data)+` L${px(data.length-1)},${padT+height} L${px(0)},${padT+height} Z`};
  return(
    <div>
      <div style={{display:"flex",gap:16,justifyContent:"flex-end",marginBottom:6}}>
        {series.map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}><div style={{width:16,height:3,borderRadius:2,background:s.color}}/><span style={{color:s.color}}>{s.label}</span></div>))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
        {grids.map((v,i)=>{const y=padT+height-(v/niceMax)*height;return(<g key={i}><line x1={padL} y1={y} x2={W-padR} y2={y} stroke="var(--c-chart-grid)" strokeWidth={i===0?1.5:1} strokeDasharray={i===0?"":"3 3"} opacity={i===0?1:.3}/><text x={padL-8} y={y+4} textAnchor="end" fill="var(--c-chart-label)" fontSize={10} fontFamily="sans-serif">{fmtA(v)}</text></g>)})}
        {series.map((s,si)=>(<g key={si}><path d={makeArea(s.data)} fill={s.color} opacity={.08}/><path d={makePath(s.data)} fill="none" stroke={s.color} strokeWidth={2.5} strokeLinecap="round"/>{s.data.map((v,i)=>(<circle key={i} cx={px(i)} cy={py(v)} r={hov===i?5:3} fill={s.color} stroke="var(--c-bg)" strokeWidth={2} style={{cursor:"pointer"}} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}/>))}</g>))}
        {hov!==null&&(<g><line x1={px(hov)} y1={padT} x2={px(hov)} y2={padT+height} stroke="var(--c-chart-label)" strokeWidth={1} strokeDasharray="3 3" opacity={.5}/>{(()=>{const tw=100,tx=Math.min(Math.max(px(hov)-tw/2,padL),W-padR-tw);return(<><rect x={tx} y={padT-2} width={tw} height={14+series.length*16} rx={5} fill="var(--c-chart-tooltip)" stroke="var(--c-chart-grid)" strokeWidth={1}/><text x={tx+tw/2} y={padT+10} textAnchor="middle" fill="var(--c-chart-label)" fontSize={10} fontFamily="sans-serif">{fmtL(labels[hov])}</text>{series.map((s,si)=>(<text key={si} x={tx+tw/2} y={padT+10+16*(si+1)} textAnchor="middle" fill={s.color} fontSize={11} fontWeight="700" fontFamily="sans-serif">{s.formatVal?s.formatVal(s.data[hov]):s.data[hov]?.toLocaleString()}</text>))}</>)})()}</g>)}
        <line x1={padL} y1={padT+height} x2={W-padR} y2={padT+height} stroke="var(--c-chart-grid)" strokeWidth={1.5}/>
        {labels.map((l,i)=>(<text key={i} x={px(i)} y={padT+height+22} textAnchor="middle" fill="var(--c-chart-label)" fontSize={10} fontWeight="600" fontFamily="sans-serif" transform={labels.length>8?`rotate(-25,${px(i)},${padT+height+22})`:""}>{fmtL(l)}</text>))}
      </svg>
    </div>
  );
}

// ── Donut Chart ────────────────────────────────────────────────────────────
function DonutChart({data,size=180}){
  const [hov,setHov]=useState(null);
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total||!data.length)return<div style={{height:size,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--c-dim)",flexDirection:"column",gap:8}}><span style={{fontSize:28}}>📊</span><span style={{fontSize:13}}>אין נתונים</span></div>;
  const R=size/2-10,r=R*.58,cx=size/2,cy=size/2;
  let angle=-Math.PI/2;
  const slices=data.map((d,i)=>{
    const pct=d.value/total,start=angle;angle+=pct*2*Math.PI;const end=angle,large=pct>.5?1:0;
    const x1=cx+R*Math.cos(start),y1=cy+R*Math.sin(start),x2=cx+R*Math.cos(end),y2=cy+R*Math.sin(end);
    const xi=cx+r*Math.cos(start),yi=cy+r*Math.sin(start),xo=cx+r*Math.cos(end),yo=cy+r*Math.sin(end);
    const path=pct>=.9999?`M${cx},${cy-R} A${R},${R} 0 1,1 ${cx-.001},${cy-R} Z`:`M${xi},${yi} L${x1},${y1} A${R},${R} 0 ${large},1 ${x2},${y2} L${xo},${yo} A${r},${r} 0 ${large},0 ${xi},${yi} Z`;
    return{...d,path,color:d.color||COLORS[i%COLORS.length],pct};
  });
  const hS=hov!=null?slices[hov]:null;
  return(
    <div style={{display:"flex",gap:16,alignItems:"center",justifyContent:"center",flexWrap:"wrap"}}>
      <svg width={size} height={size} style={{flexShrink:0}}>
        {slices.map((s,i)=>(<path key={i} d={s.path} fill={s.color} opacity={hov===null||hov===i?1:.4} stroke="var(--c-bg)" strokeWidth={2} style={{cursor:"pointer",transition:"opacity .2s"}} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}/>))}
        <circle cx={cx} cy={cy} r={r-2} fill="var(--c-card)"/>
        {hS?(<><text x={cx} y={cy-8} textAnchor="middle" fill={hS.color} fontSize={13} fontWeight="700" fontFamily="sans-serif">{hS.label.length>12?hS.label.slice(0,11)+"…":hS.label}</text><text x={cx} y={cy+10} textAnchor="middle" fill="var(--c-text)" fontSize={11} fontFamily="sans-serif">{hS.value.toLocaleString()}</text><text x={cx} y={cy+26} textAnchor="middle" fill="var(--c-muted)" fontSize={10} fontFamily="sans-serif">{Math.round(hS.pct*100)}%</text></>):(<><text x={cx} y={cy-2} textAnchor="middle" fill="var(--c-muted)" fontSize={10} fontFamily="sans-serif">סה"כ</text><text x={cx} y={cy+14} textAnchor="middle" fill="var(--c-text)" fontSize={13} fontWeight="700" fontFamily="sans-serif">{total.toLocaleString()}</text></>)}
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:5,minWidth:100}}>
        {slices.map((s,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",opacity:hov===null||hov===i?1:.4,transition:"opacity .2s"}} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}><div style={{width:9,height:9,borderRadius:2,background:s.color,flexShrink:0}}/><span style={{fontSize:11,color:"var(--c-muted)",flex:1}}>{s.label}</span><span style={{fontSize:11,fontWeight:700,color:s.color}}>{Math.round(s.pct*100)}%</span></div>))}
      </div>
    </div>
  );
}

// ── Login Screen ───────────────────────────────────────────────────────────
function LoginScreen({onLogin,lightMode,toggleLight}){
  const {toast}=useToast();
  const [mode,setMode]=useState("login"); // "login" | "register"
  const [username,setUsername]=useState("");
  const [password,setPassword]=useState("");
  const [err,setErr]=useState("");
  const [showPass,setShowPass]=useState(false);
  const [loading,setLoading]=useState(false);
  // Registration fields
  const [regStep,setRegStep]=useState(1);
  const [companyName,setCompanyName]=useState("");
  const [adminName,setAdminName]=useState("");
  const [regUser,setRegUser]=useState("");
  const [regPass,setRegPass]=useState("");
  const [regPass2,setRegPass2]=useState("");

  const doRegister=async()=>{
    if(regStep===1){
      if(!companyName.trim())return setErr("יש להזין שם חברה");
      if(!adminName.trim())return setErr("יש להזין שם מלא");
      setErr("");setRegStep(2);return;
    }
    if(!regUser.trim()||!regPass.trim())return setErr("יש למלא שם משתמש וסיסמה");
    if(regPass!==regPass2)return setErr("הסיסמאות לא תואמות");
    const pwErrors=validatePassword(regPass);
    if(pwErrors.length>0)return setErr("הסיסמה חייבת לכלול: "+pwErrors.join(", "));
    setLoading(true);setErr("");
    try{
      // Check if username exists
      const existing=await SB.get("app_users",`username=eq.${encodeURIComponent(regUser.trim())}`);
      if(existing&&existing.length>0){setErr("שם משתמש תפוס");setLoading(false);return}
      // Create company
      const compId=genuuid();
      await SB.upsert("companies",[{id:compId,name:companyName.trim(),slug:companyName.trim().toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9\u0590-\u05ff-]/g,"")}]);
      // Create free subscription
      await SB.upsert("subscriptions",[{id:genuuid(),company_id:compId,plan:"free",status:"trial",trial_ends_at:new Date(Date.now()+14*24*3600000).toISOString(),max_users:3,max_orders:10}]);
      // Create admin user
      const hash=await sha256(regPass);
      const adminUser={id:uid(),username:regUser.trim(),password_hash:hash,role:"admin",name:adminName.trim(),project_access:"all",stage_access:"all",can_edit:true,can_view:true,active:true,hourly_rate:0,company_id:compId};
      await SB.upsert("app_users",[adminUser]);
      // Create default stages for this company
      const defStages=DEF_STAGES.map(s=>({...stageToDb(s),company_id:compId}));
      await SB.upsert("stages",defStages);
      // Create default projects
      const defProjects=DEF_PROJ.map(p=>({...projectToDb(p),company_id:compId}));
      await SB.upsert("projects",defProjects);
      toast("החברה נוצרה בהצלחה! 14 יום ניסיון חינם","success",5000);
      // Auto login
      const u=dbToUser({...adminUser,login_attempts:0,locked_until:null,last_login:new Date().toISOString()});
      LS.set("users",[u]);
      onLogin(u);
    }catch(e){setErr("שגיאה ביצירת חשבון: "+(e.message||e))}
    setLoading(false);
  };

  const attempt=async()=>{
    if(!username.trim()||!password.trim()){setErr("יש למלא שם משתמש וסיסמה");return}
    setLoading(true);setErr("");
    try{
      const hash=await sha256(password);
      const rows=await SB.get("app_users",`username=eq.${encodeURIComponent(username.trim())}&active=eq.true`);
      if(!rows||rows.length===0){setErr("שם משתמש לא נמצא במערכת");setLoading(false);return}
      const row=rows[0];
      if(row.locked_until&&new Date(row.locked_until)>new Date()){
        const minsLeft=Math.ceil((new Date(row.locked_until)-new Date())/60000);
        setErr(`החשבון נעול. נסה שוב בעוד ${minsLeft} דקות`);setLoading(false);return;
      }
      if(row.password_hash!==hash){
        const attempts=(row.login_attempts||0)+1;
        const lockData={login_attempts:attempts};
        if(attempts>=MAX_LOGIN_ATTEMPTS){
          lockData.locked_until=new Date(Date.now()+LOCKOUT_MIN*60000).toISOString();
          setErr(`סיסמה שגויה. החשבון ננעל ל-${LOCKOUT_MIN} דקות`);
        }else{
          setErr(`סיסמה שגויה (${attempts}/${MAX_LOGIN_ATTEMPTS} ניסיונות)`);
        }
        try{await SB.patch("app_users",{id:row.id},lockData)}catch{}
        setLoading(false);return;
      }
      try{await SB.patch("app_users",{id:row.id},{login_attempts:0,locked_until:null,last_login:new Date().toISOString()})}catch{}
      const u=dbToUser(row);
      const cached=getUsers();
      const upd=cached.some(c=>c.id===u.id)?cached.map(c=>c.id===u.id?u:c):[...cached,u];
      LS.set("users",upd);
      addAuditEntry({userId:u.id,username:u.username,name:u.name,action:"התחברות",target:"",details:""});
      onLogin(u);
    }catch(e){
      try{
        const hash=await sha256(password);
        const users=getUsers();
        const u=users.find(u=>u.username===username.trim()&&(u.password_hash===hash||u.password===password)&&u.active!==false);
        if(!u){setErr("אין חיבור לשרת ולא נמצא משתמש מקומי");setLoading(false);return}
        addAuditEntry({userId:u.id,username:u.username,name:u.name,action:"התחברות (offline)",target:"",details:""});
        onLogin(u);
      }catch(e2){setErr(`שגיאה: ${e.message||e}`)}
    }
    setLoading(false);
  };
  const lm=lightMode;
  return(
    <div style={{minHeight:"100vh",minHeight:"100dvh",background:lm?"#f0f2f5":"#0a0e1a",display:"flex",alignItems:"center",justifyContent:"center",padding:16,transition:"background .3s"}}>
      <div style={{position:"fixed",top:16,left:16,zIndex:10}}>
        <button onClick={toggleLight} style={{background:lm?"#e2e8f0":"#131829",border:`1px solid ${lm?"#e2e8f0":"#1e2a42"}`,borderRadius:8,padding:"7px 14px",fontSize:15,color:lm?"#1a1f2e":"#8b95a8"}}>{lm?"🌙":"☀️"}</button>
      </div>
      <div style={{background:lm?"#ffffff":"#131829",borderRadius:20,padding:"clamp(24px,6vw,44px) clamp(20px,6vw,40px)",maxWidth:420,width:"100%",border:`1px solid ${lm?"#dde1e8":"#1e2a42"}`,boxShadow:lm?"0 8px 40px #0001":"0 20px 60px #000a"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{display:"flex",justifyContent:"center",marginBottom:14}}><Logo size={60}/></div>
          <div style={{fontSize:27,fontWeight:800,color:lm?"#1a1f2e":"#e2e8f0",letterSpacing:"-.03em"}}>OmniView</div>
          <div style={{fontSize:12,fontWeight:600,color:lm?"#94a3b8":"#5a6478",letterSpacing:".04em",marginTop:3}}>ניהול רצפת ייצור</div>
          <div style={{fontSize:13,color:lm?"#5a6478":"#8b95a8",marginTop:10}}>{mode==="login"?"כניסה למערכת":"הרשמת חברה חדשה"}</div>
        </div>

        {mode==="login"?(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div><label htmlFor="login-user" style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>שם משתמש</label><input id="login-user" autoComplete="username" value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="הכנס שם משתמש"/></div>
            <div><label htmlFor="login-pass" style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>סיסמה</label>
              <div style={{position:"relative"}}><input id="login-pass" autoComplete="current-password" type={showPass?"text":"password"} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="הכנס סיסמה" style={{paddingLeft:44}}/><button onClick={()=>setShowPass(p=>!p)} aria-label={showPass?"הסתר סיסמה":"הצג סיסמה"} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",fontSize:18,color:"var(--c-muted)",lineHeight:1}}>{showPass?"🙈":"👁️"}</button></div>
            </div>
            {err&&<div style={{background:lm?"#fee2e2":"#450a0a",color:lm?"#dc2626":"#fca5a5",borderRadius:8,padding:"10px 14px",fontSize:13,border:lm?"1px solid #fecaca":"1px solid #7f1d1d"}}>❌ {err}</div>}
            <button onClick={attempt} disabled={loading} style={{background:loading?"#2563eb99":"var(--c-accent)",color:"#fff",border:"none",borderRadius:10,padding:"13px",fontWeight:700,fontSize:16,marginTop:4,fontFamily:"inherit"}}>{loading?"⏳ מתחבר...":"כניסה למערכת"}</button>
            <div style={{textAlign:"center",marginTop:4}}><span style={{fontSize:13,color:lm?"#5a6478":"#8b95a8"}}>אין לך חשבון? </span><button onClick={()=>{setMode("register");setErr("");setRegStep(1)}} style={{background:"none",border:"none",color:"var(--c-accent)",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer",textDecoration:"underline"}}>הרשמה חינם</button></div>
            <div style={{position:"relative",textAlign:"center",margin:"8px 0"}}><div style={{position:"absolute",top:"50%",left:0,right:0,height:1,background:lm?"#dde1e8":"#1e2a42"}}/><span style={{position:"relative",padding:"0 12px",background:lm?"#ffffff":"#131829",fontSize:11,color:lm?"#9ca3af":"#5a6478"}}>או</span></div>
            <button onClick={()=>onLogin({id:"demo_user",username:"demo",role:"admin",name:"משתמש דמו",projectAccess:"all",stageAccess:"all",canEdit:true,canView:true,active:true,hourlyRate:0,companyId:DEFAULT_COMPANY_ID,isDemo:true})} style={{background:"none",border:`1px solid ${lm?"#06b6d4":"#06b6d433"}`,borderRadius:10,padding:"11px",color:lm?"#0891b2":"#06b6d4",fontWeight:600,fontSize:14,fontFamily:"inherit"}}>🔍 נסה דמו — בלי הרשמה</button>
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            {/* Step indicator */}
            <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:4}}>
              <div style={{width:32,height:4,borderRadius:2,background:regStep>=1?"var(--c-accent)":"var(--c-border)"}}/>
              <div style={{width:32,height:4,borderRadius:2,background:regStep>=2?"var(--c-accent)":"var(--c-border)"}}/>
            </div>
            {regStep===1?(
              <>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>שם החברה / המפעל</label><input value={companyName} onChange={e=>setCompanyName(e.target.value)} placeholder='למשל: "תעשיות אלפא בע"מ"'/></div>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>השם המלא שלך</label><input value={adminName} onChange={e=>setAdminName(e.target.value)} placeholder="שם פרטי ומשפחה"/></div>
              </>
            ):(
              <>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>שם משתמש (לכניסה)</label><input value={regUser} onChange={e=>setRegUser(e.target.value)} placeholder="בחר שם משתמש" autoComplete="username"/></div>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>סיסמה</label><input type="password" value={regPass} onChange={e=>setRegPass(e.target.value)} placeholder="מינימום 8 תווים, אות גדולה, ספרה, תו מיוחד" autoComplete="new-password"/></div>
                <div><label style={{fontSize:12,color:"var(--c-muted)",fontWeight:600,display:"block",marginBottom:5}}>אימות סיסמה</label><input type="password" value={regPass2} onChange={e=>setRegPass2(e.target.value)} placeholder="הזן שוב" autoComplete="new-password"/></div>
              </>
            )}
            {err&&<div style={{background:lm?"#fee2e2":"#450a0a",color:lm?"#dc2626":"#fca5a5",borderRadius:8,padding:"10px 14px",fontSize:13,border:lm?"1px solid #fecaca":"1px solid #7f1d1d"}}>❌ {err}</div>}
            <div style={{display:"flex",gap:10}}>
              {regStep===2&&<button onClick={()=>{setRegStep(1);setErr("")}} style={{flex:1,background:"var(--c-card)",color:"var(--c-text)",border:"1px solid var(--c-border)",borderRadius:10,padding:"13px",fontWeight:600,fontSize:14,fontFamily:"inherit"}}>→ חזרה</button>}
              <button onClick={doRegister} disabled={loading} style={{flex:1,background:loading?"#2563eb99":"var(--c-accent)",color:"#fff",border:"none",borderRadius:10,padding:"13px",fontWeight:700,fontSize:16,fontFamily:"inherit"}}>{loading?"⏳ יוצר חשבון...":regStep===1?"← המשך":"צור חשבון"}</button>
            </div>
            <div style={{textAlign:"center",marginTop:4}}><span style={{fontSize:13,color:lm?"#5a6478":"#8b95a8"}}>כבר יש לך חשבון? </span><button onClick={()=>{setMode("login");setErr("")}} style={{background:"none",border:"none",color:"var(--c-accent)",fontSize:13,fontWeight:700,fontFamily:"inherit",cursor:"pointer",textDecoration:"underline"}}>כניסה</button></div>
            <div style={{textAlign:"center",fontSize:11,color:lm?"#9ca3af":"#5a6478"}}>🎁 14 יום ניסיון חינם — ללא כרטיס אשראי</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ ORG STRUCTURE (מחלקות וצוותים) ══════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function OrgStructure({users,departments,workLogs,customTasks}){
  const activeLogs=workLogs.filter(w=>!w.completed);
  const activeTasks=(customTasks||[]).filter(t=>t.active&&!t.completed);
  const statusOf=u=>{
    const logs=activeLogs.filter(w=>w.userId===u.id);
    const tasks=activeTasks.filter(t=>t.userId===u.id);
    if(logs.some(l=>!l.paused)||tasks.some(t=>!t.paused))return{label:"עובד כעת",color:"#10b981",pulse:true};
    if(logs.length||tasks.length)return{label:"בהפסקה",color:"#f59e0b"};
    return{label:"לא פעיל",color:"#5a6478"};
  };
  const staff=users.filter(u=>u.active!==false&&u.role!=="admin"&&u.role!=="viewer");
  if(staff.length===0)return null;
  const PersonChip=({u,lead})=>{
    const st=statusOf(u);const rc=ROLES[u.role]?.color||"#3b82f6";
    return(
      <div style={{display:"flex",alignItems:"center",gap:9,background:lead?rc+"10":"var(--c-deep)",border:`1px solid ${lead?rc+"55":"var(--c-border)"}`,borderRadius:10,padding:"8px 11px"}}>
        <div style={{width:28,height:28,borderRadius:"50%",background:rc+"22",color:rc,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,flexShrink:0}}>{u.name?.charAt(0)||"?"}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12.5,fontWeight:lead?700:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{u.name}</div>
          <div style={{fontSize:10,color:rc,fontWeight:600}}>{ROLES[u.role]?.label||u.role}</div>
        </div>
        <span style={{fontSize:10,color:st.color,fontWeight:700,display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
          <span style={{width:6,height:6,borderRadius:"50%",background:st.color,display:"inline-block",animation:st.pulse?"pulse 1.6s infinite":"none"}}/>{st.label}
        </span>
      </div>
    );
  };
  // Render one pool of members as a nested tree: manager → team leads → workers.
  const TeamBlock=({members})=>{
    const ids=new Set(members.map(m=>m.id));
    const childrenOf=id=>members.filter(m=>m.managerId===id);
    // Roots = members whose direct manager isn't part of this pool (top of the local hierarchy).
    const roots=members.filter(m=>!m.managerId||!ids.has(m.managerId));
    const Node=({u})=>{
      const reports=childrenOf(u.id);
      const lead=isLeadRole(u.role)||reports.length>0;
      return(
        <div>
          <PersonChip u={u} lead={lead}/>
          {reports.length>0&&(
            <div style={{marginRight:18,marginTop:6,paddingRight:14,borderRight:`2px solid ${(ROLES[u.role]?.color||"#3b82f6")}44`,display:"flex",flexDirection:"column",gap:6}}>
              {reports.map(r=><Node key={r.id} u={r}/>)}
            </div>
          )}
          {reports.length===0&&isLeadRole(u.role)&&<div style={{marginRight:18,marginTop:4,fontSize:11,color:"var(--c-dim)"}}>אין עובדים משויכים</div>}
        </div>
      );
    };
    return(
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {roots.map(r=><Node key={r.id} u={r}/>)}
      </div>
    );
  };
  const assignedDeptIds=new Set(departments.map(d=>d.id));
  const noDept=staff.filter(u=>!u.departmentId||!assignedDeptIds.has(u.departmentId));
  return(
    <Card style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,flexWrap:"wrap",gap:8}}>
        <div style={{fontWeight:700,fontSize:15}}>🏢 מבנה ארגוני — מחלקות וצוותים</div>
        <div style={{fontSize:11.5,color:"var(--c-dim)"}}>{staff.length} אנשי צוות · {departments.length} מחלקות</div>
      </div>
      <div style={{fontSize:11.5,color:"var(--c-dim)",marginBottom:14}}>כל עובד מוצג תחת ראש הצוות / מנהל המחלקה שלו, כולל סטטוס בזמן אמת</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {departments.map(d=>{
          const members=staff.filter(u=>u.departmentId===d.id);
          const mgr=users.find(u=>u.id===d.managerId);
          return(
            <div key={d.id} style={{background:"var(--c-card)",border:"1px solid var(--c-border)",borderRadius:12,overflow:"hidden"}}>
              <div style={{padding:"10px 14px",background:d.color+"12",borderBottom:`1px solid ${d.color}33`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{width:10,height:10,borderRadius:3,background:d.color,display:"inline-block"}}/>
                  <span style={{fontWeight:700,fontSize:14}}>{d.name}</span>
                  {mgr&&<span style={{fontSize:11,color:"var(--c-muted)"}}>· מנהל/ת: <b style={{color:d.color}}>{mgr.name}</b></span>}
                </div>
                <span style={{fontSize:11,background:d.color+"22",color:d.color,padding:"2px 10px",borderRadius:12,fontWeight:700}}>{members.length} חברי צוות</span>
              </div>
              <div style={{padding:12}}>
                {members.length===0?<div style={{fontSize:12,color:"var(--c-dim)",textAlign:"center",padding:8}}>אין עובדים במחלקה זו עדיין</div>:<TeamBlock members={members}/>}
              </div>
            </div>
          );
        })}
        {noDept.length>0&&(
          <div style={{background:"var(--c-card)",border:"1px dashed var(--c-border2)",borderRadius:12,overflow:"hidden"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid var(--c-border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontWeight:700,fontSize:13,color:"var(--c-muted)"}}>ללא מחלקה</span>
              <span style={{fontSize:11,color:"var(--c-dim)"}}>{noDept.length} עובדים — ניתן לשייך דרך ניהול מערכת</span>
            </div>
            <div style={{padding:12}}><TeamBlock members={noDept}/></div>
          </div>
        )}
        {departments.length===0&&noDept.length===0&&<EmptyState icon="🏢" title="אין מחלקות מוגדרות" subtitle="צור מחלקות והקצה ראשי צוות במסך ניהול המערכת"/>}
      </div>
    </Card>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ MONTH HELPERS (תוויות חודשים — משותף לתרשים המפעל ולמסך החי) ════════
// ══════════════════════════════════════════════════════════════════════════
const HEB_MONTHS=["","ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const fmtMonthLabel=m=>{if(!m||m==="all")return"כל הזמן";const[y,mo]=m.split("-");return`${HEB_MONTHS[Number(mo)]||mo} ${y}`};

// ══════════════════════════════════════════════════════════════════════════
// ═══ DASHBOARD ═══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function Dashboard({orders,projects,stages,users,workLogs,departments,customTasks}){
  const [period,setPeriod]=useState("month");
  const [selYear,setSelYear]=useState("all");
  const [selProj,setSelProj]=useState("all");
  // The two cuts a floor manager asks the dashboard for first: which division,
  // and what state the פק"ע are in. Until now both existed only on the פק"ע
  // screen, so every dashboard number was the whole factory or nothing.
  const [selBranch,setSelBranch]=useState("all");
  const [selStat,setSelStat]=useState("all");
  const [donutSlice,setDonutSlice]=useState("status");
  const [barMetric,setBarMetric]=useState("rev");
  const [showAllLate,setShowAllLate]=useState(false);

  // Compute all years from workLogs
  const allYears=useMemo(()=>[...new Set(workLogs.filter(w=>w.completed&&w.endTime).map(w=>yK(w.endTime)).filter(Boolean))].sort().reverse(),[workLogs]);

  const branchOpts=useMemo(()=>branchList(orders,departments||[]),[orders,departments]);
  const branchCount=useMemo(()=>{
    const m={none:0};
    orders.forEach(o=>{const c=branchCode(o.branch);if(c)m[c]=(m[c]||0)+1;else m.none++});
    return m;
  },[orders]);
  const statCount=useMemo(()=>{
    const c={live:0,open:0,partial:0,complete:0,blocked:0,ph_pre:0,ph_line:0,ph_stuck:0,ph_done:0,ph_cancelled:0};
    orders.forEach(o=>{const ph=orderPhase(o);c["ph_"+ph]++;if(ph==="cancelled")return;
      c.live++;const k=o.status||"open";if(c[k]!==undefined)c[k]++});
    return c;
  },[orders]);

  // Filter orders by project, division and state
  const fOrders=useMemo(()=>orders.filter(o=>{
    // מבוטלת is "do not show": it never reaches a KPI, a chart or the late list
    // unless its own option is picked in the status filter.
    if(selStat!=="ph_cancelled"&&isCancelled(o))return false;
    if(selProj!=="all"&&o.projectId!==selProj)return false;
    if(selBranch!=="all"){
      const c=branchCode(o.branch);
      if(selBranch==="none"?!!c:c!==selBranch)return false;
    }
    if(selStat!=="all"){
      if(selStat.startsWith("ph_")){if(orderPhase(o)!==selStat.slice(3))return false}
      else if((o.status||"open")!==selStat)return false;
    }
    return true;
  }),[orders,selProj,selBranch,selStat]);

  const anyFilter=selProj!=="all"||selBranch!=="all"||selStat!=="all";
  // With a filter on, the hours and the money have to come from the same פק"ע the
  // rest of the screen is counting — otherwise "מחלקת תק״ש" shows that division's
  // units against the whole factory's hours.
  const visibleOrderIds=useMemo(()=>anyFilter?new Set(fOrders.map(o=>o.id)):null,[anyFilter,fOrders]);

  // Filter workLogs by year (and by the visible פק"ע, when a filter is on)
  const fLogs=useMemo(()=>workLogs.filter(w=>{if(!w.completed||!w.endTime)return false;if(selYear!=="all"&&yK(w.endTime)!==selYear)return false;
    if(visibleOrderIds&&!visibleOrderIds.has(w.orderId))return false;return true}),[workLogs,selYear,visibleOrderIds]);

  // Helper: is serial done
  const doneIdx=useDoneIndex(workLogs);
  const isSerDone=(o,s)=>{const st=o.stageIds||[];return st.length>0&&st.every(sid=>doneIdx.has(logKey(s.id,sid)))};

  // KPIs
  const totalSerials=fOrders.reduce((s,o)=>s+(o.serials||[]).length,0);
  const completedSerials=fOrders.reduce((s,o)=>s+(o.serials||[]).filter(sr=>isSerDone(o,sr)).length,0);
  const actualRev=fOrders.reduce((s,o)=>{const done=(o.serials||[]).filter(sr=>isSerDone(o,sr)).length;return s+done*Number(o.unitPrice||0)},0);
  const totalWorkMins=fLogs.reduce((s,w)=>s+(w.durationMin||0),0);
  const totalWorkCost=fLogs.reduce((s,w)=>{const u=users.find(u2=>u2.id===w.userId);return s+(w.durationMin||0)*(Number(u?.hourlyRate||0)/60)},0);
  const openDefects=fOrders.flatMap(o=>(o.defects||[]).filter(d=>d.status!=="closed")).length;
  // ── מצב הפק"ע לפי הסטטוס מה-ERP ───────────────────────────
  // "שטרם הסתיימו" used to be answered from the floor's reports: a פק"ע counted
  // as unfinished unless every one of its serial numbers had cleared the route.
  // Most imported פק"ע carry no serial numbers at all, so the test was true for
  // nearly every one of them and the KPI showed the whole file under an "open"
  // label. The ERP status is the answer to that question, and it is already kept
  // on every order: דווח אחרון / נסגרה / COC are finished, everything else is
  // still out there. מבוטלת never reaches fOrders unless asked for by name.
  const phaseCount=useMemo(()=>{
    const n={pre:0,line:0,stuck:0,done:0,cancelled:0},units={pre:0,line:0,stuck:0,done:0,cancelled:0};
    fOrders.forEach(o=>{const p=orderPhase(o);if(n[p]===undefined)return;n[p]++;units[p]+=orderUnits(o)});
    return{n,units};
  },[fOrders]);
  const openOrders=phaseCount.n.pre+phaseCount.n.line+phaseCount.n.stuck;
  // A פק"ע with neither serial numbers nor a quantity has nothing to sign for, so
  // no progress can ever be reported against it. That is a data gap, not work in
  // progress, so it is called out rather than folded silently into the numbers.
  const noUnitOrders=fOrders.filter(o=>!orderUnits(o)).length;
  const openShortages=fOrders.flatMap(o=>(o.shortages||[]).filter(s2=>!s2.received)).length;
  const forecastRev=fOrders.reduce((s,o)=>{const remaining=Math.max(0,(o.serials||[]).length-(o.serials||[]).filter(sr=>isSerDone(o,sr)).length);return s+remaining*Number(o.unitPrice||0)},0);

  // Revenue by period
  const keyFn=d=>period==="year"?yK(d):period==="quarter"?qK(d):mkKey(d);
  const revByPeriod={};
  const counted=new Set();
  fLogs.forEach(w=>{
    const k=keyFn(w.endTime);if(!k)return;
    if(!revByPeriod[k])revByPeriod[k]={rev:0,qty:0,cost:0};
    // Cost: always add worker cost per log
    const u2=users.find(u3=>u3.id===w.userId);
    revByPeriod[k].cost+=(w.durationMin||0)*(Number(u2?.hourlyRate||0)/60);
    // Revenue: only when serial is fully done
    const o=fOrders.find(o2=>(o2.serials||[]).some(s=>s.id===w.serialId));if(!o)return;
    if(!isSerDone(o,{id:w.serialId}))return;
    const ck=w.serialId+"|"+k;if(counted.has(ck))return;counted.add(ck);
    revByPeriod[k].rev+=Number(o.unitPrice||0);revByPeriod[k].qty+=1;
  });
  const pKeys=Object.keys(revByPeriod).sort().slice(-10);

  // Donut data
  let donutData=[];
  if(donutSlice==="status"){
    donutData=[{label:"הושלמו",value:completedSerials},{label:"בתהליך",value:totalSerials-completedSerials}].filter(d=>d.value>0);
  }else if(donutSlice==="project"){
    donutData=projects.map(p=>{const po=fOrders.filter(o=>o.projectId===p.id);const done=po.reduce((s,o)=>(o.serials||[]).filter(sr=>isSerDone(o,sr)).length+s,0);return{label:p.name,value:done}}).filter(d=>d.value>0);
  }else if(donutSlice==="phase"){
    // פק"ע by where they stand in the line, not by how many units cleared it —
    // this is the "what is waiting, what is running, what is stuck" picture.
    donutData=PHASE_ORDER.map(k=>({label:ST_PHASE[k].label,value:fOrders.filter(o=>orderPhase(o)===k).length,color:ST_PHASE[k].color})).filter(d=>d.value>0);
  }else if(donutSlice==="branch"){
    const m={};fOrders.forEach(o=>{const c=branchCode(o.branch)||"none";m[c]=(m[c]||0)+1});
    donutData=Object.entries(m).map(([c,n])=>({label:c==="none"?"ללא סניף":branchLabel(c),value:n,color:c==="none"?"#8b95a8":branchColor(c)})).sort((a,b)=>b.value-a.value);
  }else{
    donutData=stages.map(st=>({label:st.name,value:fLogs.filter(w=>w.stageId===st.id).length,color:st.color})).filter(d=>d.value>0);
  }

  // Worker stats — revenue by stage price, units = serials fully done by worker
  const workerStats=users.filter(u=>u.role!=="admin"&&u.active!==false).map(u=>{
    const logs=fLogs.filter(w=>w.userId===u.id&&w.durationMin);
    const totalMin=logs.reduce((s,w)=>s+w.durationMin,0);
    const cost=totalMin*(Number(u.hourlyRate||0)/60);
    // Revenue: sum stage prices for each completed log
    const rev=logs.reduce((s,w)=>{const st=stages.find(s2=>s2.id===w.stageId);return s+Number(st?.price||0)},0);
    // Units: count serials where this worker completed ALL stages assigned to them
    const workerStageAccess=u.stageAccess==="all"?stages.map(s2=>s2.id):(Array.isArray(u.stageAccess)?u.stageAccess:[]);
    const serialsDone=new Set();
    logs.forEach(w=>{
      const o=fOrders.find(o2=>(o2.serials||[]).some(sr=>sr.id===w.serialId));
      if(!o)return;
      const myStagesInOrder=(o.stageIds||[]).filter(sid=>workerStageAccess.includes(sid));
      const allMyDone=myStagesInOrder.every(sid=>fLogs.some(l=>l.userId===u.id&&l.serialId===w.serialId&&l.stageId===sid&&l.completed));
      if(allMyDone)serialsDone.add(w.serialId);
    });
    const units=serialsDone.size;
    return{...u,totalMin,units,cost,revenue:rev,profit:rev-cost,uph:totalMin>0?(units/(totalMin/60)):0};
  }).sort((a,b)=>b.uph-a.uph);

  // ── פק"ע באיחור ──────────────────────────────────────────────────────────
  // Late is measured against תאריך סיום ייצור — Priority's "ת. סיום יצור" column,
  // which is what lands on the order as targetDate. The old test asked whether
  // any *serial* was unfinished, so a פק"ע managed by quantity — which has no
  // serials at all — could never be late however far past its date it was. It
  // now asks the same question the progress bar does: are all the units through.
  const qtyIdx=useQtyIndex(workLogs);
  const today=todays();
  const overdue=useMemo(()=>fOrders.filter(o=>{
    if(!o.targetDate||String(o.targetDate).slice(0,10)>=today)return false;
    if(orderPhase(o)==="done")return false;
    const units=orderUnits(o);
    if(!units)return true;
    return orderDoneCount(o,orderRoute(o,stages),workLogs,doneIdx,qtyIdx)<units;
  }).map(o=>({o,days:daysBetween(o.targetDate,today)})).sort((a,b)=>b.days-a.days),
    [fOrders,stages,workLogs,doneIdx,qtyIdx,today]);
  const overdueUnits=overdue.reduce((s2,x)=>s2+orderUnits(x.o),0);

  // On-time delivery rate: orders with a target that are either done or not yet late
  const datedOrders=fOrders.filter(o=>o.targetDate&&(o.serials||[]).length>0);
  const onTimeCount=datedOrders.filter(o=>(o.serials||[]).every(sr=>isSerDone(o,sr))?true:new Date(o.targetDate)>=new Date()).length;
  const onTimePct=datedOrders.length?Math.round(onTimeCount/datedOrders.length*100):null;
  // Average net work time per completed unit
  const avgPerUnit=completedSerials>0?totalWorkMins/completedSerials:0;

  // Stage bottleneck analysis: average duration per stage
  const stagePerf=stages.map(st=>{
    const logs=fLogs.filter(w=>w.stageId===st.id&&w.durationMin>0);
    const tot=logs.reduce((s,w)=>s+w.durationMin,0);
    return{label:st.name,value:logs.length?tot/logs.length:0,color:st.color,sub:`${logs.length} פעולות`};
  }).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);

  // WIP: where unfinished units are currently waiting (their next stage)
  const wipByStage={};
  fOrders.forEach(o=>{
    const ost=orderRoute(o,stages);
    (o.serials||[]).forEach(sr=>{
      const next=ost.find(st=>!doneIdx.has(logKey(sr.id,st.id)));
      if(next)wipByStage[next.id]=(wipByStage[next.id]||0)+1;
    });
  });
  const wipData=stages.filter(st=>wipByStage[st.id]).map(st=>({label:st.name,value:wipByStage[st.id],color:st.color})).sort((a,b)=>b.value-a.value);

  return(
    <div className="fade-in">
      {/* Filter bar */}
      <div className="dash-filter-sticky" style={{position:"sticky",zIndex:40,background:"var(--c-bg)",paddingTop:8,paddingBottom:4,marginBottom:8}}>
        <Card style={{padding:"10px 14px",display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end",boxShadow:"0 2px 8px #0003"}}>
          <span style={{fontSize:13,color:"var(--c-dim)",fontWeight:600,paddingBottom:2}}>🔍</span>
          <div style={{display:"flex",flexDirection:"column",gap:3,minWidth:140}}><label style={{fontSize:11,color:"var(--c-dim)"}}>פרויקט</label><select value={selProj} onChange={e=>setSelProj(e.target.value)} style={{padding:"5px 8px",fontSize:12}}><option value="all">כל הפרויקטים</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
          <div style={{display:"flex",flexDirection:"column",gap:3,minWidth:140}}><label style={{fontSize:11,color:"var(--c-dim)"}}>סניף (חטיבה)</label>

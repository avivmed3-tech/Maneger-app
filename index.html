// ═══ PUSH NOTIFICATIONS UTILITY ════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
const PushNotify={
  async request(){
    if(!("Notification" in window))return false;
    if(Notification.permission==="granted")return true;
    const p=await Notification.requestPermission();
    return p==="granted";
  },
  send(title,body,tag="pml"){
    if(!("serviceWorker" in navigator))return;
    navigator.serviceWorker.ready.then(reg=>{
      reg.active?.postMessage({type:"NOTIFY",title,body,tag});
    });
  }
};

// ═══ LIVE FACTORY BOARD (מסך מפעל) ════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function LiveFactoryBoard({orders,workLogs,stages,customTasks,users,onClose,lightMode}){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t)},[]);
  const lm=lightMode;
  const bg=lm?"#f0f2f5":"#05080f";
  const cardBg=lm?"#ffffff":"#0d1120";
  const innerBg=lm?"#f7f8fa":"#131829";
  const borderC=lm?"#dde1e8":"#1e2a42";
  const textC=lm?"#1a1f2e":"#e2e8f0";
  const mutedC=lm?"#5a6478":"#5a6478";
  const dimC=lm?"#8b95a8":"#5a6478";

  const activeWork=workLogs.filter(w=>!w.completed);
  const activeTasks=(customTasks||[]).filter(t=>t.active&&!t.completed);

  // Build unified worker map: work logs + active tasks
  const workerMap={};
  activeWork.forEach(w=>{
    if(!workerMap[w.userId])workerMap[w.userId]={name:w.userName,logs:[],tasks:[],paused:false};
    workerMap[w.userId].logs.push(w);
    if(!w.paused)workerMap[w.userId].paused=false; else workerMap[w.userId].paused=true;
  });
  activeTasks.forEach(t=>{
    if(!workerMap[t.userId])workerMap[t.userId]={name:t.userName,logs:[],tasks:[],paused:false};
    workerMap[t.userId].tasks.push(t);
    if(t.paused)workerMap[t.userId].paused=true;
  });

  // Dedupe bulk logs per worker
  const workerCards=Object.values(workerMap).map(wk=>{
    const seen=new Set();const items=[];
    wk.logs.forEach(w=>{
      const key=w.bulkGroupId||w.id;if(seen.has(key))return;seen.add(key);
      const group=w.bulkGroupId?wk.logs.filter(g=>g.bulkGroupId===w.bulkGroupId):[w];
      items.push({...w,_count:group.length,_sns:group.map(g=>g.serialSn),_type:"work"});
    });
    // Determine status: working > task > break
    const anyWorkActive=wk.logs.some(l=>!l.paused);
    const anyTaskActive=wk.tasks.some(t=>!t.paused);
    const status=anyWorkActive?"working":anyTaskActive?"task":wk.logs.length>0||wk.tasks.length>0?"break":"idle";
    return{name:wk.name,items,tasks:wk.tasks,status};
  });

  const pendingTotal=orders.reduce((s,o)=>{
    const oSt=o.stageIds||[];
    return s+(o.serials||[]).filter(sr=>!oSt.every(sid=>workLogs.some(w=>w.serialId===sr.id&&w.stageId===sid&&w.completed))).length;
  },0);
  const doneToday=workLogs.filter(w=>w.completed&&w.endTime&&new Date(w.endTime).toDateString()===new Date().toDateString()).length;

  const fmtElapsed=ms=>{const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h>0?`${h}:${String(m%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:`${m}:${String(s%60).padStart(2,"0")}`};

  const statusLabel={working:"🔄 עובד",task:"📌 במשימה",break:"⏸️ הפסקה",idle:"😴 לא פעיל"};
  const statusColor={working:"#f59e0b",task:"#a78bfa",break:"#8b95a8",idle:"#5a6478"};

  return(
    <div style={{position:"fixed",inset:0,background:bg,zIndex:500,overflow:"auto",padding:20}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontSize:32}}>⚙️</div>
          <div>
            <div style={{fontWeight:800,fontSize:22,color:"#60a5fa",letterSpacing:-.5}}>מצב רצפת ייצור</div>
            <div style={{fontSize:13,color:dimC}}>{new Date().toLocaleString("he-IL",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}</div>
          </div>
        </div>
        <button onClick={onClose} style={{background:cardBg,border:`1px solid ${borderC}`,color:mutedC,borderRadius:10,padding:"8px 16px",fontSize:14,fontFamily:"inherit"}}>✕ סגור</button>
      </div>

      {/* KPI row */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:20}}>
        {[
          {i:"🔄",v:workerCards.filter(w=>w.status==="working").length,l:"עובדים פעילים",c:"#f59e0b"},
          {i:"📌",v:workerCards.filter(w=>w.status==="task").length,l:"במשימות",c:"#a78bfa"},
          {i:"⏸️",v:workerCards.filter(w=>w.status==="break").length,l:"בהפסקה",c:"#8b95a8"},
          {i:"✅",v:doneToday,l:"הושלמו היום",c:"#10b981"},
          {i:"📋",v:pendingTotal,l:"יחידות ממתינות",c:"#3b82f6"},
          {i:"📌",v:activeTasks.length,l:"משימות פעילות",c:"#ec4899"},
        ].map((k,i)=>(
          <div key={i} style={{background:cardBg,borderRadius:12,padding:"14px 16px",border:`1px solid ${k.c}33`,textAlign:"center"}}>
            <div style={{fontSize:24,marginBottom:4}}>{k.i}</div>
            <div style={{fontSize:28,fontWeight:800,color:k.c}}>{k.v}</div>
            <div style={{fontSize:11,color:dimC,marginTop:2}}>{k.l}</div>
          </div>
        ))}
      </div>

      {/* Worker cards */}
      <div style={{marginBottom:16,fontWeight:700,fontSize:15,color:mutedC,borderBottom:`1px solid ${borderC}`,paddingBottom:8}}>👷 עובדים בזמן אמת</div>
      {workerCards.length===0&&<EmptyState icon="😴" title="אין עבודה פעילה כרגע" subtitle="העובדים לא רשמו כניסה עדיין"/>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12,marginBottom:24}}>
        {workerCards.map((wk,i)=>{
          const sc=statusColor[wk.status];
          return(
          <div key={i} style={{background:cardBg,borderRadius:14,padding:16,border:`2px solid ${sc}33`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontWeight:700,fontSize:16,color:textC}}>{wk.name}</div>
              <span style={{fontSize:11,background:sc+"22",color:sc,padding:"3px 10px",borderRadius:20,animation:wk.status==="working"||wk.status==="task"?"pulse 2s infinite":"none"}}>
                {statusLabel[wk.status]}
              </span>
            </div>
            {/* Work log items */}
            {wk.items.map((w,j)=>{
              const stage=stages.find(s=>s.id===w.stageId);
              const elapsed=now-new Date(w.startTime).getTime()-(w.totalPauseMin||0)*60000;
              const order=orders.find(o=>o.id===w.orderId);
              return(
                <div key={`w${j}`} style={{background:innerBg,borderRadius:8,padding:"10px 12px",marginBottom:6,border:`1px solid ${stage?.color||borderC}22`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600,color:stage?.color||"#60a5fa"}}>{stage?.name||"—"}</div>
                      <div style={{fontSize:11,color:dimC}}>{order?.woNumber||""} {w._count>1?`× ${w._count} יחידות`:w.serialSn}</div>
                    </div>
                    <div style={{fontSize:18,fontWeight:800,color:w.paused?mutedC:"#f59e0b",fontVariantNumeric:"tabular-nums"}}>
                      {w.paused?"⏸️":fmtElapsed(Math.max(0,elapsed))}
                    </div>
                  </div>
                </div>
              );
            })}
            {/* Active tasks for this worker */}
            {wk.tasks.map((t,j)=>{
              const elapsed=t.startTime?now-new Date(t.startTime).getTime()-(t.totalPauseMin||0)*60000:0;
              return(
                <div key={`t${j}`} style={{background:innerBg,borderRadius:8,padding:"10px 12px",marginBottom:6,border:"1px solid #a78bfa33"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600,color:"#a78bfa"}}>📌 {t.name}</div>
                      {t.description&&<div style={{fontSize:11,color:dimC}}>{t.description}</div>}
                    </div>
                    <div style={{fontSize:18,fontWeight:800,color:t.paused?mutedC:"#a78bfa",fontVariantNumeric:"tabular-nums"}}>
                      {t.paused?"⏸️":fmtElapsed(Math.max(0,elapsed))}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )})}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ MONTHLY PDF REPORT ════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function MonthlyReportModal({orders,workLogs,stages,projects,users,onClose}){
  const now=new Date();
  const [selYear,setSelYear]=useState(now.getFullYear());
  const [selMonth,setSelMonth]=useState(now.getMonth()+1);
  const [generating,setGenerating]=useState(false);
  const monthNames=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  const years=Array.from({length:5},(_,i)=>now.getFullYear()-i);
  const month=`${selYear}-${String(selMonth).padStart(2,"0")}`;

  const generate=()=>{
    setGenerating(true);
    try{
      const [y,m]=[selYear,selMonth];
      const fLogs=workLogs.filter(w=>{if(!w.completed||!w.endTime)return false;const d=new Date(w.endTime);return d.getFullYear()===y&&d.getMonth()+1===m});
      const fOrders=orders.filter(o=>o.receivedDate&&new Date(o.receivedDate).getFullYear()===y&&new Date(o.receivedDate).getMonth()+1===m);

      // Build HTML report
      const totalMin=fLogs.reduce((s,w)=>s+w.durationMin,0);
      const totalRev=fOrders.reduce((s,o)=>s+Number(o.unitPrice||0)*Number(o.qty||0),0);
      const workerStats={};
      fLogs.forEach(w=>{
        if(!workerStats[w.userId])workerStats[w.userId]={name:w.userName,min:0,units:0};
        workerStats[w.userId].min+=w.durationMin;
        workerStats[w.userId].units++;
      });

      const html=`<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"/>
<style>body{font-family:Arial,sans-serif;direction:rtl;padding:40px;color:#1a1f2e;max-width:900px;margin:0 auto}
h1{color:#3b82f6;border-bottom:3px solid #3b82f6;padding-bottom:12px}
h2{color:#374151;margin-top:32px;font-size:16px;border-bottom:1px solid #e5e7eb;padding-bottom:6px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th{background:#f3f4f6;padding:8px 10px;text-align:right;font-weight:600;border:1px solid #e5e7eb}
td{padding:7px 10px;border:1px solid #e5e7eb}tr:nth-child(even){background:#f9fafb}
.kpi{display:inline-block;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 20px;margin:6px;text-align:center}
.kpi-v{font-size:24px;font-weight:800;color:#2563eb}.kpi-l{font-size:11px;color:#6b7280}
.footer{margin-top:40px;padding-top:16px;border-top:1px solid #e5e7eb;font-size:11px;color:#9ca3af}
</style></head><body>
<h1>⚙️ דוח חודשי — ניהול קו ייצור</h1>
<p style="color:#6b7280;margin-bottom:20px">תקופה: ${new Date(y,m-1).toLocaleString("he-IL",{month:"long",year:"numeric"})} | הופק: ${new Date().toLocaleDateString("he-IL")}</p>
<div>
  <div class="kpi"><div class="kpi-v">${fOrders.length}</div><div class="kpi-l">פקעות שנפתחו</div></div>
  <div class="kpi"><div class="kpi-v">${fLogs.length}</div><div class="kpi-l">פעולות עבודה</div></div>
  <div class="kpi"><div class="kpi-v">${Math.round(totalMin/60)} שע'</div><div class="kpi-l">סה"כ שעות</div></div>
  <div class="kpi"><div class="kpi-v">₪${totalRev.toLocaleString("he-IL")}</div><div class="kpi-l">הכנסה פוטנציאלית</div></div>
</div>
<h2>📋 פקעות החודש</h2>
<table><thead><tr><th>מספר פקעה</th><th>תיאור</th><th>P/N</th><th>כמות</th><th>פרויקט</th><th>יעד אספקה</th></tr></thead><tbody>
${fOrders.map(o=>`<tr><td>${o.woNumber}</td><td>${o.description||"—"}</td><td>${o.pn||"—"}</td><td>${o.qty}</td><td>${projects.find(p=>p.id===o.projectId)?.name||"—"}</td><td>${o.targetDate||"—"}</td></tr>`).join("")}
</tbody></table>
<h2>👥 ביצועי עובדים</h2>
<table><thead><tr><th>עובד</th><th>פעולות</th><th>שעות</th></tr></thead><tbody>
${Object.values(workerStats).sort((a,b)=>b.min-a.min).map(w=>`<tr><td>${w.name}</td><td>${w.units}</td><td>${Math.round(w.min/60)}</td></tr>`).join("")}
</tbody></table>
<div class="footer">דוח זה הופק אוטומטית ממערכת ניהול קו ייצור v${APP_VERSION}</div>
</body></html>`;

      const blob=new Blob([html],{type:"text/html;charset=utf-8"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=`דוח_ייצור_${month}.html`;
      a.click();
      URL.revokeObjectURL(a.href);
    }finally{setGenerating(false)}
  };

  return(
    <Modal onClose={onClose}>
      <div style={{fontWeight:700,fontSize:18,color:"#60a5fa",marginBottom:20}}>📄 דוח חודשי</div>
      <div style={{marginBottom:16}}>
        <label style={{fontSize:12,color:"var(--c-dim)",display:"block",marginBottom:8}}>בחר תקופה</label>
        <div style={{display:"flex",gap:10}}>
          <select value={selMonth} onChange={e=>setSelMonth(Number(e.target.value))} style={{flex:1,padding:"10px 12px",fontSize:15,fontWeight:600}}>
            {monthNames.map((n,i)=><option key={i} value={i+1}>{n}</option>)}
          </select>
          <select value={selYear} onChange={e=>setSelYear(Number(e.target.value))} style={{width:100,padding:"10px 12px",fontSize:15,fontWeight:600}}>
            {years.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>
      <div style={{background:"var(--c-deep)",borderRadius:10,padding:14,marginBottom:16,fontSize:13,color:"var(--c-muted)"}}>
        הדוח יכלול: פקעות שנפתחו, פעולות עבודה, ביצועי עובדים, ו-KPI של החודש. ייפתח כקובץ HTML שניתן להדפסה.
      </div>
      <div style={{display:"flex",gap:10}}>
        <Btn color="#3b82f6" onClick={generate} disabled={generating}>{generating?"⏳ מייצר...":"📥 הורד דוח"}</Btn>
        <Btn onClick={onClose}>סגור</Btn>
      </div>
    </Modal>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ HISTORY PANEL ════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function HistoryPanel({onClose,orders,updO,workLogs,onDeleteLog,onUndoWorkLog,customTasks,onUndoTask,onDeleteTask}){
  const [auditLog,setAuditLog]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState("all");

  useEffect(()=>{
    SB.get("audit_log","order=created_at.desc&limit=200").then(rows=>{
      setAuditLog(rows.map(r=>({
        id:r.id,userId:r.user_id,username:r.username,name:r.name,
        action:r.action,target:r.target,details:r.details,
        reverted:r.reverted,canUndo:r.can_undo,timestamp:r.created_at
      })));
      setLoading(false);
    }).catch(()=>{
      setAuditLog(getAuditLog());
      setLoading(false);
    });
  },[]);

  const filtered=auditLog.filter(e=>{
    if(filter==="all")return true;
    if(filter==="login")return e.action.includes("התחבר");
    if(filter==="work")return e.action.includes("עבוד")||e.action.includes("סיום")||e.action.includes("הפסקה")||e.action.includes("חתימ");
    if(filter==="admin")return e.action.includes("משתמש")||e.action.includes("ייבוא")||e.action.includes("מחיקה");
    return true;
  });

  const actionColor=a=>{
    if(a.includes("התחבר"))return"#60a5fa";
    if(a.includes("סיום")||a.includes("הושלם")||a.includes("חתימ"))return"#10b981";
    if(a.includes("הפסקה"))return"#f59e0b";
    if(a.includes("מחיקה")||a.includes("ביטול"))return"#ef4444";
    if(a.includes("הוספ")||a.includes("יצירה")||a.includes("התחלת"))return"#a78bfa";
    return"#8b95a8";
  };

  // Undo: find and revert a work log by serialSn & stage
  const undoEntry=(entry)=>{
    if(!confirm(`לבטל פעולה: ${entry.action} — ${entry.target||""}?`))return;

    if(entry.action.includes("סיום עבודה")||entry.action.includes("חתימת מנהל")){
      // Find the work log for this serial + stage combo
      const sn=entry.target;
      const stageName=(entry.details||"").split("—").pop()?.trim();
      const log=(workLogs||[]).find(w=>w.completed&&w.serialSn===sn&&(!stageName||stages.find(s=>s.id===w.stageId)?.name?.trim()===stageName));
      if(log){
        onUndoWorkLog&&onUndoWorkLog(log.id);
        addAuditEntry({userId:entry.userId,username:entry.username,name:entry.name,action:"ביטול פעולה",target:entry.target,details:`בוטל: ${entry.action}`});
        setAuditLog(prev=>prev.map(e=>e.id===entry.id?{...e,reverted:true}:e));
      }else{
        toast("לא נמצא רשומת עבודה מתאימה לביטול","warning");
      }
    }else if(entry.action.includes("התחלת עבודה")){
      // Delete the active (uncompleted) work log
      const sn=entry.target;
      const log=(workLogs||[]).find(w=>!w.completed&&w.serialSn===sn);
      if(log){
        onDeleteLog&&onDeleteLog([log.id]);
        addAuditEntry({userId:entry.userId,username:entry.username,name:entry.name,action:"ביטול פעולה",target:entry.target,details:`בוטל: ${entry.action}`});
        setAuditLog(prev=>prev.map(e=>e.id===entry.id?{...e,reverted:true}:e));
      }else{toast("לא נמצאה רשומה פעילה לביטול","warning")}
    }else if(entry.canUndo&&entry.action.includes("ייבוא")){
      const snapshot=LS.get("importSnapshot");
      if(!snapshot)return toast("אין גיבוי לשחזור","warning");
      if(!confirm(`לשחזר ${snapshot.length} פקעות מלפני הייבוא?`))return;
      updO(snapshot);
      LS.set("importSnapshot",null);
      setAuditLog(prev=>prev.map(e=>e.id===entry.id?{...e,reverted:true}:e));
    }
  };

  // Check if an entry can be undone
  const canUndo=(entry)=>{
    if(entry.reverted)return false;
    if(entry.action.includes("סיום עבודה")||entry.action.includes("חתימת מנהל"))return true;
    if(entry.action.includes("התחלת עבודה"))return true;
    if(entry.canUndo&&entry.action.includes("ייבוא"))return true;
    return false;
  };

  // Access stages from global scope
  const stages=window.__pml_stages||[];

  return(
    <Modal onClose={onClose} wide>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:18,color:"#60a5fa"}}>📋 היסטוריית פעילות</div>
        <IBtn onClick={onClose}>✕</IBtn>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
        {[["all","הכל"],["login","התחברויות"],["work","עבודה"],["admin","ניהול"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{background:filter===v?"var(--c-accent)":"var(--c-deep)",border:`1px solid ${filter===v?"var(--c-accent)":"var(--c-border)"}`,color:filter===v?"#fff":"var(--c-muted)",borderRadius:8,padding:"5px 12px",fontSize:12,fontFamily:"inherit",cursor:"pointer"}}>{l}</button>
        ))}
        <span style={{fontSize:12,color:"var(--c-dim)",padding:"5px 0",marginRight:"auto"}}>{filtered.length} רשומות</span>
      </div>
      {loading?<div style={{textAlign:"center",padding:30,color:"var(--c-dim)"}}>⏳ טוען...</div>:(
        <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:"60vh",overflowY:"auto"}}>
          {filtered.map(e=>(
            <div key={e.id} style={{background:e.reverted?"var(--c-card)":"var(--c-deep)",borderRadius:8,padding:"10px 12px",border:`1px solid ${e.reverted?"#ef444433":actionColor(e.action)+"22"}`,display:"flex",gap:10,alignItems:"flex-start",opacity:e.reverted?.5:1}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:e.reverted?"#ef4444":actionColor(e.action),marginTop:5,flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
                  <span><b style={{color:"#60a5fa"}}>{e.name||e.username||"מערכת"}</b><span style={{color:"var(--c-muted)",marginRight:6}}>{e.action}</span>{e.target&&<span style={{color:"var(--c-dim)",fontSize:12}}> — {e.target}</span>}{e.reverted&&<span style={{fontSize:11,color:"#ef4444",marginRight:6}}> (בוטל)</span>}</span>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    {canUndo(e)&&<button onClick={()=>undoEntry(e)} style={{background:"#f59e0b22",border:"1px solid #f59e0b44",color:"#f59e0b",borderRadius:6,padding:"2px 10px",fontSize:11,fontWeight:700,fontFamily:"inherit",cursor:"pointer",whiteSpace:"nowrap"}}>↩️ בטל</button>}
                    <span style={{fontSize:11,color:"var(--c-dim)",whiteSpace:"nowrap"}}>{e.timestamp?new Date(e.timestamp).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}</span>
                  </div>
                </div>
                {e.details&&<div style={{fontSize:11,color:"var(--c-dim)",marginTop:3}}>{e.details}</div>}
              </div>
            </div>
          ))}
          {filtered.length===0&&<EmptyState icon="📜" title="אין רשומות" subtitle="נסה לשנות את הסינון"/>}
        </div>
      )}
    </Modal>
  );

    events.forEach(e=>window.addEventListener(e,resetActivity,{passive:true}));

      }
    },60000);
    return()=>{events.forEach(e=>window.removeEventListener(e,resetActivity));clearInterval(checker)};
  },[currentUser]);

  useEffect(()=>{
    // Check if we migrated to Supabase already — if not, clear old Google Sheets localStorage
    const migrated=LS.get("sb_migrated");
    if(!migrated){
      // Clear any stale data from Google Sheets era
      ["orders","projects","stages","workLogs","customTasks","stageBlocks","users","session"].forEach(k=>{
        try{localStorage.removeItem(LS_PREFIX+k)}catch{}
      });
      LS.set("sb_migrated",true);
      setCurrentUser(null);
    }

    // Load from localStorage ONLY if same company (prevent cross-company data flash)
    const cachedSession=LS.get("session_company");
    const sessionCid=cachedSession||DEFAULT_COMPANY_ID;
    if(sessionCid===_companyId){
      const lo=LS.get("orders"),lp=LS.get("projects"),ls=LS.get("stages"),lw=LS.get("workLogs");
      if(lo)setOrders(lo);if(lp)setProjects(lp);if(ls)setStages(ls);if(lw)setWorkLogs(lw);
      const lct=LS.get("customTasks");if(lct)setCustomTasks(lct);
      const lsb=LS.get("stageBlocks");if(lsb)setStageBlocks(lsb);
    }

    // Then always load from Supabase (Supabase is the source of truth)
    Promise.all([dbLoadAll(),dbLoadUsers()]).then(async([data,users])=>{
      if(data){
        // Always prefer Supabase data — update state and cache
        setOrders(data.orders||[]);LS.set("orders",data.orders||[]);
        setProjects(data.projects?.length?data.projects:DEF_PROJ);LS.set("projects",data.projects?.length?data.projects:DEF_PROJ);
        setStages(data.stages?.length?data.stages:DEF_STAGES);LS.set("stages",data.stages?.length?data.stages:DEF_STAGES);
        setWorkLogs(data.workLogs||[]);LS.set("workLogs",data.workLogs||[]);
        setCustomTasks(data.customTasks||[]);LS.set("customTasks",data.customTasks||[]);
        setStageBlocks(data.stageBlocks||[]);LS.set("stageBlocks",data.stageBlocks||[]);
        LS.set("session_company",_companyId);
      }
      if(users?.length){LS.set("users",users)}

      // Seed default projects/stages/users if DB is empty
      if(!data?.projects?.length){
        SB.upsert("projects",DEF_PROJ.map(projectToDb)).catch(()=>{});
      }
      if(!data?.stages?.length){
        SB.upsert("stages",DEF_STAGES.map(stageToDb)).catch(()=>{});
      }
      // Seed fallback users with hashed passwords if no users in DB
      if(!users?.length){
        try{
          const seeded=[];
          for(const fu of FALLBACK_USERS){
            const h=await sha256(fu.password);
            seeded.push(userToDb({...fu,password_hash:h,password:undefined}));
          }
          await SB.upsert("app_users",seeded);
          LS.set("users",FALLBACK_USERS.map(fu=>({...fu,password:undefined})));
        }catch(e){console.warn("Seed users error",e)}
      }

      // Restore session from fresh user list
      try{
        const saved=localStorage.getItem(LS_PREFIX+"session");
        if(saved){
          const s3=JSON.parse(saved);
          const freshUsers=users?.length?users:getUsers();
          const found=freshUsers.find(u=>u.id===s3.id&&u.username===s3.username&&u.active!==false);
          if(found){setCurrentUser(found);setCompanyId(found.companyId||s3.companyId||DEFAULT_COMPANY_ID)}else{localStorage.removeItem(LS_PREFIX+"session");setCurrentUser(null)}
        }
      }catch{}
      setLoading(false);
    }).catch(()=>{
      // Supabase unreachable — use local cache
      try{const saved=localStorage.getItem(LS_PREFIX+"session");if(saved){const s3=JSON.parse(saved);const found=getUsers().find(u=>u.id===s3.id&&u.username===s3.username&&u.active!==false);if(found)setCurrentUser(found)}}catch{}
      setLoading(false);
    });
  },[]);

  useEffect(()=>{oRef.current=orders},[orders]);
  useEffect(()=>{pRef.current=projects},[projects]);
  useEffect(()=>{sRef.current=stages},[stages]);
  useEffect(()=>{wRef.current=workLogs},[workLogs]);

  // ── Refresh from Supabase ──────────────────────────────────────
  const lastPersistRef=useRef(0);
  const refreshFromDB=useCallback(async(force)=>{
    if(!force&&Date.now()-lastPersistRef.current<5000)return;
    setSync("saving");
    try{
      const [data,users]=await Promise.all([dbLoadAll(),dbLoadUsers()]);
      if(data){
        if(data.orders){setOrders(data.orders);LS.set("orders",data.orders)}
        if(data.projects){setProjects(data.projects);LS.set("projects",data.projects)}
        if(data.stages){setStages(data.stages);LS.set("stages",data.stages)}
        if(data.workLogs){setWorkLogs(data.workLogs);LS.set("workLogs",data.workLogs)}
        if(data.customTasks){setCustomTasks(data.customTasks);LS.set("customTasks",data.customTasks)}
        if(data.stageBlocks){setStageBlocks(data.stageBlocks);LS.set("stageBlocks",data.stageBlocks)}
      }
      if(users?.length)LS.set("users",users);
      setSync("ok");
    }catch{setSync("error")}
  },[]);

  // ── Supabase Realtime (with polling fallback) ──────────────────
  const [onlineUsers,setOnlineUsers]=useState([]);
  useEffect(()=>{
    if(!currentUser)return;
    let dead=false;
    let pollTimer=null;
    let ws=null;let heartbeat=null;let reconnectTimer=null;
    let realtimeWorking=false;

    // Polling fallback — always active, faster when realtime fails
    const poll=async()=>{
      if(dead)return;
      // Skip if we just persisted locally (avoid overwriting local changes)
      if(Date.now()-lastPersistRef.current<3000){pollTimer=setTimeout(poll,realtimeWorking?30000:8000);return}
      try{
        const data=await dbLoadAll();
        if(dead)return;
        if(data){
          if(data.orders){setOrders(data.orders);LS.set("orders",data.orders)}
          if(data.workLogs){setWorkLogs(data.workLogs);LS.set("workLogs",data.workLogs)}
          if(data.customTasks){setCustomTasks(data.customTasks);LS.set("customTasks",data.customTasks)}
          if(data.stages){setStages(data.stages);LS.set("stages",data.stages)}
          if(data.projects){setProjects(data.projects);LS.set("projects",data.projects)}
          if(data.stageBlocks){setStageBlocks(data.stageBlocks);LS.set("stageBlocks",data.stageBlocks)}
        }
        setSync("ok");
      }catch(e){console.warn("Poll error",e)}
      if(!dead)pollTimer=setTimeout(poll,realtimeWorking?30000:8000);
    };
    // Start polling after a short delay
    pollTimer=setTimeout(poll,5000);

    // Try Supabase Realtime WebSocket
    const wsUrl=`wss://lwiurzkiojctwzllpnmr.supabase.co/realtime/v1/websocket?apikey=${SB_KEY}&vsn=1.0.0`;
    const connect=()=>{
      if(dead)return;
      try{
        ws=new WebSocket(wsUrl);
        ws.onopen=()=>{
          console.log("Realtime WS connected");
          const tables=["orders","work_logs","custom_tasks","stages","projects","stage_blocks"];
          tables.forEach((t,i)=>{
            ws.send(JSON.stringify({
              topic:`realtime:public:${t}`,
              event:"phx_join",
              payload:{config:{broadcast:{ack:false},presence:{key:""},postgres_changes:[{event:"*",schema:"public",table:t}]}},
              ref:String(i+1)
            }));
          });
          heartbeat=setInterval(()=>{try{ws.send(JSON.stringify({topic:"phoenix",event:"heartbeat",payload:{},ref:"hb"}))}catch{}},25000);
          realtimeWorking=true;
          setSync("ok");
        };
        ws.onmessage=async(e)=>{
          try{
            const msg=JSON.parse(e.data);
            // Supabase sends postgres_changes as the event name in the payload
            const isChange=msg.event==="postgres_changes"||
              msg.event==="INSERT"||msg.event==="UPDATE"||msg.event==="DELETE"||
              (msg.payload?.data?.type==="INSERT")||(msg.payload?.data?.type==="UPDATE")||(msg.payload?.data?.type==="DELETE")||
              (msg.payload?.type==="INSERT")||(msg.payload?.type==="UPDATE")||(msg.payload?.type==="DELETE");
            if(!isChange)return;
            // Determine which table changed
            const tbl=msg.payload?.data?.table||msg.payload?.table||msg.topic?.split(":")?.[2];
            if(!tbl)return;
            console.log("Realtime change:",tbl);
            // Small delay to let write finish
            await new Promise(r=>setTimeout(r,300));
            const cf=`company_id=eq.${_companyId}&`;
            if(["orders"].includes(tbl)){const rows=await SB.get("orders",cf+"order=created_at.asc");setOrders(rows.map(dbToOrder));LS.set("orders",rows.map(dbToOrder))}
            if(["work_logs"].includes(tbl)){const rows=await SB.get("work_logs",cf+"order=created_at.asc");setWorkLogs(rows.map(dbToLog));LS.set("workLogs",rows.map(dbToLog))}
            if(["custom_tasks"].includes(tbl)){const rows=await SB.get("custom_tasks",cf+"order=created_at.asc");setCustomTasks(rows.map(dbToTask));LS.set("customTasks",rows.map(dbToTask))}
            if(["stages"].includes(tbl)){const rows=await SB.get("stages",cf+"order=stage_order.asc");setStages(rows.map(dbToStage));LS.set("stages",rows.map(dbToStage))}
            if(["projects"].includes(tbl)){const rows=await SB.get("projects",cf+"order=name.asc");setProjects(rows.map(dbToProject));LS.set("projects",rows.map(dbToProject))}
            if(["stage_blocks"].includes(tbl)){const rows=await SB.get("stage_blocks",cf+"order=created_at.asc");setStageBlocks(rows.map(dbToBlock));LS.set("stageBlocks",rows.map(dbToBlock))}
          }catch(err){console.warn("Realtime msg error",err)}
        };
        ws.onclose=()=>{
          console.log("Realtime WS closed");
          clearInterval(heartbeat);
          realtimeWorking=false;
          if(!dead)reconnectTimer=setTimeout(connect,5000);
        };
        ws.onerror=()=>{realtimeWorking=false;ws.close()};
      }catch(err){console.warn("WS connect error",err);realtimeWorking=false}
    };
    connect();

    return()=>{dead=true;clearInterval(heartbeat);clearTimeout(reconnectTimer);clearTimeout(pollTimer);try{ws?.close()}catch{}};
  },[currentUser?.id]);

  const ctRef=useRef(customTasks);
  useEffect(()=>{ctRef.current=customTasks},[customTasks]);
  const sbRef=useRef(stageBlocks);
  useEffect(()=>{sbRef.current=stageBlocks},[stageBlocks]);

  const persist=(no,np,ns,nw,nct,nsb)=>{
    const o=no??oRef.current,p=np??pRef.current,s=ns??sRef.current,w=nw??wRef.current,ct=nct??ctRef.current,sb=nsb??sbRef.current;
    // Always save to localStorage immediately
    LS.set("orders",o);LS.set("projects",p);LS.set("stages",s);LS.set("workLogs",w);LS.set("customTasks",ct);LS.set("stageBlocks",sb);
    lastPersistRef.current=Date.now();
    setSync("saving");clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      try{
        await Promise.all([
          SB.upsert("orders",o.map(orderToDb)),
          SB.upsert("projects",p.map(projectToDb)),
          SB.upsert("stages",s.map(stageToDb)),
          SB.upsert("stage_blocks",sb.map(blockToDb)),
          SB.upsert("work_logs",w.map(logToDb)),
          SB.upsert("custom_tasks",ct.map(taskToDb)),
        ]);
        setSync("ok");
      }catch(e){console.warn("Supabase save error",e);setSync("error")}
    },800);
  };

  const handleLogin=u=>{
    const cid=u.companyId||DEFAULT_COMPANY_ID;
    const prevCid=_companyId;
    setCompanyId(cid);
    // If company changed — clear stale cache immediately so no data leaks between companies
    if(cid!==prevCid){
      setOrders([]);setProjects(DEF_PROJ);setStages(DEF_STAGES);setWorkLogs([]);setCustomTasks([]);setStageBlocks([]);
      ["orders","projects","stages","workLogs","customTasks","stageBlocks"].forEach(k=>{try{localStorage.removeItem(LS_PREFIX+k)}catch{}});
    }
    setCurrentUser(u);
    try{localStorage.setItem(LS_PREFIX+"session",JSON.stringify({id:u.id,username:u.username,companyId:cid}))}catch{}
    SB.get("subscriptions",`company_id=eq.${cid}&status=eq.active`).then(rows=>{
      if(rows&&rows.length>0)setCompanyPlan(rows[0].plan||"free");
    }).catch(()=>{});
  };
  const handleLogout=()=>{
    if(currentUser)addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:"התנתקות",target:"",details:""});
    setCurrentUser(null);try{localStorage.removeItem(LS_PREFIX+"session")}catch{}
  };

  const canEdit=currentUser?.role==="admin"||currentUser?.role==="editor"||currentUser?.canEdit===true;
  const canViewProject=pid=>{if(!currentUser)return false;if(currentUser.role==="admin")return true;const pa=currentUser.projectAccess;if(pa==="all")return true;if(Array.isArray(pa))return pa.includes(pid);return pa===pid};

  const filteredProjects=projects.filter(p=>canViewProject(p.id));
  const filteredOrders=orders.filter(o=>canViewProject(o.projectId));
  const filteredWorkLogs=workLogs;

  const updO=useCallback((fn)=>{setOrders(prev=>{const next=typeof fn==="function"?fn(prev):fn;persist(next,null,null,null);return next})},[]);
  const updP=useCallback((fn)=>{setProjects(prev=>{const next=typeof fn==="function"?fn(prev):fn;persist(null,next,null,null);return next})},[]);

  // Auto-delivery: per serial — when a serial finishes all stages, mark it as delivered
  const checkAutoDelivery=(orderId,nextLogs)=>{
    const order=oRef.current.find(o=>o.id===orderId);
    if(!order)return;
    const sers=order.serials||[];if(!sers.length)return;
    const oSt=order.stageIds||[];if(!oSt.length)return;
    const delivered=new Set(order.deliveredSerials||[]);
    let changed=false;
    sers.forEach(sr=>{
      if(delivered.has(sr.id))return;
      const allDone=oSt.every(sid=>nextLogs.some(w=>w.serialId===sr.id&&w.stageId===sid&&w.completed));
      if(allDone){delivered.add(sr.id);changed=true}
    });
    if(changed){
      const deliveredArr=[...delivered];
      const allDelivered=deliveredArr.length===sers.length;
      setOrders(prev=>{
        const updated=prev.map(o=>o.id!==orderId?o:{...o,
          deliveredSerials:deliveredArr,
          deliveredQty:deliveredArr.length,
          deliveryStatus:allDelivered?"delivered":deliveredArr.length>0?"partial":"pending",
          deliveryDate:allDelivered?todays():(o.deliveryDate||"")
        });
        persist(updated,null,null,null);
        return updated;
      });
    }
  };

  const handleStartWork=(log)=>{
    setWorkLogs(prev=>{const next=[...prev,log];persist(null,null,null,next);
      // If admin sign-off (completed=true), check auto delivery
      if(log.completed&&log.orderId)setTimeout(()=>checkAutoDelivery(log.orderId,next),100);
      return next});
    addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:log.completed?"חתימת מנהל":"התחלת עבודה",target:log.serialSn,details:stages.find(s=>s.id===log.stageId)?.name||""});
  };
  const handleEndWork=(logId,duration)=>{
    setWorkLogs(prev=>{
      const next=prev.map(w=>w.id===logId?{...w,completed:true,endTime:nowISO(),durationMin:duration}:w);
      persist(null,null,null,next);
      const log=next.find(w=>w.id===logId);
      if(log?.orderId)setTimeout(()=>checkAutoDelivery(log.orderId,next),100);
      // Push notification to admin
      if(pushEnabled&&currentUser?.role!=="admin"){
        const stage=stages.find(s=>s.id===log?.stageId);
        PushNotify.send("✅ שלב הושלם",`${log?.userName} סיים ${stage?.name||""} — ${log?.serialSn}`,"work-done");
      }
      return next;
    });
    const log=workLogs.find(w=>w.id===logId);
    if(log)addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:"סיום עבודה",target:log.serialSn,details:`${fmtTime(duration)} — ${stages.find(s=>s.id===log.stageId)?.name||""}`});
  };
  const handlePauseWork=(logId)=>{
    setWorkLogs(prev=>{const next=prev.map(w=>w.id===logId?{...w,paused:true,pauseStart:nowISO(),pauseLog:[...(w.pauseLog||[]),{start:nowISO()}]}:w);persist(null,null,null,next);return next});
    addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:"הפסקה",target:"",details:""});
  };
  const handleResumeWork=(logId)=>{
    setWorkLogs(prev=>{const next=prev.map(w=>{if(w.id!==logId)return w;const pauseMin=w.pauseStart?Math.round((Date.now()-new Date(w.pauseStart).getTime())/60000):0;const pl=[...(w.pauseLog||[])];if(pl.length>0&&!pl[pl.length-1].end)pl[pl.length-1].end=nowISO();return{...w,paused:false,pauseStart:null,totalPauseMin:(w.totalPauseMin||0)+pauseMin,pauseLog:pl}});persist(null,null,null,next);return next});
    addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:"חזרה מהפסקה",target:"",details:""});
  };
  // Custom tasks
  const handleAddTask=(task)=>{
    setCustomTasks(prev=>{const next=[...prev,task];persist(null,null,null,null,next);return next});
    if(task.userName)PushNotify.send(`משימה חדשה: ${task.name}`,`${task.userName}, הוקצתה לך משימה${task.price?` (₪${task.price})`:""}`,`task_${task.id}`);
  };
  const handleStartTask=(taskId)=>{setCustomTasks(prev=>{const next=prev.map(t=>t.id===taskId?{...t,active:true,startTime:nowISO()}:t);persist(null,null,null,null,next);return next})};
  const handleEndTask=(taskId)=>{setCustomTasks(prev=>{const next=prev.map(t=>{if(t.id!==taskId)return t;const dur=t.startTime?Math.round((Date.now()-new Date(t.startTime).getTime())/60000)-(t.totalPauseMin||0):0;return{...t,active:false,completed:true,endTime:nowISO(),durationMin:Math.max(0,dur)}});persist(null,null,null,null,next);return next})};
  const handlePauseTask=(taskId)=>{setCustomTasks(prev=>{const next=prev.map(t=>t.id===taskId?{...t,paused:true,pauseStart:nowISO(),pauseLog:[...(t.pauseLog||[]),{start:nowISO()}]}:t);persist(null,null,null,null,next);return next})};
  const handleResumeTask=(taskId)=>{setCustomTasks(prev=>{const next=prev.map(t=>{if(t.id!==taskId)return t;const pMin=t.pauseStart?Math.round((Date.now()-new Date(t.pauseStart).getTime())/60000):0;const pl=[...(t.pauseLog||[])];if(pl.length>0&&!pl[pl.length-1].end)pl[pl.length-1].end=nowISO();return{...t,paused:false,pauseStart:null,totalPauseMin:(t.totalPauseMin||0)+pMin,pauseLog:pl}});persist(null,null,null,null,next);return next})};
  const handleDeleteTask=(taskId)=>{setCustomTasks(prev=>{const next=prev.filter(t=>t.id!==taskId);persist(null,null,null,null,next);return next})};
  const handleMarkPartialTask=(taskId)=>{setCustomTasks(prev=>{const next=prev.map(t=>t.id===taskId?{...t,partial:!t.partial}:t);persist(null,null,null,null,next);return next})};
  const handleMarkDoneTask=(taskId)=>{setCustomTasks(prev=>{const next=prev.map(t=>t.id===taskId?{...t,completed:true,partial:false,endTime:t.endTime||nowISO()}:t);persist(null,null,null,null,next);return next})};
  const handleUpdateTask=(taskId,updates)=>{setCustomTasks(prev=>{const next=prev.map(t=>t.id===taskId?{...t,...updates}:t);persist(null,null,null,null,next);return next})};
  const handleDeleteLog=(ids)=>{setWorkLogs(prev=>{const next=prev.filter(w=>!ids.includes(w.id));persist(null,null,null,next);return next})};
  // Undo a completed work log — revert to uncompleted state (effectively delete it)
  const handleUndoWorkLog=(logId)=>{
    setWorkLogs(prev=>{
      const next=prev.filter(w=>w.id!==logId);
      persist(null,null,null,next);
      // Also delete from Supabase
      SB.del("work_logs",{id:logId}).catch(()=>{});
      return next;
    });
  };
  // Expose stages globally so HistoryPanel can access them for matching
  window.__pml_stages=stages;
  // Listen for delete from WorkersDashboard
  useEffect(()=>{const h=(e)=>{setCustomTasks(prev=>{const next=prev.filter(t=>t.id!==e.detail);persist(null,null,null,null,next);return next})};window.addEventListener("deleteTask",h);return()=>window.removeEventListener("deleteTask",h)},[]);

  const isAdmin=currentUser?.role==="admin";
  const isWorker=currentUser?.role==="worker";

  const TABS=isAdmin?[
    {id:"dashboard",label:"📊 דאשבורד"},
    {id:"orders",label:'📋 פק"ע'},
    {id:"shortages",label:"⚠️ חוסרים"},
    {id:"mywork",label:"🔨 עבודה"},
    {id:"workers",label:"👥 עובדים"},
    {id:"yield",label:"📉 Yield"},
    {id:"stages",label:"🔧 שלבים"},
    {id:"projects",label:"🏗️ פרויקטים"},
    {id:"excel",label:"📂 Excel"},
  ]:isWorker?[
    {id:"mywork",label:"🔨 העבודה שלי"},
    {id:"orders",label:'📋 פק"ע'},
  ]:[
    {id:"dashboard",label:"📊 דאשבורד"},
    {id:"orders",label:'📋 פק"ע'},
    {id:"shortages",label:"⚠️ חוסרים"},
    {id:"mywork",label:"🔨 עבודה"},
    {id:"projects",label:"🏗️ פרויקטים"},
  ];

  // Push notification enable on login for admin
  useEffect(()=>{
    if(isAdmin&&Notification?.permission==="default"){
      PushNotify.request().then(ok=>setPushEnabled(ok));
    }
  },[isAdmin]);

  // Alert count for badge
  const alertCount=useMemo(()=>{let c=0;const dm=dismissedAlerts;filteredOrders.forEach(o=>(o.defects||[]).filter(d=>d.status!=="closed"&&(d.severity==="critical"||d.severity==="high")).forEach(d=>{if(!dm.includes(`def_${o.id}_${d.id}`))c++}));filteredOrders.filter(o=>o.targetDate&&new Date(o.targetDate)<new Date()).forEach(o=>{if(!dm.includes(`late_${o.id}`))c++});filteredWorkLogs.filter(w=>!w.completed).forEach(w=>{if(Math.round((Date.now()-new Date(w.startTime).getTime())/60000)>120&&!dm.includes(`stuck_${w.id}`))c++});return c},[filteredOrders,filteredWorkLogs,dismissedAlerts]);

  const [showDemoPanel,setShowDemoPanel]=useState(false);

  // ── Demo Data ───────────────────────────────────────────────────
  const loadDemoData=async()=>{
    if(!confirm("זה יטען נתוני דמו לשנה שלמה. להמשיך?"))return;
    setSync("saving");
    try{
      const W={w1:"יוסי כהן",w2:"דנה לוי",w3:"משה אברהם",w4:"רונית שרון",w5:"אבי מזרחי"};
      const dProj=[{id:"p1",name:"פרויקט אלפא"},{id:"p2",name:"פרויקט בטא"},{id:"p3",name:"פרויקט גמא"},{id:"p4",name:"פרויקט דלתא"}];
      const dStages=[{id:"s1",name:"קליטה וקלט",stage_order:1,color:"#3b82f6",price:80},{id:"s2",name:"הרכבה",stage_order:2,color:"#8b5cf6",price:150},{id:"s3",name:"בדיקת חשמל",stage_order:3,color:"#06b6d4",price:120},{id:"s4",name:"בדיקת מכנית",stage_order:4,color:"#f59e0b",price:100},{id:"s5",name:"QC סופי",stage_order:5,color:"#10b981",price:90},{id:"s6",name:"אריזה ומשלוח",stage_order:6,color:"#ec4899",price:60}];

      // Generate 12 months of orders
      const orders=[];const wlogs=[];const tasks=[];
      const snMap={};
      const mkSn=(prefix,n)=>Array.from({length:n},(_,i)=>({id:`${prefix}_${i}`,sn:`${prefix}-${String(i+1).padStart(4,"0")}`,createdAt:new Date().toISOString()}));
      const pns=[["ALF-PCB","לוח PCB ראשי",1200,"p1",8],["BET-SNS","חיישן תעשייתי",850,"p2",6],["GAM-MOT","בקר מנוע",2200,"p3",5],["DEL-CTL","בקר PLC",3500,"p4",4],["ALF-PWR","ספק כוח 48V",680,"p1",4],["BET-VLV","שסתום פנאומטי",420,"p2",10],["GAM-CAM","מצלמת בינה",1800,"p3",3],["DEL-SRV","מנוע סרוו",950,"p4",6]];
      const defectTitles=["הלחמה קרה","שריטה על לוח","קצר פנימי","כיול סוטה","רעש חריג","חיבור רופף","ממסר פגום","קורוזיה"];
      const defectTypes=["quality","material","process","equipment","human","other"];
      const defectSev=["low","medium","high","critical"];

      for(let month=0;month<12;month++){
        const baseDate=new Date(2025,month,1);
        pns.forEach(([pn,desc,price,proj,qty],pi)=>{
          if((month+pi)%3!==0&&month!==0)return; // spread orders across months
          const oId=`demo_o_${month}_${pi}`;
          const serials=mkSn(`${pn}_${month}`,qty);
          serials.forEach(s=>snMap[s.id]=s);
          const stageIds=["s1","s2","s3","s4","s5","s6"].slice(0,4+(pi%3));
          const targetDate=new Date(baseDate);targetDate.setMonth(targetDate.getMonth()+1+pi%2);
          const defects=Math.random()>0.4?[{
            id:`def_${oId}`,title:defectTitles[pi%defectTitles.length],
            serialId:serials[0]?.id,type:defectTypes[pi%6],
            severity:defectSev[pi%4],description:"פגם שזוהה בבדיקה",
            responsible:W[`w${(pi%5)+1}`],discoveredDate:new Date(baseDate.getTime()+7*864e5).toISOString().slice(0,10),
            status:month<10?"closed":"open",closedDate:month<10?new Date(baseDate.getTime()+14*864e5).toISOString().slice(0,10):null
          }]:[];
          const shortages=pi%4===0?[{id:`sh_${oId}`,item:`רכיב ${pn}-R${pi}`,sku:`SKU-${1000+pi}`,missing:qty,orderedDate:baseDate.toISOString().slice(0,10),received:month<9,receivedDate:month<9?new Date(baseDate.getTime()+10*864e5).toISOString().slice(0,10):null}]:[];
          orders.push({id:oId,wo_number:`WO-25${String(month+1).padStart(2,"0")}${String(pi+1).padStart(2,"0")}`,pn,description:desc,qty,unit_price:price,project_id:proj,received_date:baseDate.toISOString().slice(0,10),target_date:targetDate.toISOString().slice(0,10),stage_ids:stageIds,block_id:null,serials,shortages,defects,delivered_serials:month<11?serials.map(s=>s.id):[],status:month<11?"complete":"open",updated_at:new Date().toISOString()});

          // Work logs for this order
          const completedMonths=Math.min(month,10);
          if(completedMonths>0){
            serials.slice(0,Math.ceil(serials.length*(completedMonths/10))).forEach((sr,si)=>{
              stageIds.forEach((sid,stIdx)=>{
                const wId=`w${((si+stIdx)%5)+1}`;
                const startT=new Date(baseDate.getTime()+(si*2+stIdx)*864e5+(8*3600000));
                const dur=20+Math.round(Math.random()*60);
                const breaks=Math.random()>0.7?[{start:new Date(startT.getTime()+20*60000).toISOString(),end:new Date(startT.getTime()+35*60000).toISOString()}]:[];
                wlogs.push({id:`wl_${oId}_${sr.id}_${sid}`,user_id:wId,user_name:W[wId],serial_id:sr.id,serial_sn:sr.sn,stage_id:sid,order_id:oId,start_time:startT.toISOString(),end_time:new Date(startT.getTime()+dur*60000).toISOString(),completed:true,duration_min:dur,paused:false,pause_start:null,total_pause_min:breaks.length?15:0,pause_log:breaks,bulk:false,bulk_group_id:null,bulk_count:null});
              });
            });
          }
        });
      }

      // Custom tasks - spread across the year
      const taskNames=["הכנת דוח חודשי","סידור מחסן","ניקוי ציוד","הדרכת עובד חדש","בדיקת מלאי","עדכון נהלים","תיקון כלי עבודה","ביקורת בטיחות"];
      for(let i=0;i<20;i++){
        const wId=`w${(i%5)+1}`;
        const startT=new Date(2025,i%12,1+i*1.5|0,8,0,0);
        const dur=30+i*7;
        tasks.push({id:`demo_t_${i}`,user_id:wId,user_name:W[wId],name:taskNames[i%8],description:"משימה שהוקצתה ע״י המנהל",price:100+(i*50),active:false,completed:i<16,partial:i===16||i===17,start_time:startT.toISOString(),end_time:i<16?new Date(startT.getTime()+dur*60000).toISOString():null,duration_min:i<16?dur:0,paused:false,pause_start:null,total_pause_min:0,pause_log:[],updated_at:new Date().toISOString()});
      }

      // Save to Supabase
      const CHUNK=50;
      const chunked=(arr,n)=>Array.from({length:Math.ceil(arr.length/n)},(_,i)=>arr.slice(i*n,(i+1)*n));
      // Seed demo users with hashed passwords
      const demoUsers=[];
      for(const fu of FALLBACK_USERS){
        const h=await sha256(fu.password);
        demoUsers.push(userToDb({...fu,password_hash:h,password:undefined}));
      }
      await SB.upsert("app_users",demoUsers);
      await SB.upsert("projects",dProj);
      await SB.upsert("stages",dStages);
      for(const chunk of chunked(orders,CHUNK))await SB.upsert("orders",chunk);
      for(const chunk of chunked(wlogs,CHUNK))await SB.upsert("work_logs",chunk);
      for(const chunk of chunked(tasks,CHUNK))await SB.upsert("custom_tasks",chunk);

      // Reload
      const [data,freshUsers]=await Promise.all([dbLoadAll(),dbLoadUsers()]);
      if(data.orders){setOrders(data.orders);LS.set("orders",data.orders)}
      if(data.projects){setProjects(data.projects);LS.set("projects",data.projects)}
      if(data.stages){setStages(data.stages);LS.set("stages",data.stages)}
      if(data.workLogs){setWorkLogs(data.workLogs);LS.set("workLogs",data.workLogs)}
      if(data.customTasks){setCustomTasks(data.customTasks);LS.set("customTasks",data.customTasks)}
      if(freshUsers?.length){LS.set("users",freshUsers)}
      setSync("ok");
      toast("נתוני דמו נטענו בהצלחה!","success");
    }catch(e){console.error(e);setSync("error");toast("שגיאה: "+e.message,"error")}
  };

  const deleteDemoData=async()=>{
    if(!confirm("למחוק את כל נתוני הדמו? (פקעות, לוגים, משימות שמתחילות ב-demo_)"))return;
    setSync("saving");
    try{
      // Delete demo records by ID prefix using Supabase like operator
      await Promise.all([
        fetch(`${SB_URL}/rest/v1/work_logs?id=like.wl_demo_*`,{method:"DELETE",headers:sbHeaders()}),
        fetch(`${SB_URL}/rest/v1/custom_tasks?id=like.demo_t_*`,{method:"DELETE",headers:sbHeaders()}),
      ]);
      await fetch(`${SB_URL}/rest/v1/orders?id=like.demo_o_*`,{method:"DELETE",headers:sbHeaders()});
      const data=await dbLoadAll();
      if(data.orders){setOrders(data.orders);LS.set("orders",data.orders)}
      if(data.workLogs){setWorkLogs(data.workLogs);LS.set("workLogs",data.workLogs)}
      if(data.customTasks){setCustomTasks(data.customTasks);LS.set("customTasks",data.customTasks)}
      setSync("ok");
      toast("נתוני דמו נמחקו!","success");
    }catch(e){console.error(e);setSync("error");toast("שגיאה: "+e.message,"error")}
  };
  useEffect(()=>{const isi=window.matchMedia("(display-mode:standalone)").matches||window.navigator.standalone;if(isi)return;const h=e=>{e.preventDefault();setInstallPrompt(e);setShowInstall(true)};window.addEventListener("beforeinstallprompt",h);window.addEventListener("appinstalled",()=>{setShowInstall(false);setInstallPrompt(null)});return()=>window.removeEventListener("beforeinstallprompt",h)},[]);
  // Service Worker
  useEffect(()=>{if(!("serviceWorker" in navigator))return;navigator.serviceWorker.register("./sw.js?v=18").then(reg=>{swRegRef.current=reg;if(reg.waiting)setShowUpdate(true);reg.addEventListener("updatefound",()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener("statechange",()=>{if(nw.state==="installed"&&navigator.serviceWorker.controller)setShowUpdate(true)})});setInterval(()=>reg.update(),30*60*1000)}).catch(()=>{});navigator.serviceWorker.addEventListener("controllerchange",()=>window.location.reload())},[]);
  // Network status
  useEffect(()=>{const on=()=>{setIsOffline(false);toast("החיבור חזר — מסנכרן נתונים...","success");refreshFromDB(true)};const off=()=>{setIsOffline(true)};window.addEventListener("online",on);window.addEventListener("offline",off);return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off)}},[]);
  // PWA Install
  const handleInstall=async()=>{if(!installPrompt)return;installPrompt.prompt();setInstallPrompt(null);setShowInstall(false)};
  const handleUpdate=()=>{const r=swRegRef.current;if(r?.waiting)r.waiting.postMessage({type:"SKIP_WAITING"});else window.location.reload();setShowUpdate(false)};

  if(!currentUser)return(<AuthCtx.Provider value={{currentUser,canEdit:false,canViewProject:()=>false}}><LoginScreen onLogin={handleLogin} lightMode={lightMode} toggleLight={()=>setLightMode(p=>!p)}/></AuthCtx.Provider>);
  if(loading)return(<SkeletonDashboard/>);

  // Default tab for workers
  if(isWorker&&tab==="dashboard")setTab("mywork");
  const lm=lightMode;

  return(
    <AuthCtx.Provider value={{currentUser,canEdit,canViewProject}}>
      {isOffline&&<OfflineBanner lm={lm}/>}
      {showUpdate&&!isOffline&&<UpdateBanner onUpdate={handleUpdate} onDismiss={()=>setShowUpdate(false)} lm={lm}/>}
      <Navbar tab={tab} setTab={setTab} tabs={TABS} lightMode={lightMode} toggleLight={()=>setLightMode(p=>!p)} sync={sync} onAdmin={()=>setShowAdmin(true)} onLogout={handleLogout} alertCount={alertCount} onAlerts={()=>setShowAlerts(true)} onRefresh={()=>refreshFromDB(true)} onLiveBoard={()=>setShowLiveBoard(true)} onReport={()=>setShowReport(true)} onHistory={()=>setShowHistory(true)} isAdmin={isAdmin} onLoadDemo={loadDemoData} onDeleteDemo={deleteDemoData}/>
      {currentUser?.isDemo&&(
        <div style={{background:lm?"#eff6ff":"#0c1e3a",borderBottom:`1px solid ${lm?"#bfdbfe":"#1e3a5f"}`,padding:"8px 16px",display:"flex",alignItems:"center",justifyContent:"center",gap:10,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:lm?"#1d4ed8":"#93c5fd"}}>🔍 מצב דמו — הנתונים לא נשמרים</span>
          <button onClick={()=>{handleLogout();}} style={{background:"var(--c-accent)",color:"#fff",border:"none",borderRadius:6,padding:"4px 14px",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>הירשם עכשיו</button>
        </div>
      )}
      <main className="main-content" style={{maxWidth:1440,margin:"0 auto",padding:"16px 14px",paddingBottom:showInstall?"100px":"calc(16px + env(safe-area-inset-bottom,0px))"}}>
        {tab==="dashboard"&&<Dashboard orders={filteredOrders} projects={filteredProjects} stages={stages} users={getUsers()} workLogs={filteredWorkLogs}/>}
        {tab==="orders"&&<Orders orders={filteredOrders} projects={filteredProjects} stages={stages} stageBlocks={stageBlocks} updO={updO} workLogs={filteredWorkLogs} onWorkLog={handleStartWork}/>}
        {tab==="shortages"&&<Shortages orders={filteredOrders} updO={updO} projects={filteredProjects}/>}
        {tab==="mywork"&&<MyWork orders={filteredOrders} stages={stages} workLogs={filteredWorkLogs} onStartWork={handleStartWork} onEndWork={handleEndWork} onPauseWork={handlePauseWork} onResumeWork={handleResumeWork} customTasks={customTasks} onAddTask={handleAddTask} onStartTask={handleStartTask} onEndTask={handleEndTask} onPauseTask={handlePauseTask} onResumeTask={handleResumeTask} onDeleteTask={handleDeleteTask} onMarkPartialTask={handleMarkPartialTask} onMarkDoneTask={handleMarkDoneTask}/>}
        {tab==="workers"&&isAdmin&&<WorkersDashboard users={getUsers()} workLogs={filteredWorkLogs} orders={filteredOrders} stages={stages} customTasks={customTasks} onAddTask={handleAddTask} onDeleteLog={handleDeleteLog} onDeleteTask={handleDeleteTask} onMarkPartialTask={handleMarkPartialTask} onMarkDoneTask={handleMarkDoneTask}/>}
        {tab==="yield"&&<YieldDashboard orders={filteredOrders} projects={filteredProjects} stages={stages} workLogs={filteredWorkLogs}/>}
        {tab==="stages"&&isAdmin&&<StagesManagement stages={stages} setStages={setStages} stageBlocks={stageBlocks} setStageBlocks={setStageBlocks} persist={persist}/>}
        {tab==="projects"&&<Projects projects={filteredProjects} orders={filteredOrders} updP={updP} stages={stages} workLogs={filteredWorkLogs}/>}
        {tab==="excel"&&isAdmin&&<ExcelTab orders={filteredOrders} projects={filteredProjects} stages={stages} workLogs={filteredWorkLogs} users={getUsers()} updO={updO}/>}
      </main>
      {showInstall&&<InstallBanner onInstall={handleInstall} onDismiss={()=>setShowInstall(false)} lm={lm}/>}
      {showAdmin&&isAdmin&&<AdminPanel projects={projects} stages={stages} onClose={()=>setShowAdmin(false)} lightMode={lightMode} updO={updO}/>}
      {showAlerts&&<AlertsPanel orders={filteredOrders} stages={stages} workLogs={filteredWorkLogs} users={getUsers()} onClose={()=>setShowAlerts(false)} dismissedAlerts={dismissedAlerts} onDismissAll={ids=>setDismissedAlerts(prev=>[...new Set([...prev,...ids])])}/>}
      {showLiveBoard&&isAdmin&&(canUseFeature("live_board")?<LiveFactoryBoard orders={filteredOrders} workLogs={filteredWorkLogs} stages={stages} customTasks={customTasks} users={getUsers()} onClose={()=>setShowLiveBoard(false)} lightMode={lightMode}/>:<Modal onClose={()=>setShowLiveBoard(false)}><UpgradePrompt feature="לוח חי"/></Modal>)}
      {showReport&&isAdmin&&(canUseFeature("pdf_reports")?<MonthlyReportModal orders={filteredOrders} workLogs={filteredWorkLogs} stages={stages} projects={filteredProjects} users={getUsers()} onClose={()=>setShowReport(false)}/>:<Modal onClose={()=>setShowReport(false)}><UpgradePrompt feature="דוחות PDF"/></Modal>)}
      {showHistory&&isAdmin&&<HistoryPanel orders={filteredOrders} updO={updO} onClose={()=>setShowHistory(false)} workLogs={filteredWorkLogs} onDeleteLog={handleDeleteLog} onUndoWorkLog={handleUndoWorkLog} customTasks={customTasks} onDeleteTask={handleDeleteTask}/>}
    </AuthCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ToastProvider><App/></ToastProvider>);
</script>
</body>
</html>

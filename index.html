      toast(`זוהה קובץ Priority · ${data.scan.wos.length} פק"ע · ${data.scan.ops.length} פעולות`,"success");
      return;
    }
    setPri(null);setRes(data);
    toast(`נקראו ${data.stats.orders} פק"ע · ${data.stats.serials} סידוריים`,"success");
  })})};
  const clearAll=()=>{setRes(null);setPri(null)};

  // Replacing the order list has to remove the old rows from the server too,
  // otherwise the next sync pulls the replaced orders straight back in.
  const commitOrders=list=>{
    LS.set("importSnapshot",JSON.parse(JSON.stringify(orders)));
    let gone=[];
    if(mode==="replace"){
      const keep=new Set(list.map(o=>o.id));
      gone=orders.filter(o=>!keep.has(o.id)).map(o=>o.id);
      if(gone.length)SB.delIds("orders",gone).catch(e=>console.warn("order cleanup skipped",e));
    }
    updO(prev=>mode==="replace"?list:[...prev,...list]);
    return gone;
  };
  // "הוסף לקיימים" for a Priority file: the plan decides per פק"ע whether it is
  // new, changed or already up to date, and only the first two are written.
  const commitMerge=plan=>{
    LS.set("importSnapshot",JSON.parse(JSON.stringify(orders)));
    const byId=new Map(plan.updated.map(o=>[o.id,o]));
    updO(prev=>[...prev.map(o=>byId.get(o.id)||o),...plan.added]);
  };

  // One journal entry for the whole import, so ↩️ puts the company back exactly
  // as it was: the פק"ע that were replaced, the progress that was deleted along
  // with them, and the stages/projects the file introduced.
  const recordImport=({action,target,details,list,gone,newLogs,newStages,newProjects,droppedLogs})=>{
    const goneSet=new Set(gone||[]);
    const changes=[
      {coll:"orders",before:orders,
        // An update-in-place run lists the same פק"ע in both halves — it is the
        // row that changed, not a new one — so the ids are deduped.
        after:[...new Set((mode==="replace"?list:[...orders,...list]).map(o=>o.id))]},
    ];
    const lostLogs=[...(droppedLogs||[]),...(workLogs||[]).filter(w=>goneSet.has(w.orderId))];
    if(lostLogs.length||(newLogs||[]).length)
      changes.push({coll:"workLogs",before:lostLogs,after:(newLogs||[]).map(l=>l.id)});
    if((newStages||[]).length)
      changes.push({coll:"stages",before:stages,after:[...stages,...newStages].map(x=>x.id)});
    if((newProjects||[]).length)
      changes.push({coll:"projects",before:projects,after:[...projects,...newProjects].map(x=>x.id)});
    UNDO.record({user:currentUser,action,target,details,changes});
  };

  const applyPri=()=>{
    const r=priRes;if(!r||!r.orders.length)return;
    // Remember how each operation was mapped — including the stages this import
    // creates — so the next monthly file lands on the same route with no work.
    const saved={...(LS.get(PRI_MAP_LS)||{})};
    pri.scan.ops.forEach(o=>{
      const c=priMap[o.key];
      if(c===PRI_SKIP)saved[o.key]=PRI_SKIP;
      else if(r.opStage[o.key])saved[o.key]=r.opStage[o.key];
    });
    LS.set(PRI_MAP_LS,saved);
    if(r.newStages.length&&updS)updS(prev=>[...prev,...r.newStages]);
    if(r.newProjects.length&&updP)updP(prev=>[...prev,...r.newProjects]);
    if(mode==="merge"){
      // Update-in-place run: nothing is deleted, the פק"ע that did not move are
      // not even rewritten, and only the last import's own progress records are
      // replaced where the file says the numbers changed.
      const plan=mergePlan||priMergePlan(r,orders,workLogs);
      const dropSet=new Set(plan.dropLogIds);
      commitMerge(plan);
      if(importWorkLogs&&(plan.logs.length||plan.dropLogIds.length))importWorkLogs(plan.logs,null,plan.dropLogIds);
      if(r.stds.length&&importPnStds)importPnStds(r.stds);
      recordImport({action:"ייבוא Priority (עדכון)",target:`${plan.added.length} חדשות · ${plan.updated.length} עודכנו`,
        details:`עדכון על הקיים | ${plan.unchanged} פק"ע ללא שינוי | ${plan.newSerials} סידוריים חדשים | ${plan.progressChanged} פק"ע עם התקדמות שהשתנתה | ${plan.cancelled||0} בוטלו | ${r.stats.newStages} שלבים חדשים | ${r.stats.newProjects} פרויקטים | ${r.stats.stds} זמני תקן`,
        list:[...plan.added,...plan.updated],gone:[],newLogs:plan.logs,newStages:r.newStages,newProjects:r.newProjects,
        droppedLogs:(workLogs||[]).filter(w=>dropSet.has(w.id))});
      setPri(null);
      toast(`עודכן מול הקיים · ${plan.added.length} פק"ע חדשות · ${plan.updated.length} עודכנו · ${plan.unchanged} ללא שינוי`,"success",7000);
      return;
    }
    const gone=commitOrders(r.orders.map(({_pri,...o})=>o));
    // The progress rides along with the orders it belongs to — and in "replace"
    // mode the logs of the orders that just went away go with them, or the next
    // sync pulls back progress for units that no longer exist.
    if(importWorkLogs&&(r.logs.length||gone.length))importWorkLogs(r.logs,gone);
    if(r.stds.length&&importPnStds)importPnStds(r.stds);
    recordImport({action:"ייבוא Priority",target:`${r.orders.length} פקעות`,
      details:`${mode==="replace"?"החלפה":"הוספה"} | ${r.stats.newStages} שלבים חדשים | ${r.stats.newProjects} פרויקטים | ${r.stats.stds} זמני תקן | ${r.stats.serials} סידוריים (${r.stats.serialWos} מהקובץ, ${r.stats.serialFilled} הושלמו) | ${r.stats.logs} רישומי התקדמות ב-${r.stats.progWos} פק"ע`,
      list:r.orders,gone,newLogs:r.logs,newStages:r.newStages,newProjects:r.newProjects});
    setPri(null);toast(`יובאו ${r.orders.length} פק"ע מ-Priority · ${r.stats.logs.toLocaleString()} רישומי התקדמות`,"success");
  };

  // What the old append-mode left behind: the same מספר פק"ע on more than one row.
  const dups=useMemo(()=>{
    const m=new Map();
    orders.forEach(o=>{const k=woKey(o.woNumber);if(!k)return;m.set(k,(m.get(k)||0)+1)});
    let wos=0,extra=0;
    m.forEach(n=>{if(n>1){wos++;extra+=n-1}});
    return{wos,extra};
  },[orders]);
  const exportCtx={orders,projects,stages,stageBlocks,workLogs,users,customTasks,dailyPlans,departments,pnStandards};
  const errCount=(cur?.issues||[]).filter(x=>x.level!=="info").length;
  const stName=id=>stages.find(s=>s.id===id)?.name||priRes?.newStages.find(s=>s.id===id)?.name||"";
  const mapRows=(pri?.scan.ops||[]).filter(o=>!mapQ.trim()||o.name.includes(mapQ.trim())||o.codes.some(c=>c.toLowerCase().includes(mapQ.trim().toLowerCase())));
  const priQty=(priRes?.orders||[]).reduce((s,o)=>s+(Number(o.qty)||0),0);

  return(
    <div className="fade-in">
      <h2 style={{margin:"0 0 4px"}}>📂 ייבוא / ייצוא Excel</h2>
      <div style={{fontSize:12.5,color:"var(--c-muted)",marginBottom:14}}>ייצוא כל נתוני המערכת לקובץ אחד, או מילוי תבנית מוכנה והזרמת נתונים חדשים פנימה</div>

      <Card style={{marginBottom:14}}>
        <div style={{fontWeight:700,marginBottom:6}}>📤 ייצוא דוח מלא</div>

        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:12,fontSize:11.5,color:"var(--c-dim)"}}>
          <span>📋 {orders.length} פק"ע</span><span>🏷️ {orders.reduce((s,o)=>s+(o.serials||[]).length,0)} סידוריים</span>
          <span>⏱️ {workLogs.filter(w=>w.completed).length} פעולות</span><span>👥 {users.length} עובדים</span>
        </div>
        <Btn color="var(--c-accent)" onClick={()=>loadXLSX().then(()=>{doExport(exportCtx);toast("הדוח יורד...","success")}).catch(()=>toast(XLSX_LOAD_ERR,"error"))}>📥 הורד Excel מלא</Btn>
      </Card>

      <Card style={{marginBottom:14,border:"1px solid #10b98144"}}>
        <div style={{fontWeight:700,marginBottom:6}}>📄 תבנית ריקה למילוי</div>
        <div style={{fontSize:13,color:"var(--c-muted)",marginBottom:10}}>
          קובץ עם ראשי עמודות מוכנים ומותאמים בדיוק לשאיבת נתונים לתוך האפליקציה — כולל גיליון הוראות, דוגמה למילוי ורשימות הערכים החוקיים (הפרויקטים והשלבים שמוגדרים אצלכם).
          פשוט מורידים, ממלאים ומעלים חזרה. גיליון ״התקדמות״ הוא מה שמונע מהפק"ע להיכנס ב-0% — מלאו בו כמה יחידות כבר עברו כל שלב.
        </div>
        <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
          {["פקודות עבודה","סידוריים","תקלות","חוסרים","התקדמות"].map(n=>(
            <span key={n} style={{fontSize:11.5,background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:14,padding:"3px 11px",color:"var(--c-muted)"}}>{n}</span>
          ))}
        </div>
        <Btn color="#10b981" onClick={()=>loadXLSX().then(()=>{doTemplate({projects,stages,stageBlocks});toast("התבנית יורדת...","success")}).catch(()=>toast(XLSX_LOAD_ERR,"error"))}>📄 הורד תבנית למילוי</Btn>
      </Card>

      {canImport?(
      <Card>
        <div style={{fontWeight:700,marginBottom:10}}>📥 ייבוא נתונים מ-Excel</div>
        <div style={{display:"flex",gap:10,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
          <SegBtn options={[["replace","החלף הכל"],["merge","עדכן על הקיים"]]} value={mode} onChange={setMode}/>
          <span style={{fontSize:11.5,color:mode==="replace"?"#f59e0b":"var(--c-dim)"}}>
            {mode==="replace"
              ?'⚠️ כל הפק"ע הקיימות יימחקו ויוחלפו בקובץ'
              :'פק"ע שכבר קיימת מזוהה לפי מספר הפק"ע ומתעדכנת במקום — בלי כפילויות. רק מה שהשתנה נכתב.'}
          </span>
        </div>
        {dups.wos>0&&mergeDuplicates&&(
          <div style={{background:"#f59e0b12",border:"1px solid #f59e0b55",borderRadius:10,padding:"10px 13px",marginBottom:12}}>
            <div style={{fontWeight:700,fontSize:12.5,color:"#f59e0b",marginBottom:3}}>⚠️ יש כפילויות מייבוא קודם — {dups.wos.toLocaleString()} מספרי פק"ע מופיעים יותר מפעם אחת ({dups.extra.toLocaleString()} שורות עודפות)</div>
            <div style={{fontSize:11.5,color:"var(--c-muted)",lineHeight:1.7,marginBottom:8}}>
              נוצרו לפני שהייבוא ידע לעדכן במקום. האיחוד משאיר שורה אחת לכל פק"ע — זו שנושאת הכי הרבה דיווחי עבודה — ומעביר אליה את הסידוריים, התקלות, החוסרים והדיווחים של השורות האחרות; סידוריים זהים (אותו S/N) מתאחדים ליחידה אחת. הפעולה נרשמת ביומן וניתנת לאחזור.
            </div>
            <Btn small color="#f59e0b" onClick={()=>{
              if(!confirm(`לאחד ${dups.extra} שורות כפולות ב-${dups.wos} פק"ע?\nהדיווחים והסידוריים עוברים לשורה שנשארת. אפשר לאחזר מיומן הפעילות.`))return;
              mergeDuplicates();
            }}>🧬 אחד את הכפילויות</Btn>
          </div>
        )}
        <div className={`dz${drag?" drag":""}`} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}} onClick={()=>{const inp=document.createElement("input");inp.type="file";inp.accept=".xlsx,.xls";inp.onchange=ev=>handleFile(ev.target.files[0]);inp.click()}}>
          <div style={{fontSize:36,marginBottom:8}}>📁</div>
          <div style={{fontWeight:600,marginBottom:4}}>גרור קובץ Excel לכאן או לחץ לבחירה</div>
          <div style={{fontSize:12,color:"var(--c-dim)"}}>תבנית האפליקציה (פקודות עבודה · סידוריים · תקלות · חוסרים · התקדמות) או דוח פק"ע מ-Priority — הפורמט מזוהה אוטומטית</div>
        </div>

        {/* ── Priority ───────────────────────────────────────────────────── */}
        {pri&&priRes&&(<div style={{marginTop:14}}>
          <div style={{background:"#3b82f611",border:"1px solid #3b82f655",borderRadius:10,padding:"10px 13px",marginBottom:12}}>
            <div style={{fontWeight:700,color:"#60a5fa",marginBottom:4}}>🔗 זוהה דוח פק"ע מ-Priority</div>
            <div style={{fontSize:12,color:"var(--c-muted)",lineHeight:1.6}}>
              {pri.scan.rows} שורות פעולה קופלו ל-{pri.scan.wos.length} פקודות עבודה.
              כל פק"ע מקבלת רק את השלבים שלה, לפי הסדר של עמודת ״שלב בפק"ע״ (10, 20, 30 …) — יש פק"ע עם שלב אחד ויש עם עשרים.
              זמני התקן שבקובץ נשמרים כזמן תקן למק"ט{pri.scan.serials.rows>0?`, ו-${pri.scan.serials.rows.toLocaleString()} הסידוריים מהגיליון השני נכנסים לפק"ע שלהם`:""}.
            </div>
          </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12,fontSize:12}}>
            {[[`${priRes.stats.orders} פק"ע לייבוא`,"#10b981"],[`${priQty.toLocaleString()} יחידות`,"#3b82f6"],
              [`${priRes.stats.mapped}/${pri.scan.ops.length} פעולות משויכות`,"#a78bfa"],
              [`${priRes.stats.newStages} שלבים חדשים`,priRes.stats.newStages?"#f59e0b":"#8b95a8"],
              [`${priRes.stats.newProjects} פרויקטים חדשים`,priRes.stats.newProjects?"#f59e0b":"#8b95a8"],
              [`${priRes.stats.stds} מק"טים עם זמן תקן`,"#10b981"],
              [`${priRes.stats.serials.toLocaleString()} סידוריים ב-${priRes.stats.serialWos+priRes.stats.serialFilled} פק"ע`,priRes.stats.serials?"#3b82f6":"#8b95a8"],
              [`${priRes.stats.logs.toLocaleString()} רישומי התקדמות ב-${priRes.stats.progWos} פק"ע`,priRes.stats.logs?"#06b6d4":"#8b95a8"]].map(([t,c])=>(
              <span key={t} style={{background:c+"1a",color:c,border:`1px solid ${c}44`,borderRadius:14,padding:"3px 11px",fontWeight:600}}>{t}</span>
            ))}
          </div>

          {/* Which divisions the file covers. The branch number comes over with every
              פק"ע and is what the סניף filter on the orders screen runs on. */}
          <div style={{background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:10,padding:"9px 13px",marginBottom:12}}>
            <div style={{fontWeight:700,fontSize:12.5,marginBottom:6}}>סניפים (חטיבות) בקובץ</div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
              {Object.entries(priRes.stats.byBranch||{}).sort((a,b)=>b[1]-a[1]).map(([c,n])=>{
                const col=c==="—"?"#8b95a8":branchColor(c);
                return<span key={c} style={{background:col+"1a",color:col,border:`1px solid ${col}44`,borderRadius:14,padding:"3px 11px",fontWeight:600,fontSize:12}}>{c==="—"?"ללא סניף":branchLabel(c)} · {n}</span>;
              })}
            </div>
            <div style={{fontSize:11.5,color:"var(--c-dim)",marginTop:6}}>מספר הסניף נשמר על כל פק"ע וניתן לסנן לפיו במסך פקודות העבודה. שיוך מספרי סניף למחלקות נעשה בניהול המערכת ← מחלקות.</div>
          </div>

          {/* What the file says about status, before it is imported — this is the
              answer to "where did all the closed ones go" without having to look,
              and the legend that says what every Priority status actually means. */}
          <div style={{background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:10,padding:"9px 13px",marginBottom:12}}>
            <div style={{fontWeight:700,fontSize:12.5,marginBottom:6}}>סטטוס הפק"ע שייכנסו</div>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:8}}>
              {ST_ORDER.map(k=>{const n=priRes.stats.byStatus[k]||0;const c=SC[k];return(
                <span key={k} style={{background:c+"1a",color:n?c:"var(--c-dim)",border:`1px solid ${c}44`,borderRadius:14,padding:"3px 11px",fontWeight:600,fontSize:12}}>{SL[k]} · {n}</span>
              )})}
              {priRes.stats.closedSkipped>0&&(
                <span style={{background:"#f59e0b1a",color:"#f59e0b",border:"1px solid #f59e0b44",borderRadius:14,padding:"3px 11px",fontWeight:600,fontSize:12}}>
                  ⚠️ {priRes.stats.closedSkipped} סגורות מדולגות
                </span>

            <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
              {PHASE_ORDER.map(k=>{const ph=ST_PHASE[k];const n=(priRes.stats.byPhase||{})[k]||0;return(
                <span key={k} title={ph.hint} style={{background:ph.color+"1a",color:n?ph.color:"var(--c-dim)",border:`1px solid ${ph.color}44`,borderRadius:14,padding:"3px 11px",fontWeight:600,fontSize:12}}>{ph.icon} {ph.label} · {n}</span>
              )})}
            </div>
            <button onClick={()=>setShowLegend(p=>!p)} style={{background:"none",border:"none",color:"#60a5fa",fontSize:12,fontWeight:700,fontFamily:"inherit",padding:"8px 0 0",cursor:"pointer"}}>
              📖 מה כל סטטוס אומר — {(priRes.stats.byRaw||[]).length} סטטוסים בקובץ {showLegend?"▲":"▼"}
            </button>
            {showLegend&&(
              <div style={{marginTop:8,overflowX:"auto"}}>
                <table style={{fontSize:12}}><thead><tr>
                  <th style={{minWidth:130}}>סטטוס פק"ע ב-Priority</th><th style={{width:60}}>כמה</th>
                  <th style={{width:110}}>נכנס כ־</th><th style={{width:150}}>שלב בתהליך</th><th>מה זה אומר</th>
                </tr></thead><tbody>
                  {(priRes.stats.byRaw||[]).map(r2=>{
                    const info=priStatus(r2.raw==="(ריק)"?"":r2.raw);
                    const ph=ST_PHASE[r2.phase]||ST_PHASE.line;
                    return(<tr key={r2.raw}>
                      <td style={{fontWeight:600,whiteSpace:"nowrap"}}>{r2.raw}
                        {info.guessed
                          ?<span title="הסטטוס אינו ברשימת הסטטוסים המוכרת — שויך לפי הניסוח" style={{color:"#f59e0b",marginRight:4}}>❓</span>

                      <td style={{fontWeight:700}}>{r2.n}</td>

                      <td style={{color:ph.color,fontWeight:600,whiteSpace:"nowrap"}}>{ph.icon} {ph.label}</td>
                      <td style={{color:"var(--c-muted)",lineHeight:1.6}}>{info.desc}</td>
                    </tr>);
                  })}
                </tbody></table>
                <div style={{fontSize:11.5,color:"var(--c-dim)",marginTop:6,lineHeight:1.7}}>
                  ״שלב בתהליך״ הוא ההפרדה שארבעת הסטטוסים לא יודעים לעשות: <b style={{color:"#f59e0b"}}>פתוחה</b> ו<b style={{color:"#f59e0b"}}>שוחררה</b> שתיהן ״פתוחה״ ובשתיהן תהליך הייצור לא התחיל — לעומת <b>הודפסה</b> או <b>הועבר לייצור</b> שכבר בתוכו. אפשר לסנן לפי זה במסך פקודות העבודה ובדשבורד.
                  {" "}הסטטוס המקורי נשמר על כל פק"ע, ובפק"ע <b style={{color:"#ef4444"}}>תקועה</b> הוא מוצג בכרטיס כסיבת התקיעה.
                  {" "}<b style={{color:"var(--c-text)"}}>מבוטלת</b> מוגדרת כ״לא להציג״ — היא מדולגת בייבוא, ופק"ע שכבר במערכת ובוטלה יוצאת מהרשימות ומהדשבורד.
                  {" "}<span style={{color:"#8b95a8"}}>◦</span> = מוכר לאפליקציה אך אינו ברשימת הסטטוסים הרשמית · <span style={{color:"#f59e0b"}}>❓</span> = אינו מוכר, שויך לפי הניסוח.
                </div>
              </div>
            )}
          </div>

          <div style={{background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:10,padding:"8px 13px",marginBottom:12}}>
            <div style={{fontWeight:700,fontSize:12.5,marginBottom:2}}>מה נכנס לאפליקציה</div>
            <ChkOpt checked={priOpts.skipCancelled} onChange={v=>setOpt("skipCancelled",v)} label='דלג על פק"ע מבוטלות'
              hint={priOpts.skipCancelled
                ?`״מבוטלת״ מוגדרת כ״לא להציג״ — ${priRes.stats.cancelledSkipped} פק"ע בקובץ לא ייובאו כלל`
                :`כבוי — ${priRes.stats.cancelledInFile} הפק"ע המבוטלות נכנסות, אבל נשארות מוסתרות ברשימות ובדשבורד עד שבוחרים במפורש להציג אותן`}/>
            <ChkOpt checked={priOpts.onlyOpen} onChange={v=>setOpt("onlyOpen",v)} color="#f59e0b" label='דלג על פק"ע שהסתיימו'
              hint={priOpts.onlyOpen
                ?`פק"ע בסטטוס דווח אחרון / נסגרה / פקע COC לא ייובאו כלל — ${priRes.stats.closedSkipped} פק"ע יישארו בחוץ`
                :'כבוי — כל הפק"ע שבקובץ נכנסות, ושהסתיימו נכנסות בסטטוס ״הושלמה״'}/>
            <ChkOpt checked={priOpts.importProgress} onChange={v=>setOpt("importProgress",v)} label="ייבא התקדמות בייצור"
              hint='עמודות ״כמות מדווחת״ / ״יתרה לבצוע״ — כל יחידה שדווחה בפעולה נרשמת כשלב שהושלם, כך שסרגלי ההתקדמות באפליקציה מראים את המצב האמיתי ולא 0%'/>
            <ChkOpt checked={priOpts.makeStages} onChange={v=>setOpt("makeStages",v)} label="צור שלבים חסרים"
              hint="פעולה שאין לה שלב מקביל תיפתח כשלב חדש בסוף רשימת השלבים"/>
            <ChkOpt checked={priOpts.makeProjects} onChange={v=>setOpt("makeProjects",v)} label="צור פרויקטים חסרים"
              hint="קוד הפרויקט מ-Priority נפתח כפרויקט באפליקציה"/>
            <ChkOpt checked={priOpts.importStd} onChange={v=>setOpt("importStd",v)} label='ייבא זמני תקן למק"טים'
              hint="עמודת ז.תקן ליח' בדק' — דקות ליחידה לכל שלב"/>
            <div style={{fontSize:12.5,padding:"5px 0",color:"var(--c-muted)"}}>
              <span style={{color:"#10b981",fontWeight:700}}>✓ סידוריים מהקובץ</span> — {priRes.stats.serialWos} פק"ע קיבלו את {priRes.stats.serials.toLocaleString()} הסידוריים שלהן מגיליון ״סידוריים״
            </div>
            <ChkOpt checked={priOpts.fillSerials} onChange={v=>setOpt("fillSerials",v)} color="#f59e0b" label='השלם סידוריים לפק"ע שאינן בגיליון'
              hint={`${Math.max(priRes.stats.orders-priRes.stats.serialWos,0)} פק"ע עדיין בלי סידוריים. לא חובה: פק"ע ללא סידוריים נכנסת למעקב לפי כמות — ההתקדמות שבקובץ נרשמת כחתימה לפי כמות (${priRes.stats.progQtyWos} פק"ע), ואפשר להמשיך לחתום עליה באפליקציה. סמנו רק אם רוצים לנהל אותן יחידה-יחידה; הסידוריים שייווצרו זמניים ואינם מגיעים מ-Priority`}/>
            {priOpts.fillSerials&&(
              <div style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--c-muted)",padding:"2px 0 6px 0",marginRight:24}}>
                <span>עד</span>
                <input type="number" min="0" value={priOpts.serialMax} onChange={e=>setOpt("serialMax",Number(e.target.value)||0)} style={{width:80}}/>
                <span>סידוריים לפק"ע (0 = ללא הגבלה) · {priRes.stats.serialFilled} פק"ע יושלמו</span>
              </div>
            )}
          </div>

          {/* operation → stage mapping */}
          <div style={{background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:10,padding:"9px 13px",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <button onClick={()=>setShowMap(p=>!p)} style={{background:"none",border:"none",color:"var(--c-text)",fontSize:12.5,fontWeight:700,fontFamily:"inherit",padding:0}}>
                🔀 שיוך פעולות לשלבים ({priRes.stats.mapped}/{pri.scan.ops.length}) {showMap?"▲":"▼"}
              </button>
              <span style={{fontSize:11.5,color:"var(--c-dim)"}}>השיוך נשמר לייבוא הבא</span>
              {showMap&&(<>
                <Btn small onClick={()=>setPriMap(priAutoMap(pri.scan.ops,stages,null))}>שיוך אוטומטי מחדש</Btn>
                <Btn small onClick={()=>setPriMap(Object.fromEntries(pri.scan.ops.map(o=>[o.key,PRI_SKIP])))}>בטל הכל</Btn>
              </>)}
            </div>
            {showMap&&(<div style={{marginTop:9}}>
              <input value={mapQ} onChange={e=>setMapQ(e.target.value)} placeholder="חיפוש פעולה או קוד..." style={{width:"100%",maxWidth:280,marginBottom:8}}/>
              <div style={{maxHeight:330,overflowY:"auto",overflowX:"auto"}}>
                <table><thead><tr><th>תאור פעולה</th><th>קוד</th><th>מרכז</th><th>שורות</th><th>שלב באפליקציה</th></tr></thead><tbody>
                  {mapRows.map(o=>(<tr key={o.key}>
                    <td style={{fontWeight:600}}>{o.name||<span style={{color:"var(--c-dim)"}}>(ללא שם)</span>}</td>
                    <td style={{fontSize:11,color:"var(--c-dim)"}}>{o.codes.slice(0,2).join(", ")}{o.codes.length>2?"…":""}</td>
                    <td style={{fontSize:11,color:"var(--c-dim)"}}>{o.centers.slice(0,2).join(", ")}{o.centers.length>2?"…":""}</td>
                    <td>{o.count}</td>
                    <td>
                      <select value={priMap[o.key]||PRI_NEW} onChange={e=>setPriMap(p=>({...p,[o.key]:e.target.value}))} style={{minWidth:180}}>
                        <option value={PRI_NEW}>➕ שלב חדש בשם זה</option>
                        <option value={PRI_SKIP}>✕ אל תייבא פעולה זו</option>
                        {stages.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </td>
                  </tr>))}
                </tbody></table>
                {!mapRows.length&&<div style={{fontSize:12,color:"var(--c-dim)",padding:"8px 2px"}}>לא נמצאה פעולה מתאימה</div>}
              </div>
            </div>)}
          </div>
        </div>)}

        {/* ── shared preview ─────────────────────────────────────────────── */}
        {cur&&(<div style={{marginTop:14}}>
          {!priRes&&(
            <>
              <div style={{fontWeight:700,color:"#10b981",marginBottom:8}}>
                ✅ {cur.stats.orders} פק"ע | {cur.stats.serials} סידוריים | {cur.stats.defects} תקלות | {cur.stats.shortages} חוסרים | {cur.stats.logs||0} רישומי התקדמות
              </div>
              <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:10}}>
                {ST_ORDER.map(k=>{const n=(cur.stats.byStatus||{})[k]||0;const c=SC[k];return(
                  <span key={k} style={{background:c+"1a",color:n?c:"var(--c-dim)",border:`1px solid ${c}44`,borderRadius:14,padding:"3px 11px",fontWeight:600,fontSize:12}}>{SL[k]} · {n}</span>
                )})}
              </div>
            </>
          )}
          {/* Update-in-place: what this run would actually change, before it runs.
              The report repeats every open פק"ע every month, so the honest number
              is not "how many rows are in the file" but "how many of them moved". */}
          {mergePlan&&(
            <div style={{marginBottom:12,background:"var(--c-deep)",border:"1px solid #10b98144",borderRadius:10,padding:"10px 13px"}}>
              <div style={{fontWeight:700,fontSize:12.5,marginBottom:7,color:"#34d399"}}>🔁 עדכון על הקיים — מה ישתנה</div>
              <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:7}}>
                {[[`${mergePlan.added.length} פק"ע חדשות`,mergePlan.added.length?"#10b981":"#8b95a8"],
                  [`${mergePlan.updated.length} יתעדכנו`,mergePlan.updated.length?"#3b82f6":"#8b95a8"],
                  [`${mergePlan.unchanged} ללא שינוי — לא ייכתבו`,"#8b95a8"],
                  [`${mergePlan.newSerials} סידוריים חדשים`,mergePlan.newSerials?"#a78bfa":"#8b95a8"],
                  [`${mergePlan.progressChanged} עם התקדמות שהשתנתה`,mergePlan.progressChanged?"#06b6d4":"#8b95a8"],
                  ...(mergePlan.cancelled?[[`${mergePlan.cancelled} בוטלו — יוסתרו`,"#8b95a8"]]:[])].map(([t,c])=>(
                  <span key={t} style={{background:c+"1a",color:c,border:`1px solid ${c}44`,borderRadius:14,padding:"3px 11px",fontWeight:600,fontSize:12}}>{t}</span>
                ))}
              </div>
              <div style={{fontSize:11.5,color:"var(--c-dim)",lineHeight:1.7}}>
                הזיהוי הוא לפי <b style={{color:"var(--c-text)"}}>מספר הפק"ע</b>. מה שמגיע מה-ERP מתעדכן — סטטוס, כמות, מחיר, פרויקט, סניף, תאריכים ומסלול הפעולות.
                מה שנוצר באפליקציה נשמר כפי שהוא — סידוריים שכבר עבדו עליהם, תקלות, חוסרים ואספקות, וכל דיווח עבודה של עובד.
                מדיווחי הייבוא הקודם נמחקים רק אלה של פק"ע שההתקדמות שלהן בקובץ השתנתה.
                פק"ע שסומנה ב-ERP כ<b style={{color:"var(--c-text)"}}>מבוטלת</b> לא נמחקת — היא מסומנת ככזו ויוצאת מהרשימות ומהדשבורד, כדי שהשעות שדווחו עליה לא ייעלמו.
              </div>
              {mergePlan.changes.length>0&&(<>
                <button onClick={()=>setShowDiff(p=>!p)} style={{background:"none",border:"none",color:"#60a5fa",fontSize:12,fontWeight:700,fontFamily:"inherit",padding:"7px 0 0",cursor:"pointer"}}>
                  📋 פירוט השינויים ({mergePlan.changes.length}) {showDiff?"▲":"▼"}
                </button>
                {showDiff&&(
                  <div style={{marginTop:7,maxHeight:260,overflowY:"auto",overflowX:"auto"}}>
                    <table style={{fontSize:12}}><thead><tr><th style={{width:110}}>פק"ע</th><th style={{minWidth:170}}>סטטוס: מ־ ← ל־</th><th>מה משתנה</th></tr></thead><tbody>
                      {mergePlan.changes.map(c=>(
                        <tr key={c.wo}>
                          <td style={{fontWeight:600}}>{c.wo}</td>
                          <td style={{color:"var(--c-muted)"}}>{c.from===c.to?"—":<>{c.from||"—"} ← <b style={{color:"var(--c-text)"}}>{c.to||"—"}</b></>}</td>
                          <td style={{color:"var(--c-muted)"}}>{c.fields.join(" · ")||"—"}</td>
                        </tr>
                      ))}
                    </tbody></table>
                  </div>
                )}
              </>)}
            </div>
          )}
          {cur.issues.length>0&&(
            <div style={{marginBottom:10,background:"var(--c-deep)",border:`1px solid ${errCount?"#f59e0b55":"var(--c-border)"}`,borderRadius:9,padding:"9px 12px"}}>
              <button onClick={()=>setShowIssues(p=>!p)} style={{background:"none",border:"none",color:errCount?"#f59e0b":"var(--c-muted)",fontSize:12.5,fontWeight:700,fontFamily:"inherit",padding:0}}>
                {errCount?"⚠️":"ℹ️"} {cur.issues.length} הערות בקובץ {showIssues?"▲":"▼"}
              </button>
              {showIssues&&(<ul style={{margin:"8px 14px 0 0",padding:0,fontSize:12,color:"var(--c-muted)",lineHeight:1.7,maxHeight:190,overflowY:"auto"}}>
                {cur.issues.map((x,i)=><li key={i} style={{color:x.level==="warn"?"#f59e0b":"var(--c-dim)"}}>{x.msg}</li>)}
              </ul>)}
            </div>
          )}
          <div style={{overflowX:"auto",marginBottom:10}}><table><thead><tr>
            <th>פק"ע</th><th>P/N</th><th>תיאור</th><th>פרויקט</th><th>כמות</th><th>שלבים</th>
            {priRes?<><th>מסלול</th><th>סידוריים</th><th>סטטוס</th><th>שחרור</th><th>יעד</th></>:<><th>סידוריים</th><th>תקלות</th><th>חוסרים</th></>}
          </tr></thead><tbody>
            {cur.orders.slice(0,12).map(o=>(<tr key={o.id}>
              <td style={{fontWeight:600}}>{o.woNumber}</td><td>{o.pn||"—"}</td><td>{o.description||"—"}</td>
              <td>{projects.find(p=>p.id===o.projectId)?.name||priRes?.newProjects.find(p=>p.id===o.projectId)?.name||<span style={{color:"#f59e0b"}}>—</span>}</td>
              <td>{o.qty||"—"}</td>
              <td title={(o.stageIds||[]).map(stName).join(" ← ")}>{(o.stageIds||[]).length}</td>
              {priRes?(<>
                <td style={{fontSize:11,color:"var(--c-muted)",maxWidth:280}}>{(o.stageIds||[]).map(stName).join(" ← ")||"—"}</td>
                <td>{(o.serials||[]).length||"—"}</td>
                <td><Badge status={o.status}/></td>
                <td style={{whiteSpace:"nowrap"}}>{o.receivedDate?fmt(o.receivedDate):"—"}</td>
                <td style={{whiteSpace:"nowrap"}}>{o.targetDate?fmt(o.targetDate):"—"}</td>
              </>):(<>
                <td>{(o.serials||[]).length}</td><td>{(o.defects||[]).length}</td><td>{(o.shortages||[]).length}</td>
              </>)}
            </tr>))}
          </tbody></table>
          {cur.orders.length>12&&<div style={{fontSize:11.5,color:"var(--c-dim)",padding:"6px 2px"}}>מוצגות 12 מתוך {cur.orders.length} פקודות</div>}
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <Btn color="#10b981" disabled={!cur.orders.length||(!!mergePlan&&!mergePlan.added.length&&!mergePlan.updated.length)} onClick={()=>{
              if(priRes){applyPri();return}
              if(mode==="merge"){
                // The template goes through the same update-in-place path as a
                // Priority file: a פק"ע that is already here is updated, not
                // added a second time.
                const plan=mergePlan||priMergePlan(res,orders,workLogs);
                const dropSet=new Set(plan.dropLogIds);
                commitMerge(plan);
                if(importWorkLogs&&(plan.logs.length||plan.dropLogIds.length))importWorkLogs(plan.logs,null,plan.dropLogIds);
                recordImport({action:"ייבוא Excel (עדכון)",target:`${plan.added.length} חדשות · ${plan.updated.length} עודכנו`,
                  details:`עדכון על הקיים | ${plan.unchanged} פק"ע ללא שינוי | ${plan.newSerials} סידוריים חדשים | ${plan.progressChanged} פק"ע עם התקדמות שהשתנתה`,
                  list:[...plan.added,...plan.updated],gone:[],newLogs:plan.logs,
                  droppedLogs:(workLogs||[]).filter(w=>dropSet.has(w.id))});
                setRes(null);
                toast(`עודכן מול הקיים · ${plan.added.length} פק"ע חדשות · ${plan.updated.length} עודכנו · ${plan.unchanged} ללא שינוי`,"success",7000);
                return;
              }
              const gone=commitOrders(res.orders);
              if(importWorkLogs&&((res.logs||[]).length||gone.length))importWorkLogs(res.logs||[],gone);
              recordImport({action:"ייבוא Excel",target:`${res.orders.length} פקעות`,
                details:`${mode==="replace"?"החלפה":"הוספה"} | ${res.stats.serials} סידוריים | ${res.stats.defects} תקלות | ${res.stats.shortages} חוסרים | ${res.stats.logs} רישומי התקדמות`,
                list:res.orders,gone,newLogs:res.logs||[]});
              setRes(null);toast(`הנתונים יובאו בהצלחה${res.stats.logs?` · ${res.stats.logs} רישומי התקדמות`:""}`,"success")}}>{mergePlan?`✅ עדכן — ${mergePlan.added.length} חדשות · ${mergePlan.updated.length} עדכונים`:`✅ אשר ייבוא (${cur.orders.length})`}</Btn>
            <Btn onClick={clearAll}>ביטול</Btn>
            {mergePlan&&!mergePlan.added.length&&!mergePlan.updated.length&&
              <span style={{fontSize:11.5,color:"#10b981"}}>✔️ הכול כבר מעודכן — אין מה לכתוב מהקובץ הזה</span>}
            {priRes&&cur.orders.length>500&&<span style={{fontSize:11.5,color:"var(--c-dim)"}}>ייבוא גדול — השמירה לענן עשויה לקחת מספר שניות</span>}
          </div>
        </div>)}
      </Card>
      ):(
        <Card><div style={{fontSize:13,color:"var(--c-muted)"}}>🔒 ייבוא נתונים לקובץ המערכת מתבצע על ידי מנהל המערכת. את התבנית שמילאת אפשר להעביר אליו לטעינה.</div></Card>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ ALERTS PANEL ════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function AlertsPanel({orders,stages,workLogs,users,onClose,dismissedAlerts,onDismissAll}){
  const alerts=useMemo(()=>{
    const a=[];
    orders.forEach(o=>(o.defects||[]).filter(d=>d.status!=="closed"&&(d.severity==="critical"||d.severity==="high")).forEach(d=>{
      a.push({id:`def_${o.id}_${d.id}`,sev:d.severity==="critical"?0:1,icon:d.severity==="critical"?"🔴":"🟠",text:`תקלה ${d.severity==="critical"?"קריטית":"גבוהה"}: ${d.title}`,sub:`פק"ע ${o.woNumber}${d.discoveredDate?` | ${fmt(d.discoveredDate)}`:""}`,color:d.severity==="critical"?"#dc2626":"#f97316"})}));
    // Late is measured against תאריך סיום ייצור (ת. סיום יצור from Priority). A
    // פק"ע that already left the line is not late, however old its date is.
    orders.filter(o=>o.targetDate&&new Date(o.targetDate)<new Date()&&!["done","cancelled"].includes(orderPhase(o))).forEach(o=>{const d=daysBetween(o.targetDate,todays());if(d>0)a.push({id:`late_${o.id}`,sev:1,icon:"🚨",text:`פק"ע ${o.woNumber} באיחור ${d} ימים`,sub:`תאריך סיום ייצור: ${fmt(o.targetDate)}`,color:"#ef4444"})});
    const sMap=new Map((stages||[]).map(s=>[s.id,s]));
    workLogs.filter(w=>!w.completed).forEach(w=>{const m=Math.round((Date.now()-new Date(w.startTime).getTime())/60000);if(m>120)a.push({id:`stuck_${w.id}`,sev:2,icon:"⏳",text:`${w.userName} תקוע ${fmtTime(m)} על ${logUnitLabel(w)}`,sub:sMap.get(w.stageId)?.name||"",color:"#f59e0b"})});
    orders.forEach(o=>{const sn=(o.serials||[]).length,df=(o.defects||[]).filter(d=>d.status!=="closed").length;if(sn>0&&df/sn>.2)a.push({id:`yield_${o.id}`,sev:2,icon:"📉",text:`Yield נמוך ב-${o.woNumber}: ${df}/${sn} תקלות`,sub:`${Math.round(df/sn*100)}% שיעור תקלות`,color:"#f97316"})});
    // The newest completed log per פק"ע, in one pass over the logs. Asked per order
    // this was a filter of the whole log table *and a sort of the result* for every
    // one of them — the most expensive thing on this screen by a wide margin.
    const lastDone=new Map();
    workLogs.forEach(w=>{
      if(!w.completed||!w.orderId)return;
      const cur=lastDone.get(w.orderId);
      if(!cur||String(w.endTime||"")>String(cur.endTime||""))lastDone.set(w.orderId,w);
    });
    orders.forEach(o=>{if(!(o.serials||[]).length)return;const last=lastDone.get(o.id);if(last){const d=daysBetween(last.endTime?.slice(0,10),todays());if(d>7)a.push({id:`idle_${o.id}`,sev:3,icon:"💤",text:`אין התקדמות ב-${o.woNumber} כבר ${d} ימים`,sub:`אחרון: ${fmt(last.endTime?.slice(0,10))}`,color:"#8b95a8"})}});
    return a.sort((x,y)=>x.sev-y.sev);
  },[orders,stages,workLogs]);
  const visible=alerts.filter(a=>!(dismissedAlerts||[]).includes(a.id));
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"#000c",zIndex:200,display:"flex",justifyContent:"flex-start"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--c-card)",width:"min(420px,90vw)",height:"100%",overflowY:"auto",borderLeft:"1px solid var(--c-border)",padding:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:18}}>🔔 התראות ({visible.length})</div>
          <div style={{display:"flex",gap:8}}>
            {visible.length>0&&<button onClick={()=>onDismissAll(alerts.map(a=>a.id))} style={{background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:8,padding:"5px 12px",fontSize:12,color:"var(--c-muted)",fontFamily:"inherit"}}>נקה הכל</button>}
            <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,color:"var(--c-muted)"}}>✕</button>
          </div>
        </div>
        {visible.length===0?<EmptyState icon="✅" title="הכל תקין!" subtitle="אין התראות פעילות"/>:(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {visible.map((a,i)=>(<div key={a.id} style={{background:"var(--c-deep)",borderRadius:10,padding:"12px 14px",borderRight:`4px solid ${a.color}`}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{fontSize:16}}>{a.icon}</span><span style={{fontWeight:600,fontSize:13,color:a.color,flex:1}}>{a.text}</span></div>
              {a.sub&&<div style={{fontSize:11,color:"var(--c-dim)",paddingRight:24}}>{a.sub}</div>}
            </div>))}
          </div>
        )}
      </div>
    </div>
  );
}

// ═══ NAVBAR ═════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// ── ניקוי לפיילוט ─────────────────────────────────────────────────────────────
// A first run of the app seeds a full demo organisation — two departments, four
// team leads, twelve workers — so the screens have something to show before any
// real data exists. The moment a real pilot starts, every one of those people is
// noise: they sit in the הספק עובדים table, in the org chart, in the reports, and
// in every average the dashboard computes.
//
// Deleting them one by one is fourteen confirmations and leaves their work logs,
// tasks and plans behind, still counted. This does the whole thing in one pass,
// shows exactly what will go before it goes, and records it in the journal so a
// mistake is one ↩️ away.
//
// Two things are never on the list: the admin account, and whoever is signed in —
// an app with no users at all re-seeds the demo team on the next load, which is
// the opposite of what this is for.
function PilotResetModal({users,workLogs,customTasks,dailyPlans,departments,onClose,onRun,lightMode}){
  const {currentUser}=useAuth();
  const protectedIds=new Set([currentUser?.id,...users.filter(u=>u.role==="admin").map(u=>u.id)].filter(Boolean));
  const candidates=users.filter(u=>!protectedIds.has(u.id));
  const [picked,setPicked]=useState(()=>new Set(candidates.map(u=>u.id)));
  const [wipeWork,setWipeWork]=useState(true);
  const [wipeAllLogs,setWipeAllLogs]=useState(false);
  const [dropDepts,setDropDepts]=useState(false);
  const [typed,setTyped]=useState("");
  const [busy,setBusy]=useState(false);
  const lm=lightMode;
  const card=lm?"#ffffff":"#131829",border=lm?"#dde1e8":"#1e2a42",text=lm?"#1a1f2e":"#e2e8f0",muted=lm?"#5a6478":"#8b95a8";
  const toggle=id=>setPicked(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});

  const theirLogs=(workLogs||[]).filter(w=>picked.has(w.userId));
  const theirTasks=(customTasks||[]).filter(t=>picked.has(t.userId));
  const theirPlans=(dailyPlans||[]).filter(p=>picked.has(p.userId));
  const allLogs=(workLogs||[]).length;
  // A department nobody is left in is a demo department; one that still has people
  // is somebody's real structure and is left alone whatever the checkbox says.
  const emptyDepts=(departments||[]).filter(d=>!users.some(u=>u.departmentId===d.id&&!picked.has(u.id)));
  const ok=picked.size>0&&typed.trim()==="מחק";

  const run=async()=>{
    if(!ok||busy)return;
    setBusy(true);
    try{
      await onRun({
        userIds:[...picked],
        logIds:wipeAllLogs?(workLogs||[]).map(w=>w.id):(wipeWork?theirLogs.map(w=>w.id):[]),
        taskIds:wipeWork?theirTasks.map(t=>t.id):[],
        planIds:wipeWork?theirPlans.map(p=>p.id):[],
        deptIds:dropDepts?emptyDepts.map(d=>d.id):[]
      });
      onClose();
    }finally{setBusy(false)}
  };

  const row={display:"flex",alignItems:"center",gap:8,fontSize:12.5,color:text,padding:"3px 0",cursor:"pointer"};
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"#000000cc",zIndex:260,display:"flex",alignItems:"center",justifyContent:"center",padding:10,overflowY:"auto"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:card,borderRadius:16,maxWidth:640,width:"100%",maxHeight:"92vh",overflowY:"auto",border:`1px solid ${border}`,color:text}}>
        <div style={{padding:"16px 22px",borderBottom:`1px solid ${border}`,display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:card,zIndex:1,borderRadius:"16px 16px 0 0"}}>
          <div style={{fontWeight:700,fontSize:17}}>🧹 ניקוי לפיילוט — מחיקת עובדים ונתוניהם</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,color:muted}}>✕</button>
        </div>
        <div style={{padding:"14px 22px 22px"}}>
          <div style={{background:"#f59e0b12",border:"1px solid #f59e0b44",borderRadius:9,padding:"10px 12px",fontSize:12.5,lineHeight:1.8,marginBottom:14}}>
            מוחק את העובדים שנבחרו ואת כל מה שתלוי בהם, כדי שהפיילוט יתחיל עם נתונים נקיים.
            <b> חשבון המנהל והמשתמש המחובר לא נמחקים</b> — מערכת בלי אף משתמש טוענת מחדש את צוות הדמו בכניסה הבאה.
            <div style={{color:muted,marginTop:4}}>הפעולה נרשמת ביומן הפעילות וניתנת לאחזור מלא דרך 🛡️ ניהול מערכת ← יומן ואחזור.</div>
          </div>

          {candidates.length===0?(
            <div style={{fontSize:13,color:muted,padding:"10px 0"}}>אין עובדים למחיקה — במערכת יש רק חשבונות מנהל.</div>
          ):(<>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:8}}>
              <div style={{fontWeight:700,fontSize:13}}>עובדים למחיקה ({picked.size}/{candidates.length})</div>
              <div style={{display:"flex",gap:6}}>
                <Btn small onClick={()=>setPicked(new Set(candidates.map(u=>u.id)))}>סמן הכל</Btn>
                <Btn small onClick={()=>setPicked(new Set())}>נקה בחירה</Btn>
              </div>
            </div>
            <div style={{border:`1px solid ${border}`,borderRadius:9,padding:"8px 10px",maxHeight:230,overflowY:"auto",marginBottom:12,background:lm?"#f7f8fa":"#0a0e1a"}}>
              {candidates.map(u=>{
                const nLogs=(workLogs||[]).filter(w=>w.userId===u.id).length;
                return(
                  <label key={u.id} style={row}>
                    <input type="checkbox" style={{width:"auto"}} checked={picked.has(u.id)} onChange={()=>toggle(u.id)}/>
                    <b>{u.name||u.username}</b>
                    <span style={{color:ROLES[u.role]?.color||muted,fontSize:11.5}}>{ROLES[u.role]?.label||u.role}</span>
                    <span style={{color:muted,fontSize:11.5}}>@{u.username}</span>
                    {nLogs>0&&<span style={{color:"#f59e0b",fontSize:11.5}}>· {nLogs.toLocaleString()} דיווחים</span>}
                  </label>
                );
              })}
            </div>
            <div style={{border:`1px solid ${border}`,borderRadius:9,padding:"9px 11px",marginBottom:12}}>
              <label style={row}><input type="checkbox" style={{width:"auto"}} checked={wipeWork} onChange={e=>setWipeWork(e.target.checked)}/>
                מחק גם את מה ששייך להם — {theirLogs.length.toLocaleString()} דיווחי עבודה · {theirTasks.length.toLocaleString()} משימות · {theirPlans.length.toLocaleString()} תוכניות עבודה</label>
              <div style={{fontSize:11.5,color:muted,marginRight:24,marginBottom:6}}>בלי זה הדיווחים יישארו במערכת בלי עובד שיוצג לצידם, וימשיכו להיספר בשעות ובעלויות.</div>
              <label style={row}><input type="checkbox" style={{width:"auto"}} checked={wipeAllLogs} onChange={e=>setWipeAllLogs(e.target.checked)}/>
                <span style={{color:"#ef4444",fontWeight:700}}>מחק את כל {allLogs.toLocaleString()} דיווחי העבודה במערכת</span></label>
              <div style={{fontSize:11.5,color:muted,marginRight:24,marginBottom:6}}>כולל ההתקדמות שיובאה מ-Priority. סרגלי ההתקדמות של כל הפק"ע יתאפסו — סמנו רק אם רוצים להתחיל את המדידה מאפס. הפק"ע עצמן, הסידוריים והסטטוסים נשארים.</div>
              {emptyDepts.length>0&&(<>
                <label style={row}><input type="checkbox" style={{width:"auto"}} checked={dropDepts} onChange={e=>setDropDepts(e.target.checked)}/>
                  מחק {emptyDepts.length} מחלקות שיישארו ריקות — {emptyDepts.map(d=>d.name).join(" · ")}</label>
              </>)}
            </div>
            <div style={{fontSize:12.5,marginBottom:6}}>להשלמה, הקלידו <b style={{color:"#ef4444"}}>מחק</b>:</div>
            <input value={typed} onChange={e=>setTyped(e.target.value)} placeholder="מחק" style={{marginBottom:12,maxWidth:200}}/>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <Btn color="#ef4444" disabled={!ok||busy} onClick={run}>{busy?"מוחק...":`🗑️ מחק ${picked.size} עובדים`}</Btn>
              <Btn onClick={onClose}>ביטול</Btn>
            </div>
          </>)}
        </div>
      </div>
    </div>
  );
}

function Navbar({tab,setTab,tabs,lightMode,toggleLight,sync,onAdmin,onLogout,alertCount,onAlerts,onRefresh,onLiveBoard,onReport,onHistory,isAdmin,isManager,onLoadDemo,onDeleteDemo,onPilotReset,onInstall,canInstall}){
  const {currentUser}=useAuth();
  const [menuOpen,setMenuOpen]=useState(false);
  const lm=lightMode;
  const navBg=lm?"#ffffff":"#131829";
  const navBorder=lm?"#dde1e8":"#1e2a42";
  const navMuted=lm?"#5a6478":"#8b95a8";
  const navActive=lm?"#2563eb":"#60a5fa";

  // The tab strip scrolls when it cannot fit next to the logo and the action
  // buttons. Track which side still has tabs off-screen so we can show an arrow
  // there — otherwise the overflowing tabs (Excel is last) just vanish under the
  // buttons with nothing to hint that they exist.
  const stripRef=useRef(null);
  const [ovf,setOvf]=useState({start:false,end:false});
  const syncOvf=useCallback(()=>{
    const el=stripRef.current;if(!el)return;
    const max=el.scrollWidth-el.clientWidth;
    if(max<=2){setOvf(p=>p.start||p.end?{start:false,end:false}:p);return}
    // RTL scrollLeft counts down from 0 into negatives; abs() gives the distance
    // travelled from the start of the strip either way.
    const pos=Math.abs(el.scrollLeft);
    const next={start:pos>2,end:pos<max-2};
    setOvf(p=>p.start===next.start&&p.end===next.end?p:next);
  },[]);
  useEffect(()=>{
    syncOvf();
    const el=stripRef.current;
    const ro=typeof ResizeObserver!=="undefined"?new ResizeObserver(syncOvf):null;
    if(ro&&el){ro.observe(el);Array.from(el.children).forEach(c=>ro.observe(c))}
    window.addEventListener("resize",syncOvf);
    return()=>{window.removeEventListener("resize",syncOvf);if(ro)ro.disconnect()};
  },[syncOvf,tabs]);
  // Keep the selected tab in view — it can be picked from outside the navbar.
  useEffect(()=>{
    const el=stripRef.current;if(!el)return;
    const btn=el.querySelector(`[data-tab="${tab}"]`);
    if(btn&&btn.scrollIntoView)btn.scrollIntoView({block:"nearest",inline:"nearest"});
  },[tab,tabs]);
  const scrollStrip=dir=>{const el=stripRef.current;if(el)el.scrollBy({left:dir*220,behavior:"smooth"})};
  const arrowStyle=side=>({
    background:`linear-gradient(to ${side==="at-start"?"left":"right"},${navBg} 60%,${navBg}00)`,
    color:navMuted,fontFamily:"inherit",
  });

  return(
    <div className="nav-wrapper" style={{background:navBg,borderBottom:`1px solid ${navBorder}`,position:"sticky",top:0,zIndex:50,transition:"background .3s"}}>
      <div style={{maxWidth:1440,margin:"0 auto",padding:"0 16px",display:"flex",alignItems:"center",gap:0,height:52}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0,paddingLeft:10}}>
          <Logo size={34}/>
          <div style={{display:"flex",flexDirection:"column",lineHeight:1.05}}>
            <span style={{fontWeight:800,fontSize:14,color:lm?"#1a1f2e":"#e2e8f0",whiteSpace:"nowrap",letterSpacing:"-.02em"}}>OmniView</span>
            <span style={{fontSize:9.5,color:navMuted,fontWeight:600,letterSpacing:".02em",whiteSpace:"nowrap"}}>ניהול רצפת ייצור</span>
          </div>
        </div>
        <div className="desk-nav-wrap">
          <div ref={stripRef} className="desk-nav" onScroll={syncOvf} style={{justifyContent:"flex-start"}}>
            {tabs.map(t=>(<button key={t.id} data-tab={t.id} className="nav-tab" onClick={()=>setTab(t.id)} title={t.badge>0?`${t.badge} שיבוצים פתוחים בתוכנית העבודה שלך`:undefined} style={{height:52,flex:"0 0 auto",background:"none",border:"none",color:tab===t.id?navActive:navMuted,borderBottom:tab===t.id?`3px solid ${navActive}`:"3px solid transparent",fontWeight:tab===t.id?700:400,whiteSpace:"nowrap",fontFamily:"inherit"}}>{t.label}{t.badge>0&&<span style={{background:"#06b6d4",color:"#fff",fontSize:9,fontWeight:800,borderRadius:10,padding:"1px 6px",marginRight:5,verticalAlign:"middle"}}>📅 {t.badge}</span>}</button>))}
          </div>
          {ovf.start&&<button className="nav-scroll-btn at-start" aria-label="גלול ללשוניות הקודמות" onClick={()=>scrollStrip(1)} style={arrowStyle("at-start")}>▶</button>}
          {ovf.end&&<button className="nav-scroll-btn at-end" aria-label="גלול ללשוניות הבאות" onClick={()=>scrollStrip(-1)} style={arrowStyle("at-end")}>◀</button>}
        </div>
        <div className="hide-mobile" style={{display:"flex",gap:4,alignItems:"center",flexShrink:0}}>
          <button onClick={onAlerts} aria-label={`התראות${alertCount>0?` (${alertCount})`:""}`} style={{background:alertCount>0?"#ef444422":"transparent",border:`1px solid ${alertCount>0?"#ef4444":navBorder}`,borderRadius:8,padding:"5px 10px",fontSize:14,color:alertCount>0?"#ef4444":navMuted,fontFamily:"inherit",position:"relative"}}>🔔{alertCount>0&&<span style={{position:"absolute",top:-4,right:-4,background:"#ef4444",color:"#fff",fontSize:9,fontWeight:700,borderRadius:10,padding:"1px 5px",minWidth:16,textAlign:"center"}}>{alertCount}</span>}</button>

const PushNotify={
  async request(){
    if(!("Notification" in window))return false;
    if(Notification.permission==="granted")return true;
    const p=await Notification.requestPermission();
    return p==="granted";
  },
  send(title,body,tag="pml"){
    if(!("serviceWorker" in navigator))return;
    navigator.serviceWorker.ready.then(reg=>{
      reg.active?.postMessage({type:"NOTIFY",title,body,tag});
    });
  }
};

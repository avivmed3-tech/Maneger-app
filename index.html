          <div style={{display:"flex",gap:9,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div style={{display:"flex",flexDirection:"column",gap:3,flex:"1 1 170px"}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>חיפוש פק"ע / מק"ט</label>
              <input value={fText} onChange={e=>{setFText(e.target.value);setBulkSelected([])}} placeholder={'מספר פק"ע, מק"ט או תיאור...'}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>מק"ט</label>
              <select value={fPn} onChange={e=>{setFPn(e.target.value);setBulkSelected([])}} style={{padding:"7px 8px",fontSize:12,minWidth:135}}>
                <option value="all">כל המק"טים</option>
                {queueOpts.pn.map(([v,n])=><option key={v||"__none"} value={v||"none"}>{v||'ללא מק"ט'} · {n}</option>)}
              </select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>שלב</label>
              <select value={fStage} onChange={e=>{setFStage(e.target.value);setBulkSelected([])}} style={{padding:"7px 8px",fontSize:12,minWidth:135}} title="רק השלבים שיש לך הרשאה אליהם">
                <option value="all">כל השלבים שלי</option>
                {queueOpts.st.map(([sid,n])=><option key={sid} value={sid}>{stageMap.get(sid)?.name||sid} · {n}</option>)}
              </select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>סניף (חטיבה)</label>
              <select value={fBranch} onChange={e=>{setFBranch(e.target.value);setBulkSelected([])}} style={{padding:"7px 8px",fontSize:12,minWidth:135}} title='מספר הסניף מגיע מה-ERP ומייצג את החטיבה העסקית'>
                <option value="all">כל הסניפים</option>
                {queueOpts.br.map(([v,n])=><option key={v||"__none"} value={v||"none"}>{v?branchLabel(v):"ללא סניף"} · {n}</option>)}
              </select>
            </div>
            {filterOn&&<Btn small onClick={clearFilters}>✕ נקה סינון</Btn>}
          </div>
          {filterOn&&(
            <div style={{fontSize:11.5,color:"var(--c-dim)",marginTop:8}}>
              {(visibleQueues.length||visibleQtyOrders.length)
                ?<>מציג {visibleUnitCount} יחידות ב-{visibleQueues.length} פק"ע{visibleQtyOrders.length>0?` · ועוד ${visibleQtyOrders.length} פק"ע לדיווח לפי כמות`:""}</>
                :<span style={{color:"#f59e0b"}}>אין עבודה שמתאימה לסינון — נסה לנקות אותו</span>}
            </div>
          )}
        </Card>
      )}

      {/* Bulk mode toggle + "my plan only" filter */}
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
        <Btn color={bulkMode?"#ef4444":"#374151"} small onClick={()=>{setBulkMode(p=>!p);setBulkSelected([])}}>{bulkMode?"✕ בטל מצב קבוצתי":"📦 הפעלת טיימר קבוצתי"}</Btn>
        {myPlans.length>0&&<SegBtn options={[["all","כל היחידות הממתינות"],["plan","📅 תוכנית העבודה שלי"]]} value={onlyPlan?"plan":"all"} onChange={v=>{setOnlyPlan(v==="plan");setBulkSelected([])}}/>}
        {myPlans.length>0&&<span style={{fontSize:11,color:"var(--c-dim)"}}>יחידות המסומנות ב-📅 הוקצו לך בתוכנית העבודה</span>}
      </div>

      {/* Available Work — plan units first, each one tagged.
          Virtualised: a worker whose access spans the whole plant has a queue as
          long as the פק"ע list itself, and rendering every card up front — each
          with up to fifteen unit rows — put tens of thousands of nodes on the page
          before the tab could paint. Only what fits on screen is built, the same
          way the פק"ע list works. */}
      <VirtualList items={visibleQueues} estimate={220} gap={0} renderRow={({order:o,units,planned})=>(
        <Card key={o.id} style={{marginBottom:10,border:planned>0?"1px solid #06b6d455":"1px solid var(--c-border)"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
            <span style={{fontWeight:700,color:"#60a5fa"}}>{o.woNumber}</span>
            {o.pn&&<span style={{fontSize:12,color:"#a78bfa"}}>P/N: {o.pn}</span>}
            <span style={{fontSize:11,color:"var(--c-dim)"}}>({units.length} ממתינות)</span>
            {planned>0&&<PlanTag label={`תוכנית העבודה שלי · ${planned} יח'`}/>}
            {bulkMode&&bulkSelected.length>0&&<Btn color="var(--c-accent)" small onClick={()=>startBulk(o.id)}>▶️ התחל {bulkSelected.length} יחידות</Btn>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {units.slice(0,15).map(s=>{
              const nextStage=s.next;
              const isSel=bulkSelected.includes(s.id);
              return(
                <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",background:isSel?"#3b82f611":(s.planned?"#06b6d40f":"var(--c-deep)"),borderRadius:8,padding:"8px 12px",border:isSel?"1px solid #3b82f6":(s.planned?"1px solid #06b6d455":"1px solid transparent")}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    {bulkMode&&<input type="checkbox" checked={isSel} onChange={e=>{setBulkSelected(p=>e.target.checked?[...p,s.id]:p.filter(x=>x!==s.id))}}/>}
                    <span style={{fontWeight:600,fontSize:13}}>{s.sn}</span>
                    <span style={{fontSize:11,color:nextStage.color}}>← {nextStage.name}</span>
                    {s.planned&&<PlanTag small/>}
                  </div>
                  {!bulkMode&&<Btn color={nextStage.color} small onClick={()=>startWork(s.id,nextStage.id,o.id)} disabled={!!(myActiveLog&&!myActiveLog.paused)}>▶️ התחל</Btn>}
                </div>
              );
            })}
            {units.length>15&&<div style={{fontSize:12,color:"var(--c-dim)",textAlign:"center"}}>ועוד {units.length-15}...</div>}
          </div>
        </Card>
      )}/>
      {visibleQtyOrders.length>0&&(
        <Card style={{marginBottom:12,border:"1px solid #10b98133"}}>
          <div style={{fontWeight:700,fontSize:15,color:"#10b981",marginBottom:5}}>✍️ דיווח לפי כמות ({visibleQtyOrders.length}{filterOn&&visibleQtyOrders.length!==qtyOrders.length?` מתוך ${qtyOrders.length}`:""})</div>
          <div style={{fontSize:11.5,color:"var(--c-dim)",lineHeight:1.7,marginBottom:10}}>
            פק"ע שאינן מנוהלות סיריאלית — אין בהן מספר סידורי לבחור, ולכן בוחרים כמות: לוחצים <b style={{color:"#f59e0b"}}>▶️ התחל עבודה</b> ומקבלים את אותו טיימר של יחידה סיריאלית (הפסקה, סיימתי),
            כך שגם על העבודה הזו יוצאים נתוני זמן בפועל מול זמן תקן. לעבודה שכבר בוצעה אפשר גם לחתום מיד ב-<b style={{color:"#10b981"}}>✍️ חתום</b>, בלי טיימר.
            אפשר לדווח רק על השלבים שבהרשאות שלך, כל דיווח נרשם על שמך, ואפשר לבטל דיווח שלך אם טעית.
          </div>
          <VirtualList items={visibleQtyOrders} estimate={64} gap={7} renderRow={o=>{
            const open=openQty===o.id;
            const cap=Number(o.qty)||0;
            const mineLeft=(o.stageIds||[]).reduce((n,sid)=>myAccessSet.has(sid)
              ?n+Math.max(0,cap-Math.min(cap,qtySigned(myQtyIdx,workLogs,o.id,sid))):n,0);
            // Of those, the units somebody already has a timer running on.
            const mineRunning=(o.stageIds||[]).reduce((n,sid)=>myAccessSet.has(sid)?n+qtyRunning(myQtyRunIdx,workLogs,o.id,sid):n,0);
            const br=branchCode(o.branch);
            return(
              <div key={o.id} style={{background:"var(--c-deep)",borderRadius:10,border:`1px solid ${open?"#10b98155":"var(--c-border)"}`,padding:"9px 12px"}}>
                <div onClick={()=>setOpenQty(open?"":o.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",cursor:"pointer"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,color:"#60a5fa"}}>{o.woNumber}</span>
                    {o.pn&&<span style={{fontSize:12,color:"#a78bfa"}}>P/N: {o.pn}</span>}
                    {br&&<span style={{fontSize:11,color:branchColor(br)}}>🏢 {branchLabel(br)}</span>}
                    <span style={{fontSize:11,color:"var(--c-dim)"}}>כמות: {cap}</span>
                    {mineLeft>0
                      ?<span style={{fontSize:11,background:"#f59e0b1a",color:"#f59e0b",border:"1px solid #f59e0b44",padding:"2px 8px",borderRadius:12}}>נותרו {mineLeft} דיווחים שלך</span>
                      :<span style={{fontSize:11,color:"#10b981"}}>✅ השלבים שלך נחתמו</span>}
                    {mineRunning>0&&<span style={{fontSize:11,color:"#f59e0b"}} title="יחידות שיש עליהן טיימר פתוח כרגע — ייחתמו בסיום העבודה">⏱️ {mineRunning} בעבודה</span>}
                  </div>
                  <span style={{fontSize:12,color:open?"#10b981":"var(--c-dim)",fontWeight:600}}>{open?"▲ סגור":"▼ דווח כמות"}</span>
                </div>
                {open&&<div style={{marginTop:10}}>
                  <QtySignOff order={o} stages={stages} workLogs={workLogs} onSignOff={onStartWork} onDeleteLog={onDeleteLog} compact
                    onStartRun={(st,n)=>startQtyRun(o,st,n)}
                    runBlocked={myActiveLog&&!myActiveLog.paused?"יש לך עבודה פעילה — סיים או עצור אותה לפני שמתחיל חדשה":""}/>
                </div>}
              </div>
            );
          }}/>
        </Card>
      )}
      {!myActiveLog&&!activeTask&&visibleQueues.length===0&&visibleQtyOrders.length===0&&(filterOn
        ?<EmptyState icon="🔍" title="אין עבודה שמתאימה לסינון" subtitle="נקה את הסינון כדי לראות את כל העבודה שממתינה לך" action={clearFilters} actionLabel="✕ נקה סינון"/>
        :onlyPlan
        ?<EmptyState icon="📅" title="אין יחידות פתוחות בתוכנית שלך" subtitle="כל מה שהוקצה לך להיום בוצע — עבור ל'כל היחידות הממתינות' כדי לראות עבודה נוספת"/>
        :<EmptyState icon="🎉" title="אין עבודה ממתינה!" subtitle="כל היחידות הושלמו"/>)}
    </div>
      )}
    </div>
  );
}

function ActiveTimer({startTime,pauseMin=0}){
  const[e2,setE]=useState(0);
  useEffect(()=>{const t=setInterval(()=>{setE(Math.max(0,Math.round((Date.now()-new Date(startTime).getTime())/1000)-pauseMin*60))},1000);return()=>clearInterval(t)},[startTime,pauseMin]);
  const h=Math.floor(e2/3600),m=Math.floor((e2%3600)/60),s=e2%60;
  const stale=h*60+m>=STALE_WORK_MIN;
  return<div style={{fontSize:22,fontWeight:800,color:stale?"#ef4444":"#f59e0b",marginTop:6,fontVariantNumeric:"tabular-nums"}}>{String(h).padStart(2,"0")}:{String(m).padStart(2,"0")}:{String(s).padStart(2,"0")}</div>;
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ WORKERS DASHBOARD ══════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function WorkersDashboard({users,workLogs,orders,stages,customTasks,onAddTask,onDeleteLog,onUpdateTask,onDeleteTask,onMarkPartialTask,onMarkDoneTask,dailyPlans,onAddPlan,onDeletePlan,onTogglePlanDone}){
  const {toast}=useToast();
  const [search,setSearch]=useState("");
  const [period,setPeriod]=useState("all");
  // Memoised so the indexes below (which key off `filtered`) are not rebuilt by
  // every unrelated re-render of this screen.
  const workers=useMemo(()=>users.filter(u=>u.role!=="admin"&&u.active!==false),[users]);
  const filtered=useMemo(()=>workers.filter(w=>!search||w.name.includes(search)),[workers,search]);

  // Period filter for logs
  const filterByPeriod=(dateStr)=>{
    if(period==="all"||!dateStr)return true;
    const d=new Date(dateStr);const now=new Date();
    if(period==="today")return d.toDateString()===now.toDateString();
    if(period==="week"){const week=7*864e5;return(now-d)<week}
    if(period==="month")return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(period==="quarter"){const q=Math.floor(now.getMonth()/3);return Math.floor(d.getMonth()/3)===q&&d.getFullYear()===now.getFullYear()}
    if(period==="year")return d.getFullYear()===now.getFullYear();
    return true;
  };

  // ── Indexes ────────────────────────────────────────────────────────────────
  // Everything below used to be answered by scanning a whole collection from
  // inside a loop: the owning פק"ע by scanning every order (and every serial in
  // it) once per log, "did this worker clear that stage" by scanning every log
  // again inside *that*. On a real database — 56,000 logs, 2,787 פק"ע — the
  // screen simply stopped. Each scan is now a Map/Set built once.
  const sMap=useMemo(()=>new Map((stages||[]).map(s2=>[s2.id,s2])),[stages]);
  const allStageIds=useMemo(()=>(stages||[]).map(s2=>s2.id),[stages]);
  // serialId → the order that serial belongs to.
  const orderBySerial=useMemo(()=>{
    const m=new Map();
    (orders||[]).forEach(o=>(o.serials||[]).forEach(sr=>{if(sr?.id)m.set(sr.id,o)}));
    return m;
  },[orders]);
  // "user|serial|stage" for every completed log — the inner .some() as a hash lookup.
  const doneByUser=useMemo(()=>{
    const s2=new Set();
    (workLogs||[]).forEach(w=>{if(w.completed&&w.userId&&w.serialId&&w.stageId)s2.add(`${w.userId}|${w.serialId}|${w.stageId}`)});
    return s2;
  },[workLogs]);
  // The logs each worker owns, split once instead of filtered per worker.
  const logsByUser=useMemo(()=>{
    const m=new Map();
    (workLogs||[]).forEach(w=>{
      if(!w.userId)return;
      let e=m.get(w.userId);
      if(!e){e={done:[],active:null};m.set(w.userId,e)}
      if(w.completed)e.done.push(w);
      else if(!e.active)e.active=w;
    });
    return m;
  },[workLogs]);
  const tasksByUser=useMemo(()=>{
    const m=new Map();
    (customTasks||[]).forEach(t=>{if(!t.userId)return;const l=m.get(t.userId);if(l)l.push(t);else m.set(t.userId,[t])});
    return m;
  },[customTasks]);

  const workerData=useMemo(()=>filtered.map(u=>{
    const bucket=logsByUser.get(u.id);
    const logs=(bucket?.done||[]).filter(w=>w.durationMin&&filterByPeriod(w.endTime));
    const totalMin=logs.reduce((s2,w)=>s2+w.durationMin,0);
    const rate=Number(u.hourlyRate||0);
    const cost=totalMin*(rate/60);
    // Revenue: sum stage prices per completed log
    const revenue=logs.reduce((s2,w)=>s2+Number(sMap.get(w.stageId)?.price||0),0);
    // Units: serials where worker completed ALL their assigned stages
    const workerStageAccess=new Set(u.stageAccess==="all"?allStageIds:(Array.isArray(u.stageAccess)?u.stageAccess:[]));
    const serialsDone=new Set();
    logs.forEach(w=>{
      const o=orderBySerial.get(w.serialId);
      if(!o)return;
      const myStagesInOrder=(o.stageIds||[]).filter(sid=>workerStageAccess.has(sid));
      const allMyDone=myStagesInOrder.every(sid=>doneByUser.has(`${u.id}|${w.serialId}|${sid}`));
      if(allMyDone)serialsDone.add(w.serialId);
    });
    const units=serialsDone.size;
    const totalBreaks=logs.reduce((s2,w)=>s2+((w.pauseLog||[]).length),0);
    const totalBreakMin=logs.reduce((s2,w)=>s2+(w.totalPauseMin||0),0);
    const active=bucket?.active||undefined;
    const myTasks=tasksByUser.get(u.id)||[];
    const completedTasks=myTasks.filter(t=>t.completed&&filterByPeriod(t.endTime));
    const taskMin=completedTasks.reduce((s2,t)=>s2+(t.durationMin||0),0);
    const taskRev=completedTasks.reduce((s2,t)=>s2+Number(t.price||0),0);
    return{...u,totalMin,units,cost,revenue:revenue+taskRev,profit:(revenue+taskRev)-cost,uph:totalMin>0?(units/(totalMin/60)):0,active,totalBreaks,totalBreakMin,completedTasks:completedTasks.length,taskMin};
  }),[filtered,logsByUser,tasksByUser,sMap,allStageIds,orderBySerial,doneByUser,period]);

  return(
    <div className="fade-in">
      <h2 style={{margin:"0 0 14px"}}>👥 ביצועי עובדים</h2>
      <Card style={{padding:"12px 14px",marginBottom:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{display:"flex",flexDirection:"column",gap:3,flex:"1 1 160px"}}>
          <label style={{fontSize:11,color:"var(--c-dim)"}}>חיפוש עובד</label>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="הקלד שם..."/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:3}}>
          <label style={{fontSize:11,color:"var(--c-dim)"}}>תקופה</label>
          <SegBtn options={[["all","הכל"],["today","היום"],["week","שבוע"],["month","חודש"],["quarter","רבעון"],["year","שנה"]]} value={period} onChange={setPeriod}/>
        </div>
      </Card>

      {/* Daily work plan */}
      <DailyPlanBoard dailyPlans={dailyPlans} workers={workers} orders={orders} stages={stages} workLogs={workLogs} onAddPlan={onAddPlan} onDeletePlan={onDeletePlan} onTogglePlanDone={onTogglePlanDone}/>

      {/* Tasks Board */}
      <AdminTasksBoard workers={workers} customTasks={customTasks||[]} onAddTask={onAddTask} onUpdateTask={onUpdateTask} onDeleteTask={onDeleteTask} filterByPeriod={filterByPeriod}/>

      {/* Worker cards with detailed stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:10,marginBottom:14}}>
        {workerData.map(w=>(
          <Card key={w.id} style={{border:w.active?`2px solid #f59e0b`:"1px solid var(--c-border)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:15}}>{w.name}</div>
              {w.active&&<span style={{fontSize:11,background:"#f59e0b22",color:"#f59e0b",padding:"3px 8px",borderRadius:12,animation:"pulse 1.5s infinite"}}>🔄 עובד</span>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
              <div style={{background:"var(--c-deep)",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>יחידות</div><div style={{fontWeight:700,color:"#60a5fa"}}>{w.units}</div></div>
              <div style={{background:"var(--c-deep)",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>יח'/שעה</div><div style={{fontWeight:700,color:"#06b6d4"}}>{w.uph.toFixed(1)}</div></div>
              <div style={{background:"var(--c-deep)",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>שעות</div><div style={{fontWeight:700}}>{fmtTime(w.totalMin)}</div></div>
              <div style={{background:"var(--c-deep)",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>הפסקות</div><div style={{fontWeight:700,color:"#f97316"}}>{w.totalBreaks} ({fmtTime(w.totalBreakMin)})</div></div>
              <div style={{background:"var(--c-deep)",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>משימות</div><div style={{fontWeight:700,color:"#a78bfa"}}>{w.completedTasks}</div></div>
              <div style={{background:"var(--c-deep)",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>רווח</div><div style={{fontWeight:700,color:w.profit>=0?"#10b981":"#ef4444"}}>{fmtMoney(w.profit)}</div></div>
            </div>
            {w.hourlyRate>0&&<div style={{fontSize:11,color:"var(--c-dim)",marginTop:6}}>תעריף: {fmtMoney(w.hourlyRate)}/שעה | עלות: {fmtMoney(w.cost)} | הכנסה: {fmtMoney(w.revenue)}</div>}
          </Card>
        ))}
      </div>

      {/* Recent activity table — filtered by search */}
      <Card>
        <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>📋 פעילות אחרונה{search?` — ${search}`:""}</div>
        <div style={{overflowX:"auto"}}><table><thead><tr><th>עובד</th><th>S/N</th><th>שלב</th><th>זמן כולל</th><th>ליחידה</th><th>תמחור</th><th>הפסקות</th><th>סיום</th><th></th></tr></thead><tbody>
          {(()=>{
            const logs=workLogs.filter(w=>w.completed&&filterByPeriod(w.endTime)&&(!search||w.userName.includes(search))).sort((a,b)=>(b.endTime||"").localeCompare(a.endTime||""));
            // Group by bulkGroupId
            const seen=new Set();const rows=[];
            logs.forEach(w=>{
              if(w.bulkGroupId){
                if(seen.has(w.bulkGroupId))return;
                seen.add(w.bulkGroupId);
                const group=logs.filter(l=>l.bulkGroupId===w.bulkGroupId);
                const sns=group.map(l=>l.serialSn).join(", ");
                rows.push({...w,_sns:sns,_count:group.length,_grouped:true});
              }else{
                rows.push({...w,_sns:logUnitLabel(w),_count:1,_grouped:false});
              }
            });
            return rows.slice(0,50).map(w=>{
              const stage=stages.find(s=>s.id===w.stageId);
              const stagePrice=Number(stage?.price||0);
              const perUnit=w._count>1?Math.round(w.durationMin/w._count):w.durationMin;
              return(
                <tr key={w.id}>
                  <td style={{fontWeight:600}}>{w.userName}</td>
                  <td style={{color:"#7eb8ff",fontSize:12}}>{w._count>1?<span>{w._count} יחידות<div style={{fontSize:10,color:"var(--c-dim)",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{w._sns}</div></span>:w._sns}</td>
                  <td><span style={{color:stage?.color||"var(--c-muted)"}}>{stage?.name||"—"}</span></td>
                  <td style={{fontWeight:w._count>1?700:400}}>{fmtTime(w.durationMin)}</td>
                  <td style={{color:w._count>1?"#06b6d4":"var(--c-dim)"}}>{w._count>1?fmtTime(perUnit):"—"}</td>
                  <td style={{color:stagePrice?"#a78bfa":"var(--c-dim)"}}>{stagePrice?`₪${stagePrice}${w._count>1?` × ${w._count} = ₪${stagePrice*w._count}`:""}`:"—"}</td>
                  <td style={{color:"#f97316"}}>{(w.pauseLog||[]).length>0?`${(w.pauseLog||[]).length} (${fmtTime(w.totalPauseMin||0)})`:"—"}</td>
                  <td style={{fontSize:11,color:"var(--c-dim)"}}>{w.endTime?new Date(w.endTime).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}</td>
                  <td><IBtn onClick={()=>{if(!confirm("למחוק רשומה?"))return;if(w._grouped&&w.bulkGroupId){onDeleteLog(workLogs.filter(l=>l.bulkGroupId===w.bulkGroupId).map(l=>l.id))}else{onDeleteLog([w.id])}}}>🗑️</IBtn></td>
                </tr>);
            });
          })()}
        </tbody></table></div>
      </Card>

      {/* Completed custom tasks */}
      {(()=>{const dTasks=(customTasks||[]).filter(t=>t.completed&&filterByPeriod(t.endTime)&&(!search||t.userName.includes(search)));return dTasks.length>0&&(
        <Card style={{marginTop:12}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>📌 משימות שבוצעו{search?` — ${search}`:""}</div>
          <div style={{overflowX:"auto"}}><table><thead><tr><th>עובד</th><th>משימה</th><th>זמן נטו</th><th>הפסקות</th><th>תמחור</th><th>סיום</th><th></th></tr></thead><tbody>
            {dTasks.sort((a,b)=>(b.endTime||"").localeCompare(a.endTime||"")).slice(0,30).map(t=>(
              <tr key={t.id}>
                <td style={{fontWeight:600}}>{t.userName}</td>
                <td style={{color:"#a78bfa"}}>{t.name}</td>
                <td>{fmtTime(t.durationMin)}</td>
                <td style={{color:"#f97316"}}>{(t.pauseLog||[]).length>0?`${(t.pauseLog||[]).length} (${fmtTime(t.totalPauseMin||0)})`:"—"}</td>
                <td style={{color:t.price?"#10b981":"var(--c-dim)"}}>{t.price?fmtMoney(t.price):"—"}</td>
                <td style={{fontSize:11,color:"var(--c-dim)"}}>{t.endTime?new Date(t.endTime).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}</td>
                <td><IBtn onClick={()=>{if(confirm("למחוק?"))onAddTask&&window.dispatchEvent(new CustomEvent("deleteTask",{detail:t.id}))}}>🗑️</IBtn></td>
              </tr>
            ))}
          </tbody></table></div>
        </Card>
      )})()}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ DAILY WORK PLANS (תוכנית עבודה יומית) ═══════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// Managers (team leads / dept managers / admin) assign each worker the order+stage
// units to work on for a chosen day. Workers see their plan in "העבודה שלי".
function DailyPlanBoard({dailyPlans,workers,orders,stages,workLogs,onAddPlan,onDeletePlan,onTogglePlanDone}){
  const {toast}=useToast();
  const {currentUser}=useAuth();
  const [date,setDate]=useState(todays());
  const [showForm,setShowForm]=useState(false);
  const [pWorker,setPWorker]=useState("");
  const [pOrder,setPOrder]=useState("");
  const [pStage,setPStage]=useState("");
  const [pQty,setPQty]=useState("");
  const [pSerials,setPSerials]=useState([]); // specific serial IDs assigned for the current line (empty = by quantity / all)
  const [pNote,setPNote]=useState("");
  const [queue,setQueue]=useState([]); // pending assignment lines (פק"ע+שלב) before saving
  const canAssign=Array.isArray(workers)&&workers.length>0&&!!onAddPlan;
  const selOrder=(orders||[]).find(o=>o.id===pOrder);
  const orderStages=orderRoute(selOrder,stages);
  // ── Permissions of the currently-selected worker ──
  const allStageIds=stages.map(s=>s.id);
  const selWorker=workers.find(w=>w.id===pWorker);
  const wAccess=selWorker?(selWorker.stageAccess==="all"?allStageIds:(Array.isArray(selWorker.stageAccess)?selWorker.stageAccess:[])):[];
  const wStageNames=selWorker?(selWorker.stageAccess==="all"?"כל השלבים":(stages.filter(s=>wAccess.includes(s.id)).sort((a,b)=>a.order-b.order).map(s=>s.name).join(", ")||"לא הוגדרו שלבים")):"";
  const hasAccess=(stageId)=>wAccess.includes(stageId);
  const selStage=stages.find(s=>s.id===pStage);
  const lacksAccess=!!(selWorker&&selStage&&!hasAccess(selStage.id));
  const roleMismatch=!!(selWorker&&selStage&&selStage.roleId&&selStage.roleId!==selWorker.role);
  // Serial units of an order still needing a given stage (not yet completed there).
  const pendingSerialsFor=(orderId,stageId)=>{const o=(orders||[]).find(x=>x.id===orderId);if(!o)return [];return (o.serials||[]).filter(sr=>!(workLogs||[]).some(w=>w.serialId===sr.id&&w.stageId===stageId&&w.completed))};
  const pendingFor=(orderId,stageId)=>pendingSerialsFor(orderId,stageId).length;
  // Remaining (not-yet-completed) units for a saved plan — respects specific serial assignments.
  const planRemain=(p)=>{if(Array.isArray(p.serialIds)&&p.serialIds.length){return p.serialIds.filter(id=>!(workLogs||[]).some(w=>w.serialId===id&&w.stageId===p.stageId&&w.completed)).length}return pendingFor(p.orderId,p.stageId)};
  const stageOrder=(stageId)=>{const s=stages.find(x=>x.id===stageId);return s?.order||0};
  const availSerials=(pOrder&&pStage)?pendingSerialsFor(pOrder,pStage):[];
  const toggleSerial=(id)=>setPSerials(arr=>arr.includes(id)?arr.filter(x=>x!==id):[...arr,id]);
  const addToQueue=()=>{
    if(!pOrder||!pStage){toast('בחר פק"ע ושלב להוספה',"warning");return}
    if(queue.some(q=>q.orderId===pOrder&&q.stageId===pStage)){toast("שיבוץ זה כבר ברשימה","warning");return}
    if(lacksAccess&&!confirm(`⚠️ ל${selWorker?.name||"עובד"} אין הרשאה לשלב "${selStage?.name}". להוסיף בכל זאת?`))return;
    setQueue(q=>[...q,{key:uid(),orderId:pOrder,stageId:pStage,targetQty:pSerials.length>0?pSerials.length:(Number(pQty)||0),serialIds:[...pSerials],note:pNote.trim(),lacksAccess}]);
    setPStage("");setPQty("");setPSerials([]);setPNote("");
  };
  const submit=()=>{
    if(!pWorker){toast("יש לבחור עובד","warning");return}
    let items=[...queue];
    // include the currently-typed line if not yet queued
    if(pOrder&&pStage&&!items.some(q=>q.orderId===pOrder&&q.stageId===pStage)){
      if(lacksAccess&&!confirm(`⚠️ ל${selWorker?.name||"עובד"} אין הרשאה לשלב "${selStage?.name}". לשבץ בכל זאת?`))return;
      items.push({key:uid(),orderId:pOrder,stageId:pStage,targetQty:pSerials.length>0?pSerials.length:(Number(pQty)||0),serialIds:[...pSerials],note:pNote.trim(),lacksAccess});
    }
    if(items.length===0){toast('יש לבחור לפחות פק"ע ושלב אחד',"warning");return}
    // Sort by stage sequence (לפי סידורי) so the worker sees the work in order.
    items.sort((a,b)=>stageOrder(a.stageId)-stageOrder(b.stageId));
    const u=workers.find(w=>w.id===pWorker);
    items.forEach(it=>onAddPlan({id:uid(),userId:pWorker,userName:u?.name||"",date,orderId:it.orderId,stageId:it.stageId,targetQty:it.targetQty,serialIds:Array.isArray(it.serialIds)?it.serialIds:[],note:it.note,done:false,createdBy:currentUser.id,createdByName:currentUser.name,createdAt:nowISO()}));
    setQueue([]);setPOrder("");setPStage("");setPQty("");setPSerials([]);setPNote("");setShowForm(false);
    toast(items.length>1?`${items.length} שיבוצים נשמרו`:"התוכנית נשמרה","success");
  };
  const dayPlans=(dailyPlans||[]).filter(p=>p.date===date&&workers.some(w=>w.id===p.userId));
  const byWorker={};
  dayPlans.forEach(p=>{(byWorker[p.userId]=byWorker[p.userId]||[]).push(p)});
  return(
    <Card style={{marginBottom:14,border:"1px solid #06b6d433"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontWeight:700,fontSize:15,color:"#06b6d4"}}>📅 תוכנית עבודה יומית</div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{padding:"6px 8px",fontSize:12}}/>
          {canAssign&&<Btn color="#06b6d4" small onClick={()=>setShowForm(p=>!p)}>{showForm?"✕ סגור":"➕ שיבוץ"}</Btn>}
        </div>
      </div>
      {canAssign&&showForm&&(
        <div style={{background:"var(--c-deep)",borderRadius:10,padding:14,marginBottom:12,border:"1px solid #06b6d444"}}>
          <div style={{fontWeight:700,fontSize:13,color:"#06b6d4",marginBottom:10}}>➕ שיבוץ עבודה ל-{fmt(date)}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>עובד *</label>
              <select value={pWorker} onChange={e=>{setPWorker(e.target.value);setQueue([]);setPSerials([])}}><option value="">— בחר עובד —</option>{workers.map(w=><option key={w.id} value={w.id}>{w.name}{ROLES[w.role]?` · ${ROLES[w.role].label}`:""}</option>)}</select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>פק"ע *</label>
              <select value={pOrder} onChange={e=>{setPOrder(e.target.value);setPStage("");setPSerials([])}}><option value="">— בחר פק"ע —</option>{(orders||[]).map(o=><option key={o.id} value={o.id}>{o.woNumber}{o.pn?` · ${o.pn}`:""}</option>)}</select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>שלב *</label>
              <select value={pStage} onChange={e=>{setPStage(e.target.value);setPSerials([])}} disabled={!selOrder}><option value="">— בחר שלב —</option>{orderStages.map(st=><option key={st.id} value={st.id}>{st.name}{st.roleId&&ROLES[st.roleId]?` (${ROLES[st.roleId].label})`:""}{selWorker&&!hasAccess(st.id)?" ⚠️ אין הרשאה":""}</option>)}</select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>יעד יחידות (0=הכל)</label>
              <input type="number" min="0" value={pSerials.length>0?pSerials.length:pQty} onChange={e=>setPQty(e.target.value)} placeholder="0" disabled={pSerials.length>0} title={pSerials.length>0?"נקבע אוטומטית לפי המספרים הסידוריים שנבחרו":""}/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3,gridColumn:"1 / -1"}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>הערה (לא חובה)</label>
              <input value={pNote} onChange={e=>setPNote(e.target.value)} placeholder="הנחיות נוספות..."/>
            </div>
          </div>
          {/* Selected worker — role + which stages they're allowed to do */}
          {selWorker&&(
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginTop:8,fontSize:11}}>
              <span style={{background:(ROLES[selWorker.role]?.color||"#3b82f6")+"22",color:ROLES[selWorker.role]?.color||"#3b82f6",padding:"2px 8px",borderRadius:10,fontWeight:700}}>{ROLES[selWorker.role]?.icon||""} {ROLES[selWorker.role]?.label||selWorker.role}</span>
              <span style={{color:"var(--c-dim)"}}>מורשה לשלבים: {wStageNames}</span>
            </div>
          )}
          {/* Permission warning to the manager */}
          {lacksAccess&&<div style={{marginTop:8,padding:"8px 10px",borderRadius:8,background:"#ef444415",border:"1px solid #ef444455",color:"#f87171",fontSize:12,fontWeight:600}}>⚠️ ל{selWorker?.name} אין הרשאה לשלב "{selStage?.name}". אפשר לשבץ בכל זאת — אך מומלץ לבחור עובד מורשה או לעדכן את הרשאותיו.</div>}
          {!lacksAccess&&roleMismatch&&<div style={{marginTop:8,padding:"8px 10px",borderRadius:8,background:"#f59e0b15",border:"1px solid #f59e0b55",color:"#f59e0b",fontSize:12}}>ℹ️ השלב מיועד לתפקיד {ROLES[selStage.roleId]?.label||selStage.roleId}, והעובד הוא {ROLES[selWorker.role]?.label||selWorker.role}. יש לו הרשאה לשלב, אך התפקיד שונה.</div>}
          {pOrder&&pStage&&<div style={{fontSize:11,color:"var(--c-dim)",marginTop:8}}>זמינות לשלב זה: {pendingFor(pOrder,pStage)} יחידות ממתינות</div>}
          {/* Optional: assign specific serial numbers instead of a plain quantity */}
          {pOrder&&pStage&&availSerials.length>0&&(
            <div style={{marginTop:8,background:"var(--c-card)",borderRadius:8,padding:"8px 10px",border:"1px solid var(--c-border)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6,marginBottom:6}}>
                <span style={{fontSize:11,color:"var(--c-dim)"}}>🔢 בחר מספרים סידוריים ספציפיים (לא חובה) — אם לא תבחר, ישובצו כל היחידות / לפי היעד{pSerials.length>0?` · נבחרו ${pSerials.length}`:""}</span>
                <span style={{display:"flex",gap:6}}>
                  <button type="button" onClick={()=>setPSerials(availSerials.map(s=>s.id))} style={{background:"transparent",border:"1px solid var(--c-border)",borderRadius:6,padding:"2px 7px",fontSize:11,color:"var(--c-muted)",fontFamily:"inherit",cursor:"pointer"}}>בחר הכל</button>
                  {pSerials.length>0&&<button type="button" onClick={()=>setPSerials([])} style={{background:"transparent",border:"1px solid var(--c-border)",borderRadius:6,padding:"2px 7px",fontSize:11,color:"var(--c-muted)",fontFamily:"inherit",cursor:"pointer"}}>נקה</button>}
                </span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,maxHeight:140,overflowY:"auto"}}>
                {availSerials.map(s=>{const sel=pSerials.includes(s.id);return(
                  <button key={s.id} type="button" onClick={()=>toggleSerial(s.id)} style={{background:sel?(selStage?.color||"#06b6d4")+"33":"var(--c-deep)",border:`1px solid ${sel?(selStage?.color||"#06b6d4"):"var(--c-border)"}`,borderRadius:6,padding:"3px 9px",fontSize:11,color:sel?(selStage?.color||"#06b6d4"):"var(--c-muted)",fontFamily:"inherit",cursor:"pointer",fontWeight:sel?700:400}}>{sel?"✓ ":""}{s.sn}</button>
                );})}
              </div>
            </div>
          )}
          {/* Queue of assignment lines (multiple orders / stages) */}
          {queue.length>0&&(
            <div style={{marginTop:10,background:"var(--c-card)",borderRadius:8,padding:"8px 10px",border:"1px solid var(--c-border)"}}>
              <div style={{fontSize:11,color:"var(--c-dim)",marginBottom:6}}>שיבוצים שיישמרו ({queue.length}) — לפי סדר השלבים:</div>
              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {[...queue].sort((a,b)=>stageOrder(a.stageId)-stageOrder(b.stageId)).map(it=>{const o=(orders||[]).find(x=>x.id===it.orderId);const st=stages.find(s=>s.id===it.stageId);return(
                  <div key={it.key} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",fontSize:12}}>
                    <span style={{fontWeight:700,color:"#60a5fa"}}>{o?.woNumber||'פק"ע'}</span>
                    {st&&<span style={{color:st.color}}>← {st.name}</span>}
                    <span style={{color:"var(--c-dim)"}}>{it.serialIds&&it.serialIds.length>0?`${it.serialIds.length} ס"נ נבחרו`:(it.targetQty>0?`יעד ${it.targetQty}`:"כל היחידות")}</span>
                    {it.serialIds&&it.serialIds.length>0&&(()=>{const o2=(orders||[]).find(x=>x.id===it.orderId);const sns=it.serialIds.map(id=>(o2?.serials||[]).find(s=>s.id===id)?.sn).filter(Boolean);return <span style={{color:"#7eb8ff",fontSize:11}}>🔢 {sns.slice(0,6).join(", ")}{sns.length>6?` +${sns.length-6}`:""}</span>;})()}
                    {it.lacksAccess&&<span style={{color:"#f87171"}}>⚠️ ללא הרשאה</span>}
                    {it.note&&<span style={{color:"var(--c-muted)"}}>📝 {it.note}</span>}
                    <IBtn onClick={()=>setQueue(q=>q.filter(x=>x.key!==it.key))}>🗑️</IBtn>
                  </div>);})}
              </div>
            </div>
          )}
          <div style={{display:"flex",gap:8,marginTop:10,justifyContent:"flex-end",flexWrap:"wrap"}}>
            <Btn small onClick={()=>{setShowForm(false);setQueue([])}}>ביטול</Btn>
            <Btn color="#3b82f6" small onClick={addToQueue} disabled={!pOrder||!pStage}>➕ הוסף עוד</Btn>
            <Btn color="#06b6d4" small onClick={submit}>✅ שבץ{queue.length>0?` (${queue.length+(pOrder&&pStage&&!queue.some(q=>q.orderId===pOrder&&q.stageId===pStage)?1:0)})`:""}</Btn>
          </div>
        </div>
      )}
      {dayPlans.length===0?<EmptyState icon="📅" title="אין שיבוצים ליום זה" subtitle={canAssign?"לחץ על שיבוץ כדי להקצות עבודה לעובד":"המנהל יכול לשבץ לך עבודה יומית"}/>:(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {workers.filter(w=>byWorker[w.id]).map(w=>(
            <div key={w.id} style={{background:"var(--c-deep)",borderRadius:10,padding:"10px 12px",border:"1px solid var(--c-border)"}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:6,display:"flex",alignItems:"center",gap:6}}>
                <span style={{width:24,height:24,borderRadius:"50%",background:(ROLES[w.role]?.color||"#3b82f6")+"22",color:ROLES[w.role]?.color||"#3b82f6",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800}}>{w.name?.charAt(0)}</span>
                {w.name}
                {ROLES[w.role]&&<span style={{fontSize:10,color:ROLES[w.role].color,fontWeight:600}}>{ROLES[w.role].icon} {ROLES[w.role].label}</span>}
                <span style={{fontSize:11,color:"var(--c-dim)"}}>({byWorker[w.id].length} שיבוצים)</span>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {byWorker[w.id].map(p=>{
                  const o=(orders||[]).find(x=>x.id===p.orderId);const st=stages.find(s=>s.id===p.stageId);const remain=planRemain(p);
                  const planSns=(Array.isArray(p.serialIds)&&p.serialIds.length>0)?p.serialIds.map(id=>(o?.serials||[]).find(s=>s.id===id)?.sn).filter(Boolean):[];
                  return(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",background:"var(--c-card)",borderRadius:8,padding:"7px 10px",border:`1px solid ${p.done?"#10b98144":"var(--c-border)"}`,opacity:p.done?.7:1}}>
                      <span style={{fontWeight:700,color:"#60a5fa",fontSize:13}}>{o?.woNumber||"פק\"ע נמחקה"}</span>
                      {st&&<span style={{fontSize:11,color:st.color}}>← {st.name}</span>}
                      <span style={{fontSize:11,color:"var(--c-dim)"}}>{planSns.length>0?`${planSns.length} ס"נ`:(p.targetQty>0?`יעד ${p.targetQty}`:"כל היחידות")} · נותרו {remain}</span>
                      {planSns.length>0&&<span style={{fontSize:11,color:"#7eb8ff"}}>🔢 {planSns.slice(0,6).join(", ")}{planSns.length>6?` +${planSns.length-6}`:""}</span>}
                      {p.note&&<span style={{fontSize:11,color:"var(--c-muted)"}}>📝 {p.note}</span>}
                      <div style={{marginInlineStart:"auto",display:"flex",gap:4,alignItems:"center"}}>
                        <button onClick={()=>onTogglePlanDone&&onTogglePlanDone(p.id)} title="סמן כבוצע" style={{background:p.done?"#10b98133":"transparent",border:"1px solid #10b98144",borderRadius:6,padding:"2px 7px",fontSize:11,color:"#10b981",fontFamily:"inherit",cursor:"pointer"}}>✅</button>
                        {onDeletePlan&&<IBtn onClick={()=>{if(confirm("למחוק שיבוץ?"))onDeletePlan(p.id)}}>🗑️</IBtn>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ TEAM DASHBOARD (ראש צוות / מנהל מחלקה) ══════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function TeamDashboard({users,workLogs,orders,stages,customTasks,departments,onAddTask,onDeleteTask,onMarkPartialTask,onMarkDoneTask,dailyPlans,onAddPlan,onDeletePlan,onTogglePlanDone}){
  const {currentUser}=useAuth();
  const isDeptMgr=currentUser.role==="dept_manager";
  const myDept=(departments||[]).find(d=>d.id===currentUser.departmentId||d.managerId===currentUser.id);
  // Dept managers see their whole department; team leads see their direct reports
  const team=users.filter(u=>u.active!==false&&u.id!==currentUser.id&&(
    u.managerId===currentUser.id||
    (isDeptMgr&&myDept&&u.departmentId===myDept.id)
  ));
  const teamIds=new Set(team.map(u=>u.id));
  const today=new Date().toDateString();
  const activeLogs=workLogs.filter(w=>!w.completed&&teamIds.has(w.userId));
  const activeTasks=(customTasks||[]).filter(t=>t.active&&!t.completed&&teamIds.has(t.userId));
  const todayLogs=workLogs.filter(w=>w.completed&&w.endTime&&new Date(w.endTime).toDateString()===today&&teamIds.has(w.userId));
  const todayMin=todayLogs.reduce((s,w)=>s+(w.durationMin||0),0);
  const workingNow=team.filter(u=>activeLogs.some(l=>l.userId===u.id&&!l.paused)||activeTasks.some(t=>t.userId===u.id&&!t.paused)).length;
  const onBreak=team.filter(u=>{
    const ls=activeLogs.filter(l=>l.userId===u.id),ts=activeTasks.filter(t=>t.userId===u.id);
    return(ls.length||ts.length)&&ls.every(l=>l.paused)&&ts.every(t=>t.paused);
  }).length;
  const openTeamTasks=(customTasks||[]).filter(t=>!t.completed&&teamIds.has(t.userId)).length;

  return(
    <div className="fade-in">
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,flexWrap:"wrap"}}>
        <h2 style={{margin:0}}>{ROLES[currentUser.role]?.icon} הצוות שלי</h2>
        {myDept&&<span style={{fontSize:12,background:myDept.color+"22",color:myDept.color,padding:"3px 12px",borderRadius:14,fontWeight:700,border:`1px solid ${myDept.color}44`}}>{myDept.name}</span>}
      </div>
      <div style={{fontSize:12.5,color:"var(--c-muted)",marginBottom:14}}>{isDeptMgr?"כל העובדים במחלקה שלך":"העובדים שמשויכים אליך"} — סטטוס, ביצועים ומשימות</div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:9,marginBottom:14}}>
        <KpiBox i="👥" v={team.length} label="חברי צוות" c="#3b82f6"/>
        <KpiBox i="🔄" v={workingNow} label="עובדים כעת" c="#10b981"/>
        <KpiBox i="⏸️" v={onBreak} label="בהפסקה" c="#f59e0b"/>
        <KpiBox i="✅" v={todayLogs.length} label="פעולות שהושלמו היום" c="#a78bfa"/>
        <KpiBox i="⏱️" v={fmtTime(todayMin)} label="שעות עבודה היום" c="#06b6d4"/>
        <KpiBox i="📌" v={openTeamTasks} label="משימות פתוחות" c="#ec4899"/>
      </div>

      {team.length===0?(
        <Card><EmptyState icon="👥" title="עדיין לא שויכו אליך עובדים" subtitle="מנהל המערכת יכול לשייך עובדים אליך במסך ניהול המערכת (מנהל ישיר / מחלקה)"/></Card>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:10,marginBottom:14}}>
          {team.map(u=>{
            const myActive=activeLogs.filter(l=>l.userId===u.id);
            const myTask=activeTasks.find(t=>t.userId===u.id);
            const act=myActive.find(l=>!l.paused)||myActive[0];
            const myToday=todayLogs.filter(w=>w.userId===u.id);
            const myTodayMin=myToday.reduce((s,w)=>s+(w.durationMin||0),0);
            const working=(act&&!act.paused)||(myTask&&!myTask.paused);
            const paused=!working&&(act||myTask);
            const sc=working?"#10b981":paused?"#f59e0b":"var(--c-border)";
            const stage=act?stages.find(s=>s.id===act.stageId):null;
            const order=act?orders.find(o=>o.id===act.orderId):null;
            return(
              <Card key={u.id} style={{border:`1px solid ${working?"#10b98155":paused?"#f59e0b55":"var(--c-border)"}`,padding:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:9}}>
                    <div style={{width:34,height:34,borderRadius:"50%",background:(ROLES[u.role]?.color||"#3b82f6")+"22",color:ROLES[u.role]?.color||"#3b82f6",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14}}>{u.name?.charAt(0)}</div>
                    <div><div style={{fontWeight:700,fontSize:14}}>{u.name}</div><div style={{fontSize:10.5,color:"var(--c-dim)"}}>{ROLES[u.role]?.label||u.role}</div></div>
                  </div>
                  <span style={{fontSize:11,fontWeight:700,color:working?"#10b981":paused?"#f59e0b":"var(--c-dim)",display:"flex",alignItems:"center",gap:5}}>
                    <span style={{width:7,height:7,borderRadius:"50%",background:working?"#10b981":paused?"#f59e0b":"#5a6478",display:"inline-block",animation:working?"pulse 1.6s infinite":"none"}}/>
                    {working?"עובד כעת":paused?"בהפסקה":"לא פעיל"}
                  </span>
                </div>
                {(act||myTask)&&(
                  <div style={{background:"var(--c-deep)",borderRadius:9,padding:"9px 12px",marginBottom:10,borderRight:`3px solid ${sc}`}}>
                    {act?(
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                        <div style={{minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:600,color:stage?.color||"var(--c-text)"}}>{stage?.name||"—"}</div>
                          <div style={{fontSize:10.5,color:"var(--c-dim)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{order?.woNumber||""} · {logUnitLabel(act)}{myActive.length>1?` +${myActive.length-1}`:""}</div>
                        </div>
                        {!act.paused?<ActiveTimer startTime={act.startTime} pauseMin={act.totalPauseMin||0}/>:<span style={{color:"#f59e0b",fontWeight:700}}>⏸️</span>}
                      </div>
                    ):(
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                        <div style={{fontSize:12,fontWeight:600,color:"#a78bfa"}}>📌 {myTask.name}</div>
                        {!myTask.paused?<ActiveTimer startTime={myTask.startTime} pauseMin={myTask.totalPauseMin||0}/>:<span style={{color:"#f59e0b",fontWeight:700}}>⏸️</span>}
                      </div>
                    )}
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                  <div style={{background:"var(--c-deep)",borderRadius:7,padding:"6px 9px"}}><div style={{fontSize:9.5,color:"var(--c-dim)"}}>פעולות היום</div><div style={{fontWeight:700,color:"#60a5fa",fontSize:14}}>{myToday.length}</div></div>
                  <div style={{background:"var(--c-deep)",borderRadius:7,padding:"6px 9px"}}><div style={{fontSize:9.5,color:"var(--c-dim)"}}>זמן עבודה היום</div><div style={{fontWeight:700,fontSize:14}}>{fmtTime(myTodayMin)}</div></div>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {/* Daily work plan for my team */}
      {team.length>0&&<DailyPlanBoard dailyPlans={dailyPlans} workers={team} orders={orders} stages={stages} workLogs={workLogs} onAddPlan={onAddPlan} onDeletePlan={onDeletePlan} onTogglePlanDone={onTogglePlanDone}/>}

      {/* Task assignment to my team */}
      {team.length>0&&<AdminTasksBoard customTasks={(customTasks||[]).filter(t=>teamIds.has(t.userId))} onDeleteTask={onDeleteTask} onMarkPartialTask={onMarkPartialTask} onMarkDoneTask={onMarkDoneTask} workers={team} onAddTask={onAddTask}/>}

      {/* Recent team activity */}
      {team.length>0&&(
        <Card>
          <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>📋 פעילות אחרונה של הצוות</div>
          {(()=>{
            const recent=workLogs.filter(w=>w.completed&&teamIds.has(w.userId)).sort((a,b)=>(b.endTime||"").localeCompare(a.endTime||"")).slice(0,20);
            if(!recent.length)return<EmptyState icon="📋" title="אין פעילות עדיין" subtitle="פעולות שהצוות ישלים יופיעו כאן"/>;
            return(
              <div style={{overflowX:"auto"}}><table><thead><tr><th>עובד</th><th>S/N</th><th>שלב</th><th>זמן</th><th>סיום</th></tr></thead><tbody>
                {recent.map(w=>{const stage=stages.find(s=>s.id===w.stageId);return(
                  <tr key={w.id}>
                    <td style={{fontWeight:600}}>{w.userName}</td>
                    <td style={{color:"#7eb8ff",fontSize:12}}>{logUnitLabel(w)}</td>
                    <td><span style={{color:stage?.color||"var(--c-muted)"}}>{stage?.name||"—"}</span></td>
                    <td>{fmtTime(w.durationMin)}</td>
                    <td style={{fontSize:11,color:"var(--c-dim)"}}>{w.endTime?new Date(w.endTime).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}</td>
                  </tr>
                )})}
              </tbody></table></div>
            );
          })()}
        </Card>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ STAGES MANAGEMENT ══════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function StagesManagement({stages,setStages,stageBlocks,setStageBlocks,persist}){
  const {toast}=useToast();
  const {currentUser}=useAuth();
  const [showForm,setShowForm]=useState(false);
  const [name,setName]=useState("");
  const [color,setColor]=useState("#3b82f6");
  const [price,setPrice]=useState(0);
  const [hourly,setHourly]=useState(0);
  const [roleId,setRoleId]=useState("");
  const [minutes,setMinutes]=useState(0);
  const [editId,setEditId]=useState(null);
  const [editPrice,setEditPrice]=useState(0);
  const [editHourly,setEditHourly]=useState(0);
  const [editRoleId,setEditRoleId]=useState("");
  const [editMinutes,setEditMinutes]=useState(0);
  const [editStageName,setEditStageName]=useState("");
  const [editStageColor,setEditStageColor]=useState("#3b82f6");
  // Block management
  const [showBlockForm,setShowBlockForm]=useState(false);
  const [blockName,setBlockName]=useState("");
  const [blockStages,setBlockStages]=useState([]);
  const [editBlockId,setEditBlockId]=useState(null);

  const add=()=>{
    if(!name.trim())return;
    const maxOrder=stages.reduce((m,s)=>Math.max(m,s.order||0),0);
    const created={id:uid(),name:name.trim(),order:maxOrder+1,color,price:Number(price)||0,hourlyRate:Number(hourly)||0,roleId:roleId||"",minutes:Number(minutes)||0};
    const ns=[...stages,created];
    setStages(ns);persist(null,null,ns);setName("");setPrice(0);setHourly(0);setRoleId("");setMinutes(0);setShowForm(false);
    UNDO.record({user:currentUser,action:"הוספת שלב",target:created.name,
      changes:[{coll:"stages",before:[],after:[created.id]}]});
  };
  const del=id=>{
    const victim=stages.find(s=>s.id===id);
    if(!confirm("למחוק?"))return;
    const ns=stages.filter(s=>s.id!==id);setStages(ns);persist(null,null,ns);SB.del("stages",{id}).catch(()=>{});
    if(victim)UNDO.record({user:currentUser,action:"מחיקת שלב",target:victim.name,
      changes:[{coll:"stages",before:[victim],after:[]}]});
  };
  const move=(id,dir)=>{const idx=stages.findIndex(s=>s.id===id);if((dir===-1&&idx===0)||(dir===1&&idx===stages.length-1))return;const before=stages.map(s=>({...s}));const arr=[...stages];[arr[idx],arr[idx+dir]]=[arr[idx+dir],arr[idx]];arr.forEach((s,i)=>s.order=i+1);setStages(arr);persist(null,null,arr);UNDO.record({user:currentUser,action:"שינוי סדר שלבים",target:stages[idx]?.name||"",changes:[{coll:"stages",before,after:arr.map(s=>s.id)}]})};
  const saveStage=(id)=>{const before=stages.find(s=>s.id===id);const ns=stages.map(s=>s.id===id?{...s,name:editStageName.trim()||s.name,color:editStageColor,price:Number(editPrice)||0,hourlyRate:Number(editHourly)||0,roleId:editRoleId||"",minutes:Number(editMinutes)||0}:s);setStages(ns);persist(null,null,ns);setEditId(null);if(before)UNDO.record({user:currentUser,action:"עריכת שלב",target:before.name,changes:[{coll:"stages",before:[before],after:[id]}]})};

  // Block functions
  const addBlock=()=>{
    if(!blockName.trim()||blockStages.length===0)return toast("יש לתת שם ולבחור לפחות שלב אחד","warning");
    let nb;
    if(editBlockId){
      nb=(stageBlocks||[]).map(b=>b.id===editBlockId?{...b,name:blockName.trim(),stages:blockStages.map((bs,i)=>({...bs,order:i+1}))}:b);
    } else {
      const block={id:uid(),name:blockName.trim(),stages:blockStages.map((bs,i)=>({...bs,id:uid(),order:i+1}))};
      nb=[...(stageBlocks||[]),block];
    }
    setStageBlocks(nb);LS.set("stageBlocks",nb);persist(null,null,null,null,null,nb);
    UNDO.record({user:currentUser,action:editBlockId?"עריכת בלוק":"הוספת בלוק",target:blockName.trim(),
      changes:[{coll:"stageBlocks",before:stageBlocks||[],after:nb.map(b=>b.id)}]});
    setBlockName("");setBlockStages([]);setShowBlockForm(false);setEditBlockId(null);
  };
  const delBlock=id=>{
    const victim=(stageBlocks||[]).find(b=>b.id===id);
    const nb=(stageBlocks||[]).filter(b=>b.id!==id);setStageBlocks(nb);LS.set("stageBlocks",nb);persist(null,null,null,null,null,nb);SB.del("stage_blocks",{id}).catch(()=>{});
    if(victim)UNDO.record({user:currentUser,action:"מחיקת בלוק",target:victim.name,
      changes:[{coll:"stageBlocks",before:[victim],after:[]}]});
  };
  const addStageToBlock=stageId=>{
    const st=stages.find(s=>s.id===stageId);if(!st)return;
    if(blockStages.some(bs=>bs.sourceId===stageId))return;
    setBlockStages(p=>[...p,{sourceId:stageId,name:st.name,color:st.color,hourlyRate:Number(st.hourlyRate||0),minutes:0,price:0}]);
  };
  // Setting time per stage derives the total price from the work-center hourly rate.
  const updateBlockStageMinutes=(idx,mins)=>{setBlockStages(p=>p.map((bs,i)=>i===idx?{...bs,minutes:Number(mins)||0,price:Math.round((Number(bs.hourlyRate||0)*(Number(mins)||0)/60))}:bs))};
  const updateBlockStagePrice=(idx,pr)=>{setBlockStages(p=>p.map((bs,i)=>i===idx?{...bs,price:Number(pr)||0}:bs))};
  const removeFromBlock=idx=>{setBlockStages(p=>p.filter((_,i)=>i!==idx))};

  return(
    <div className="fade-in">
      <h2 style={{margin:"0 0 14px"}}>🔧 שלבי עבודה ובלוקים</h2>

      {/* Stage Blocks */}
      <Card style={{marginBottom:14,border:"1px solid #8b5cf633"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <h3 style={{margin:0,fontSize:15,color:"#8b5cf6"}}>📦 בלוקים (תבניות שלבים)</h3>
          <Btn color="#8b5cf6" small onClick={()=>{setShowBlockForm(p=>!p);setBlockStages([]);setBlockName("");setEditBlockId(null)}}>+ בלוק חדש</Btn>
        </div>
        {showBlockForm&&(
          <div style={{background:"var(--c-deep)",borderRadius:10,padding:14,marginBottom:12,border:"1px solid #8b5cf633"}}>
            <div style={{fontWeight:700,fontSize:13,color:"#8b5cf6",marginBottom:8}}>{editBlockId?"✏️ עריכת בלוק":"➕ בלוק חדש"}</div>
            <Field label="שם הבלוק *" value={blockName} onChange={setBlockName} style={{marginBottom:10,maxWidth:300}}/>
            <div style={{fontSize:12,color:"var(--c-dim)",fontWeight:600,marginBottom:6}}>בחר שלבים והזן זמן (דקות) לכל שלב — המחיר מחושב לפי תעריף שעתי של השלב:</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
              {stages.sort((a,b)=>a.order-b.order).map(st=>{
                const inBlock=blockStages.some(bs=>bs.sourceId===st.id);
                return(<button key={st.id} onClick={()=>!inBlock&&addStageToBlock(st.id)} style={{background:inBlock?st.color+"22":"var(--c-card)",border:`1px solid ${inBlock?st.color:  "var(--c-border)"}`,borderRadius:8,padding:"5px 10px",fontSize:12,color:inBlock?st.color:"var(--c-muted)",cursor:inBlock?"default":"pointer",fontFamily:"inherit",opacity:inBlock?.6:1}}>{inBlock?"✓ ":""}{st.name}{st.hourlyRate>0?` (₪${st.hourlyRate}/שע')`:""}</button>);
              })}
            </div>
            {blockStages.length>0&&(
              <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
                {blockStages.map((bs,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8,background:"var(--c-card)",borderRadius:8,padding:"6px 10px",border:`1px solid ${bs.color}33`,flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,color:bs.color,minWidth:20}}>{i+1}</span>
                    <span style={{fontWeight:600,flex:1,minWidth:90}}>{bs.name}</span>
                    <span style={{fontSize:11,color:"var(--c-dim)"}}>{bs.hourlyRate>0?`₪${bs.hourlyRate}/שע'`:"ללא תעריף"}</span>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                      <input type="number" min="0" value={bs.minutes} onChange={e=>updateBlockStageMinutes(i,e.target.value)} style={{width:64,padding:"3px 6px",fontSize:12}} placeholder="דק'"/>
                      <span style={{fontSize:11,color:"var(--c-dim)"}}>דק'</span>
                    </div>
                    {bs.hourlyRate>0?(
                      <span style={{fontSize:12,fontWeight:700,color:"#10b981",minWidth:54,textAlign:"left"}}>₪{bs.price}</span>
                    ):(
                      <div style={{display:"flex",alignItems:"center",gap:4}}><input type="number" value={bs.price} onChange={e=>updateBlockStagePrice(i,e.target.value)} style={{width:64,padding:"3px 6px",fontSize:12}} placeholder="₪"/><span style={{fontSize:11,color:"var(--c-dim)"}}>₪</span></div>
                    )}
                    <IBtn onClick={()=>removeFromBlock(i)}>✕</IBtn>
                  </div>
                ))}
                <div style={{display:"flex",justifyContent:"flex-end",gap:14,fontSize:12,fontWeight:700,padding:"2px 10px"}}>
                  <span style={{color:"var(--c-dim)"}}>סה"כ זמן: {blockStages.reduce((s,bs)=>s+(bs.minutes||0),0)} דק'</span>
                  <span style={{color:"#10b981"}}>מחיר כולל: ₪{blockStages.reduce((s,bs)=>s+(bs.price||0),0)}</span>
                </div>
              </div>
            )}
            <div style={{display:"flex",gap:8}}>
              <Btn color="#8b5cf6" onClick={addBlock} small>{editBlockId?"✅ עדכן בלוק":"צור בלוק"} ({blockStages.length} שלבים)</Btn>
              <Btn onClick={()=>{setShowBlockForm(false);setEditBlockId(null);setBlockName("");setBlockStages([])}} small>ביטול</Btn>
            </div>
          </div>
        )}
        {(stageBlocks||[]).length===0&&!showBlockForm?<EmptyState icon="📦" title="אין בלוקים" subtitle="צור בלוק חדש כדי להגדיר תבנית שלבים לפקעות"/>:(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {(stageBlocks||[]).map(b=>(
              <div key={b.id} style={{background:"var(--c-deep)",borderRadius:10,padding:"12px 14px",border:"1px solid var(--c-border)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontWeight:700,fontSize:14}}>{b.name}</span>
                  <div style={{display:"flex",gap:4,alignItems:"center"}}>
                    <span style={{fontSize:11,color:"var(--c-dim)"}}>{b.stages.length} שלבים</span>
                    {b.stages.reduce((s,st)=>s+(st.minutes||0),0)>0&&<span style={{fontSize:11,color:"var(--c-dim)"}}>{b.stages.reduce((s,st)=>s+(st.minutes||0),0)} דק'</span>}
                    <span style={{fontSize:11,color:"#a78bfa"}}>סה"כ: ₪{b.stages.reduce((s,st)=>s+(st.price||0),0)}</span>
                    <IBtn onClick={()=>{setEditBlockId(b.id);setBlockName(b.name);setBlockStages(b.stages.slice().sort((a,b2)=>a.order-b2.order));setShowBlockForm(true)}} title="ערוך בלוק">✏️</IBtn>
                    <IBtn onClick={()=>delBlock(b.id)}>🗑️</IBtn>
                  </div>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {b.stages.sort((a,b2)=>a.order-b2.order).map((st,i)=>(
                    <span key={i} style={{fontSize:11,background:st.color+"22",color:st.color,padding:"3px 8px",borderRadius:6,border:`1px solid ${st.color}33`}}>{st.name}{st.minutes?` ${st.minutes}ד'`:""}{st.price?` ₪${st.price}`:""}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      {/* Individual Stages */}
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <h3 style={{margin:0,fontSize:15}}>🔧 שלבים בודדים</h3>
          <Btn color="var(--c-accent)" small onClick={()=>setShowForm(p=>!p)}>+ שלב</Btn>
        </div>
        {showForm&&(

                      <input type="number" value={editPrice} onChange={e=>setEditPrice(e.target.value)} style={{width:80,padding:"5px 8px",fontSize:13,borderRadius:6,border:"1px solid var(--c-border)",background:"var(--c-deep)",color:"var(--c-text)",fontFamily:"inherit"}}/>

                        <option value="">— ללא —</option>
                        {EXECUTION_ROLES.map(r=><option key={r} value={r}>{ROLES[r].icon} {ROLES[r].label}</option>)}

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:16,fontWeight:800,color:s.color,minWidth:24}}>{i+1}</span>

                    <span style={{fontSize:11,color:(s.price||s.hourlyRate)?"#a78bfa":"var(--c-dim)",padding:"2px 6px",borderRadius:6,background:"var(--c-deep)"}}>{s.price?`₪${s.price}/יח'`:""}{s.hourlyRate?`${s.price?" · ":""}₪${s.hourlyRate}/שע'`:""}{!s.price&&!s.hourlyRate?"ללא תמחור":""}</span>

// ═══ PROJECTS ═══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function Projects({projects,orders,updP,stages,workLogs}){
  const doneIdx=useDoneIndex(workLogs);
  const {toast}=useToast();
  const {canEdit,currentUser}=useAuth();
  const [showForm,setShowForm]=useState(false);
  const [name,setName]=useState("");
  const add=()=>{if(!name.trim())return;const created={id:uid(),name:name.trim()};updP(prev=>[...prev,created]);setName("");setShowForm(false);UNDO.record({user:currentUser,action:"הוספת פרויקט",target:created.name,changes:[{coll:"projects",before:[],after:[created.id]}]})};
  const del=id=>{if(orders.some(o=>o.projectId===id))return toast('לא ניתן למחוק פרויקט עם פק"ע',"warning");const victim=projects.find(p=>p.id===id);updP(prev=>prev.filter(p=>p.id!==id));SB.del("projects",{id}).catch(()=>{});if(victim)UNDO.record({user:currentUser,action:"מחיקת פרויקט",target:victim.name,changes:[{coll:"projects",before:[victim],after:[]}]})};
  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h2 style={{margin:0}}>🏗️ פרויקטים</h2>
        {canEdit&&<Btn color="var(--c-accent)" onClick={()=>setShowForm(p=>!p)}>+ פרויקט חדש</Btn>}
      </div>
      {showForm&&(<Card style={{marginBottom:12,display:"flex",gap:10,alignItems:"flex-end",padding:12}}><div style={{flex:1}}><Field label="שם הפרויקט" value={name} onChange={setName}/></div><Btn color="#10b981" onClick={add}>הוסף</Btn><Btn onClick={()=>setShowForm(false)}>ביטול</Btn></Card>)}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:12}}>
        {projects.map((p,idx)=>{
          const po=orders.filter(o=>o.projectId===p.id);
          const totalSer=po.reduce((s,o)=>s+(o.serials||[]).length,0);
          const completed=po.reduce((s,o)=>(o.serials||[]).filter(sr=>{
            const oStages=(o.stageIds||[]);
            return oStages.every(sid=>doneIdx.has(logKey(sr.id,sid)));
          }).length+s,0);
          const pct=totalSer?Math.round(completed/totalSer*100):0;
          const rev=completed*po.reduce((s,o)=>s+Number(o.unitPrice||0),0)/Math.max(po.length,1);
          const c=COLORS[idx%COLORS.length];
          return(
            <Card key={p.id}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:10,alignItems:"center"}}>
                <span style={{fontWeight:700,fontSize:15}}>{p.name}</span>
                {canEdit&&<IBtn onClick={()=>del(p.id)}>🗑️</IBtn>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:10}}>
                {[['פק"ע',po.length],["יחידות",totalSer],["הושלמו",completed],["אחוז",pct+"%"]].map(([l,v])=>(
                  <div key={l} style={{background:"var(--c-deep)",borderRadius:8,padding:"7px 10px"}}><div style={{fontSize:11,color:"var(--c-dim)"}}>{l}</div><div style={{fontWeight:700,fontSize:14}}>{v}</div></div>
                ))}
              </div>
              {totalSer>0&&<PBar pct={pct} h={7} color={c}/>}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

// ═══ COMPANIES ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// Every row in every table carries a company_id, so a company is exactly the set
// of rows that name it. Deleting one therefore means clearing it out table by
// table and only then removing the company itself — the foreign keys point *at*
// companies, so the row cannot go first.
//
// Ordered so that if a delete fails halfway the company still exists and can be
// retried, rather than leaving orphan rows behind an already-deleted company.
const COMPANY_TABLES=[
  ["work_logs","רישומי עבודה"],["orders",'פק"ע'],["custom_tasks","משימות"],
  ["daily_plans","תוכניות עבודה"],["pn_standards","זמני תקן"],["stage_blocks","בלוקים"],
  ["stages","שלבים"],["projects","פרויקטים"],["departments","מחלקות"],
  ["audit_log","יומן פעילות"],["app_users","משתמשים"],["subscriptions","מנוי"],
];
// Shown per company in the list — the tables worth knowing the size of before
// pressing delete.
const COMPANY_COUNTS=[["orders",'פק"ע'],["work_logs","דיווחים"],["app_users","משתמשים"],["stages","שלבים"],["projects","פרויקטים"]];

function CompaniesTab({lightMode,currentUser}){
  const {toast}=useToast();
  const [rows,setRows]=useState(null);
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState("");
  const [confirmId,setConfirmId]=useState("");
  const [typed,setTyped]=useState("");
  const [progress,setProgress]=useState("");
  const lm=lightMode;
  const card=lm?"#f7f8fa":"#0d1120";
  const border=lm?"#dde1e8":"#1e2a42";
  const muted=lm?"#5a6478":"#8b95a8";
  const here=getCompanyId();

  const load=useCallback(async()=>{
    setErr("");setRows(null);
    try{
      const list=await SB.get("companies","order=created_at.asc");
      const withCounts=await Promise.all(list.map(async c=>{
        const counts={};
        await Promise.all(COMPANY_COUNTS.map(async([t])=>{
          counts[t]=await SB.count(t,`company_id=eq.${c.id}`).catch(()=>null);
        }));
        return{...c,counts};
      }));
      setRows(withCounts);
    }catch(e){setErr(sbErrMsg(e))}
  },[]);
  useEffect(()=>{load()},[load]);

  const doDelete=async(c)=>{
    setBusy(c.id);setProgress("");
    let removed=0;
    try{
      for(const [table,label] of COMPANY_TABLES){
        setProgress(`מוחק ${label}…`);
        // A company with no rows in a table is the normal case, and a table that
        // does not exist in this project must not abort the whole delete.
        try{await SB.del(table,{company_id:c.id})}
        catch(e){
          const msg=sbErrMsg(e);
          if(/does not exist|could not find the table/i.test(msg))continue;
          throw new Error(`${label}: ${msg}`);
        }
        removed++;
      }
      setProgress("מוחק את החברה…");
      await SB.del("companies",{id:c.id});
      UNDO.dropCompany(c.id);
      addAuditEntry({userId:currentUser?.id,username:currentUser?.username,name:currentUser?.name,
        action:"מחיקת חברה",target:c.name,details:`${removed} טבלאות נוקו · פעולה בלתי הפיכה`});
      toast(`החברה "${c.name}" נמחקה על כל נתוניה`,"success",6000);
      setConfirmId("");setTyped("");
      load();
    }catch(e){
      toast("המחיקה נכשלה — "+(e.message||e),"error",8000);
      load();
    }
    setBusy("");setProgress("");
  };

  if(err)return(
    <div>
      <div style={{color:"#ef4444",fontSize:13,marginBottom:10}}>שגיאה בטעינת החברות: {err}</div>
      <Btn small onClick={load}>נסה שוב</Btn>
    </div>
  );
  if(!rows)return<div style={{textAlign:"center",padding:30,color:muted}}>⏳ טוען חברות…</div>;

  return(
    <div>
      <div style={{fontWeight:700,marginBottom:4}}>🏭 חברות במערכת ({rows.length})</div>
      <div style={{fontSize:11.5,color:muted,marginBottom:12}}>
        כל חברה היא מרחב נתונים נפרד — פק"ע, עובדים, שלבים ודיווחים. אתה מחובר כרגע ל<b>{rows.find(c=>c.id===here)?.name||"חברה לא מזוהה"}</b>, ורואה רק את הנתונים שלה.
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {rows.map(c=>{
          const mine=c.id===here;
          const total=COMPANY_COUNTS.reduce((n,[t])=>n+(c.counts[t]||0),0);
          return(
            <div key={c.id} style={{background:card,border:`1px solid ${mine?"var(--c-accent)":border}`,borderRadius:10,padding:"11px 13px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <b style={{fontSize:14}}>{c.name}</b>
                  {mine&&<span style={{fontSize:11,background:"var(--c-tag-blue-bg)",color:"var(--c-tag-blue)",padding:"2px 8px",borderRadius:12}}>החברה שלך</span>}
                  {c.id===DEFAULT_COMPANY_ID&&<span style={{fontSize:11,background:"#8b5cf622",color:"#a78bfa",padding:"2px 8px",borderRadius:12}}>ברירת מחדל</span>}
                </div>
                {mine||c.id===DEFAULT_COMPANY_ID
                  ?<span style={{fontSize:11,color:muted}} title={mine?"אי אפשר למחוק את החברה שאיתה אתה מחובר":"החברה הראשית אינה ניתנת למחיקה"}>🔒 מוגנת</span>
                  :<button onClick={()=>{setConfirmId(confirmId===c.id?"":c.id);setTyped("")}} disabled={!!busy} style={{background:"#ef444422",border:"1px solid #ef444455",color:"#ef4444",borderRadius:7,padding:"4px 12px",fontSize:12,fontWeight:700,fontFamily:"inherit",cursor:"pointer"}}>🗑️ מחק חברה</button>}
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:6,fontSize:11.5,color:muted}}>
                {COMPANY_COUNTS.map(([t,l])=><span key={t}>{l}: <b style={{color:c.counts[t]?"var(--c-text)":muted}}>{c.counts[t]==null?"?":c.counts[t].toLocaleString("he-IL")}</b></span>)}
                {c.created_at&&<span>נוצרה: {new Date(c.created_at).toLocaleDateString("he-IL")}</span>}
              </div>
              {confirmId===c.id&&(
                <div style={{marginTop:10,background:"#ef44440f",border:"1px solid #ef444455",borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontSize:12.5,color:"#ef4444",fontWeight:700,marginBottom:4}}>⚠️ מחיקה בלתי הפיכה</div>
                  <div style={{fontSize:12,color:muted,marginBottom:8}}>
                    יימחקו {total.toLocaleString("he-IL")} רשומות מכל הטבלאות של החברה, וגם החברה עצמה. לא ניתן לאחזר את זה מיומן הפעילות.
                    <br/>להמשך, הקלד את שם החברה: <b style={{color:"var(--c-text)"}}>{c.name}</b>
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                    <input value={typed} onChange={e=>setTyped(e.target.value)} placeholder="שם החברה" style={{flex:"1 1 180px",minWidth:150,padding:"6px 10px",fontSize:13}}/>
                    <Btn small color="#ef4444" disabled={typed.trim()!==c.name||!!busy} onClick={()=>typed.trim()===c.name&&doDelete(c)}>{busy===c.id?(progress||"מוחק…"):"מחק לצמיתות"}</Btn>
                    <Btn small onClick={()=>{setConfirmId("");setTyped("")}}>ביטול</Btn>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

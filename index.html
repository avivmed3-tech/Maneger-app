            ones already in the queue is the whole point of this row. */}
        <div style={{display:"flex",gap:6,flexWrap:"wrap",width:"100%",alignItems:"center"}}>
          <span style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}} title='נגזר מהסטטוס המקורי של Priority ששמור על כל פק"ע'>שלב בתהליך:</span>
          {PHASE_ORDER.filter(k=>k!=="cancelled"||statCount.ph_cancelled>0).map(k=>{const ph=ST_PHASE[k],key="ph_"+k,n=statCount[key]||0;return(
            <button key={key} title={ph.hint} onClick={()=>setFilterStat(filterStat===key?"all":key)} style={{background:filterStat===key?ph.color+"26":"var(--c-deep)",
              border:`1px solid ${filterStat===key?ph.color+"88":"var(--c-border)"}`,color:filterStat===key?ph.color:"var(--c-muted)",
              borderRadius:16,padding:"3px 11px",fontSize:11.5,fontWeight:600,fontFamily:"inherit",cursor:"pointer"}}>{ph.icon} {ph.label} · {n}</button>
          )})}
        </div>
        {statCount.nounits>0&&(
          <div style={{width:"100%",fontSize:11.5,color:"var(--c-dim)",background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:8,padding:"7px 10px",lineHeight:1.6}}>
            🔢 ל-<b style={{color:"var(--c-text)"}}>{statCount.nounits}</b> מתוך {orders.length} פק"ע אין מספרים סידוריים ועדיין לא דווחה עליהן עבודה.
            פק"ע שאינה מנוהלת סיריאלית לא חייבת סידוריים: פתחו אותה ובצעו <b style={{color:"var(--c-text)"}}>✍️ חתימה לפי כמות</b> — חותמים כמה יחידות עברו כל שלב, וההתקדמות נספרת ומוצגת בדיוק כמו בפק"ע סיריאלית.
            לחלופין אפשר להוסיף סידוריים בכרטיס הפק"ע או לייבא מחדש עם גיליון ״סידוריים״ / באפשרות ״השלם סידוריים״.
          </div>
        )}
      </Card>
      {filtered.length===0&&<EmptyState icon="📋" title='אין פק"ע להצגה' subtitle={orders.length?"אף פק\"ע לא עונה על הסינון הנוכחי":"צור הזמנה חדשה כדי להתחיל"}/>}
      <VirtualList items={filtered} estimate={128} gap={7} renderRow={o=>{
          const serials=o.serials||[];
          const oStages=orderRoute(o,stages);
          const completed=orderDoneCount(o,oStages,workLogs,doneIdx,qtyIdx);
          // Units to measure against: the serials, or — for a פק"ע that is not
          // managed serially — the quantity it was opened for.
          const units=orderUnits(o);
          const byQty=!serials.length&&units>0;
          const pct=units?Math.round(completed/units*100):0;
          // Whole units finished the route; stage passes are how far the units got
          // through it. Shown together so a פק"ע that is genuinely part-built stops
          // looking identical to one nobody has touched.
          const passes=orderStagePasses(o,oStages,workLogs,doneIdx,qtyIdx);
          const passPct=passes.total?Math.round(passes.done/passes.total*100):0;
          const rs=REPORT_STATE[orderReportState(o,oStages,workLogs,doneIdx,qtyIdx)];
          const phase=orderPhase(o),ph=ST_PHASE[phase]||ST_PHASE.line;
          const erp=orderErpInfo(o);
          const proj=projMap.get(o.projectId);
          const br=branchCode(o.branch);
          const openDef=(o.defects||[]).filter(d=>d.status!=="closed").length;
          const remainMin=orderRemainingMin(o,stages,stageBlocks,workLogs,doneIdx,qtyIdx);
          return(
            <div key={o.id} style={{background:"var(--c-card)",borderRadius:10,padding:"12px 14px",border:"1px solid var(--c-border)",cursor:"pointer",transition:"border-color .15s"}}
              onClick={()=>setDetail(o)}
              onMouseEnter={e=>e.currentTarget.style.borderColor="var(--c-accent)"}
              onMouseLeave={e=>e.currentTarget.style.borderColor="var(--c-border)"}
            >
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontWeight:700,fontSize:15}}>{o.woNumber}</span>
                  <span title={erp?`סטטוס פק"ע ב-Priority: ${erp.raw}${erp.desc?"\n"+erp.desc:""}`:`סטטוס מה-ERP: ${SL[o.status||"open"]}`}><Badge status={o.status||"open"}/></span>
                  {/* The ERP's own wording, where it says more than the four
                      statuses can — a stuck פק"ע carries its reason right here. */}
                  {erp&&erp.raw&&<span title={erp.desc} style={{fontSize:11,background:ph.color+"14",color:ph.color,border:`1px dashed ${ph.color}55`,padding:"2px 7px",borderRadius:20,whiteSpace:"nowrap"}}>{ph.icon} {erp.raw}</span>}
                  {!erp&&phase==="pre"&&<span title={ST_PHASE.pre.hint} style={{fontSize:11,background:ST_PHASE.pre.color+"14",color:ST_PHASE.pre.color,border:`1px dashed ${ST_PHASE.pre.color}55`,padding:"2px 7px",borderRadius:20,whiteSpace:"nowrap"}}>{ST_PHASE.pre.icon} {ST_PHASE.pre.label}</span>}
                  {rs&&<span title={rs.hint} style={{fontSize:11,background:rs.color+"1f",color:rs.color,border:`1px solid ${rs.color}44`,padding:"2px 7px",borderRadius:20,whiteSpace:"nowrap"}}>{rs.icon} {rs.label}</span>}
                  {o.pn&&<span style={{fontSize:11,color:"#a78bfa"}}>P/N: {o.pn}</span>}
                  {br&&<span title={`סניף ${br}${branchName(br)?" — "+branchName(br):""} · חטיבה עסקית מה-ERP${deptsForBranch(departments,br).length?" · "+deptsForBranch(departments,br).map(d=>d.name).join(" · "):""}`} style={{fontSize:11,background:branchColor(br)+"1f",color:branchColor(br),border:`1px solid ${branchColor(br)}44`,padding:"2px 7px",borderRadius:20,whiteSpace:"nowrap"}}>🏢 {branchLabel(br)}</span>}
                  {proj?<span style={{fontSize:11,background:"var(--c-tag-blue-bg)",color:"var(--c-tag-blue)",padding:"2px 7px",borderRadius:20}}>{proj.name}</span>:<span style={{fontSize:11,background:"var(--c-border)",color:"var(--c-dim)",padding:"2px 7px",borderRadius:20}}>ללא פרויקט</span>}
                  {openDef>0&&<span style={{fontSize:11,background:"#450a0a",color:"#fca5a5",padding:"2px 7px",borderRadius:20}}>🔧 {openDef}</span>}
                </div>
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  <span title={byQty?'יחידות שנחתמו בכל שלבי המסלול (חתימה לפי כמות)':'יחידות שסיימו את כל מסלול הפק"ע'} style={{fontSize:12,fontWeight:700,color:pct>=100?"#10b981":"var(--c-muted)"}}>{completed}/{units}{byQty?" 📦":""}</span>
                  {canEdit&&<><IBtn onClick={e=>{e.stopPropagation();setEditing(o);setShowForm(true)}}>✏️</IBtn><IBtn onClick={e=>{e.stopPropagation();del(o.id)}}>🗑️</IBtn></>}
                </div>
              </div>
              {o.description&&<div style={{fontSize:13,color:"var(--c-muted)",marginBottom:4}}>{o.description}</div>}
              <div style={{display:"flex",gap:10,fontSize:12,color:"var(--c-dim)",marginBottom:5,flexWrap:"wrap"}}>
                <span>{byQty?<>כמות (ללא סידוריים): <b style={{color:"var(--c-text)"}}>{units}</b></>:<>יחידות: <b style={{color:serials.length?"var(--c-text)":"#f59e0b"}}>{serials.length||"—"}</b>{!serials.length&&<b style={{color:"#f59e0b"}}> (כמות בפק"ע: {Number(o.qty)||0})</b>}</>}</span>
                {canEdit&&<span>מחיר: <b style={{color:"#a78bfa"}}>{fmtMoney(o.unitPrice)}</b></span>}
                <span>שלבים: <b>{(o.stageIds||[]).length}</b></span>
                {passes.total>0&&<span title="דיווחי שלב שבוצעו מתוך כלל השלבים × היחידות">דיווחי שלבים: <b style={{color:passes.done?"#3b82f6":"var(--c-dim)"}}>{passes.done}/{passes.total}</b></span>}
                {remainMin>0&&pct<100&&<span>⏳ צפי לסיום: <b style={{color:"#06b6d4"}}>{fmtWorkEstimate(remainMin,workdayHours)}</b></span>}
              </div>
              {units>0
                ?<PBar pct={pct>0?pct:passPct}/>
                :<div style={{fontSize:11,color:"#f59e0b",background:"#f59e0b12",border:"1px dashed #f59e0b55",borderRadius:6,padding:"4px 8px"}}>אין סידוריים ואין כמות — לא ניתן לדווח עבודה על הפק"ע הזו</div>}
            </div>
          );
        }}/>
      {showForm&&(<Modal onClose={()=>setShowForm(false)}><OrderForm initial={editing} projects={projects} stages={stages} stageBlocks={stageBlocks} branchOpts={branchOpts} departments={departments} onSave={data=>{
        const{_serials,...rest}=data;
        if(editing){
          updO(prev=>prev.map(o=>o.id===editing.id?{...editing,...rest}:o));
          UNDO.record({user:currentUser,action:'עריכת פק"ע',target:editing.woNumber,
            changes:[{coll:"orders",before:[editing],after:[editing.id]}]});
        }else{
          const created={...rest,id:uid(),serials:_serials||[],shortages:[],defects:[]};
          updO(prev=>[...prev,created]);
          UNDO.record({user:currentUser,action:'יצירת פק"ע',target:created.woNumber,
            details:created.description||"",changes:[{coll:"orders",before:[],after:[created.id]}]});
        }
        setShowForm(false);
      }} onClose={()=>setShowForm(false)}/></Modal>)}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ SHORTAGES (חוסרים) ═════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function Shortages({orders,updO,projects}){
  const {canEdit}=useAuth();
  const [filter,setFilter]=useState("open");
  const [filterProj,setFilterProj]=useState("all");
  const [partialModal,setPartialModal]=useState(null);
  const [partialQty,setPartialQty]=useState("");
  const [search,setSearch]=useState("");
  const projMap=useMemo(()=>new Map(projects.map(p=>[p.id,p])),[projects]);
  const all=useMemo(()=>{
    const q=search.trim().toLowerCase();
    return orders.flatMap(o=>(o.shortages||[]).map(s=>({...s,order:o,proj:projMap.get(o.projectId)}))).filter(s=>{
      if(filterProj!=="all"&&s.order.projectId!==filterProj)return false;
      if(q&&!String(s.item||"").toLowerCase().includes(q)&&!String(s.sku||"").toLowerCase().includes(q)&&!String(s.order.woNumber||"").toLowerCase().includes(q))return false;
      return filter==="all"||(filter==="open"&&!s.received)||(filter==="received"&&s.received);
    });
  },[orders,projMap,filterProj,filter,search]);
  const markRec=(oid,sid)=>{updO(prev=>prev.map(o=>{if(o.id!==oid)return o;const sh=o.shortages.map(s=>s.id===sid?{...s,received:true,receivedDate:todays(),receivedQty:Number(s.missing||0)}:s);return{...o,shortages:sh}}))};
  const markRecPartial=(oid,sid,qty)=>{updO(prev=>prev.map(o=>{if(o.id!==oid)return o;const sh=o.shortages.map(s=>{if(s.id!==sid)return s;const nq=Number(s.receivedQty||0)+Number(qty),tot=Number(s.missing||0);return{...s,receivedQty:nq,received:tot>0&&nq>=tot,receivedDate:todays()}});return{...o,shortages:sh}}));setPartialModal(null);setPartialQty("")};
  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:10}}>
        <h2 style={{margin:0,fontSize:22,color:"#f87171"}}>⚠️ חוסרים</h2>
        <SegBtn options={[["open","פתוחים"],["received","שהתקבלו"],["all","הכל"]]} value={filter} onChange={setFilter}/>
      </div>
      <Card style={{padding:"10px 14px",marginBottom:12,display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap"}}>
        <div style={{display:"flex",flexDirection:"column",gap:3,minWidth:160}}><label style={{fontSize:11,color:"var(--c-dim)"}}>פרויקט</label><select value={filterProj} onChange={e=>setFilterProj(e.target.value)} style={{padding:"6px 8px",fontSize:12}}><option value="all">הכל</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        <div style={{display:"flex",flexDirection:"column",gap:3,flex:"1 1 150px"}}><label style={{fontSize:11,color:"var(--c-dim)"}}>חיפוש</label><input value={search} onChange={e=>setSearch(e.target.value)} placeholder='פריט / מק"ט / פק"ע...'/></div>
        <div style={{fontSize:12,color:"var(--c-dim)",paddingBottom:4}}>{all.length} חוסרים</div>
      </Card>
      {all.length===0?<EmptyState icon={filter==="open"?"🎉":"📭"} title={filter==="open"?"אין חוסרים פתוחים!":"אין נתונים"} subtitle={filter==="open"?"כל החומרים זמינים":"נסה לשנות את הסינון"}/>:(
        <VirtualList items={all} estimate={92} gap={8} renderRow={s=>{const rq=Number(s.receivedQty||0),tot=Number(s.missing||0),isPar=rq>0&&!s.received;return(
            <div style={{background:"var(--c-card)",borderRadius:10,padding:"12px 14px",border:`1px solid ${s.received?"#10b98133":isPar?"#f59e0b33":"#ef444433"}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,color:s.received?"#10b981":isPar?"#f59e0b":"#f87171",marginBottom:3}}>{s.item}{s.sku&&<span style={{fontSize:11,color:"#7eb8ff",marginRight:8,fontWeight:400}}>מק"ט: {s.sku}</span>}</div>
                <div style={{fontSize:12,color:"var(--c-muted)",display:"flex",gap:10,flexWrap:"wrap"}}>
                  <span style={{color:"#60a5fa"}}>{s.order.woNumber}</span>
                  {tot>0&&<span>נדרש: {tot}{isPar?` | התקבל: ${rq}`:""}</span>}
                  <span>הוזמן: {fmt(s.orderedDate)}</span>
                  {s.received&&s.orderedDate&&s.receivedDate&&<span style={{color:"#a78bfa"}}>⏱ {daysBetween(s.orderedDate,s.receivedDate)} ימים</span>}
                </div>
                {(s.reason||s.responsible)&&<div style={{fontSize:11,color:"var(--c-dim)",marginTop:3,display:"flex",gap:10,flexWrap:"wrap"}}>{s.reason&&<span>סיבה: {s.reason}</span>}{s.responsible&&<span style={{color:"#a78bfa"}}>אחראי: {s.responsible}</span>}</div>}
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                {canEdit&&!s.received&&<><Btn color="#f59e0b" small onClick={()=>{setPartialModal({oid:s.order.id,sid:s.id,item:s.item});setPartialQty("")}}>📦 חלקי</Btn><Btn color="#10b981" small onClick={()=>markRec(s.order.id,s.id)}>✅ הכל</Btn></>}
                {s.received?<span style={{fontSize:11,background:"#052e16",color:"#6ee7b7",padding:"3px 9px",borderRadius:20}}>✅ הושלם</span>:isPar?<span style={{fontSize:11,background:"#451a0344",color:"#fbbf24",padding:"3px 9px",borderRadius:20}}>📦 חלקי</span>:<span style={{fontSize:11,background:"#450a0a",color:"#fca5a5",padding:"3px 9px",borderRadius:20}}>❌ ממתין</span>}
              </div>
            </div>
          )}}/>
      )}
      {partialModal&&(<div onClick={()=>setPartialModal(null)} style={{position:"fixed",inset:0,background:"#000c",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div onClick={e=>e.stopPropagation()} style={{background:"var(--c-card)",borderRadius:12,padding:24,minWidth:280,border:"1px solid var(--c-border2)"}}><div style={{fontWeight:700,fontSize:16,marginBottom:12,color:"#f59e0b"}}>📦 קבלה חלקית</div><div style={{fontSize:13,color:"var(--c-muted)",marginBottom:12}}>{partialModal.item}</div><Field label="כמות שהתקבלה" type="number" value={partialQty} onChange={setPartialQty}/><div style={{display:"flex",gap:8,marginTop:14}}><Btn color="#f59e0b" onClick={()=>partialQty&&markRecPartial(partialModal.oid,partialModal.sid,partialQty)}>שמור</Btn><Btn onClick={()=>setPartialModal(null)}>ביטול</Btn></div></div></div>)}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ ADMIN TASKS BOARD ══════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function AdminTasksBoard({customTasks,onDeleteTask,onMarkPartialTask,onMarkDoneTask,workers,onAddTask}){
  const {toast}=useToast();
  const [taskView,setTaskView]=useState("board");
  const [detailTask,setDetailTask]=useState(null);
  const [showTaskForm,setShowTaskForm]=useState(false);
  const [taskName,setTaskName]=useState("");
  const [taskDesc,setTaskDesc]=useState("");
  const [taskWorker,setTaskWorker]=useState("");
  const [taskPrice,setTaskPrice]=useState("");
  const canAssign=!!(onAddTask&&Array.isArray(workers)&&workers.length>0);
  const submitTask=()=>{
    if(!taskName.trim()||!taskWorker){toast&&toast("יש לבחור עובד ושם משימה","warning");return}
    const u=(workers||[]).find(w=>w.id===taskWorker);
    onAddTask({id:uid(),userId:taskWorker,userName:u?.name||"",name:taskName.trim(),description:taskDesc.trim(),price:Number(taskPrice)||0,createdAt:nowISO(),active:false,completed:false,startTime:null,endTime:null,durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[]});
    setTaskName("");setTaskDesc("");setTaskWorker("");setTaskPrice("");setShowTaskForm(false);
    toast&&toast("המשימה הוקצתה בהצלחה","success");
  };
  const openTasks=(customTasks||[]).filter(t=>!t.completed&&!t.partial);
  const partialTasks=(customTasks||[]).filter(t=>!t.completed&&t.partial);
  const doneTasks=(customTasks||[]).filter(t=>t.completed);
  const workerSummary={};
  (customTasks||[]).filter(t=>!t.completed).forEach(t=>{
    if(!workerSummary[t.userId])workerSummary[t.userId]={name:t.userName,open:0,partial:0};
    if(t.partial)workerSummary[t.userId].partial++;else workerSummary[t.userId].open++;
  });
  const TaskCard=({t,accent})=>(
    <div style={{background:"var(--c-deep)",borderRadius:10,padding:"12px 14px",border:t.partial?"1px solid #3b82f655":t.active?`1px solid ${accent||"#a78bfa"}`:"1px solid var(--c-border)",cursor:"pointer"}}
      onClick={()=>setDetailTask(t)}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:6,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:4}}>
            <span style={{fontWeight:700,fontSize:14}}>{t.name}</span>
            {t.partial&&<span style={{fontSize:11,background:"#3b82f622",color:"#60a5fa",padding:"2px 8px",borderRadius:12,border:"1px solid #3b82f633"}}>🔄 חלקית</span>}
            {t.active&&!t.partial&&<span style={{fontSize:11,background:"#a78bfa22",color:"#a78bfa",padding:"2px 8px",borderRadius:12}}>⚡ פעיל</span>}
            {t.price>0&&<span style={{fontSize:11,color:"#10b981"}}>₪{t.price}</span>}
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:12,background:"#60a5fa22",color:"#60a5fa",padding:"2px 8px",borderRadius:8}}>👤 {t.userName}</span>
            {t.description&&<span style={{fontSize:11,color:"var(--c-dim)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:200}}>{t.description}</span>}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3,flexShrink:0}}>
          <div style={{fontSize:11,color:"var(--c-dim)"}}>הוקצה: {fmt(t.createdAt?.slice(0,10))}</div>
          {t.endTime&&<div style={{fontSize:11,color:"#10b981"}}>הסתיים: {fmt(t.endTime?.slice(0,10))}</div>}
          <div style={{display:"flex",gap:4}}>
            <button onClick={e=>{e.stopPropagation();onMarkPartialTask&&onMarkPartialTask(t.id)}} title="סמן חלקית" style={{background:t.partial?"#3b82f633":"transparent",border:"1px solid #3b82f644",borderRadius:6,padding:"3px 7px",fontSize:11,color:"#60a5fa",fontFamily:"inherit",cursor:"pointer"}}>〰️</button>
            <button onClick={e=>{e.stopPropagation();onMarkDoneTask&&onMarkDoneTask(t.id)}} title="סמן כבוצע" style={{background:"transparent",border:"1px solid #10b98144",borderRadius:6,padding:"3px 7px",fontSize:11,color:"#10b981",fontFamily:"inherit",cursor:"pointer"}}>✅</button>
            <IBtn onClick={e=>{e.stopPropagation();if(confirm("למחוק משימה?"))onDeleteTask(t.id)}}>🗑️</IBtn>
          </div>
        </div>
      </div>
    </div>
  );
  return(
    <Card style={{marginBottom:14,border:"1px solid #a78bfa33"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontWeight:700,fontSize:15,color:"#a78bfa"}}>📌 לוח משימות</div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:12,background:"#f59e0b22",color:"#f59e0b",padding:"3px 10px",borderRadius:12}}>{openTasks.length} פתוחות</span>
          <span style={{fontSize:12,background:"#3b82f622",color:"#60a5fa",padding:"3px 10px",borderRadius:12}}>{partialTasks.length} חלקיות</span>
          <span style={{fontSize:12,background:"#10b98122",color:"#10b981",padding:"3px 10px",borderRadius:12}}>{doneTasks.length} הושלמו</span>
          <SegBtn options={[["board","כרטיסים"],["summary","סיכום"]]} value={taskView} onChange={setTaskView}/>
          {canAssign&&<Btn color="#a78bfa" small onClick={()=>setShowTaskForm(p=>!p)}>{showTaskForm?"✕ סגור":"➕ הקצה משימה"}</Btn>}
        </div>
      </div>

      {canAssign&&showTaskForm&&(
        <div style={{background:"var(--c-deep)",borderRadius:10,padding:14,marginBottom:12,border:"1px solid #a78bfa44"}}>
          <div style={{fontWeight:700,fontSize:13,color:"#a78bfa",marginBottom:10}}>➕ הקצאת משימה חדשה</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10}}>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>עובד *</label>
              <select value={taskWorker} onChange={e=>setTaskWorker(e.target.value)}>
                <option value="">— בחר עובד —</option>
                {workers.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
              </select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>שם המשימה *</label>
              <input value={taskName} onChange={e=>setTaskName(e.target.value)} placeholder="לדוגמה: סידור מחסן"/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>תמחור (₪)</label>
              <input type="number" min="0" value={taskPrice} onChange={e=>setTaskPrice(e.target.value)} placeholder="0"/>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:3,gridColumn:"1 / -1"}}>
              <label style={{fontSize:11,color:"var(--c-dim)"}}>תיאור (לא חובה)</label>
              <input value={taskDesc} onChange={e=>setTaskDesc(e.target.value)} placeholder="פרטים נוספים..."/>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:10,justifyContent:"flex-end"}}>
            <Btn small onClick={()=>{setTaskName("");setTaskDesc("");setTaskWorker("");setTaskPrice("");setShowTaskForm(false)}}>ביטול</Btn>
            <Btn color="#a78bfa" small onClick={submitTask}>✅ הקצה</Btn>
          </div>
        </div>
      )}

      {taskView==="summary"&&(
        <div>
          <div style={{fontWeight:600,fontSize:13,color:"var(--c-dim)",marginBottom:8}}>משימות פתוחות לפי עובד</div>
          {Object.keys(workerSummary).length===0?<EmptyState icon="📌" title="אין משימות פתוחות" subtitle="הקצה משימה חדשה לעובד"/>:(
            <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
              {Object.values(workerSummary).sort((a,b)=>(b.open+b.partial)-(a.open+a.partial)).map((w,i)=>(
                <div key={i} style={{background:"var(--c-deep)",borderRadius:8,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",border:"1px solid var(--c-border)"}}>
                  <span style={{fontWeight:600,fontSize:14}}>{w.name}</span>
                  <div style={{display:"flex",gap:10}}>
                    {w.open>0&&<span style={{fontSize:12,background:"#f59e0b22",color:"#f59e0b",padding:"3px 10px",borderRadius:10}}>{w.open} פתוחות</span>}
                    {w.partial>0&&<span style={{fontSize:12,background:"#3b82f622",color:"#60a5fa",padding:"3px 10px",borderRadius:10}}>{w.partial} חלקיות</span>}
                  </div>
                </div>
              ))}
            </div>
          )}
          <div style={{fontWeight:600,fontSize:13,color:"var(--c-dim)",marginBottom:8}}>הושלמו לאחרונה</div>
          {doneTasks.length===0?<div style={{color:"var(--c-dim)",fontSize:12,textAlign:"center",padding:8}}>אין</div>:(
            <div style={{overflowX:"auto"}}>
              <table><thead><tr><th>עובד</th><th>משימה</th><th>הוקצה</th><th>הסתיים</th><th>זמן</th><th>תמחור</th><th></th></tr></thead><tbody>
                {doneTasks.sort((a,b)=>(b.endTime||"").localeCompare(a.endTime||"")).slice(0,20).map(t=>(
                  <tr key={t.id} style={{cursor:"pointer"}} onClick={()=>setDetailTask(t)}>
                    <td style={{fontWeight:600}}>{t.userName}</td>
                    <td style={{color:"#a78bfa"}}>{t.name}</td>
                    <td style={{fontSize:11,color:"var(--c-dim)"}}>{fmt(t.createdAt?.slice(0,10))}</td>
                    <td style={{fontSize:11,color:"#10b981"}}>{fmt(t.endTime?.slice(0,10))}</td>
                    <td>{fmtTime(t.durationMin)}</td>
                    <td style={{color:t.price?"#10b981":"var(--c-dim)"}}>{t.price?fmtMoney(t.price):"—"}</td>
                    <td><IBtn onClick={e=>{e.stopPropagation();if(confirm("למחוק?"))onDeleteTask(t.id)}}>🗑️</IBtn></td>
                  </tr>
                ))}
              </tbody></table>
            </div>
          )}
        </div>
      )}

      {taskView==="board"&&(
        <div>
          {openTasks.length===0&&partialTasks.length===0?<EmptyState icon="📌" title="אין משימות פתוחות" subtitle="כל המשימות הושלמו"/>:(
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {openTasks.length>0&&<div style={{fontSize:11,fontWeight:700,color:"#f59e0b",marginBottom:2}}>🔴 פתוחות ({openTasks.length})</div>}
              {openTasks.map(t=><TaskCard key={t.id} t={t} accent="#f59e0b"/>)}
              {partialTasks.length>0&&<div style={{fontSize:11,fontWeight:700,color:"#60a5fa",marginTop:6,marginBottom:2}}>🔄 בוצעו חלקית ({partialTasks.length})</div>}
              {partialTasks.map(t=><TaskCard key={t.id} t={t} accent="#3b82f6"/>)}
            </div>
          )}
          {doneTasks.length>0&&(
            <details style={{marginTop:10}}>
              <summary style={{fontSize:12,color:"var(--c-dim)",cursor:"pointer",padding:"6px 0",borderTop:"1px solid var(--c-border)"}}>✅ הושלמו ({doneTasks.length})</summary>
              <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
                {doneTasks.slice(0,10).map(t=>(
                  <div key={t.id} style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 12px",opacity:.7,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>setDetailTask(t)}>
                    <div><span style={{fontWeight:600,fontSize:13}}>✅ {t.name}</span><span style={{fontSize:11,color:"#60a5fa",marginRight:8}}>{t.userName}</span></div>
                    <div style={{display:"flex",gap:8,alignItems:"center"}}>
                      <span style={{fontSize:11,color:"var(--c-dim)"}}>{fmt(t.endTime?.slice(0,10))}</span>
                      <IBtn onClick={e=>{e.stopPropagation();if(confirm("למחוק?"))onDeleteTask(t.id)}}>🗑️</IBtn>
                    </div>
                  </div>
                ))}
              </div>
            </details>
          )}
        </div>
      )}

      {detailTask&&(
        <div onClick={()=>setDetailTask(null)} style={{position:"fixed",inset:0,background:"#000000cc",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"var(--c-card)",borderRadius:14,padding:24,maxWidth:520,width:"100%",border:"1px solid var(--c-border)",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:17,color:"#a78bfa"}}>📌 פירוט משימה</div>
              <IBtn onClick={()=>setDetailTask(null)}>✕</IBtn>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div style={{background:"var(--c-deep)",borderRadius:10,padding:14}}>
                <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{detailTask.name}</div>
                {detailTask.description&&<div style={{fontSize:13,color:"var(--c-muted)",marginBottom:8}}>{detailTask.description}</div>}
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {detailTask.partial&&<span style={{fontSize:12,background:"#3b82f622",color:"#60a5fa",padding:"3px 10px",borderRadius:10}}>🔄 בוצע חלקית</span>}
                  {detailTask.completed&&<span style={{fontSize:12,background:"#10b98122",color:"#10b981",padding:"3px 10px",borderRadius:10}}>✅ הושלם</span>}
                  {!detailTask.completed&&!detailTask.partial&&<span style={{fontSize:12,background:"#f59e0b22",color:"#f59e0b",padding:"3px 10px",borderRadius:10}}>🔴 פתוח</span>}
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>עובד</div><div style={{fontWeight:600,color:"#60a5fa"}}>{detailTask.userName}</div></div>
                <div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>תמחור</div><div style={{fontWeight:600,color:"#10b981"}}>{detailTask.price?fmtMoney(detailTask.price):"—"}</div></div>
                <div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>תאריך הקצאה</div><div style={{fontWeight:600}}>{fmt(detailTask.createdAt?.slice(0,10))}</div></div>
                <div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>תאריך סיום</div><div style={{fontWeight:600,color:detailTask.endTime?"#10b981":"var(--c-dim)"}}>{detailTask.endTime?fmt(detailTask.endTime.slice(0,10)):"—"}</div></div>
                {detailTask.durationMin>0&&<div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>זמן ביצוע</div><div style={{fontWeight:600,color:"#a78bfa"}}>{fmtTime(detailTask.durationMin)}</div></div>}
                {(detailTask.pauseLog||[]).length>0&&<div style={{background:"var(--c-deep)",borderRadius:8,padding:10}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>הפסקות</div><div style={{fontWeight:600,color:"#f97316"}}>{(detailTask.pauseLog||[]).length} ({fmtTime(detailTask.totalPauseMin||0)})</div></div>}
              </div>
              {!detailTask.completed&&(
                <div style={{display:"flex",gap:8,marginTop:4,flexWrap:"wrap"}}>
                  <Btn color="#3b82f6" small onClick={()=>{onMarkPartialTask&&onMarkPartialTask(detailTask.id);setDetailTask(null)}}>🔄 סמן חלקית</Btn>
                  <Btn color="#10b981" small onClick={()=>{onMarkDoneTask&&onMarkDoneTask(detailTask.id);setDetailTask(null)}}>✅ סמן כבוצע</Btn>
                  <Btn small onClick={()=>{if(confirm("למחוק?"))onDeleteTask(detailTask.id);setDetailTask(null)}}>🗑️ מחק</Btn>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </Card>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ MY WORK (Worker View) — Enhanced with Break, Bulk, Custom Tasks ════
// ══════════════════════════════════════════════════════════════════════════
// Marks a פק"ע / unit that belongs to the work plan the manager assigned to me,
// so it stands out from the rest of the units waiting in the queue.
const PlanTag=({small,label="תוכנית העבודה שלי"})=>(
  <span style={{background:"#06b6d422",color:"#06b6d4",border:"1px solid #06b6d455",borderRadius:10,padding:small?"1px 7px":"2px 9px",fontSize:small?10:11,fontWeight:700,whiteSpace:"nowrap"}}>📅 {label}</span>
);
function MyWork({orders,stages,workLogs,onStartWork,onEndWork,onPauseWork,onResumeWork,onDeleteLog,customTasks,onAddTask,onStartTask,onEndTask,onPauseTask,onResumeTask,onDeleteTask,onMarkPartialTask,onMarkDoneTask,users,dailyPlans,onMarkPlanDone}){
  const {toast}=useToast();
  const {currentUser}=useAuth();
  const myAccess=useMemo(()=>currentUser.stageAccess==="all"?stages.map(s=>s.id):(Array.isArray(currentUser.stageAccess)?currentUser.stageAccess:[]),[currentUser,stages]);
  // The same list as a Set: the checks below ask "is this stage mine" once per
  // stage per unit per פק"ע, which as an array scan is the inner loop of the
  // whole screen.
  const myAccessSet=useMemo(()=>new Set(myAccess),[myAccess]);
  const myActiveLogs=useMemo(()=>workLogs.filter(w=>w.userId===currentUser.id&&!w.completed),[workLogs,currentUser]);
  // The card below shows one open log, and it has to be the one actually ticking:
  // a paused unit is allowed to sit while something else is started (that is what
  // ⏸️ is for), and picking the oldest would leave the running work off screen with
  // no way to reach its ⏸️ / ✅.
  const myActiveLog=useMemo(()=>myActiveLogs.find(w=>!w.paused)||myActiveLogs[0],[myActiveLogs]);
  const [bulkMode,setBulkMode]=useState(false);
  const [bulkSelected,setBulkSelected]=useState([]);
  // Units actually finished on an open quantity run — blank means "all of them".
  const [runDone,setRunDone]=useState("");
  const [onlyPlan,setOnlyPlan]=useState(false); // show only the units assigned in my daily plan
  // ── Queue filters — פק"ע · מק"ט · שלב · סניף ──────────────────────────
  // A worker whose access covers several stages gets every פק"ע in the plant that
  // is waiting on any of them, in one list. That is the right list — it is just
  // not the right *question* when the answer wanted is "what is left on this
  // מק"ט", or "only my division", or "only the שלב I am set up for right now".
  const [fText,setFText]=useState("");   // פק"ע number / מק"ט / description
  const [fPn,setFPn]=useState("all");
  const [fStage,setFStage]=useState("all");
  const [fBranch,setFBranch]=useState("all");
  const [showTaskForm,setShowTaskForm]=useState(false);
  const [taskName,setTaskName]=useState("");
  const [taskDesc,setTaskDesc]=useState("");

  const {done:doneIdx,running:runIdx,busy:busyIdx}=useLogIndex(workLogs);
  const accessible=useMemo(()=>orders.filter(o=>(o.stageIds||[]).some(sid=>myAccessSet.has(sid))),[orders,myAccessSet]);
  // One stage lookup table for this screen. orderRoute() builds its own Map from
  // the stage list on every call, and the queue below calls it once per פק"ע —
  // a few thousand identical Maps per render.
  const stageMap=useMemo(()=>new Map((stages||[]).map(s=>[s.id,s])),[stages]);
  // Today's work plan assigned to me by my manager
  const myPlans=useMemo(()=>(dailyPlans||[]).filter(p=>p.userId===currentUser.id&&p.date===todays())
    .sort((a,b)=>(stageMap.get(a.stageId)?.order||0)-(stageMap.get(b.stageId)?.order||0)),[dailyPlans,currentUser,stageMap]);
  const planPending=(orderId,stageId,serialIds)=>{const o=orders.find(x=>x.id===orderId);if(!o)return [];let sers=o.serials||[];if(Array.isArray(serialIds)&&serialIds.length){sers=sers.filter(sr=>serialIds.includes(sr.id))}return sers.filter(sr=>!doneIdx.has(logKey(sr.id,stageId))&&!runIdx.has(logKey(sr.id,stageId)))};
  // A unit belongs to my plan when a plan line covers its order+stage — either by
  // naming its serial explicitly, or by covering the whole פק"ע (no serials listed).
  const isPlanned=(orderId,stageId,serialId)=>myPlans.some(p=>p.orderId===orderId&&p.stageId===stageId&&(!Array.isArray(p.serialIds)||p.serialIds.length===0||p.serialIds.includes(serialId)));
  const planUnitsLeft=myPlans.reduce((s,p)=>s+planPending(p.orderId,p.stageId,p.serialIds).length,0);
  // Auto sign-off: when every unit of an assigned plan's stage is completed, mark the plan done.
  useEffect(()=>{
    if(!onMarkPlanDone)return;
    myPlans.forEach(p=>{
      if(p.done)return;
      const o=orders.find(x=>x.id===p.orderId);if(!o||!(o.serials||[]).length)return;
      // When specific serials were assigned, only they count toward completion; otherwise all order units.
      const scope=(Array.isArray(p.serialIds)&&p.serialIds.length)?(o.serials||[]).filter(sr=>p.serialIds.includes(sr.id)):(o.serials||[]);
      if(!scope.length)return;
      const allDone=scope.every(sr=>doneIdx.has(logKey(sr.id,p.stageId)));
      if(allDone)onMarkPlanDone(p.id);
    });
  },[workLogs,dailyPlans]);

  const startWork=(serialId,stageId,orderId)=>{
    if(myActiveLog&&!myActiveLog.paused){toast("יש לך עבודה פעילה. סיים או עצור לפני שמתחיל חדשה.","warning");return}
    const order=orders.find(o=>o.id===orderId);const serial=(order?.serials||[]).find(s=>s.id===serialId);
    onStartWork({id:uid(),userId:currentUser.id,userName:currentUser.name,serialId,stageId,orderId,serialSn:serial?.sn||"",startTime:nowISO(),endTime:null,completed:false,durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[]});
  };

  // ── התחלת עבודה על פק"ע ללא סידוריים ───────────────────────────────────
  // Same act as pressing ▶️ on a unit, one level up: pick how many units of the
  // stage you are about to do and the timer starts on them. From here the screen
  // treats it exactly like a unit — the same active card, the same הפסקה, the same
  // סיימתי — and what it books at the end is a quantity report that carries the
  // minutes it actually took, so a פק"ע without serial numbers finally produces
  // זמן בפועל to set against זמן תקן.
  const startQtyRun=(order,stage,count)=>{
    if(myActiveLog&&!myActiveLog.paused){toast("יש לך עבודה פעילה. סיים או עצור לפני שמתחיל חדשה.","warning");return}
    const n=Math.max(1,Math.floor(Number(count)||0));
    onStartWork({id:uid(),userId:currentUser.id,userName:currentUser.name,
      // No serial — the count is the unit. That, plus an open log, is a run.
      serialId:null,serialSn:null,stageId:stage.id,orderId:order.id,
      startTime:nowISO(),endTime:null,completed:false,durationMin:0,
      paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[],
      bulk:true,bulkGroupId:null,bulkCount:n});
    toast(`התחלת עבודה על ${n} יחידות · ${stage.name}`,"success");
  };

  const startBulk=(oId)=>{
    if(myActiveLog&&!myActiveLog.paused){toast("יש עבודה פעילה","warning");return}
    const order=orders.find(o=>o.id===oId);
    const allStagesOrdered=orderRoute(order,stages);
    const groupId=uid();
    bulkSelected.forEach(sId=>{
      const serial=(order?.serials||[]).find(s=>s.id===sId);
      // Find THIS serial's correct next stage
      const nextSt=allStagesOrdered.find(st=>!doneIdx.has(logKey(sId,st.id)));
      if(!nextSt||!myAccess.includes(nextSt.id))return;
      onStartWork({id:uid(),userId:currentUser.id,userName:currentUser.name,serialId:sId,stageId:nextSt.id,orderId:oId,serialSn:serial?.sn||"",startTime:nowISO(),endTime:null,completed:false,durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[],bulk:true,bulkGroupId:groupId,bulkCount:bulkSelected.length});
    });
    setBulkSelected([]);setBulkMode(false);
  };

  const endWork=()=>{
    if(!myActiveLog)return;
    const start=new Date(myActiveLog.startTime);
    let dur=Math.round((Date.now()-start.getTime())/60000);
    dur-=(myActiveLog.totalPauseMin||0);
    if(myActiveLog.paused&&myActiveLog.pauseStart)dur-=Math.round((Date.now()-new Date(myActiveLog.pauseStart).getTime())/60000);
    // A quantity run books whatever was actually finished — the count it was opened
    // for unless the worker corrected it down, never more than that.
    let patch=null;
    if(isQtyRun(myActiveLog)){
      const started=Number(myActiveLog.bulkCount)||0;
      const n=runDone===""?started:Math.max(0,Math.min(started,Math.floor(Number(runDone)||0)));
      if(!(n>0)){toast("כמה יחידות סיימת? אם לא סיימת אף אחת — בטל את הרישום במקום לסיים אותו.","warning");return}
      if(n!==started)patch={bulkCount:n};
      setRunDone("");
    }
    onEndWork(myActiveLog.id,Math.max(0,dur),patch);
    // A group that was started together ends together — that group only, so an
    // unrelated batch left open on the side is not closed with it.
    if(myActiveLog.bulkGroupId)myActiveLogs.filter(w=>w.id!==myActiveLog.id&&w.bulkGroupId===myActiveLog.bulkGroupId).forEach(w=>{
      let d2=Math.round((Date.now()-new Date(w.startTime).getTime())/60000)-(w.totalPauseMin||0);
      onEndWork(w.id,Math.max(0,d2));
    });
  };
  // Started by mistake: a run that reported nothing can be dropped outright, the
  // way an unwanted unit timer is undone from the journal.
  const cancelRun=()=>{
    if(!myActiveLog||!isQtyRun(myActiveLog)||!onDeleteLog)return;
    if(!confirm(`לבטל את ההתחלה על ${myActiveLog.bulkCount} יחידות? לא יירשם דיווח ולא ייספר זמן.`))return;
    setRunDone("");
    onDeleteLog([myActiveLog.id]);
  };

  const togglePause=()=>{
    if(!myActiveLog)return;
    // Pause/resume ALL logs in bulk group
    const logsToToggle=myActiveLog.bulkGroupId?myActiveLogs.filter(w=>w.bulkGroupId===myActiveLog.bulkGroupId):myActiveLogs.filter(w=>w.id===myActiveLog.id);
    if(myActiveLog.paused){logsToToggle.forEach(w=>onResumeWork(w.id))}
    else{logsToToggle.forEach(w=>onPauseWork(w.id))}
  };

  // My custom tasks
  const myTasks=useMemo(()=>(customTasks||[]).filter(t=>t.userId===currentUser.id),[customTasks,currentUser]);
  const activeTask=myTasks.find(t=>t.active&&!t.completed);

  const addTask=()=>{if(!taskName.trim())return;onAddTask({id:uid(),userId:currentUser.id,userName:currentUser.name,name:taskName.trim(),description:taskDesc.trim(),createdAt:nowISO(),active:false,completed:false,startTime:null,endTime:null,durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[]});setTaskName("");setTaskDesc("");setShowTaskForm(false)};

  // ── Available work queue ────────────────────────────────────────────────
  // Every pending unit I may start, tagged with whether it came from the work
  // plan my manager assigned me today. Planned units sort first — inside each
  // פק"ע and across פק"עים — so my own plan always sits at the top of the list.
  const orderQueues=useMemo(()=>accessible.map(o=>{
    // The route, read straight off the shared stage map rather than through
    // orderRoute() — same result, without a fresh Map per פק"ע.
    const allStagesOrdered=(o.stageIds||[]).map(id=>stageMap.get(id)).filter(Boolean);
    const units=(o.serials||[]).map(s=>{
      // The unit's true next stage (stages must run in order)
      const next=allStagesOrdered.find(st=>!doneIdx.has(logKey(s.id,st.id)));
      if(!next||!myAccessSet.has(next.id))return null;                                    // done, or not mine to do
      if(runIdx.has(logKey(s.id,next.id)))return null;                                    // already running
      return{...s,next,planned:isPlanned(o.id,next.id,s.id)};
    }).filter(Boolean).sort((a,b)=>(b.planned?1:0)-(a.planned?1:0));
    // id carried on the queue itself so the virtual list keys rows by פק"ע rather
    // than by position — the list re-sorts as plan units are worked off.
    return{id:o.id,order:o,units,planned:units.filter(u=>u.planned).length};
  }).filter(q=>q.units.length>0).sort((a,b)=>b.planned-a.planned),
    [accessible,stageMap,doneIdx,runIdx,myAccessSet,myPlans]);
  // ── פק"ע שאינן מנוהלות סיריאלית ───────────────────────────────────────
  // These never reach the queue above and never could: that queue is built from
  // units, and a פק"ע with no serial numbers has none. It is still work, and it is
  // still *this* worker's work wherever one of its stages is theirs — so it gets
  // its own list, where the report is a quantity instead of a unit. Only the
  // orders that still have something unsigned on a stage of mine are listed, the
  // same rule the unit queue follows.
  const [openQty,setOpenQty]=useState("");
  const myQtyIdx=useQtyIndex(workLogs);
  const myQtyRunIdx=useQtyRunIndex(workLogs);
  const qtyOrders=useMemo(()=>accessible.filter(o=>{
    if(!isQtyOrder(o))return false;
    const cap=Number(o.qty)||0;
    return (o.stageIds||[]).some(sid=>myAccessSet.has(sid)&&qtySigned(myQtyIdx,workLogs,o.id,sid)<cap);
  }),[accessible,myAccessSet,myQtyIdx,workLogs]);
  // ── What the filters may offer ──────────────────────────────────────────
  // Every option is drawn from the queue itself and carries its own count, so a
  // value that would empty the screen is never in the list to be picked. Both
  // lists feed it — the unit queue and the quantity-reported פק"ע — because a
  // filter that hid one of them would look like the work had disappeared.
  const queueOpts=useMemo(()=>{
    const pn=new Map(),br=new Map(),st=new Map();
    const bump=(m,k,n)=>m.set(k,(m.get(k)||0)+n);
    orderQueues.forEach(q=>{
      bump(pn,(q.order.pn||"").trim(),q.units.length);
      bump(br,branchCode(q.order.branch),q.units.length);
      q.units.forEach(u=>bump(st,u.next.id,1));
    });
    qtyOrders.forEach(o=>{
      bump(pn,(o.pn||"").trim(),1);
      bump(br,branchCode(o.branch),1);
      (o.stageIds||[]).forEach(sid=>{if(myAccessSet.has(sid))bump(st,sid,1)});
    });
    const blankLast=(a,b)=>(a[0]?0:1)-(b[0]?0:1);
    return{
      pn:[...pn].sort((a,b)=>blankLast(a,b)||String(a[0]).localeCompare(String(b[0]),"he",{numeric:true})),
      // Same order the number reads in everywhere else: 51 · 52 · 53 · 57, then
      // anything non-numeric, then "ללא סניף".
      br:[...br].sort((a,b)=>{
        const bl=blankLast(a,b);if(bl)return bl;
        const na=Number(a[0]),nb=Number(b[0]);
        return(isFinite(na)&&isFinite(nb))?na-nb:String(a[0]).localeCompare(String(b[0]),"he",{numeric:true});
      }),
      st:[...st].sort((a,b)=>(stageMap.get(a[0])?.order||0)-(stageMap.get(b[0])?.order||0))
    };
  },[orderQueues,qtyOrders,myAccessSet,stageMap]);
  const filterOn=fText.trim()!==""||fPn!=="all"||fStage!=="all"||fBranch!=="all";
  const clearFilters=()=>{setFText("");setFPn("all");setFStage("all");setFBranch("all");setBulkSelected([])};
  // The three פק"ע-level filters. The שלב filter is not here: it is a property of
  // the unit, not of the פק"ע, so it is applied a row further in.
  const orderMatches=useCallback(o=>{
    if(fPn!=="all"&&(fPn==="none"?(o.pn||"").trim()!=="":(o.pn||"").trim()!==fPn))return false;
    if(fBranch!=="all"){
      const c=branchCode(o.branch);
      if(fBranch==="none"?!!c:c!==fBranch)return false;
    }
    const q=fText.trim().toLowerCase();
    if(q&&!String(o.woNumber||"").toLowerCase().includes(q)
        &&!String(o.pn||"").toLowerCase().includes(q)
        &&!String(o.description||"").toLowerCase().includes(q))return false;
    return true;
  },[fPn,fBranch,fText]);
  const visibleQueues=useMemo(()=>orderQueues
    .filter(q=>orderMatches(q.order))
    .map(q=>{
      let units=q.units;
      if(onlyPlan)units=units.filter(u=>u.planned);
      if(fStage!=="all")units=units.filter(u=>u.next.id===fStage);
      return units===q.units?q:{...q,units,planned:units.filter(u=>u.planned).length};
    })
    .filter(q=>q.units.length>0),[orderQueues,onlyPlan,fStage,orderMatches]);
  // The quantity list answers to the same filters. A שלב filter keeps only the
  // פק"ע that still have something unsigned on *that* stage, which is the rule
  // the list already follows for the worker's stages as a whole.
  const visibleQtyOrders=useMemo(()=>qtyOrders.filter(o=>{
    if(!orderMatches(o))return false;
    if(fStage==="all")return true;
    if(!myAccessSet.has(fStage)||!(o.stageIds||[]).includes(fStage))return false;
    return qtySigned(myQtyIdx,workLogs,o.id,fStage)<(Number(o.qty)||0);
  }),[qtyOrders,orderMatches,fStage,myAccessSet,myQtyIdx,workLogs]);
  const visibleUnitCount=useMemo(()=>visibleQueues.reduce((n,q)=>n+q.units.length,0),[visibleQueues]);
  // Admin view: the same two figures were recomputed inline in the markup on every
  // render — including the pending-unit count, which walks every serial of every
  // פק"ע against its whole route.
  const adminActiveWork=useMemo(()=>workLogs.filter(w=>!w.completed),[workLogs]);
  const adminTotalPending=useMemo(()=>orders.reduce((s,o)=>{const oSt=o.stageIds||[];
    return s+(o.serials||[]).filter(sr=>!oSt.every(sid=>doneIdx.has(logKey(sr.id,sid)))).length},0),[orders,doneIdx]);

  return(
    <div className="fade-in">
      {currentUser.role==="admin"?(
        <div>
          <h2 style={{margin:"0 0 14px"}}>📡 מצב עבודה בזמן אמת</h2>

          {/* Active workers — group by worker, not by log */}
          {(()=>{
            const activeWork=adminActiveWork,totalPending=adminTotalPending;
            // Group by worker
            const allW={};
            activeWork.forEach(w=>{
              if(!allW[w.userId])allW[w.userId]={name:w.userName,logs:[]};
              allW[w.userId].logs.push(w);
            });
            // Dedupe bulk within each worker, classify worker as working or break
            const workerWork={};const workerBreak={};
            Object.entries(allW).forEach(([uid2,wk])=>{
              const anyActive=wk.logs.some(l=>!l.paused);
              const seen2=new Set();const items=[];
              wk.logs.forEach(w=>{
                const key=w.bulkGroupId||w.id;if(seen2.has(key))return;seen2.add(key);
                if(w.bulkGroupId){const group=wk.logs.filter(g=>g.bulkGroupId===w.bulkGroupId);items.push({...w,_sns:group.map(g=>g.serialSn),_count:group.length})}
                else{items.push({...w,_sns:[logUnitLabel(w)],_count:1})}
              });
              if(anyActive){workerWork[uid2]={name:wk.name,items}}else{workerBreak[uid2]={name:wk.name,items}}
            });
            const ww=Object.keys(workerWork).length;const bw=Object.keys(workerBreak).length;
            const activeTasks2=(customTasks||[]).filter(t=>t.active&&!t.completed);
            return(<>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:9,marginBottom:14}}>
                <KpiBox i="🔄" v={ww} label="עובדים בעבודה" c="#f59e0b"/>
                <KpiBox i="⏸️" v={bw} label="בהפסקה" c="#8b95a8"/>
                <KpiBox i="📋" v={totalPending} label="יחידות ממתינות" c="#3b82f6"/>
                <KpiBox i="📦" v={orders.filter(o=>(o.serials||[]).length>0&&(o.serials||[]).some(sr=>!(o.stageIds||[]).every(sid=>doneIdx.has(logKey(sr.id,sid))))).length} label={'פק"ע בתהליך'} c="#06b6d4"/>
              </div>
              {ww>0&&(<Card style={{marginBottom:12,border:"2px solid #f59e0b33"}}><div style={{fontWeight:700,fontSize:15,color:"#f59e0b",marginBottom:10}}>🔄 עובדים בעבודה ({ww})</div><div style={{display:"flex",flexDirection:"column",gap:8}}>{Object.values(workerWork).flatMap(wk=>wk.items.map(w=>{const stage=stages.find(s2=>s2.id===w.stageId);const order=orders.find(o=>o.id===w.orderId);return(<div key={w.id} style={{background:"var(--c-deep)",borderRadius:10,padding:"10px 14px",border:"1px solid #f59e0b22",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}><div><span style={{fontWeight:700,fontSize:14}}>{w.userName}</span><span style={{fontSize:12,color:"#60a5fa",marginRight:8}}>← {order?.woNumber||""}</span>{w._count>1?<span style={{fontSize:11,background:"#3b82f622",color:"#60a5fa",padding:"2px 8px",borderRadius:10}}>{w._count} יחידות</span>:<span style={{fontSize:12,color:"#7eb8ff"}}>{logUnitLabel(w)}</span>}<span style={{fontSize:11,color:stage?.color||"var(--c-muted)",marginRight:6}}>/ {stage?.name||""}</span>{isStaleWork(w.startTime,w.totalPauseMin)&&<span title="העבודה פתוחה מעל 12 שעות — כנראה לא נלחץ 'סיימתי'" style={{fontSize:11,background:"#ef444422",color:"#ef4444",padding:"2px 8px",borderRadius:10,marginRight:6,fontWeight:700}}>⚠️ לא נסגר</span>}</div><ActiveTimer startTime={w.startTime} pauseMin={w.totalPauseMin||0}/></div>)}))}</div></Card>)}
              {bw>0&&(<Card style={{marginBottom:12,border:"1px solid #8b95a833"}}><div style={{fontWeight:700,fontSize:15,color:"#8b95a8",marginBottom:10}}>⏸️ בהפסקה ({bw})</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{Object.values(workerBreak).flatMap(wk=>wk.items.map(w=>{const stage=stages.find(s2=>s2.id===w.stageId);return(<div key={w.id} style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",opacity:.7}}><div><span style={{fontWeight:600}}>{w.userName}</span>{w._count>1?<span style={{fontSize:11,color:"var(--c-dim)",marginRight:8}}>{w._count} יחידות / {stage?.name||""}</span>:<span style={{fontSize:12,color:"var(--c-dim)",marginRight:8}}>{logUnitLabel(w)} / {stage?.name||""}</span>}</div><span style={{fontSize:12,color:"#8b95a8"}}>⏸️</span></div>)}))}</div></Card>)}
              {activeTasks2.length>0&&(<Card style={{marginBottom:12,border:"1px solid #a78bfa33"}}><div style={{fontWeight:700,fontSize:15,color:"#a78bfa",marginBottom:10}}>📌 עובדים על משימות</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{activeTasks2.map(t=>(<div key={t.id} style={{background:"var(--c-deep)",borderRadius:10,padding:"10px 14px",border:t.paused?"1px solid #8b95a833":"1px solid #a78bfa22",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}><div><span style={{fontWeight:700}}>{t.userName}</span><span style={{fontSize:12,color:"#a78bfa",marginRight:8}}>← {t.name}</span>{t.paused&&<span style={{fontSize:11,color:"#8b95a8"}}>⏸️</span>}</div>{!t.paused?<ActiveTimer startTime={t.startTime} pauseMin={t.totalPauseMin||0}/>:<span style={{fontSize:14,color:"#8b95a8"}}>⏸️</span>}</div>))}</div></Card>)}
              {ww===0&&bw===0&&activeTasks2.length===0&&(<Card style={{marginBottom:12}}><EmptyState icon="😴" title="אין עבודה פעילה כרגע" subtitle="בחר יחידה מהרשימה למטה כדי להתחיל עבודה"/></Card>)}

              <Card style={{marginBottom:12}}>
                <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>📋 עבודה שנותרה</div>
                <div style={{overflowX:"auto"}}><table><thead><tr><th>פק"ע</th><th>P/N</th><th>יחידות</th><th>הושלמו</th><th>בתהליך</th><th>נותרו</th><th>התקדמות</th></tr></thead><tbody>
                  {orders.filter(o=>(o.serials||[]).length>0).map(o=>{
                    const sers=o.serials||[];const oSt=o.stageIds||[];
                    const done=sers.filter(sr=>oSt.every(sid=>doneIdx.has(logKey(sr.id,sid)))).length;
                    const inProg=sers.filter(sr=>busyIdx.has(sr.id)).length;
                    const remain=sers.length-done;
                    const pct=sers.length?Math.round(done/sers.length*100):0;
                    if(done===sers.length)return null;
                    return(<tr key={o.id}><td style={{fontWeight:600,color:"#60a5fa"}}>{o.woNumber}</td><td style={{fontSize:12,color:"#a78bfa"}}>{o.pn||"—"}</td><td>{sers.length}</td><td style={{color:"#10b981"}}>{done}</td><td style={{color:"#f59e0b"}}>{inProg}</td><td style={{fontWeight:700}}>{remain}</td><td style={{minWidth:80}}><PBar pct={pct} h={6}/><span style={{fontSize:10,color:"var(--c-dim)"}}>{pct}%</span></td></tr>);
                  })}
                </tbody></table></div>
              </Card>
            </>);
          })()}

          {/* Admin tasks section — full task board */}
          <AdminTasksBoard customTasks={customTasks} onDeleteTask={onDeleteTask} onMarkPartialTask={onMarkPartialTask} onMarkDoneTask={onMarkDoneTask} workers={(users||[]).filter(u=>u.role!=="admin"&&u.active!==false)} onAddTask={onAddTask}/>
        </div>
      ):(
      <div>
      <h2 style={{margin:"0 0 14px"}}>🔨 העבודה שלי</h2>

      {/* My daily work plan (assigned by manager) */}

        <Card style={{marginBottom:14,border:"2px solid #06b6d4",background:"linear-gradient(135deg,var(--c-card),#02161c)"}}>

            <span style={{fontSize:11,background:"#06b6d422",color:"#06b6d4",border:"1px solid #06b6d455",padding:"2px 9px",borderRadius:10,fontWeight:700}}>{myPlans.length} שיבוצים · {planUnitsLeft} יחידות נותרו</span>

          <div style={{display:"flex",flexDirection:"column",gap:8}}>

                    {st&&<span style={{fontSize:12,color:st.color}}>← {st.name}</span>}
                    <span style={{fontSize:11,color:"var(--c-dim)"}}>{hasSpecific?`${p.serialIds.length} מספרים סידוריים משובצים`:(p.targetQty>0?`יעד: ${p.targetQty} יח'`:"כל היחידות")} · נותרו {pend.length}</span>
                    {p.done&&<span style={{fontSize:11,color:"#10b981"}}>✅ בוצע</span>}
                    {p.createdByName&&<span style={{fontSize:11,color:"var(--c-dim)"}}>· שובץ ע"י {p.createdByName}</span>}
                  </div>

                  {!canStart&&st&&<div style={{fontSize:11,color:"#f59e0b"}}>⚠️ אין לך הרשאה לשלב זה — פנה למנהל</div>}
                  {canStart&&pend.length>0&&(

                      {pend.slice(0,12).map(s=>(
                        <Btn key={s.id} color={st.color} small onClick={()=>startWork(s.id,st.id,p.orderId)} disabled={!!(myActiveLog&&!myActiveLog.paused)}>▶️ {s.sn}</Btn>

                    </div>

                </div>

            })}
          </div>
        </Card>

      {/* Active Work */}
      {myActiveLog&&(
        <Card style={{marginBottom:14,border:`2px solid ${myActiveLog.paused?"#8b95a8":"#f59e0b"}`,background:myActiveLog.paused?"var(--c-card)":"linear-gradient(135deg,var(--c-card),#1a1800)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>

              {isStaleWork(myActiveLog.startTime,myActiveLog.totalPauseMin)&&<div style={{fontSize:12,color:"#ef4444",fontWeight:700,marginTop:4}}>⚠️ העבודה פתוחה מעל 12 שעות — אם סיימת, לחץ "סיימתי"</div>}
              {myActiveLog.paused&&<div style={{fontSize:22,fontWeight:800,color:"#8b95a8",marginTop:6}}>⏸️ מושהה</div>}

              {isQtyRun(myActiveLog)&&(
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginTop:8}}>

                    onChange={e=>setRunDone(e.target.value)} style={{width:72,padding:"5px 7px",fontSize:12}}
                    title="ברירת המחדל היא הכמות שהתחלת. סיימת פחות? עדכן כאן — זו הכמות שתיחתם, והשאר יישאר פתוח לדיווח נוסף"/>
                  <span style={{fontSize:11,color:"var(--c-dim)"}}>מתוך {myActiveLog.bulkCount}</span>
                </div>
              )}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <Btn color={myActiveLog.paused?"#3b82f6":"#f97316"} onClick={togglePause} style={{fontSize:14,padding:"10px 20px"}}>{myActiveLog.paused?"▶️ חזור לעבודה":"⏸️ הפסקה"}</Btn>
              <Btn color="#10b981" onClick={endWork} style={{fontSize:16,padding:"12px 24px"}}>✅ סיימתי</Btn>
              {isQtyRun(myActiveLog)&&onDeleteLog&&<button onClick={cancelRun} style={{background:"none",border:"none",color:"#ef4444",fontSize:11.5,cursor:"pointer",fontFamily:"inherit"}}>🗑️ בטל התחלה</button>}
            </div>
          </div>
        </Card>
      )}

      {/* Active Custom Task */}
      {activeTask&&(
        <Card style={{marginBottom:14,border:`2px solid ${activeTask.paused?"#8b95a8":"#a78bfa"}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontSize:12,color:activeTask.paused?"#8b95a8":"#a78bfa",fontWeight:700,marginBottom:4}}>{activeTask.paused?"⏸️ משימה בהפסקה":"📌 משימה פעילה:"}</div>

          <div>

              <div style={{display:"flex",gap:6}}>

                        <button onClick={()=>onMarkDoneTask&&onMarkDoneTask(t.id)} title="בוצע" style={{background:"transparent",border:"1px solid #10b98144",borderRadius:6,padding:"2px 6px",fontSize:11,color:"#10b981",fontFamily:"inherit",cursor:"pointer"}}>✅</button>

                <summary style={{fontSize:11,color:"var(--c-dim)",cursor:"pointer",padding:"4px 0",borderTop:"1px solid var(--c-border)"}}>✅ הושלמו ({(customTasks||[]).filter(t=>t.completed).length})</summary>
                <div style={{marginTop:6}}>
                  {(customTasks||[]).filter(t=>t.completed).slice(0,8).map(t=>(

                      <span>✅ {t.name}</span><span style={{color:"#60a5fa"}}>{t.userName}</span><span style={{color:"#a78bfa"}}>{fmtTime(t.durationMin)}</span>{t.price>0&&<span style={{color:"#10b981"}}>₪{t.price}</span>}
                    </div>
                  ))}
                </div>
              </details>
            )}
          </div>
        ):(
          <div>
            <div style={{fontWeight:700,fontSize:15,color:"#a78bfa",marginBottom:10}}>📌 משימות שהוקצו לי</div>
            {myTasks.filter(t=>!t.completed).length===0?<EmptyState icon="📌" title="אין משימות" subtitle="אין משימות פעילות כרגע"/>:(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {myTasks.filter(t=>!t.completed).map(t=>(

                    </div>
                    {!t.active?<Btn color="#a78bfa" small onClick={()=>onStartTask(t.id)} disabled={!!activeTask||!!myActiveLog}>▶️ התחל</Btn>:<Btn color="#10b981" small onClick={()=>onEndTask(t.id)}>✅ סיים</Btn>}
                  </div>

// ═══ LIVE FACTORY BOARD (מסך מפעל) ════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// Recursive org-chart branch (top-down node + connectors + children rail)
function OrgBranch({node,isRoot,horizontal}){
  const has=node.children&&node.children.length>0;
  const h=horizontal?"-h":"";
  return(
    <div className={(isRoot?"fd-tree":"fd-node")+h}>
      {node.box}
      {has&&(<>
        <div className={"fd-trunk"+h}/>
        <div className={"fd-rail-outer"+h}>
          <div className={"fd-rail"+h+(node.children.length<=1?" fd-single":"")}>
            {node.children.map(c=><OrgBranch key={c.key} node={c} horizontal={horizontal}/>)}
          </div>
        </div>
      </>)}
    </div>
  );
}

function LiveFactoryBoard({orders,workLogs,stages,customTasks,users,departments,onClose,lightMode}){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t)},[]);
  const [selMonth,setSelMonth]=useState("all");   // month filter (cumulative stats)
  const [selDept,setSelDept]=useState(null);       // open department (id | "__none__")
  const [selWorker,setSelWorker]=useState(null);   // open worker (id)
  const [orgHorizontal,setOrgHorizontal]=useState(true); // org-chart orientation (true=לרוחב)
  const [stageOpen,setStageOpen]=useState(true); // "תפוקה לפי שלב" panel collapsed/expanded
  const lm=lightMode;
  const bg=lm?"#f0f2f5":"#05080f";
  const cardBg=lm?"#ffffff":"#0d1120";
  const innerBg=lm?"#f7f8fa":"#131829";
  const borderC=lm?"#dde1e8":"#1e2a42";
  const textC=lm?"#1a1f2e":"#e2e8f0";
  const mutedC=lm?"#5a6478":"#5a6478";
  const dimC=lm?"#8b95a8":"#5a6478";

  // ── Why everything below is memoised ───────────────────────────────────────
  // This board re-renders once a second, by design — the elapsed timers need it.
  // What it must NOT do once a second is re-derive the whole factory: the scans
  // here run over every progress record in the company, several of them looked a
  // user or a stage up *per record*, and perfFor()/stageBreakdown() were called
  // again for every department on screen. That is the board pinning a CPU core and
  // taking the rest of the app down with it. Keyed on the data instead of on the
  // clock, the tick now re-renders the timers and nothing else.
  const uMap=useMemo(()=>new Map((users||[]).map(u=>[u.id,u])),[users]);
  const sMapLive=useMemo(()=>new Map((stages||[]).map(s=>[s.id,s])),[stages]);
  const oMapLive=useMemo(()=>new Map((orders||[]).map(o=>[o.id,o])),[orders]);

  const activeWork=useMemo(()=>workLogs.filter(w=>!w.completed),[workLogs]);
  const activeTasks=useMemo(()=>(customTasks||[]).filter(t=>t.active&&!t.completed),[customTasks]);

  // Live activity per user (active logs + active tasks)
  const liveByUser=useMemo(()=>{
    const m={};
    activeWork.forEach(w=>{(m[w.userId]=m[w.userId]||{logs:[],tasks:[]}).logs.push(w)});
    activeTasks.forEach(t=>{(m[t.userId]=m[t.userId]||{logs:[],tasks:[]}).tasks.push(t)});
    return m;
  },[activeWork,activeTasks]);
  const userStatus=uid=>{const lv=liveByUser[uid];if(!lv)return"idle";const anyW=lv.logs.some(l=>!l.paused),anyT=lv.tasks.some(t=>!t.paused);return anyW?"working":anyT?"task":(lv.logs.length||lv.tasks.length)?"break":"idle"};

  const liveDoneIdx=useDoneIndex(workLogs);
  const isSerDone=(o,s)=>{const st=o.stageIds||[];return st.length>0&&st.every(sid=>liveDoneIdx.has(logKey(s.id,sid)))};
  // Done/remaining per פק"ע, counted once. These were three separate reduces over
  // every order — each re-walking every serial against every stage — and they ran
  // on the clock tick.
  const unitCounts=useMemo(()=>{
    const m=new Map();
    (orders||[]).forEach(o=>{
      const sers=o.serials||[];
      let done=0;
      sers.forEach(sr=>{if(isSerDone(o,sr))done++});
      m.set(o.id,{done,remaining:Math.max(0,sers.length-done)});
    });
    return m;
  },[orders,liveDoneIdx]);
  const remainingUnits=o=>unitCounts.get(o.id)?.remaining||0;
  const doneUnits=o=>unitCounts.get(o.id)?.done||0;

  // Available months from completed work logs + completed tasks
  const months=useMemo(()=>[...new Set([
    ...workLogs.filter(w=>w.completed&&w.endTime).map(w=>w.endTime.slice(0,7)),
    ...(customTasks||[]).filter(t=>t.completed&&t.endTime).map(t=>t.endTime.slice(0,7))
  ].filter(Boolean))].sort().reverse(),[workLogs,customTasks]);
  const inMonth=iso=>selMonth==="all"||(iso&&iso.slice(0,7)===selMonth);

  // Per-user totals, accumulated in a single pass over the logs and tasks. perfFor
  // and stageBreakdown are asked for a different set of people every time — the
  // whole floor, each department, one worker — and each call used to re-scan every
  // completed record (looking the user up with users.find() per record) for each of
  // those sets, on every tick. Now the pass happens once per data/month change and
  // a call is a sum over the handful of ids it was given.
  const perfByUser=useMemo(()=>{
    const m=new Map();
    const slot=id=>{let e=m.get(id);if(!e){e={min:0,cost:0,sale:0,units:0,tasksN:0,stages:new Map()};m.set(id,e)}return e};
    const add=(id,mins,isTask,stageId)=>{
      const u=uMap.get(id),e=slot(id);
      e.min+=mins;
      e.cost+=mins*Number(u?.hourlyRate||0)/60;
      e.sale+=mins*Number(u?.saleRate||0)/60;
      if(isTask)e.tasksN++;
      else{e.units++;if(stageId)e.stages.set(stageId,(e.stages.get(stageId)||0)+1)}
    };
    workLogs.forEach(w=>{if(!w.completed||!w.userId||!inMonth(w.endTime))return;add(w.userId,w.durationMin||0,false,w.stageId)});
    (customTasks||[]).forEach(t=>{if(!t.completed||!t.userId||!inMonth(t.endTime))return;add(t.userId,t.durationMin||0,true)});
    return m;
  },[workLogs,customTasks,uMap,selMonth]);
  // Cumulative performance for a set of user ids (completed logs + tasks), month-filtered
  const perfFor=ids=>{
    let min=0,cost=0,sale=0,units=0,tasksN=0;
    new Set(ids).forEach(id=>{
      const e=perfByUser.get(id);if(!e)return;
      min+=e.min;cost+=e.cost;sale+=e.sale;units+=e.units;tasksN+=e.tasksN;
    });
    return{min,cost,sale,units,tasksN,profit:sale-cost};
  };
  // Stage output breakdown (operations per stage) for a set of users, month-filtered
  const stageBreakdown=ids=>{
    const by={};
    new Set(ids).forEach(id=>{
      const e=perfByUser.get(id);if(!e)return;
      e.stages.forEach((n,stageId)=>{
        const st=sMapLive.get(stageId);if(!st)return;
        by[st.id]=by[st.id]||{label:st.name,color:st.color,value:0};
        by[st.id].value+=n;
      });
    });
    return Object.values(by).sort((a,b)=>b.value-a.value);
  };

  // Sales overview (feature: expected sales + cost of sales) — always cumulative/live
  const {forecastSales,realizedSales,pendingTotal}=useMemo(()=>{
    let f=0,r=0,pend=0;
    (orders||[]).forEach(o=>{
      const c=unitCounts.get(o.id)||{done:0,remaining:0},price=Number(o.unitPrice||0);
      f+=c.remaining*price;r+=c.done*price;pend+=c.remaining;
    });
    return{forecastSales:f,realizedSales:r,pendingTotal:pend};
  },[orders,unitCounts]);
  const allPerf=perfFor((users||[]).map(u=>u.id));
  // Same local-calendar-day test as before, but as a numeric range check instead of
  // building two Date objects and two toDateString() strings per record — over every
  // log in the company, once a second. Keyed on the day so it still rolls at midnight.
  const todayKey=new Date(now).toDateString();
  const doneToday=useMemo(()=>{
    const d=new Date();d.setHours(0,0,0,0);
    const from=d.getTime(),to=from+86400000;
    let n=0;
    workLogs.forEach(w=>{if(!w.completed||!w.endTime)return;const t=Date.parse(w.endTime);if(t>=from&&t<to)n++});
    return n;
  },[workLogs,todayKey]);

  const fmtElapsed=ms=>{const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h>0?`${h}:${String(m%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:`${m}:${String(s%60).padStart(2,"0")}`};
  const statusLabel={working:"🔄 עובד",task:"📌 במשימה",break:"⏸️ הפסקה",idle:"😴 לא פעיל"};
  const statusBg={working:"#f59e0b",task:"#a78bfa",break:"#8b95a8",idle:lm?"#aeb6c4":"#475569"};

  // Floor population: all active users (system admins excluded from the floor view)
  const floor=users.filter(u=>u.active!==false&&u.role!=="admin");
  const liveCount=s=>floor.filter(u=>userStatus(u.id)===s).length;

  const deptList=(departments||[]);
  const unassigned=floor.filter(u=>!u.departmentId||!deptList.some(d=>d.id===u.departmentId));
  // Departments + the pseudo "no department" group, for the diagram
  const deptData=deptList.map(d=>({d,members:floor.filter(u=>u.departmentId===d.id)}));
  if(unassigned.length>0)deptData.push({d:{id:"__none__",name:"ללא מחלקה",color:"#8b95a8",dashed:true},members:unassigned});
  const totalPerf=perfFor(floor.map(u=>u.id));
  const activeNowCount=floor.filter(u=>{const st=userStatus(u.id);return st==="working"||st==="task"}).length;
  const single=deptData.length<=1;

  // ── Live activity lines for a user (deduped bulk logs + tasks) ──
  const liveItems=u=>{
    const lv=liveByUser[u.id];const out=[];if(!lv)return out;
    const seen=new Set();
    lv.logs.forEach(w=>{const k=w.bulkGroupId||w.id;if(seen.has(k))return;seen.add(k);const grp=w.bulkGroupId?lv.logs.filter(g=>g.bulkGroupId===w.bulkGroupId):[w];const stage=sMapLive.get(w.stageId);const order=oMapLive.get(w.orderId);const el=now-new Date(w.startTime).getTime()-(w.totalPauseMin||0)*60000;out.push({key:"w"+k,icon:"🔧",label:stage?.name||"—",color:stage?.color||"#60a5fa",meta:(order?.woNumber||"")+(grp.length>1?` ×${grp.length}`:(logUnitLabel(w)!=="—"?" "+logUnitLabel(w):"")),time:w.paused?"⏸️":fmtElapsed(Math.max(0,el))})});
    lv.tasks.forEach((t,j)=>{const el=t.startTime?now-new Date(t.startTime).getTime()-(t.totalPauseMin||0)*60000:0;out.push({key:"t"+j,icon:"📌",label:t.name,color:"#a78bfa",meta:"משימה",time:t.paused?"⏸️":fmtElapsed(Math.max(0,el))})});
    return out;
  };

  // Single live employee rectangle (used in the "who works now" strip)
  const MemberBox=({u,onClick})=>{
    const st=userStatus(u.id);const sc=statusBg[st];const items=liveItems(u);
    return(
      <button onClick={onClick} style={{textAlign:"right",cursor:"pointer",fontFamily:"inherit",background:innerBg,borderRadius:10,padding:"9px 11px",border:`2px solid ${sc}`,minWidth:158,flex:"1 1 158px",maxWidth:230,boxShadow:st==="working"||st==="task"?`0 0 0 1px ${sc}55`:"none"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
          <span style={{fontWeight:700,fontSize:13,color:textC,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ROLES[u.role]?.icon} {u.name}</span>
          <span style={{width:9,height:9,borderRadius:"50%",background:sc,flexShrink:0,animation:st==="working"||st==="task"?"pulse 2s infinite":"none"}}/>
        </div>
        <div style={{fontSize:10,color:sc,fontWeight:600,marginTop:1}}>{statusLabel[st]}</div>
        {items.map(it=>(
          <div key={it.key} style={{marginTop:5,fontSize:10,lineHeight:1.3}}>
            <div style={{color:it.color,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{it.icon} {it.label}</div>
            <div style={{color:dimC,display:"flex",justifyContent:"space-between"}}><span>{it.meta}</span><span style={{color:"#f59e0b",fontVariantNumeric:"tabular-nums",fontWeight:700}}>{it.time}</span></div>
          </div>
        ))}
        {st==="idle"&&<div style={{marginTop:5,fontSize:10,color:dimC}}>אין פעילות כרגע</div>}
      </button>
    );
  };

  // Clickable org-chart worker node
  const WorkerBox=({u})=>{
    const st=userStatus(u.id);const sc=statusBg[st];const rc=ROLES[u.role]?.color||"#3b82f6";const items=liveItems(u);
    return(
      <button className="fd-box" onClick={()=>setSelWorker(u.id)}
        style={{width:188,maxWidth:"80vw",background:cardBg,border:`2px solid ${sc}`,borderRadius:13,overflow:"hidden",boxShadow:"var(--shadow-sm)"}}>
        <div style={{height:4,background:rc}}/>
        <div style={{padding:"9px 11px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6}}>
            <span style={{fontWeight:800,fontSize:13,color:textC,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ROLES[u.role]?.icon} {u.name}</span>
            <span style={{width:9,height:9,borderRadius:"50%",background:sc,flexShrink:0,animation:st==="working"||st==="task"?"pulse 2s infinite":"none"}}/>
          </div>
          <div style={{fontSize:10,color:rc,fontWeight:600,marginTop:2}}>{ROLES[u.role]?.label||u.role}</div>
          {items.length>0?(
            <div style={{marginTop:5,fontSize:10,lineHeight:1.3}}>
              <div style={{color:items[0].color,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{items[0].icon} {items[0].label}</div>
              <div style={{color:"#f59e0b",fontVariantNumeric:"tabular-nums",fontWeight:700}}>{items[0].time}{items.length>1?` · +${items.length-1}`:""}</div>
            </div>
          ):<div style={{marginTop:5,fontSize:10,color:dimC}}>{statusLabel[st]}</div>}
          <div style={{marginTop:6,fontSize:9.5,color:sc,fontWeight:700,textAlign:"center"}}>פרטים ›</div>
        </div>
      </button>
    );
  };

  // Role-group connector node (e.g. "🛠️ טכנאים · 3")
  const RoleGroupBox=({role,count})=>(
    <div style={{background:innerBg,border:`1px dashed ${(ROLES[role]?.color||borderC)}88`,borderRadius:10,padding:"7px 14px",fontSize:12,fontWeight:700,color:ROLES[role]?.color||textC,whiteSpace:"nowrap"}}>
      {ROLES[role]?.icon} {ROLES[role]?.label||role} · {count}
    </div>
  );

  // Build the department org-chart tree: head → team leads → role groups → workers
  const buildDeptTree=(d,members)=>{
    const mgr=members.find(m=>m.id===d.managerId)||members.find(m=>m.role==="dept_manager")||null;
    const mgrId=mgr&&mgr.id;
    const leads=members.filter(m=>m.role==="team_lead"&&m.id!==mgrId);
    const leadIds=new Set(leads.map(l=>l.id));
    const isStaff=m=>m.role!=="team_lead"&&m.role!=="dept_manager"&&m.id!==mgrId;
    const reportsOf=lead=>members.filter(m=>isStaff(m)&&m.managerId===lead.id);
    const directWorkers=members.filter(m=>isStaff(m)&&(!m.managerId||!leadIds.has(m.managerId)));
    const roleGroupNodes=(workers,pid)=>{
      const byRole={};workers.forEach(w=>{(byRole[w.role]=byRole[w.role]||[]).push(w)});
      return Object.entries(byRole).map(([role,ws])=>({
        key:pid+"-rg-"+role,
        box:<RoleGroupBox role={role} count={ws.length}/>,
        children:ws.map(w=>({key:w.id,box:<WorkerBox u={w}/>}))
      }));
    };
    const leadNodes=leads.map(l=>({key:l.id,box:<WorkerBox u={l}/>,children:roleGroupNodes(reportsOf(l),l.id)}));
    const rootChildren=[...leadNodes,...roleGroupNodes(directWorkers,"direct")];
    if(mgr)return{key:mgr.id,box:<WorkerBox u={mgr}/>,children:rootChildren};
    return{
      key:"head",
      box:(<div style={{width:230,maxWidth:"86vw",background:`linear-gradient(135deg,${d.color},${d.color}aa)`,borderRadius:14,padding:"13px 16px",textAlign:"center",color:"#fff",boxShadow:"var(--shadow-md)"}}>
        <div style={{fontSize:13,fontWeight:800}}>🏢 {d.name}</div>
        <div style={{fontSize:11,opacity:.85,marginTop:2}}>לא הוגדר ראש מחלקה</div>
      </div>),
      children:rootChildren
    };
  };

  const Metric=({label,value,color})=>(<div style={{textAlign:"center",minWidth:64}}><div style={{fontSize:15,fontWeight:800,color:color||textC}}>{value}</div><div style={{fontSize:10,color:dimC}}>{label}</div></div>);
  const Mini=({label,val,color})=>(<div style={{background:innerBg,borderRadius:8,padding:"6px 4px",textAlign:"center"}}><div style={{fontSize:13,fontWeight:800,color}}>{val}</div><div style={{fontSize:9.5,color:dimC,fontWeight:600}}>{label}</div></div>);
  const KBox=({i,v,label,c,sub})=>(<div style={{background:innerBg,borderRadius:12,padding:"11px 12px",border:`1px solid ${c}33`}}><div style={{fontSize:11,color:dimC,marginBottom:4}}>{i} {label}</div><div style={{fontSize:19,fontWeight:800,color:c}}>{v}</div>{sub&&<div style={{fontSize:10,color:dimC,marginTop:2}}>{sub}</div>}</div>);
  const monthSelect=extra=>(
    <select value={selMonth} onChange={e=>setSelMonth(e.target.value)} style={{padding:"6px 9px",fontSize:12,background:innerBg,color:textC,border:`1px solid ${borderC}`,borderRadius:8,width:"auto",...extra}}>
      <option value="all">כל הזמן</option>
      {months.map(m=><option key={m} value={m}>{fmtMonthLabel(m)}</option>)}
    </select>
  );
  const overlay=(content,onClose,maxW,z)=>(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"#000000cc",zIndex:z,overflowY:"auto",padding:16,display:"flex",alignItems:"flex-start",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:cardBg,borderRadius:16,padding:22,maxWidth:maxW||900,width:"100%",margin:"20px auto",border:`1px solid ${borderC}`,boxShadow:"var(--shadow-md)"}}>{content}</div>
    </div>
  );

  const selEntry=selDept?deptData.find(x=>x.d.id===selDept):null;
  const selUser=selWorker?floor.find(u=>u.id===selWorker)||users.find(u=>u.id===selWorker):null;

  return(
    <div style={{position:"fixed",inset:0,background:bg,zIndex:500,overflow:"auto",padding:20}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontSize:32}}>⚙️</div>
          <div>
            <div style={{fontWeight:800,fontSize:22,color:"#60a5fa",letterSpacing:-.5}}>מצב רצפת ייצור — מפעל חי</div>
            <div style={{fontSize:13,color:dimC}}>{new Date().toLocaleString("he-IL",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}</div>
          </div>
        </div>
        <button onClick={onClose} style={{background:cardBg,border:`1px solid ${borderC}`,color:mutedC,borderRadius:10,padding:"8px 16px",fontSize:14,fontFamily:"inherit"}}>✕ סגור</button>
      </div>

      {/* KPI row */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:18}}>
        {[
          {i:"🔄",v:liveCount("working"),l:"עובדים פעילים",c:"#f59e0b"},
          {i:"📌",v:liveCount("task"),l:"במשימות",c:"#a78bfa"},
          {i:"⏸️",v:liveCount("break"),l:"בהפסקה",c:"#8b95a8"},
          {i:"😴",v:liveCount("idle"),l:"לא פעילים",c:mutedC},
          {i:"✅",v:doneToday,l:"הושלמו היום",c:"#10b981"},
          {i:"📋",v:pendingTotal,l:"יחידות ממתינות",c:"#3b82f6"},
        ].map((k,i)=>(
          <div key={i} style={{background:cardBg,borderRadius:12,padding:"12px 14px",border:`1px solid ${k.c}33`,textAlign:"center"}}>
            <div style={{fontSize:22,marginBottom:2}}>{k.i}</div>
            <div style={{fontSize:26,fontWeight:800,color:k.c}}>{k.v}</div>
            <div style={{fontSize:11,color:dimC,marginTop:2}}>{k.l}</div>
          </div>
        ))}
      </div>

      {/* Sales overview */}
      <div style={{marginBottom:10,fontWeight:700,fontSize:15,color:mutedC,borderBottom:`1px solid ${borderC}`,paddingBottom:8}}>💰 מכירות ועלויות</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:10,marginBottom:24}}>
        <div style={{background:cardBg,borderRadius:12,padding:14,border:"1px solid #10b98133"}}>
          <div style={{fontSize:11,color:dimC,marginBottom:3}}>מכירות צפויות (יח' שנותרו)</div>
          <div style={{fontSize:22,fontWeight:800,color:"#10b981"}}>{fmtMoney(forecastSales)}</div>
        </div>
        <div style={{background:cardBg,borderRadius:12,padding:14,border:"1px solid #3b82f633"}}>
          <div style={{fontSize:11,color:dimC,marginBottom:3}}>מכירות שמומשו</div>
          <div style={{fontSize:22,fontWeight:800,color:"#3b82f6"}}>{fmtMoney(realizedSales)}</div>
        </div>
        <div style={{background:cardBg,borderRadius:12,padding:14,border:"1px solid #f9731633"}}>
          <div style={{fontSize:11,color:dimC,marginBottom:3}}>עלות מכירות — לפי שעת עובד אמיתית</div>
          <div style={{fontSize:22,fontWeight:800,color:"#f97316"}}>{fmtMoney(allPerf.cost)}</div>
          <div style={{fontSize:10,color:dimC,marginTop:2}}>שכר בפועל · {fmtTime(allPerf.min)}</div>
        </div>
        <div style={{background:cardBg,borderRadius:12,padding:14,border:"1px solid #a78bfa33"}}>
          <div style={{fontSize:11,color:dimC,marginBottom:3}}>עלות מכירות — לפי תמחור עובד</div>
          <div style={{fontSize:22,fontWeight:800,color:"#a78bfa"}}>{fmtMoney(allPerf.sale)}</div>
          <div style={{fontSize:10,color:dimC,marginTop:2}}>שווי מכירת עובד</div>
        </div>
      </div>

      {/* Factory diagram — clickable departments */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:6,borderBottom:`1px solid ${borderC}`,paddingBottom:8}}>
        <div style={{fontWeight:700,fontSize:15,color:mutedC}}>🏭 תרשים המפעל</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:11.5,color:dimC}}>📅 חודש</span>{monthSelect()}</div>
      </div>
      <div style={{fontSize:11.5,color:dimC,marginBottom:16}}>הקש על מחלקה לצפייה בזמן אמת — מי עובד, על מה, ובתרשים ההיררכי המלא. הקש על עובד לכרטיס אישי.</div>
      {floor.length===0?(
        <EmptyState icon="👥" title="אין עובדים פעילים" subtitle="הוסף עובדים בניהול המערכת"/>
      ):(
        <div className="fd-tree" style={{marginBottom:24}}>
          <div style={{width:300,maxWidth:"94%",background:"linear-gradient(135deg,var(--c-accent),var(--c-accent2))",borderRadius:16,padding:"16px 18px",boxShadow:"var(--shadow-md)",textAlign:"center",color:"#fff"}}>
            <div style={{fontSize:12.5,fontWeight:700,opacity:.9,marginBottom:2}}>🏭 כל המפעל</div>
            <div style={{fontSize:17,fontWeight:900,marginBottom:10}}>{deptList.length} מחלקות · {floor.length} עובדים</div>
            <div style={{display:"flex",justifyContent:"center",gap:12,flexWrap:"wrap",background:"#ffffff1f",borderRadius:12,padding:"10px 8px"}}>
              <div style={{textAlign:"center",minWidth:60}}><div style={{fontSize:16,fontWeight:900}}>{totalPerf.units}</div><div style={{fontSize:10,opacity:.85}}>תפוקה</div></div>
              <div style={{textAlign:"center",minWidth:60}}><div style={{fontSize:16,fontWeight:900}}>{fmtMoney(totalPerf.sale)}</div><div style={{fontSize:10,opacity:.85}}>הכנסות</div></div>
              <div style={{textAlign:"center",minWidth:60}}><div style={{fontSize:16,fontWeight:900}}>{fmtMoney(totalPerf.cost)}</div><div style={{fontSize:10,opacity:.85}}>עלות</div></div>
              <div style={{textAlign:"center",minWidth:60}}><div style={{fontSize:16,fontWeight:900}}>{fmtMoney(totalPerf.profit)}</div><div style={{fontSize:10,opacity:.85}}>רווח</div></div>
            </div>
            {activeNowCount>0&&<div style={{marginTop:9,fontSize:11.5,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}><span style={{width:7,height:7,borderRadius:"50%",background:"#bbf7d0",animation:"pulse 1.6s infinite"}}/>{activeNowCount} עובדים פעילים כעת</div>}
          </div>
          <div className="fd-trunk"/>
          <div className="fd-rail-outer">
            <div className={"fd-rail"+(single?" fd-single":"")}>
              {deptData.map(({d,members})=>{
                const perf=perfFor(members.map(m=>m.id));
                const activeN=members.filter(m=>{const st=userStatus(m.id);return st==="working"||st==="task"}).length;
                return(
                  <div className="fd-node" key={d.id}>
                    <button className="fd-box" onClick={()=>setSelDept(d.id)}
                      style={{width:210,maxWidth:"82vw",background:cardBg,border:`1px ${d.dashed?"dashed":"solid"} ${d.color}66`,borderRadius:14,overflow:"hidden",boxShadow:"var(--shadow-sm)"}}>
                      <div style={{height:5,background:d.color}}/>
                      <div style={{padding:"11px 13px"}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                          <span style={{width:11,height:11,borderRadius:3,background:d.color,flexShrink:0}}/>
                          <span style={{fontWeight:800,fontSize:14,flex:1,color:textC,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</span>
                        </div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11.5,color:mutedC,marginBottom:8}}>
                          <span>👥 {members.length} עובדים</span>
                          {activeN>0&&<span style={{color:"#10b981",fontWeight:700,display:"flex",alignItems:"center",gap:4}}><span style={{width:6,height:6,borderRadius:"50%",background:"#10b981",animation:"pulse 1.6s infinite"}}/>{activeN}</span>}
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5}}>
                          <Mini label="תפוקה" val={perf.units} color="#60a5fa"/>
                          <Mini label="הכנסה" val={fmtMoney(perf.sale)} color="#a78bfa"/>
                          <Mini label="רווח" val={fmtMoney(perf.profit)} color={perf.profit>=0?"#10b981":"#ef4444"}/>
                        </div>
                        <div style={{marginTop:9,fontSize:10.5,color:d.color,fontWeight:700,textAlign:"center"}}>הקש לפירוט ›</div>
                      </div>
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* ── Department detail (live + org chart + month stats) ── */}
      {selEntry&&(()=>{
        const {d,members}=selEntry;const ids=members.map(m=>m.id);
        const perf=perfFor(ids);const mgr=users.find(u=>u.id===d.managerId);
        const stageData=stageBreakdown(ids);
        const liveMembers=members.filter(m=>{const st=userStatus(m.id);return st==="working"||st==="task"||st==="break"});
        return overlay((<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:6}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{width:14,height:14,borderRadius:4,background:d.color,flexShrink:0}}/>
              <div>
                <div style={{fontSize:19,fontWeight:900,color:textC}}>{d.name}</div>
                <div style={{fontSize:12,color:mutedC}}>{mgr?<>מנהל/ת: <b style={{color:d.color}}>{mgr.name}</b> · </>:null}{members.length} עובדים · {fmtMonthLabel(selMonth)}</div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>{monthSelect()}
              <button onClick={()=>setSelDept(null)} style={{background:innerBg,border:`1px solid ${borderC}`,borderRadius:8,padding:"5px 11px",fontSize:13,color:mutedC,fontFamily:"inherit"}}>✕</button>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:8,margin:"14px 0"}}>
            <KBox i="👥" v={members.length} label="עובדים" c="#60a5fa"/>
            <KBox i="📦" v={perf.units} label="תפוקה (פעולות)" c="#06b6d4" sub={perf.tasksN?`+${perf.tasksN} משימות`:null}/>
            <KBox i="💰" v={fmtMoney(perf.sale)} label="הכנסות" c="#a78bfa"/>
            <KBox i="💵" v={fmtMoney(perf.cost)} label="עלות עבודה" c="#f97316"/>
            <KBox i="📈" v={fmtMoney(perf.profit)} label="רווח" c={perf.profit>=0?"#10b981":"#ef4444"}/>
            <KBox i="⏱️" v={fmtTime(perf.min)} label="שעות עבודה" c="#3b82f6"/>
          </div>

          {/* Live now */}
          <div style={{fontWeight:700,fontSize:13.5,color:textC,marginBottom:8,display:"flex",alignItems:"center",gap:6}}><span style={{width:7,height:7,borderRadius:"50%",background:"#10b981",animation:"pulse 1.6s infinite"}}/>בזמן אמת — מי עובד עכשיו</div>
          {liveMembers.length===0?(
            <div style={{background:innerBg,borderRadius:10,padding:14,fontSize:12,color:dimC,marginBottom:16}}>אין פעילות במחלקה כרגע</div>
          ):(
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>{liveMembers.map(m=><MemberBox key={m.id} u={m} onClick={()=>setSelWorker(m.id)}/>)}</div>
          )}

          {/* Stage output — collapsible to free up room for the org chart */}
          {stageData.length>0&&(
            <div style={{background:innerBg,borderRadius:12,padding:14,marginBottom:18}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:stageOpen?10:0}}>
                <button onClick={()=>setStageOpen(v=>!v)} aria-expanded={stageOpen}
                  style={{display:"inline-flex",alignItems:"center",gap:7,background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:"inherit",flex:1,textAlign:"right"}}>
                  <span style={{fontSize:11,color:dimC,transform:stageOpen?"rotate(0deg)":"rotate(-90deg)",transition:"transform .2s ease",display:"inline-block"}}>▼</span>
                  <span style={{fontWeight:700,fontSize:13,color:textC}}>🔧 תפוקה לפי שלב</span>
                  {!stageOpen&&<span style={{fontSize:11,color:dimC,fontWeight:600}}>· {stageData.length} שלבים</span>}
                </button>
                <ChartInfo title="תפוקה לפי שלב — מחלקה"
                  shows="עמודות אופקיות שמראות כמה פעולות בוצעו בכל שלב ייצור על ידי חברי המחלקה במהלך החודש הנוכחי."
                  data="מספר הפעולות שהושלמו בכל שלב, מדורג מהשלב הפעיל ביותר לפחות."
                  how="המערכת סופרת רק רישומי עבודה שהושלמו, של עובדי המחלקה, שתאריך סיומם נופל בחודש הנוכחי, ומקבצת אותם לפי שלב."
                  tip="כך רואים במבט אחד על אילו שלבי ייצור המחלקה הכי פעילה החודש."/>
              </div>
              {stageOpen&&<HBarChart data={stageData} formatVal={v=>`${v} פעולות`}/>}
            </div>
          )}

          {/* Org chart */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:12}}>
            <div style={{fontWeight:700,fontSize:13.5,color:textC}}>🗂️ תרשים ארגוני — לחץ על עובד לכרטיס אישי</div>
            <button onClick={()=>setOrgHorizontal(v=>!v)} style={{display:"inline-flex",alignItems:"center",gap:6,background:innerBg,border:`1px solid ${borderC}`,borderRadius:8,padding:"6px 11px",fontSize:12,fontWeight:700,color:mutedC,fontFamily:"inherit",cursor:"pointer"}}>
              {orgHorizontal?"↕ תצוגה אנכית":"↔ תצוגה לרוחב"}
            </button>
          </div>
          <div style={{overflow:"auto",paddingBottom:8,maxHeight:orgHorizontal?"68vh":"none"}}>
            <OrgBranch node={buildDeptTree(d,members)} isRoot horizontal={orgHorizontal}/>
          </div>
        </>),()=>setSelDept(null),1120,600);
      })()}

      {/* ── Worker detail card ── */}
      {selUser&&(()=>{
        const u=selUser;const st=userStatus(u.id);const sc=statusBg[st];const rc=ROLES[u.role]?.color||"#3b82f6";
        const perf=perfFor([u.id]);const dept=deptList.find(d=>d.id===u.departmentId);
        const mgr=users.find(x=>x.id===u.managerId);const items=liveItems(u);const stageData=stageBreakdown([u.id]);
        return overlay((<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:46,height:46,borderRadius:"50%",background:rc+"22",color:rc,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:800,flexShrink:0}}>{ROLES[u.role]?.icon||u.name?.charAt(0)||"?"}</div>
              <div>
                <div style={{fontSize:19,fontWeight:900,color:textC}}>{u.name}</div>
                <div style={{fontSize:12,color:rc,fontWeight:600}}>{ROLES[u.role]?.label||u.role}</div>
                <div style={{fontSize:11,color:dimC,marginTop:2}}>{dept?`🏢 ${dept.name}`:"ללא מחלקה"}{mgr?` · מנהל: ${mgr.name}`:""}</div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>{monthSelect()}
              <button onClick={()=>setSelWorker(null)} style={{background:innerBg,border:`1px solid ${borderC}`,borderRadius:8,padding:"5px 11px",fontSize:13,color:mutedC,fontFamily:"inherit"}}>✕</button>
            </div>
          </div>

          {/* Live status */}
          <div style={{background:innerBg,borderRadius:12,padding:14,border:`2px solid ${sc}`,marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:items.length?10:0}}>
              <span style={{width:10,height:10,borderRadius:"50%",background:sc,animation:st==="working"||st==="task"?"pulse 1.6s infinite":"none"}}/>
              <span style={{fontSize:13,fontWeight:700,color:sc}}>{statusLabel[st]}</span>
            </div>
            {items.map(it=>(
              <div key={it.key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginTop:6,fontSize:12}}>
                <span style={{color:it.color,fontWeight:600}}>{it.icon} {it.label} <span style={{color:dimC,fontWeight:400}}>{it.meta}</span></span>
                <span style={{color:"#f59e0b",fontVariantNumeric:"tabular-nums",fontWeight:700}}>{it.time}</span>
              </div>
            ))}
            {items.length===0&&<div style={{fontSize:11.5,color:dimC,marginTop:6}}>אין פעילות פעילה כרגע</div>}
          </div>

          {/* Month stats */}
          <div style={{fontWeight:700,fontSize:13,color:textC,marginBottom:8}}>📊 ביצועים — {fmtMonthLabel(selMonth)}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:8,marginBottom:16}}>
            <KBox i="📦" v={perf.units} label="פעולות" c="#06b6d4"/>
            <KBox i="📌" v={perf.tasksN} label="משימות" c="#a78bfa"/>
            <KBox i="⏱️" v={fmtTime(perf.min)} label="שעות" c="#3b82f6"/>
            <KBox i="💵" v={fmtMoney(perf.cost)} label="עלות" c="#f97316"/>
            <KBox i="💰" v={fmtMoney(perf.sale)} label="שווי מכירה" c="#10b981"/>
            <KBox i="📈" v={fmtMoney(perf.profit)} label="רווח" c={perf.profit>=0?"#10b981":"#ef4444"}/>
          </div>

          {stageData.length>0&&(
            <div style={{background:innerBg,borderRadius:12,padding:14}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
                <div style={{fontWeight:700,fontSize:13,color:textC}}>🔧 תפוקה לפי שלב</div>
                <ChartInfo title="תפוקה לפי שלב — עובד"
                  shows="עמודות אופקיות שמראות כמה פעולות העובד ביצע בכל שלב ייצור במהלך החודש הנוכחי."
                  data="מספר הפעולות שהעובד השלים בכל שלב, מדורג מהגבוה לנמוך."
                  how="המערכת סופרת רק את רישומי העבודה שהושלמו על ידי העובד, שתאריך סיומם נופל בחודש הנוכחי, ומקבצת אותם לפי שלב."
                  tip="כך מזהים את השלבים שבהם העובד הכי פעיל או מתמחה."/>
              </div>
              <HBarChart data={stageData} formatVal={v=>`${v} פעולות`}/>
            </div>
          )}
        </>),()=>setSelWorker(null),640,700);
      })()}
    </div>
  );
}

// ═══ MONTHLY PDF REPORT ════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function MonthlyReportModal({orders,workLogs,stages,projects,users,onClose}){
  const now=new Date();
  const [selYear,setSelYear]=useState(now.getFullYear());
  const [selMonth,setSelMonth]=useState(now.getMonth()+1);
  const [generating,setGenerating]=useState(false);
  const monthNames=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  const years=Array.from({length:5},(_,i)=>now.getFullYear()-i);
  const month=`${selYear}-${String(selMonth).padStart(2,"0")}`;

  const generate=()=>{
    setGenerating(true);
    try{
      const [y,m]=[selYear,selMonth];
      const fLogs=workLogs.filter(w=>{if(!w.completed||!w.endTime)return false;const d=new Date(w.endTime);return d.getFullYear()===y&&d.getMonth()+1===m});
      const fOrders=orders.filter(o=>o.receivedDate&&new Date(o.receivedDate).getFullYear()===y&&new Date(o.receivedDate).getMonth()+1===m);

      // Build HTML report
      const totalMin=fLogs.reduce((s,w)=>s+w.durationMin,0);
      const totalRev=fOrders.reduce((s,o)=>s+Number(o.unitPrice||0)*Number(o.qty||0),0);
      const workerStats={};
      fLogs.forEach(w=>{
        if(!workerStats[w.userId])workerStats[w.userId]={name:w.userName,min:0,units:0};
        workerStats[w.userId].min+=w.durationMin;
        workerStats[w.userId].units++;
      });

      const html=`<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="utf-8"/>
<style>body{font-family:Arial,sans-serif;direction:rtl;padding:40px;color:#1a1f2e;max-width:900px;margin:0 auto}
h1{color:#3b82f6;border-bottom:3px solid #3b82f6;padding-bottom:12px}
h2{color:#374151;margin-top:32px;font-size:16px;border-bottom:1px solid #e5e7eb;padding-bottom:6px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th{background:#f3f4f6;padding:8px 10px;text-align:right;font-weight:600;border:1px solid #e5e7eb}
td{padding:7px 10px;border:1px solid #e5e7eb}tr:nth-child(even){background:#f9fafb}
.kpi{display:inline-block;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 20px;margin:6px;text-align:center}
.kpi-v{font-size:24px;font-weight:800;color:#2563eb}.kpi-l{font-size:11px;color:#6b7280}
.footer{margin-top:40px;padding-top:16px;border-top:1px solid #e5e7eb;font-size:11px;color:#9ca3af}
</style></head><body>
<h1>דוח חודשי — OmniView</h1>
<p style="color:#6b7280;margin-bottom:20px">תקופה: ${new Date(y,m-1).toLocaleString("he-IL",{month:"long",year:"numeric"})} | הופק: ${new Date().toLocaleDateString("he-IL")}</p>
<div>
  <div class="kpi"><div class="kpi-v">${fOrders.length}</div><div class="kpi-l">פקעות שנפתחו</div></div>
  <div class="kpi"><div class="kpi-v">${fLogs.length}</div><div class="kpi-l">פעולות עבודה</div></div>
  <div class="kpi"><div class="kpi-v">${Math.round(totalMin/60)} שע'</div><div class="kpi-l">סה"כ שעות</div></div>
  <div class="kpi"><div class="kpi-v">₪${totalRev.toLocaleString("he-IL")}</div><div class="kpi-l">הכנסה פוטנציאלית</div></div>
</div>
<h2>📋 פקעות החודש</h2>
<table><thead><tr><th>מספר פקעה</th><th>תיאור</th><th>P/N</th><th>כמות</th><th>פרויקט</th><th>יעד אספקה</th></tr></thead><tbody>
${fOrders.map(o=>`<tr><td>${o.woNumber}</td><td>${o.description||"—"}</td><td>${o.pn||"—"}</td><td>${o.qty}</td><td>${projects.find(p=>p.id===o.projectId)?.name||"—"}</td><td>${o.targetDate||"—"}</td></tr>`).join("")}
</tbody></table>
<h2>👥 ביצועי עובדים</h2>
<table><thead><tr><th>עובד</th><th>פעולות</th><th>שעות</th></tr></thead><tbody>
${Object.values(workerStats).sort((a,b)=>b.min-a.min).map(w=>`<tr><td>${w.name}</td><td>${w.units}</td><td>${Math.round(w.min/60)}</td></tr>`).join("")}
</tbody></table>
<div class="footer">דוח זה הופק אוטומטית ממערכת OmniView v${APP_VERSION}</div>
</body></html>`;

      const blob=new Blob([html],{type:"text/html;charset=utf-8"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=`דוח_ייצור_${month}.html`;
      a.click();
      URL.revokeObjectURL(a.href);
    }finally{setGenerating(false)}
  };

  return(
    <Modal onClose={onClose}>
      <div style={{fontWeight:700,fontSize:18,color:"#60a5fa",marginBottom:20}}>📄 דוח חודשי</div>
      <div style={{marginBottom:16}}>
        <label style={{fontSize:12,color:"var(--c-dim)",display:"block",marginBottom:8}}>בחר תקופה</label>
        <div style={{display:"flex",gap:10}}>
          <select value={selMonth} onChange={e=>setSelMonth(Number(e.target.value))} style={{flex:1,padding:"10px 12px",fontSize:15,fontWeight:600}}>
            {monthNames.map((n,i)=><option key={i} value={i+1}>{n}</option>)}
          </select>
          <select value={selYear} onChange={e=>setSelYear(Number(e.target.value))} style={{width:100,padding:"10px 12px",fontSize:15,fontWeight:600}}>
            {years.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>
      <div style={{background:"var(--c-deep)",borderRadius:10,padding:14,marginBottom:16,fontSize:13,color:"var(--c-muted)"}}>
        הדוח יכלול: פקעות שנפתחו, פעולות עבודה, ביצועי עובדים, ו-KPI של החודש. ייפתח כקובץ HTML שניתן להדפסה.
      </div>
      <div style={{display:"flex",gap:10}}>
        <Btn color="#3b82f6" onClick={generate} disabled={generating}>{generating?"⏳ מייצר...":"📥 הורד דוח"}</Btn>
        <Btn onClick={onClose}>סגור</Btn>
      </div>
    </Modal>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ HISTORY PANEL ════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function HistoryPanel({onClose,orders,updO,workLogs,onDeleteLog,onUndoWorkLog,customTasks,onUndoTask,onDeleteTask}){
  const {toast}=useToast();
  const [auditLog,setAuditLog]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState("all");

  // Journal entries carry the before-state, so they are what the ↩️ button acts on.
  const [journal,setJournal]=useState(()=>UNDO.list());
  const [reverting,setReverting]=useState("");
  const journalById=useMemo(()=>new Map(journal.map(e=>[e.id,e])),[journal]);
  useEffect(()=>{
    // Scoped to this company — the log used to show every company's activity.
    SB.get("audit_log",`company_id=eq.${getCompanyId()}&order=created_at.desc&limit=200`).then(rows=>{
      setAuditLog(rows.map(r=>({
        id:r.id,userId:r.user_id,username:r.username,name:r.name,
        action:r.action,target:r.target,details:r.details,
        reverted:r.reverted,canUndo:r.can_undo,timestamp:r.created_at
      })));
      setLoading(false);
    }).catch(()=>{
      setAuditLog(getAuditLog().filter(e=>!e.companyId||e.companyId===getCompanyId()));
      setLoading(false);
    });
  },[]);

  // A journal entry that never reached the server (offline, or the row was
  // trimmed) still belongs in the list, so the two sources are merged by id.
  const merged=useMemo(()=>{
    const seen=new Set(auditLog.map(e=>e.id));
    const extra=journal.filter(e=>!seen.has(e.id)).map(e=>({
      id:e.id,userId:e.userId,username:e.username,name:e.name,action:e.action,
      target:e.target,details:e.details,reverted:e.reverted,canUndo:true,timestamp:e.timestamp
    }));
    return[...auditLog,...extra].sort((a,b)=>String(b.timestamp||"").localeCompare(String(a.timestamp||"")));
  },[auditLog,journal]);

  // Declared before `filtered`, which calls it while rendering.
  const canUndo=(entry)=>{
    if(entry.reverted)return false;
    const je=journalById.get(entry.id);
    if(je)return!je.reverted;
    // Both branches below find the work log by its S/N. A quantity report has none —
    // it is taken back from the פק"ע's own history (🕘 in דיווח לפי כמות), or, while
    // it is still running, from "בטל התחלה" on the worker's card.
    if(String(entry.target||"").includes(QTY_UNIT_TAG))return false;
    if(entry.action.includes("סיום עבודה")||entry.action.includes("חתימת מנהל"))return true;
    if(entry.action.includes("התחלת עבודה"))return true;
    if(entry.canUndo&&entry.action.includes("ייבוא"))return true;
    return false;
  };

  const filtered=merged.filter(e=>{
    if(filter==="undo")return canUndo(e);
    if(filter==="all")return true;
    if(filter==="login")return e.action.includes("התחבר");
    if(filter==="work")return e.action.includes("עבוד")||e.action.includes("סיום")||e.action.includes("הפסקה")||e.action.includes("חתימ");
    if(filter==="admin")return e.action.includes("משתמש")||e.action.includes("ייבוא")||e.action.includes("מחיקה")||e.action.includes("מחלקה")||e.action.includes("חברה");
    return true;
  });

  const actionColor=a=>{
    if(a.includes("התחבר"))return"#60a5fa";
    if(a.includes("סיום")||a.includes("הושלם")||a.includes("חתימ"))return"#10b981";
    if(a.includes("הפסקה"))return"#f59e0b";
    if(a.includes("מחיקה")||a.includes("ביטול"))return"#ef4444";
    if(a.includes("הוספ")||a.includes("יצירה")||a.includes("התחלת"))return"#a78bfa";
    return"#8b95a8";
  };

  // Undo. An entry the journal knows is restored from its own snapshot — that
  // covers every manager action. The work-log cases below predate the journal and
  // stay for entries recorded before it existed.
  const undoEntry=async(entry)=>{
    const je=journalById.get(entry.id);
    if(je&&!je.reverted){
      const scope=(je.changes||[]).map(c=>`${UNDO_COLL[c.coll]?.label||c.coll}: ${c.before.length} לשחזור${c.after.filter(id=>!c.before.some(r=>r.id===id)).length?` · ${c.after.filter(id=>!c.before.some(r=>r.id===id)).length} להסרה`:""}`).join(" | ");
      if(!confirm(`לאחזר את המצב שלפני "${entry.action}"${entry.target?` — ${entry.target}`:""}?\n${scope}`))return;
      setReverting(entry.id);
      try{
        const what=await UNDO.revert(entry.id);
        setJournal(UNDO.list());
        setAuditLog(prev=>prev.map(e=>e.id===entry.id?{...e,reverted:true}:e));
        toast(`אוחזר: ${what||entry.action}`,"success",5000);
      }catch(err){toast(err.message||String(err),"error",6000)}
      setReverting("");
      return;
    }

    if(!confirm(`לבטל פעולה: ${entry.action} — ${entry.target||""}?`))return;

    if(entry.action.includes("סיום עבודה")||entry.action.includes("חתימת מנהל")){
      // Find the work log for this serial + stage combo
      const sn=entry.target;
      const stageName=(entry.details||"").split("—").pop()?.trim();
      const log=(workLogs||[]).find(w=>w.completed&&w.serialSn===sn&&(!stageName||stages.find(s=>s.id===w.stageId)?.name?.trim()===stageName));
      if(log){
        onUndoWorkLog&&onUndoWorkLog(log.id);
        addAuditEntry({userId:entry.userId,username:entry.username,name:entry.name,action:"ביטול פעולה",target:entry.target,details:`בוטל: ${entry.action}`});
        setAuditLog(prev=>prev.map(e=>e.id===entry.id?{...e,reverted:true}:e));
      }else{
        toast("לא נמצא רשומת עבודה מתאימה לביטול","warning");
      }
    }else if(entry.action.includes("התחלת עבודה")){
      // Delete the active (uncompleted) work log
      const sn=entry.target;
      const log=(workLogs||[]).find(w=>!w.completed&&w.serialSn===sn);
      if(log){
        onDeleteLog&&onDeleteLog([log.id]);
        addAuditEntry({userId:entry.userId,username:entry.username,name:entry.name,action:"ביטול פעולה",target:entry.target,details:`בוטל: ${entry.action}`});
        setAuditLog(prev=>prev.map(e=>e.id===entry.id?{...e,reverted:true}:e));
      }else{toast("לא נמצאה רשומה פעילה לביטול","warning")}
    }else if(entry.canUndo&&entry.action.includes("ייבוא")){
      const snapshot=LS.get("importSnapshot");
      if(!snapshot)return toast("אין גיבוי לשחזור","warning");
      if(!confirm(`לשחזר ${snapshot.length} פקעות מלפני הייבוא?`))return;
      updO(snapshot);
      LS.set("importSnapshot",null);
      setAuditLog(prev=>prev.map(e=>e.id===entry.id?{...e,reverted:true}:e));
    }else{
      toast("לפעולה זו לא נשמר מצב קודם — היא בוצעה לפני שהאחזור הופעל","warning",6000);
    }
  };


  // Access stages from global scope
  const stages=window.__pml_stages||[];

  return(
    <Modal onClose={onClose} wide>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:18,color:"#60a5fa"}}>📋 היסטוריית פעילות</div>
        <IBtn onClick={onClose}>✕</IBtn>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
        {[["all","הכל"],["undo","↩️ ניתן לאחזור"],["login","התחברויות"],["work","עבודה"],["admin","ניהול"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{background:filter===v?"var(--c-accent)":"var(--c-deep)",border:`1px solid ${filter===v?"var(--c-accent)":"var(--c-border)"}`,color:filter===v?"#fff":"var(--c-muted)",borderRadius:8,padding:"5px 12px",fontSize:12,fontFamily:"inherit",cursor:"pointer"}}>{l}</button>
        ))}
        <span style={{fontSize:12,color:"var(--c-dim)",padding:"5px 0",marginRight:"auto"}}>{filtered.length} רשומות</span>
      </div>
      {loading?<div style={{textAlign:"center",padding:30,color:"var(--c-dim)"}}>⏳ טוען...</div>:(
        <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:"60vh",overflowY:"auto"}}>
          {filtered.map(e=>(
            <div key={e.id} style={{background:e.reverted?"var(--c-card)":"var(--c-deep)",borderRadius:8,padding:"10px 12px",border:`1px solid ${e.reverted?"#ef444433":actionColor(e.action)+"22"}`,display:"flex",gap:10,alignItems:"flex-start",opacity:e.reverted?.5:1}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:e.reverted?"#ef4444":actionColor(e.action),marginTop:5,flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
                  <span><b style={{color:"#60a5fa"}}>{e.name||e.username||"מערכת"}</b><span style={{color:"var(--c-muted)",marginRight:6}}>{e.action}</span>{e.target&&<span style={{color:"var(--c-dim)",fontSize:12}}> — {e.target}</span>}{e.reverted&&<span style={{fontSize:11,color:"#ef4444",marginRight:6}}> (בוטל)</span>}</span>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    {canUndo(e)&&<button onClick={()=>undoEntry(e)} disabled={reverting===e.id} style={{background:"#f59e0b22",border:"1px solid #f59e0b44",color:"#f59e0b",borderRadius:6,padding:"2px 10px",fontSize:11,fontWeight:700,fontFamily:"inherit",cursor:"pointer",whiteSpace:"nowrap",opacity:reverting===e.id?.6:1}}>{reverting===e.id?"…":"↩️ אחזר"}</button>}
                    <span style={{fontSize:11,color:"var(--c-dim)",whiteSpace:"nowrap"}}>{e.timestamp?new Date(e.timestamp).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}</span>
                  </div>
                </div>
                {e.details&&<div style={{fontSize:11,color:"var(--c-dim)",marginTop:3}}>{e.details}</div>}
              </div>
            </div>
          ))}
          {filtered.length===0&&<EmptyState icon="📜" title="אין רשומות" subtitle="נסה לשנות את הסינון"/>}
        </div>
      )}
    </Modal>
  );
}

let saveTimer=null;
function App(){
  const {toast}=useToast();

  const [currentUser,setCurrentUser]=useState(()=>{
    try{const saved=localStorage.getItem(LS_PREFIX+"session");if(saved){const s=JSON.parse(saved);const cached=JSON.parse(localStorage.getItem(LS_PREFIX+"users")||"[]");const found=cached.find(u=>u.id===s.id&&u.username===s.username&&u.active!==false);if(found)return found}return null}catch{return null}
  });
  const [tab,setTab]=useState("dashboard");

  const [usersTick,setUsersTick]=useState(0);
  const [workdayHours,setWorkdayHours]=useState(()=>{const v=Number(LS.get(WORKDAY_LS_KEY));return v>0?v:8});

  const [sync,setSync]=useState("ok");

  const [installPrompt,setInstallPrompt]=useState(null);

  const [isStandalone,setIsStandalone]=useState(()=>window.matchMedia("(display-mode:standalone)").matches||!!window.navigator.standalone);

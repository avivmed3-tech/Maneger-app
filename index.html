  },[lightMode]);

  // ── Session timeout — auto logout after inactivity ──────────────
  useEffect(()=>{
    if(!currentUser)return;
    const resetActivity=()=>{lastActivityRef.current=Date.now()};
    const events=["mousedown","keydown","touchstart","scroll"];
    events.forEach(e=>window.addEventListener(e,resetActivity,{passive:true}));
    const checker=setInterval(()=>{
      if(Date.now()-lastActivityRef.current>SESSION_TIMEOUT_MIN*60*1000){
        toast("נותקת אוטומטית בגלל חוסר פעילות","warning");
        setCurrentUser(null);try{localStorage.removeItem(LS_PREFIX+"session")}catch{}
      }
    },60000);
    return()=>{events.forEach(e=>window.removeEventListener(e,resetActivity));clearInterval(checker)};
  },[currentUser]);

  useEffect(()=>{
    // Check if we migrated to Supabase already — if not, clear old Google Sheets localStorage
    const migrated=LS.get("sb_migrated");
    if(!migrated){
      // Clear any stale data from Google Sheets era
      ["orders","projects","stages","workLogs","customTasks","stageBlocks","users","session"].forEach(k=>{
        try{localStorage.removeItem(LS_PREFIX+k)}catch{}
      });
      LS.set("sb_migrated",true);
      setCurrentUser(null);
    }

    // Load from localStorage ONLY if same company (prevent cross-company data flash)
    const cachedSession=LS.get("session_company");
    const sessionCid=cachedSession||DEFAULT_COMPANY_ID;
    if(sessionCid===_companyId){
      const lo=LS.get("orders"),lp=LS.get("projects"),ls=LS.get("stages"),lw=LS.get("workLogs");
      if(lo)setOrders(lo);if(lp)setProjects(lp);if(ls)setStages(ls);if(lw)setWorkLogs(lw);
      const lct=LS.get("customTasks");if(lct)setCustomTasks(lct);
      const lsb=LS.get("stageBlocks");if(lsb)setStageBlocks(lsb);
      const ldp=LS.get("departments");if(ldp)setDepartments(ldp);
      const lpl=LS.get("dailyPlans");if(lpl)setDailyPlans(lpl);
      const lps=LS.get("pnStandards");if(lps)setPnStandards(lps);
    }

    // Then always load from Supabase (Supabase is the source of truth)
    Promise.all([dbLoadAll(),dbLoadUsers()]).then(async([data,users])=>{
      if(data){
        // Always prefer Supabase data — update state and cache
        setOrders(data.orders||[]);LS.set("orders",data.orders||[]);
        setProjects(data.projects?.length?data.projects:DEF_PROJ);LS.set("projects",data.projects?.length?data.projects:DEF_PROJ);
        setStages(data.stages?.length?data.stages:DEF_STAGES);LS.set("stages",data.stages?.length?data.stages:DEF_STAGES);
        setWorkLogs(data.workLogs||[]);LS.set("workLogs",data.workLogs||[]);
        setCustomTasks(data.customTasks||[]);LS.set("customTasks",data.customTasks||[]);
        setStageBlocks(data.stageBlocks||[]);LS.set("stageBlocks",data.stageBlocks||[]);
        setDepartments(data.departments||[]);LS.set("departments",data.departments||[]);
        setDailyPlans(data.dailyPlans||[]);LS.set("dailyPlans",data.dailyPlans||[]);
        // null = the pn_standards table isn't there yet — keep the local copy
        if(data.pnStandards){setPnStandards(data.pnStandards);LS.set("pnStandards",data.pnStandards)}
        LS.set("session_company",_companyId);
        // This was a full read; the sweeps that follow can go incremental.
        lastFullSweepRef.current=Date.now();
        commitLogWatermark(data);
      }
      if(users?.length){LS.set("users",users)}

      // Seed default projects/stages/users if DB is empty
      if(!data?.projects?.length){
        SB.upsert("projects",DEF_PROJ.map(projectToDb)).catch(()=>{});
      }
      if(!data?.stages?.length){
        SB.upsert("stages",DEF_STAGES.map(stageToDb)).catch(()=>{});
      }
      // Seed fallback users + their departments with hashed passwords if no users in DB
      if(!users?.length){
        try{
          // This company has no users of its own, but the demo logins may still be
          // taken elsewhere in app_users — resolve the ids the same way the demo
          // loader does so the seed merges instead of failing on the unique index.
          const cid=_companyId||DEFAULT_COMPANY_ID;
          const {idMap}=await resolveDemoUsers(FALLBACK_USERS,cid);
          await SB.upsert("departments",DEF_DEPTS.map(d=>deptToDb({...d,managerId:idMap[d.managerId]||"",companyId:cid}))).catch(()=>{});
          const seeded=await buildDemoUserRows(FALLBACK_USERS,idMap,cid);
          await SB.upsert("app_users",seeded);
          LS.set("users",seeded.map(dbToUser));
        }catch(e){console.warn("Seed users error",e)}
      }

      // Restore session from fresh user list
      try{
        const saved=localStorage.getItem(LS_PREFIX+"session");
        if(saved){
          const s3=JSON.parse(saved);
          const freshUsers=users?.length?users:getUsers();
          const found=freshUsers.find(u=>u.id===s3.id&&u.username===s3.username&&u.active!==false);
          if(found){
            const realCid=found.companyId||s3.companyId||DEFAULT_COMPANY_ID;
            setCurrentUser(found);
            // The load above already ran against the company saved in the session.
            // If the user has since been moved, that data belongs to someone else:
            // switch companies and read again rather than showing it.
            if(realCid!==_companyId){
              setCompanyId(realCid);
              try{localStorage.setItem(LS_PREFIX+"session",JSON.stringify({id:found.id,username:found.username,companyId:realCid}))}catch{}
              SYNC.reset();
              const [d2,u2]=await Promise.all([dbLoadAll(),dbLoadUsers()]);
              setOrders(d2.orders||[]);LS.set("orders",d2.orders||[]);
              setProjects(d2.projects?.length?d2.projects:DEF_PROJ);LS.set("projects",d2.projects?.length?d2.projects:DEF_PROJ);
              setStages(d2.stages?.length?d2.stages:DEF_STAGES);LS.set("stages",d2.stages?.length?d2.stages:DEF_STAGES);
              setWorkLogs(d2.workLogs||[]);LS.set("workLogs",d2.workLogs||[]);
              setCustomTasks(d2.customTasks||[]);LS.set("customTasks",d2.customTasks||[]);
              setStageBlocks(d2.stageBlocks||[]);LS.set("stageBlocks",d2.stageBlocks||[]);
              setDepartments(d2.departments||[]);LS.set("departments",d2.departments||[]);
              setDailyPlans(d2.dailyPlans||[]);LS.set("dailyPlans",d2.dailyPlans||[]);
              if(d2.pnStandards){setPnStandards(d2.pnStandards);LS.set("pnStandards",d2.pnStandards)}
              if(u2?.length)LS.set("users",u2);
              LS.set("session_company",realCid);
              commitLogWatermark(d2);
            }
          }else{localStorage.removeItem(LS_PREFIX+"session");setCurrentUser(null)}
        }
      }catch{}
      setLoading(false);
    }).catch(()=>{
      // Supabase unreachable — use local cache
      try{const saved=localStorage.getItem(LS_PREFIX+"session");if(saved){const s3=JSON.parse(saved);const found=getUsers().find(u=>u.id===s3.id&&u.username===s3.username&&u.active!==false);if(found)setCurrentUser(found)}}catch{}
      setLoading(false);
    });
  },[]);

  useEffect(()=>{oRef.current=orders},[orders]);
  useEffect(()=>{pRef.current=projects},[projects]);
  useEffect(()=>{sRef.current=stages},[stages]);
  useEffect(()=>{wRef.current=workLogs},[workLogs]);

  // ── Refresh from Supabase ──────────────────────────────────────
  const lastPersistRef=useRef(0);
  // When the whole of work_logs was last read. Between full sweeps the refresh
  // only reads the rows that can have changed — see dbLoadHotLogs.
  const FULL_SWEEP_MS=5*60*1000;
  const lastFullSweepRef=useRef(0);
  const pendingSaveRef=useRef(false); // local changes not yet confirmed saved to Supabase
  const saveRunningRef=useRef(false); // an upsert batch is currently in flight
  const doSaveRef=useRef(null);
  // Assigned further down, once cacheLS and the collection refs exist. The sweep
  // and the manual refresh reach it through the ref so they always call the
  // current one rather than the copy captured when their closure was built.
  const applyRemoteRef=useRef(null);
  // Applying remote data must be blocked while a local change is unsaved, a save is
  // in flight, or a save just landed — a fetch that started before the save finished
  // returns stale rows and would overwrite the local change (the "click resets" bug).
  const remoteApplyBlocked=()=>pendingSaveRef.current||saveRunningRef.current||Date.now()-lastPersistRef.current<5000;
  const refreshFromDB=useCallback(async(force)=>{
    if(!force&&remoteApplyBlocked())return;
    setSync("saving");
    try{
      // A manual refresh must not clobber unsaved local changes — wait for any
      // in-flight save, flush any pending one, and bail if the data still isn't saved
      for(let i=0;i<50&&saveRunningRef.current;i++)await new Promise(r=>setTimeout(r,100));
      if(pendingSaveRef.current){clearTimeout(saveTimer);await doSaveRef.current?.()}
      if(pendingSaveRef.current||saveRunningRef.current)throw new Error("unsaved local changes");
      const [data,users]=await Promise.all([dbLoadAll(),dbLoadUsers()]);
      lastFullSweepRef.current=Date.now();
      if(data)applyRemoteRef.current(data);
      if(users?.length)LS.set("users",users);
      setSync("ok");
    }catch{setSync("error")}
  },[]);

  // ── Supabase Realtime (with polling fallback) ──────────────────
  const [onlineUsers,setOnlineUsers]=useState([]);
  useEffect(()=>{
    if(!currentUser)return;
    let dead=false;
    let pollTimer=null;
    let ws=null;let heartbeat=null;let reconnectTimer=null;
    let realtimeWorking=false;
    // Which tables the server has actually confirmed a postgres_changes subscription
    // for. An open socket proves nothing — if the table is missing from the
    // supabase_realtime publication the join still returns, and not one change
    // event ever arrives.
    const joined=new Set();

    // Safety-net sweep. Realtime pushes changes the moment they land, so it can be
    // slow — but only once the subscription is confirmed; otherwise it IS the
    // update path and has to stay quick. A sweep skipped because of an in-flight
    // save retries in a moment, never a whole interval later: that wait was what
    // made a finished job keep showing as active for more than a minute.
    const POLL_LIVE=15000,POLL_FALLBACK=5000,POLL_BLOCKED=1500;
    const pollDelay=()=>realtimeWorking?POLL_LIVE:POLL_FALLBACK;
    // Set whenever fresh data had to be turned away, so the sweep that re-arms
    // afterwards stays quick even if an in-flight poll finishes in between and
    // would otherwise re-arm at the slow cadence.
    let sweepSoon=false;
    const arm=ms=>{if(dead)return;clearTimeout(pollTimer);pollTimer=setTimeout(poll,ms)};
    const pollSoon=()=>{sweepSoon=true;arm(POLL_BLOCKED)};

    // How the sweep asks for work_logs: the hot slice normally, the whole table
    // every FULL_SWEEP_MS so a row deleted elsewhere eventually disappears here
    // too. See dbLoadHotLogs.
    const hotArg=()=>{
      if(Date.now()-lastFullSweepRef.current>FULL_SWEEP_MS)return null;
      const prev=wRef.current||[];
      return{prev,openIds:prev.filter(w=>!w.completed).map(w=>w.id)};
    };
    const poll=async()=>{
      if(dead)return;
      // Skip while a local change is unsaved / just saved (avoid overwriting it)
      if(remoteApplyBlocked()){arm(POLL_BLOCKED);return}
      try{
        sweepSoon=false;
        const hot=hotArg();
        const data=await dbLoadAll(hot);
        if(!hot)lastFullSweepRef.current=Date.now();
        if(dead)return;
        // Re-check — the user may have clicked an action while the fetch was in flight,
        // in which case this data is stale and applying it would undo the click.
        if(data&&remoteApplyBlocked()){pollSoon();return}
        if(data){
          // Only the collections that actually moved are applied — see applyRemote.
          applyRemoteRef.current(data);
          setSync("ok");
        }
      }catch(e){console.warn("Poll error",e)}
      arm(sweepSoon?POLL_BLOCKED:pollDelay());
    };
    // Start polling after a short delay
    pollTimer=setTimeout(poll,2000);

    // Try Supabase Realtime WebSocket
    const wsUrl=`wss://lwiurzkiojctwzllpnmr.supabase.co/realtime/v1/websocket?apikey=${SB_KEY}&vsn=1.0.0`;
    const connect=()=>{
      if(dead)return;
      try{
        ws=new WebSocket(wsUrl);
        ws.onopen=()=>{
          console.log("Realtime WS connected");
          const tables=["orders","work_logs","custom_tasks","stages","projects","stage_blocks","departments","daily_plans","pn_standards"];
          tables.forEach((t,i)=>{
            ws.send(JSON.stringify({
              topic:`realtime:public:${t}`,
              event:"phx_join",
              payload:{config:{broadcast:{ack:false},presence:{key:""},postgres_changes:[{event:"*",schema:"public",table:t}]}},
              ref:String(i+1)
            }));
          });
          heartbeat=setInterval(()=>{try{ws.send(JSON.stringify({topic:"phoenix",event:"heartbeat",payload:{},ref:"hb"}))}catch{}},25000);
          // realtimeWorking stays false until the joins are confirmed below —
          // until then the poll is the update path and must keep its fast cadence.
          setSync("ok");
        };
        ws.onmessage=async(e)=>{
          try{
            const msg=JSON.parse(e.data);
            // Join acknowledgements — the server echoes back the postgres_changes
            // filters it accepted. Only tables in that echo actually stream, so a
            // reply carrying an empty list means "connected, but silent".
            if(msg.event==="phx_reply"){
              const jt=msg.topic?.split(":")?.[2];
              const accepted=msg.payload?.response?.postgres_changes;
              if(jt&&msg.payload?.status==="ok"&&(!Array.isArray(accepted)||accepted.length>0))joined.add(jt);
              // work_logs and orders drive the live board; until both are streaming,
              // keep polling at the fallback rate rather than pretending we're live.
              if(!realtimeWorking&&joined.has("work_logs")&&joined.has("orders")){
                realtimeWorking=true;
                console.log("Realtime subscribed:",[...joined].join(", "));
              }
              return;
            }
            // Supabase sends postgres_changes as the event name in the payload
            const isChange=msg.event==="postgres_changes"||
              msg.event==="INSERT"||msg.event==="UPDATE"||msg.event==="DELETE"||
              (msg.payload?.data?.type==="INSERT")||(msg.payload?.data?.type==="UPDATE")||(msg.payload?.data?.type==="DELETE")||
              (msg.payload?.type==="INSERT")||(msg.payload?.type==="UPDATE")||(msg.payload?.type==="DELETE");
            if(!isChange)return;
            // Determine which table changed
            const tbl=msg.payload?.data?.table||msg.payload?.table||msg.topic?.split(":")?.[2];
            if(!tbl)return;
            console.log("Realtime change:",tbl);
            // Never refetch/apply while a local change is unsaved — the change event may be
            // ours (mid-save) or someone else's, and either way stale rows would undo the click.
            // But the event must not be thrown away either: re-sweep in a moment, or the
            // change waits for the next full interval before anyone sees it.
            if(remoteApplyBlocked()){pollSoon();return}
            // Small delay to let write finish
            await new Promise(r=>setTimeout(r,300));
            const cf=`company_id=eq.${_companyId}&`;
            // apply() re-checks the guard — a click may have happened during the fetch
            const apply=(setter,lsKey,rows)=>{if(remoteApplyBlocked()){pollSoon();return}setter(rows);LS.set(lsKey,rows)};
            if(["orders"].includes(tbl)){const rows=(await SB.getAll("orders",cf+ORDER_BY.orders)).map(dbToOrder);SYNC.prime("orders",rows,orderToDb);apply(setOrders,"orders",rows)}
            if(["work_logs"].includes(tbl)){
              // Same reasoning as the sweep: read the rows that can have moved,
              // not the whole progress history, on every stage a worker closes.
              const prev=wRef.current||[];
              const full=Date.now()-lastFullSweepRef.current>FULL_SWEEP_MS;
              let rows;
              if(full){
                rows=(await SB.getAll("work_logs",cf+ORDER_BY.work_logs)).map(dbToLog);
                SYNC.prime("work_logs",rows,logToDb);
                lastFullSweepRef.current=Date.now();
              }else{
                const {rows:hotRows,gone}=await dbLoadHotLogs(_companyId,prev.filter(w=>!w.completed).map(w=>w.id));
                const fresh=hotRows.map(dbToLog);
                SYNC.prime("work_logs",fresh,logToDb);SYNC.forget("work_logs",gone);
                const goneSet=new Set(gone);
                const byId=new Map(prev.filter(w=>!goneSet.has(w.id)).map(w=>[w.id,w]));
                fresh.forEach(w=>byId.set(w.id,w));
                rows=[...byId.values()];
              }
              apply(setWorkLogs,"workLogs",rows);
            }
            if(["custom_tasks"].includes(tbl)){const rows=(await SB.getAll("custom_tasks",cf+ORDER_BY.custom_tasks)).map(dbToTask);apply(setCustomTasks,"customTasks",rows)}
            if(["stages"].includes(tbl)){const rows=(await SB.getAll("stages",cf+ORDER_BY.stages)).map(dbToStage);apply(setStages,"stages",rows)}
            if(["projects"].includes(tbl)){const rows=(await SB.getAll("projects",cf+ORDER_BY.projects)).map(dbToProject);apply(setProjects,"projects",rows)}
            if(["stage_blocks"].includes(tbl)){const rows=(await SB.getAll("stage_blocks",cf+ORDER_BY.stage_blocks)).map(dbToBlock);apply(setStageBlocks,"stageBlocks",rows)}
            if(["departments"].includes(tbl)){const rows=(await SB.getAll("departments",cf+ORDER_BY.departments)).map(dbToDept);apply(setDepartments,"departments",rows)}
            if(["daily_plans"].includes(tbl)){const rows=(await SB.getAll("daily_plans",cf+ORDER_BY.daily_plans)).map(dbToPlan);apply(setDailyPlans,"dailyPlans",rows)}
          }catch(err){console.warn("Realtime msg error",err)}
        };
        ws.onclose=()=>{
          console.log("Realtime WS closed");
          clearInterval(heartbeat);
          realtimeWorking=false;joined.clear();
          if(!dead)reconnectTimer=setTimeout(connect,5000);
        };
        ws.onerror=()=>{realtimeWorking=false;ws.close()};
      }catch(err){console.warn("WS connect error",err);realtimeWorking=false}
    };
    connect();

    return()=>{dead=true;clearInterval(heartbeat);clearTimeout(reconnectTimer);clearTimeout(pollTimer);try{ws?.close()}catch{}};
  },[currentUser?.id]);

  const ctRef=useRef(customTasks);
  useEffect(()=>{ctRef.current=customTasks},[customTasks]);
  const sbRef=useRef(stageBlocks);
  useEffect(()=>{sbRef.current=stageBlocks},[stageBlocks]);
  const dpRef=useRef(departments);
  useEffect(()=>{dpRef.current=departments},[departments]);
  const plRef=useRef(dailyPlans);
  useEffect(()=>{plRef.current=dailyPlans},[dailyPlans]);
  const psRef=useRef(pnStandards);
  useEffect(()=>{psRef.current=pnStandards},[pnStandards]);

  // Saves the latest state (from refs) to Supabase. Marks the data "unsaved" again and
  // retries on failure, so polling/realtime never overwrite a change that didn't land.
  const doSave=async()=>{
    if(saveRunningRef.current){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,1000);return}
    saveRunningRef.current=true;
    pendingSaveRef.current=false;
    try{
      // Only rows whose content actually changed go out — see SYNC. On an ordinary
      // click that is a single row; right after an import it is everything, once.
      //
      // mine() is the last line of defence against cross-company writes: whatever
      // is still sitting in state from a previous session, only rows belonging to
      // the company we are logged into are ever sent.
      const here=getCompanyId();
      const mine=rows=>rows.filter(r=>r&&r.company_id===here);
      await Promise.all([
        SB.upsertChanged("orders",mine(oRef.current.map(orderToDb))),
        SB.upsertChanged("projects",mine(pRef.current.map(projectToDb))),
        SB.upsertChanged("stages",mine(sRef.current.map(stageToDb))),
        SB.upsertChanged("stage_blocks",mine(sbRef.current.map(blockToDb))),
        SB.upsertChanged("work_logs",mine(wRef.current.map(logToDb))),
        SB.upsertChanged("custom_tasks",mine(ctRef.current.map(taskToDb))),
        SB.upsertChanged("departments",mine(dpRef.current.map(deptToDb))),
        SB.upsertChanged("daily_plans",mine(plRef.current.map(planToDb))),
        // Standard times live in their own (newer) table — if it hasn't been created
        // yet the rest of the save must still succeed; the local cache keeps them.
        SB.upsertChanged("pn_standards",mine(psRef.current.map(pnStdToDb))).catch(e=>console.warn("pn_standards save skipped",e)),
      ]);
      lastPersistRef.current=Date.now();
      setSync("ok");
    }catch(e){
      console.warn("Supabase save error",e);setSync("error");
      pendingSaveRef.current=true;
      clearTimeout(saveTimer);saveTimer=setTimeout(doSave,4000);
    }finally{saveRunningRef.current=false}
  };
  doSaveRef.current=doSave;
  // What each cache key was last written from, so an unchanged collection is
  // skipped instead of re-serialised.
  const lsSeen=useRef({});
  const cacheLS=(key,val)=>{
    if(lsSeen.current[key]===val)return;
    lsSeen.current[key]=val;
    LS.set(key,val);
  };
  // ── Applying what a sweep read ──────────────────────────────────────────────
  // A sweep that found nothing new must cost nothing. Each collection is compared
  // against what is already in state (via its ref — the sweep's closure is older
  // than the current render) and skipped when identical, which keeps the existing
  // array identity. That identity is what every downstream useMemo is keyed on, so
  // an unchanged collection now re-renders nothing and re-serialises nothing.
  //
  // The refs are updated here rather than waiting for their effects, so two sweeps
  // in quick succession compare against the newer data, not the older.
  const remoteSlots=[
    ["orders",oRef,setOrders,"orders"],
    ["projects",pRef,setProjects,"projects"],
    ["stages",sRef,setStages,"stages"],
    ["workLogs",wRef,setWorkLogs,"workLogs"],
    ["customTasks",ctRef,setCustomTasks,"customTasks"],
    ["stageBlocks",sbRef,setStageBlocks,"stageBlocks"],
    ["departments",dpRef,setDepartments,"departments"],
    ["dailyPlans",plRef,setDailyPlans,"dailyPlans"],
    // null (not []) when the pn_standards table isn't there yet — the falsy check
    // below then keeps whatever standards are cached locally.
    ["pnStandards",psRef,setPnStandards,"pnStandards"],
  ];
  const applyRemote=(data)=>{
    if(!data)return 0;
    // Reaching here is what makes the rows "applied": the caller has already checked
    // that no local edit is in flight, so the watermark may safely move past them.
    commitLogWatermark(data);
    let changed=0;
    for(const [key,ref,setter,lsKey] of remoteSlots){
      const rows=data[key];
      if(!rows)continue;
      if(sameRows(ref.current,rows))continue;
      ref.current=rows;
      setter(rows);
      cacheLS(lsKey,rows);
      changed++;
    }
    return changed;
  };
  applyRemoteRef.current=applyRemote;
  const persist=(no,np,ns,nw,nct,nsb,ndp,npl,nps)=>{
    const o=no??oRef.current,p=np??pRef.current,s=ns??sRef.current,w=nw??wRef.current,ct=nct??ctRef.current,sb=nsb??sbRef.current,dp=ndp??dpRef.current,pl=npl??plRef.current,ps=nps??psRef.current;
    // Refs lag one render behind the state — sync them now so doSave sees this change
    oRef.current=o;pRef.current=p;sRef.current=s;wRef.current=w;ctRef.current=ct;sbRef.current=sb;dpRef.current=dp;plRef.current=pl;psRef.current=ps;
    // Save to localStorage immediately — but only the collections that actually
    // changed. These arrays are replaced, never mutated, so an identity check is
    // enough, and it keeps a single click from re-serialising every פק"ע, every
    // סידורי and every רישום התקדמות in the company.
    cacheLS("orders",o);cacheLS("projects",p);cacheLS("stages",s);cacheLS("workLogs",w);
    cacheLS("customTasks",ct);cacheLS("stageBlocks",sb);cacheLS("departments",dp);
    cacheLS("dailyPlans",pl);cacheLS("pnStandards",ps);
    lastPersistRef.current=Date.now();
    pendingSaveRef.current=true;
    setSync("saving");clearTimeout(saveTimer);
    saveTimer=setTimeout(doSave,800);
  };

  // ── Undo applier ─────────────────────────────────────────────────────────
  // The journal knows *what* to put back; this is the only place that knows how.
  // Each collection is merged by id — restored rows overwrite, created rows are
  // dropped — then written to state, the local cache and Supabase in one go.
  // persist() takes its collections positionally, hence the slot numbers.
  const undoSlot={orders:0,projects:1,stages:2,workLogs:3,customTasks:4,
    stageBlocks:5,departments:6,dailyPlans:7,pnStandards:8};
  const undoSetter={orders:setOrders,projects:setProjects,stages:setStages,
    workLogs:setWorkLogs,customTasks:setCustomTasks,stageBlocks:setStageBlocks,
    departments:setDepartments,dailyPlans:setDailyPlans,pnStandards:setPnStandards};
  const undoApply=useCallback(async(coll,restore,removeIds)=>{
    const spec=UNDO_COLL[coll];
    if(!spec)throw new Error("אוסף לא מוכר לאחזור: "+coll);
    const merge=prev=>{
      const byId=new Map((prev||[]).map(r=>[r.id,r]));
      (removeIds||[]).forEach(id=>byId.delete(id));
      (restore||[]).forEach(r=>byId.set(r.id,{...r}));
      return[...byId.values()];
    };
    // Restored rows must go out again even if their fingerprint matches what the
    // server was last known to hold — the row may have been deleted since.
    SYNC.forget(spec.table,(restore||[]).map(r=>r.id));
    if(coll==="users"){
      const next=merge(getUsers());
      await saveUsers(next);
      setUsersTick(t=>t+1);
      window.dispatchEvent(new CustomEvent("pml:users"));
    }else{
      const setter=undoSetter[coll];
      const args=[null,null,null,null,null,null,null,null,null];
      setter(prev=>{const next=merge(prev);args[undoSlot[coll]]=next;persist(...args);return next});
    }
    if((removeIds||[]).length)await SB.delIds(spec.table,removeIds).catch(e=>console.warn("undo delete",e));
  },[]);
  useEffect(()=>{UNDO.setApplier(undoApply)},[undoApply]);

  const handleLogin=u=>{
    const cid=u.companyId||DEFAULT_COMPANY_ID;
    const prevCid=_companyId;
    setCompanyId(cid);
    // If company changed — clear stale cache immediately so no data leaks between companies
    if(cid!==prevCid){
      SYNC.reset();
      setOrders([]);setProjects(DEF_PROJ);setStages(DEF_STAGES);setWorkLogs([]);setCustomTasks([]);setStageBlocks([]);setDepartments([]);setDailyPlans([]);setPnStandards([]);
      ["orders","projects","stages","workLogs","customTasks","stageBlocks","departments","dailyPlans","pnStandards"].forEach(k=>{try{localStorage.removeItem(LS_PREFIX+k)}catch{}});
    }
    setCurrentUser(u);
    LS.set("session_company",cid);
    try{localStorage.setItem(LS_PREFIX+"session",JSON.stringify({id:u.id,username:u.username,companyId:cid}))}catch{}
    SB.get("subscriptions",`company_id=eq.${cid}&status=eq.active`).then(rows=>{
      if(rows&&rows.length>0)setCompanyPlan(rows[0].plan||"free");
    }).catch(()=>{});
  };
  const handleLogout=()=>{
    if(currentUser)addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:"התנתקות",target:"",details:""});
    setCurrentUser(null);try{localStorage.removeItem(LS_PREFIX+"session")}catch{}
  };

  const canEdit=currentUser?.role==="admin"||currentUser?.role==="editor"||currentUser?.canEdit===true;

  // ── Role-based data visibility ──────────────────────────────────────────
  // Only admins, department managers and team leads see beyond their own work.
  const isDeptMgr=currentUser?.role==="dept_manager";
  const allUsers=useMemo(()=>getUsers(),[usersTick,currentUser]);
  // Every derived list below is memoised, and that is not a micro-optimisation:
  // this block runs on *every* render of App — every keystroke, every timer tick,
  // every sweep — and it is the widest scan in the app. Recomputed raw it was the
  // single thing that made the screen stop responding on a real database.
  const allStageIds=useMemo(()=>stages.map(s=>s.id),[stages]);
  const scopeIds=useMemo(()=>overseeingUserIds(currentUser,allUsers,departments),[currentUser,allUsers,departments]);
  const scopeIdSet=useMemo(()=>scopeIds==null?null:new Set(scopeIds),[scopeIds]);
  const scopeUsers=useMemo(()=>scopeIds==null?allUsers:allUsers.filter(u=>scopeIdSet.has(u.id)),[scopeIds,scopeIdSet,allUsers]);
  // The user list handed to dashboards/panels — admins see everyone, scoped roles
  // (dept managers, team leads) see only the people they oversee.
  const visibleUsers=scopeIds==null?allUsers:scopeUsers;
  const visibleDepartments=useMemo(()=>isDeptMgr?departments.filter(d=>d.id===currentUser.departmentId||d.managerId===currentUser.id):departments,[isDeptMgr,departments,currentUser]);
  // Leads/managers are created with broad personal access, so their own access must
  // not widen the scope — for them relevance is driven by the people they oversee.
  // A plain employee's scope is simply their own defined work.
  const relevanceUsers=useMemo(()=>isLeadRole(currentUser?.role)?scopeUsers.filter(u=>u.id!==currentUser?.id):scopeUsers,[currentUser,scopeUsers]);
  // Each relevant user's stage ids as a Set. Asked straight from the user record
  // this was an array .includes() per order per stage per user; as a Set it is a
  // hash lookup, and the list is built once per scope change rather than per order.
  const relevanceIdx=useMemo(()=>relevanceUsers.map(u=>({u,stageSet:new Set(userStageIds(u,allStageIds))})),[relevanceUsers,allStageIds]);
  // Which orders anyone in scope has logged work on. Asked per order — as
  // workLogs.some(w=>w.orderId===o.id&&…) — this was a scan of every progress
  // record for every פק"ע: 2,787 × 56,000 ≈ 156 million comparisons, on every
  // render. One pass over the logs answers it for all of them at once, and the
  // answer is reused until the logs actually change.
  const scopeLoggedOrderIds=useMemo(()=>{
    if(!scopeIdSet)return null;
    const s=new Set();
    workLogs.forEach(w=>{if(w.orderId&&scopeIdSet.has(w.userId))s.add(w.orderId)});
    return s;
  },[workLogs,scopeIdSet]);
  // Which business divisions this person may see at all — their department's
  // branch numbers, plus whatever their own record adds. null when nothing is
  // configured, which is every install until a department is given a number.
  const branchScope=useMemo(()=>userBranchScope(currentUser,departments),[currentUser,departments]);
  // An order is visible if: the user is an admin, it is defined work for someone the
  // user oversees (or themselves), or anyone in their scope has logged work on it.
  //
  // The branch scope is checked first and it is a veto, not another way in: a פק"ע
  // of a division that is not this person's stays out of every list even when the
  // stage on it is theirs and even when they have already reported work on it —
  // otherwise the one thing that would carry work across the divisions is the very
  // thing the restriction exists to stop.
  const orderVisible=useCallback((o)=>{
    if(currentUser?.role==="admin")return true;
    if(!branchScopeAllows(branchScope,o))return false;
    if(relevanceIdx.some(({u,stageSet})=>userHasProjectAccess(u,o.projectId)&&(o.stageIds||[]).some(sid=>stageSet.has(sid))))return true;
    if(scopeLoggedOrderIds&&scopeLoggedOrderIds.has(o.id))return true;
    return false;
  },[currentUser,relevanceIdx,scopeLoggedOrderIds,branchScope]);

  const filteredOrders=useMemo(()=>orders.filter(orderVisible),[orders,orderVisible]);
  // The project ids that survived the order filter, collected in one pass — the
  // question "is this project visible" was previously a scan of the whole order
  // list, asked once per project and again on every canViewProject() call.
  const visibleProjectIds=useMemo(()=>new Set(filteredOrders.map(o=>o.projectId)),[filteredOrders]);
  const filteredProjects=useMemo(()=>currentUser?.role==="admin"?projects:projects.filter(p=>visibleProjectIds.has(p.id)),[projects,visibleProjectIds,currentUser]);
  const canViewProject=useCallback(pid=>{
    if(!currentUser)return false;
    if(currentUser.role==="admin")return true;
    return visibleProjectIds.has(pid);
  },[currentUser,visibleProjectIds]);
  // Scoped roles see the logs of their own people, plus any log on an order they can
  // view (so serial/stage progress done by others still renders correctly).
  const visibleOrderIds=useMemo(()=>new Set(filteredOrders.map(o=>o.id)),[filteredOrders]);
  const filteredWorkLogs=useMemo(()=>scopeIdSet?workLogs.filter(w=>scopeIdSet.has(w.userId)||visibleOrderIds.has(w.orderId)):workLogs,[scopeIdSet,workLogs,visibleOrderIds]);
  // Tasks and daily plans belong to a person, so a scoped role only ever sees
  // the ones of the people they oversee (used by reports and the Excel export).
  const visibleTasks=useMemo(()=>scopeIdSet?customTasks.filter(t=>scopeIdSet.has(t.userId)):customTasks,[scopeIdSet,customTasks]);
  const visiblePlans=useMemo(()=>scopeIdSet?dailyPlans.filter(p=>scopeIdSet.has(p.userId)):dailyPlans,[scopeIdSet,dailyPlans]);

  const updO=useCallback((fn)=>{setOrders(prev=>{const next=typeof fn==="function"?fn(prev):fn;persist(next,null,null,null);return next})},[]);
  const updP=useCallback((fn)=>{setProjects(prev=>{const next=typeof fn==="function"?fn(prev):fn;persist(null,next,null,null);return next})},[]);
  const updS=useCallback((fn)=>{setStages(prev=>{const next=typeof fn==="function"?fn(prev):fn;persist(null,null,next);return next})},[]);
  const updD=useCallback((fn)=>{setDepartments(prev=>{const next=typeof fn==="function"?fn(prev):fn;persist(null,null,null,null,null,null,next);return next})},[]);

  // ── Standard times (זמן תקן) — one record per מק"ט, minutes per stage ──
  // Stages left blank are dropped, so a מק"ט with nothing filled in simply has
  // no standard rather than a standard of zero.
  const savePnStd=useCallback((pn,stageMin,extra)=>{
    const k=pnKey(pn);if(!k)return;
    setPnStandards(prev=>{
      const clean={};
      Object.entries(stageMin||{}).forEach(([sid,v])=>{const n=Number(v);if(sid.startsWith("__")||!(n>0))return;clean[sid]=Math.round(n*10)/10});
      // Saving is also the moment to collapse any duplicate rows for this מק"ט:
      // keep the newest, drop the rest here and in the DB.
      const mine=prev.filter(r=>pnKey(r.pn)===k).sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));
      const others=prev.filter(r=>pnKey(r.pn)!==k);
      const stale=mine.slice(1);
      const base=mine[0]||{id:"std_"+uid(),pn:k,total:0,note:""};
      const rec={...base,...(extra||{}),pn:k,stageMin:clean,updatedBy:currentUser?.name||"",updatedAt:nowISO()};
      // Everything cleared = no standard at all, not a standard of zero
      const drop=(!Object.keys(clean).length&&!(Number(rec.total)>0))?mine:stale;
      if(drop===mine&&!mine.length)return prev;
      const next=drop===mine?others:[...others,rec];
      persist(null,null,null,null,null,null,null,null,next);
      drop.forEach(r=>SB.del("pn_standards",{id:r.id}).catch(()=>{}));
      UNDO.record({user:currentUser,action:"עדכון זמן תקן",target:k,
        changes:[{coll:"pnStandards",before:mine,after:next.map(r=>r.id)}]});
      return next;
    });
  },[currentUser]);
  // Bulk import of standard times (an ERP export brings hundreds at once): each
  // record replaces the one for its מק"ט, and every other מק"ט is left alone.
  const importPnStds=useCallback((recs)=>{
    const list=(recs||[]).filter(r=>pnKey(r.pn));
    if(!list.length)return;
    setPnStandards(prev=>{
      const incoming=new Map(list.map(r=>[pnKey(r.pn),r]));
      const kept=prev.filter(r=>!incoming.has(pnKey(r.pn)));
      const stale=prev.filter(r=>incoming.has(pnKey(r.pn))&&!list.some(n=>n.id===r.id));
      const next=[...kept,...list];
      persist(null,null,null,null,null,null,null,null,next);
      stale.forEach(r=>SB.del("pn_standards",{id:r.id}).catch(()=>{}));
      UNDO.record({user:currentUser,action:"ייבוא זמני תקן",target:`${list.length} מק"טים`,
        details:"ייבוא מ-Excel",
        changes:[{coll:"pnStandards",before:prev,after:next.map(r=>r.id)}]});
      return next;
    });
  },[currentUser]);
  // Bulk import of progress: the completed work logs an ERP export implies, one
  // per unit per stage. `dropOrderIds` is the list of orders a "replace all"
  // import just removed — their logs go with them, here and on the server, or the
  // next sync pulls back progress for units that no longer exist.
  // `dropLogIds` is the finer cut a re-import needs: only the records the *last*
  // import wrote for an order that has since moved, so the work its people
  // reported through the app stays exactly where it is.
  const importWorkLogs=useCallback((logs,dropOrderIds,dropLogIds)=>{
    // A quantity signature has no serial by design — it is the count that carries
    // the progress — so it is admitted on the same terms as a per-unit record.
    const add=(logs||[]).filter(w=>w&&w.stageId&&(w.serialId||isQtyLog(w)));
    const drop=(dropOrderIds&&dropOrderIds.length)?new Set(dropOrderIds):null;
    const dropIds=(dropLogIds&&dropLogIds.length)?new Set(dropLogIds):null;
    if(!add.length&&!drop&&!dropIds)return;
    const doomed=w=>(drop&&drop.has(w.orderId))||(dropIds&&dropIds.has(w.id));
    setWorkLogs(prev=>{
      const gone=(drop||dropIds)?prev.filter(doomed):[];
      const next=(drop||dropIds)?[...prev.filter(w=>!doomed(w)),...add]:[...prev,...add];
      persist(null,null,null,next);
      if(gone.length)SB.delIds("work_logs",gone.map(w=>w.id)).catch(e=>console.warn("log cleanup skipped",e));
      return next;
    });
    if(add.length)addAuditEntry({userId:currentUser?.id,username:currentUser?.username,name:currentUser?.name,
      action:"ייבוא התקדמות",target:`${add.length} רישומים`,details:"נגזר מכמות מדווחת בקובץ הייבוא"});
  },[currentUser]);
  const deletePnStd=useCallback((pn)=>{
    const k=pnKey(pn);
    setPnStandards(prev=>{
      const gone=prev.filter(r=>pnKey(r.pn)===k);
      const next=prev.filter(r=>pnKey(r.pn)!==k);
      persist(null,null,null,null,null,null,null,null,next);
      gone.forEach(r=>SB.del("pn_standards",{id:r.id}).catch(()=>{}));
      UNDO.record({user:currentUser,action:"מחיקת זמן תקן",target:k,
        changes:[{coll:"pnStandards",before:gone,after:[]}]});
      return next;
    });
  },[currentUser]);

  // Auto-delivery: per serial — when a serial finishes all stages, mark it as delivered
  const checkAutoDelivery=(orderId,nextLogs)=>{
    const order=oRef.current.find(o=>o.id===orderId);
    if(!order)return;
    const sers=order.serials||[];if(!sers.length)return;
    const oSt=order.stageIds||[];if(!oSt.length)return;
    const delivered=new Set(order.deliveredSerials||[]);
    const doneIdx=buildDoneIndex(nextLogs);
    let changed=false;
    sers.forEach(sr=>{
      if(delivered.has(sr.id))return;
      const allDone=oSt.every(sid=>doneIdx.has(logKey(sr.id,sid)));
      if(allDone){delivered.add(sr.id);changed=true}
    });
    if(changed){
      const deliveredArr=[...delivered];
      const allDelivered=deliveredArr.length===sers.length;
      setOrders(prev=>{
        const updated=prev.map(o=>o.id!==orderId?o:{...o,
          deliveredSerials:deliveredArr,
          deliveredQty:deliveredArr.length,
          deliveryStatus:allDelivered?"delivered":deliveredArr.length>0?"partial":"pending",
          deliveryDate:allDelivered?todays():(o.deliveryDate||"")
        });
        persist(updated,null,null,null);
        return updated;
      });
    }
  };

  const handleStartWork=(log)=>{
    setWorkLogs(prev=>{const next=[...prev,log];persist(null,null,null,next);
      // If admin sign-off (completed=true), check auto delivery
      if(log.completed&&log.orderId)setTimeout(()=>checkAutoDelivery(log.orderId,next),100);
      return next});
    addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,
      action:isQtyLog(log)?"חתימה לפי כמות":isQtyRun(log)?"התחלת עבודה לפי כמות":log.completed?"חתימת מנהל":"התחלת עבודה",
      target:logUnitLabel(log),
      details:stages.find(s=>s.id===log.stageId)?.name||""});
  };
  // `patch` is how a quantity run closes on fewer units than it started with —
  // the count is part of the record, so it is written with the completion.
  const handleEndWork=(logId,duration,patch)=>{
    setWorkLogs(prev=>{
      const next=prev.map(w=>w.id===logId?{...w,...(patch||{}),completed:true,endTime:nowISO(),durationMin:duration}:w);
      persist(null,null,null,next);
      const log=next.find(w=>w.id===logId);
      if(log?.orderId)setTimeout(()=>checkAutoDelivery(log.orderId,next),100);
      // Note: the completion notification is NOT shown here (this device belongs to the
      // worker) — the direct manager's device picks it up via the sync effect below.
      return next;
    });
    const log=workLogs.find(w=>w.id===logId);
    if(log)addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:"סיום עבודה",target:logUnitLabel({...log,...(patch||{})}),details:`${fmtTime(duration)} — ${stages.find(s=>s.id===log.stageId)?.name||""}`});
  };
  const handlePauseWork=(logId)=>{
    setWorkLogs(prev=>{const next=prev.map(w=>w.id===logId?{...w,paused:true,pauseStart:nowISO(),pauseLog:[...(w.pauseLog||[]),{start:nowISO()}]}:w);persist(null,null,null,next);return next});
    addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:"הפסקה",target:"",details:""});
  };
  const handleResumeWork=(logId)=>{
    setWorkLogs(prev=>{const next=prev.map(w=>{if(w.id!==logId)return w;const pauseMin=w.pauseStart?Math.round((Date.now()-new Date(w.pauseStart).getTime())/60000):0;const pl=[...(w.pauseLog||[])];if(pl.length>0&&!pl[pl.length-1].end)pl[pl.length-1].end=nowISO();return{...w,paused:false,pauseStart:null,totalPauseMin:(w.totalPauseMin||0)+pauseMin,pauseLog:pl}});persist(null,null,null,next);return next});
    addAuditEntry({userId:currentUser.id,username:currentUser.username,name:currentUser.name,action:"חזרה מהפסקה",target:"",details:""});
  };
  // Custom tasks
  const handleAddTask=(task)=>{
    setCustomTasks(prev=>{const next=[...prev,task];persist(null,null,null,null,next);return next});
    if(task.userName)PushNotify.send(`משימה חדשה: ${task.name}`,`${task.userName}, הוקצתה לך משימה${task.price?` (₪${task.price})`:""}`,`task_${task.id}`);
  };

  const [showDemoPanel,setShowDemoPanel]=useState(false);

  // ── Demo Data ───────────────────────────────────────────────────
  const loadDemoData=async()=>{
    if(!confirm("זה יטען נתוני דמו לשנה שלמה. להמשיך?"))return;

      // Resolve who the demo team is written as before generating anything that

      const cid=_companyId||DEFAULT_COMPANY_ID;
      const {idMap,skipped}=await resolveDemoUsers(FALLBACK_USERS,cid);

      const W=Object.fromEntries(DEMO_WORKER_IDS.filter(id=>idMap[id]).map(id=>[rid(id),(FALLBACK_USERS.find(u=>u.id===id)||{}).name||id]));
      const dProj=[{id:"p1",name:"פרויקט אלפא"},{id:"p2",name:"פרויקט בטא"},{id:"p3",name:"פרויקט גמא"},{id:"p4",name:"פרויקט דלתא"}];
      // minutes = the time sold for the stage per the price list (זמן מכירה)
      const dStages=[{id:"s1",name:"קליטה וקלט",stage_order:1,color:"#3b82f6",price:80,hourly_rate:160,minutes:30},{id:"s2",name:"הרכבה",stage_order:2,color:"#8b5cf6",price:150,hourly_rate:180,minutes:50},{id:"s3",name:"בדיקת חשמל",stage_order:3,color:"#06b6d4",price:120,hourly_rate:180,minutes:40},{id:"s4",name:"בדיקת מכנית",stage_order:4,color:"#f59e0b",price:100,hourly_rate:170,minutes:35},{id:"s5",name:"QC סופי",stage_order:5,color:"#10b981",price:90,hourly_rate:170,minutes:32},{id:"s6",name:"אריזה ומשלוח",stage_order:6,color:"#ec4899",price:60,hourly_rate:150,minutes:24}];

      const STD_TARGET=[1.02,0.93,1.10,0.97,1.14,0.90,1.06,1.0];

      const snMap={};
      const mkSn=(prefix,n)=>Array.from({length:n},(_,i)=>({id:`${prefix}_${i}`,sn:`${prefix}-${String(i+1).padStart(4,"0")}`,createdAt:new Date().toISOString()}));
      const pns=[["ALF-PCB","לוח PCB ראשי",1200,"p1",8],["BET-SNS","חיישן תעשייתי",850,"p2",6],["GAM-MOT","בקר מנוע",2200,"p3",5],["DEL-CTL","בקר PLC",3500,"p4",4],["ALF-PWR","ספק כוח 48V",680,"p1",4],["BET-VLV","שסתום פנאומטי",420,"p2",10],["GAM-CAM","מצלמת בינה",1800,"p3",3],["DEL-SRV","מנוע סרוו",950,"p4",6]];

      await SB.upsert("stages",dStages);
      for(const chunk of chunked(orders,CHUNK))await SB.upsert("orders",chunk);
      for(const chunk of chunked(wlogs,CHUNK))await SB.upsert("work_logs",chunk);
      for(const chunk of chunked(tasks,CHUNK))await SB.upsert("custom_tasks",chunk);
      // The standards table is newer than the rest — if it hasn't been created the
      // demo still works, the standards simply stay in the local cache.
      await SB.upsert("pn_standards",dPnStd).catch(e=>console.warn("pn_standards demo upsert skipped",e));
      const localStd=dPnStd.map(dbToPnStd);
      setPnStandards(localStd);LS.set("pnStandards",localStd);psRef.current=localStd;

      // Reload
      const [data,freshUsers]=await Promise.all([dbLoadAll(),dbLoadUsers()]);
      if(data.orders){setOrders(data.orders);LS.set("orders",data.orders)}
      if(data.projects){setProjects(data.projects);LS.set("projects",data.projects)}
      if(data.stages){setStages(data.stages);LS.set("stages",data.stages)}
      if(data.workLogs){setWorkLogs(data.workLogs);LS.set("workLogs",data.workLogs)}
      if(data.customTasks){setCustomTasks(data.customTasks);LS.set("customTasks",data.customTasks)}
      if(data.pnStandards?.length){setPnStandards(data.pnStandards);LS.set("pnStandards",data.pnStandards)}
      if(freshUsers?.length){LS.set("users",freshUsers)}
      commitLogWatermark(data);
      setSync("ok");
      toast(skipped.length?`נתוני דמו נטענו. ${skipped.length} משתמשי דמו דולגו — שם המשתמש תפוס בחברה אחרת (${skipped.join(", ")})`:"נתוני דמו נטענו בהצלחה!","success",skipped.length?7000:undefined);
    }catch(e){console.error(e);setSync("error");toast("שגיאה: "+sbErrMsg(e),"error")}
  };

  // Folds פק"ע that appear more than once — the leftovers of the old
  // "הוסף לקיימים" — back into one row each, carrying their units and their
  // reported work with them. Journalled as one entry, like an import.
  const mergeDuplicateOrders=useCallback(()=>{
    const plan=dupMergePlan(oRef.current,wRef.current);
    if(!plan.dropIds.length)return plan;
    const keepById=new Map(plan.keepers.map(o=>[o.id,o]));
    const dropSet=new Set(plan.dropIds),dropLogSet=new Set(plan.dropLogIds);
    const beforeOrders=oRef.current.filter(o=>dropSet.has(o.id)||keepById.has(o.id));
    const movedIds=new Set(plan.movedLogs.map(w=>w.id));
    const beforeLogs=wRef.current.filter(w=>movedIds.has(w.id)||dropLogSet.has(w.id));
    const nextOrders=oRef.current.filter(o=>!dropSet.has(o.id)).map(o=>keepById.get(o.id)||o);
    // The moved logs keep their ids and only change which order (and which unit)
    // they belong to, so they are rewritten in place rather than deleted and
    // re-created — no window in which the progress does not exist.
    const nextLogs=[...wRef.current.filter(w=>!movedIds.has(w.id)&&!dropLogSet.has(w.id)),...plan.movedLogs];
    setOrders(nextOrders);setWorkLogs(nextLogs);persist(nextOrders,null,null,nextLogs);
    SB.delIds("orders",plan.dropIds).catch(e=>console.warn("dup cleanup skipped",e));
    if(plan.dropLogIds.length)SB.delIds("work_logs",plan.dropLogIds).catch(()=>{});
    UNDO.record({user:currentUser,action:'איחוד פק"ע כפולות',target:`${plan.groups.length} מספרי פק"ע`,
      details:`${plan.dropIds.length} שורות כפולות אוחדו | ${plan.movedLogs.length} דיווחים הועברו | ${plan.dropLogIds.length} דיווחי ייבוא כפולים הוסרו`,
      changes:[{coll:"orders",before:beforeOrders,after:nextOrders.map(o=>o.id)},
        ...(beforeLogs.length?[{coll:"workLogs",before:beforeLogs,after:nextLogs.map(w=>w.id)}]:[])]});
    toast(`אוחדו ${plan.dropIds.length} שורות כפולות ב-${plan.groups.length} פק"ע — אפשר לאחזר מיומן הפעילות`,"success",7000);
    return plan;
  },[currentUser,toast]);

  // ── ניקוי לפיילוט ────────────────────────────────────────────────────────
  // One pass over everything a set of employees leaves behind: the accounts, the
  // work they reported, their tasks and their plans, and — when asked — the
  // departments that end up with nobody in them. Written to state, to the local
  // cache and to the server together, and journalled as a single entry so ↩️ puts
  // all of it back at once.
  const runPilotReset=async({userIds,logIds,taskIds,planIds,deptIds})=>{
    const uSet=new Set(userIds||[]),lSet=new Set(logIds||[]),tSet=new Set(taskIds||[]),pSet=new Set(planIds||[]),dSet=new Set(deptIds||[]);
    setSync("saving");
    try{
      const before={
        users:getUsers().filter(u=>uSet.has(u.id)),
        workLogs:wRef.current.filter(w=>lSet.has(w.id)),
        customTasks:ctRef.current.filter(t=>tSet.has(t.id)),
        dailyPlans:plRef.current.filter(x=>pSet.has(x.id)),
        departments:dpRef.current.filter(d=>dSet.has(d.id))
      };
      const changes=Object.entries(before).filter(([,rows])=>rows.length)
        .map(([coll,rows])=>({coll,before:rows,after:[]}));

      if(lSet.size){const next=wRef.current.filter(w=>!lSet.has(w.id));setWorkLogs(next);persist(null,null,null,next)}
      if(tSet.size){const next=ctRef.current.filter(t=>!tSet.has(t.id));setCustomTasks(next);persist(null,null,null,null,next)}
      if(pSet.size){const next=plRef.current.filter(x=>!pSet.has(x.id));setDailyPlans(next);persist(null,null,null,null,null,null,null,next)}
      if(dSet.size){const next=dpRef.current.filter(d=>!dSet.has(d.id));setDepartments(next);persist(null,null,null,null,null,null,next)}
      if(uSet.size){
        const next=getUsers().filter(u=>!uSet.has(u.id));
        await saveUsers(next);
        setUsersTick(t=>t+1);
        window.dispatchEvent(new CustomEvent("pml:users"));
      }
      // The rows have to leave the server too, or the next sweep pulls every one
      // of them straight back in.
      await Promise.all([
        lSet.size?SB.delIds("work_logs",[...lSet]):null,
        tSet.size?SB.delIds("custom_tasks",[...tSet]):null,
        pSet.size?SB.delIds("daily_plans",[...pSet]):null,
        dSet.size?SB.delIds("departments",[...dSet]):null,
        uSet.size?SB.delIds("app_users",[...uSet]):null
      ].filter(Boolean));
      if(changes.length)UNDO.record({user:currentUser,action:"ניקוי לפיילוט",
        target:`${uSet.size} עובדים`,
        details:`${lSet.size} דיווחי עבודה · ${tSet.size} משימות · ${pSet.size} תוכניות · ${dSet.size} מחלקות`,
        changes});
      setSync("ok");
      toast(`נמחקו ${uSet.size} עובדים${lSet.size?` ו-${lSet.size.toLocaleString()} דיווחי עבודה`:""} — אפשר לאחזר מיומן הפעילות`,"success",7000);
    }catch(e){console.error(e);setSync("error");toast("שגיאה בניקוי: "+sbErrMsg(e),"error",7000)}
  };

  const deleteDemoData=async()=>{
    if(!confirm("למחוק את כל נתוני הדמו? (פקעות, לוגים, משימות וזמני תקן שמתחילים ב-demo_)"))return;
    setSync("saving");
    try{
      // Delete demo records by ID prefix using Supabase like operator
      await Promise.all([
        fetch(`${SB_URL}/rest/v1/work_logs?id=like.wl_demo_*`,{method:"DELETE",headers:sbHeaders()}),
        fetch(`${SB_URL}/rest/v1/custom_tasks?id=like.demo_t_*`,{method:"DELETE",headers:sbHeaders()}),
      ]);
      await fetch(`${SB_URL}/rest/v1/orders?id=like.demo_o_*`,{method:"DELETE",headers:sbHeaders()});
      await fetch(`${SB_URL}/rest/v1/departments?id=like.demo_d*`,{method:"DELETE",headers:sbHeaders()}).catch(()=>{});
      await fetch(`${SB_URL}/rest/v1/pn_standards?id=like.demo_std_*`,{method:"DELETE",headers:sbHeaders()}).catch(()=>{});
      const noDemoStd=psRef.current.filter(r=>!String(r.id||"").startsWith("demo_std_"));
      setPnStandards(noDemoStd);LS.set("pnStandards",noDemoStd);psRef.current=noDemoStd;
      const data=await dbLoadAll();
      if(data.orders){setOrders(data.orders);LS.set("orders",data.orders)}
      if(data.workLogs){setWorkLogs(data.workLogs);LS.set("workLogs",data.workLogs)}
      if(data.customTasks){setCustomTasks(data.customTasks);LS.set("customTasks",data.customTasks)}
      if(data.departments){setDepartments(data.departments);LS.set("departments",data.departments)}
      if(data.pnStandards){setPnStandards(data.pnStandards);LS.set("pnStandards",data.pnStandards)}
      setSync("ok");
      toast("נתוני דמו נמחקו!","success");
    }catch(e){console.error(e);setSync("error");toast("שגיאה: "+sbErrMsg(e),"error")}
  };
  useEffect(()=>{const isi=window.matchMedia("(display-mode:standalone)").matches||window.navigator.standalone;if(isi){setIsStandalone(true);return;}const h=e=>{e.preventDefault();setInstallPrompt(e);setShowInstall(true)};window.addEventListener("beforeinstallprompt",h);window.addEventListener("appinstalled",()=>{setShowInstall(false);setInstallPrompt(null);setIsStandalone(true)});return()=>window.removeEventListener("beforeinstallprompt",h)},[]);
  // Service Worker
  useEffect(()=>{if(!("serviceWorker" in navigator))return;navigator.serviceWorker.register("./sw.js?v=30").then(reg=>{swRegRef.current=reg;if(reg.waiting)setShowUpdate(true);reg.addEventListener("updatefound",()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener("statechange",()=>{if(nw.state==="installed"&&navigator.serviceWorker.controller)setShowUpdate(true)})});setInterval(()=>reg.update(),30*60*1000)}).catch(()=>{});
    // Reload only when a *replacement* worker takes over an already-controlled page
    // — i.e. a real update, which is what the update banner triggers.
    //
    // On a first visit (or the first after the cache is cleared) there is no
    // controller yet, and the new worker's clients.claim() fires controllerchange
    // as well. Reloading on that one meant every such visit loaded, parsed and
    // booted the whole app twice, back to back, for no reason.
    const hadController=!!navigator.serviceWorker.controller;
    let reloading=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(!hadController||reloading)return;
      reloading=true;window.location.reload();
    });
  },[]);
  // Network status
  useEffect(()=>{const on=()=>{setIsOffline(false);toast("החיבור חזר — מסנכרן נתונים...","success");refreshFromDB(true)};const off=()=>{setIsOffline(true)};window.addEventListener("online",on);window.addEventListener("offline",off);return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off)}},[]);
  // PWA Install
  const handleInstall=async()=>{
    if(installPrompt){installPrompt.prompt();setInstallPrompt(null);setShowInstall(false);return;}
    const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    if(isIOS)toast("ב-Safari: לחץ על סמל השיתוף ← 'הוסף למסך הבית'","info",6000);
    else toast("לחץ על תפריט הדפדפן (⋮ / ☰) ← 'הוסף למסך הבית' או 'התקן אפליקציה'","info",6000);
  };
  const handleUpdate=()=>{const r=swRegRef.current;if(r?.waiting)r.waiting.postMessage({type:"SKIP_WAITING"});else window.location.reload();setShowUpdate(false)};

  if(!currentUser)return(<AuthCtx.Provider value={{currentUser,canEdit:false,canViewProject:()=>false}}><LoginScreen onLogin={handleLogin} lightMode={lightMode} toggleLight={()=>setLightMode(p=>!p)}/></AuthCtx.Provider>);
  if(loading)return(<AppLoading/>);

  // Default tab for workers and team leads (dept managers land on the dashboard like admins)
  if(isWorker&&tab==="dashboard")setTab("mywork");
  if(currentUser?.role==="team_lead"&&tab==="dashboard")setTab("team");
  const lm=lightMode;

  return(
    <AuthCtx.Provider value={{currentUser,canEdit,canViewProject}}>
      {isOffline&&<OfflineBanner lm={lm}/>}
      {showUpdate&&!isOffline&&<UpdateBanner onUpdate={handleUpdate} onDismiss={()=>setShowUpdate(false)} lm={lm}/>}
      <Navbar tab={tab} setTab={setTab} tabs={TABS} lightMode={lightMode} toggleLight={()=>setLightMode(p=>!p)} sync={sync} onAdmin={()=>setShowAdmin(true)} onLogout={handleLogout} alertCount={alertCount} onAlerts={()=>setShowAlerts(true)} onRefresh={()=>refreshFromDB(true)} onLiveBoard={()=>setShowLiveBoard(true)} onReport={()=>setShowReport(true)} onHistory={()=>setShowHistory(true)} isAdmin={isAdmin} isManager={isAdmin||isDeptMgr} onLoadDemo={loadDemoData} onDeleteDemo={deleteDemoData} onPilotReset={()=>setShowPilotReset(true)} onInstall={handleInstall} canInstall={!isStandalone}/>
      {currentUser?.isDemo&&(
        <div style={{background:lm?"#eff6ff":"#0c1e3a",borderBottom:`1px solid ${lm?"#bfdbfe":"#1e3a5f"}`,padding:"8px 16px",display:"flex",alignItems:"center",justifyContent:"center",gap:10,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:lm?"#1d4ed8":"#93c5fd"}}>🔍 מצב דמו — הנתונים לא נשמרים</span>
          <button onClick={()=>{handleLogout();}} style={{background:"var(--c-accent)",color:"#fff",border:"none",borderRadius:6,padding:"4px 14px",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>הירשם עכשיו</button>
        </div>
      )}
      <main className="main-content" style={{maxWidth:1440,margin:"0 auto",padding:"16px 14px",paddingBottom:showInstall?"100px":"calc(16px + env(safe-area-inset-bottom,0px))"}}>
        {tab==="dashboard"&&<Dashboard orders={filteredOrders} projects={filteredProjects} stages={stages} users={visibleUsers} workLogs={filteredWorkLogs} departments={visibleDepartments} customTasks={customTasks}/>}
        {tab==="team"&&isLead&&<TeamDashboard users={getUsers()} workLogs={filteredWorkLogs} orders={filteredOrders} stages={stages} customTasks={customTasks} departments={departments} onAddTask={handleAddTask} onDeleteTask={handleDeleteTask} onMarkPartialTask={handleMarkPartialTask} onMarkDoneTask={handleMarkDoneTask} dailyPlans={dailyPlans} onAddPlan={handleAddPlan} onDeletePlan={handleDeletePlan} onTogglePlanDone={handleTogglePlanDone}/>}
        {tab==="orders"&&<Orders orders={filteredOrders} projects={filteredProjects} stages={stages} stageBlocks={stageBlocks} departments={departments} updO={updO} workLogs={filteredWorkLogs} onWorkLog={handleStartWork} onDeleteLog={handleDeleteLog} workdayHours={workdayHours} setWorkdayHours={setWorkdayHoursPersist} pnStandards={pnStandards}/>}
        {tab==="shortages"&&<Shortages orders={filteredOrders} updO={updO} projects={filteredProjects}/>}
        {tab==="mywork"&&<MyWork orders={filteredOrders} stages={stages} workLogs={filteredWorkLogs} onStartWork={handleStartWork} onEndWork={handleEndWork} onDeleteLog={handleDeleteLog} onPauseWork={handlePauseWork} onResumeWork={handleResumeWork} customTasks={customTasks} onAddTask={handleAddTask} onStartTask={handleStartTask} onEndTask={handleEndTask} onPauseTask={handlePauseTask} onResumeTask={handleResumeTask} onDeleteTask={handleDeleteTask} onMarkPartialTask={handleMarkPartialTask} onMarkDoneTask={handleMarkDoneTask} users={getUsers()} dailyPlans={dailyPlans} onMarkPlanDone={handleMarkPlanDone}/>}
        {tab==="workers"&&(isAdmin||isDeptMgr)&&<WorkersDashboard users={visibleUsers} workLogs={filteredWorkLogs} orders={filteredOrders} stages={stages} customTasks={customTasks} onAddTask={handleAddTask} onDeleteLog={handleDeleteLog} onDeleteTask={handleDeleteTask} onMarkPartialTask={handleMarkPartialTask} onMarkDoneTask={handleMarkDoneTask} dailyPlans={dailyPlans} onAddPlan={handleAddPlan} onDeletePlan={handleDeletePlan} onTogglePlanDone={handleTogglePlanDone}/>}
        {tab==="stdtimes"&&(isAdmin||isDeptMgr||isLead)&&<StandardTimes orders={filteredOrders} stages={stages} stageBlocks={stageBlocks} workLogs={filteredWorkLogs} users={visibleUsers} projects={filteredProjects} pnStandards={pnStandards} onSavePnStd={savePnStd} onDeletePnStd={deletePnStd}/>}
        {tab==="yield"&&<YieldDashboard orders={filteredOrders} projects={filteredProjects} stages={stages} workLogs={filteredWorkLogs}/>}
        {tab==="stages"&&isAdmin&&<StagesManagement stages={stages} setStages={setStages} stageBlocks={stageBlocks} setStageBlocks={setStageBlocks} persist={persist}/>}
        {tab==="projects"&&<Projects projects={filteredProjects} orders={filteredOrders} updP={updP} stages={stages} workLogs={filteredWorkLogs}/>}
        {tab==="reports"&&(isAdmin||isDeptMgr||isLead)&&<TeamReports users={visibleUsers} workLogs={filteredWorkLogs} orders={filteredOrders} stages={stages} stageBlocks={stageBlocks} projects={filteredProjects} customTasks={visibleTasks} dailyPlans={visiblePlans} departments={visibleDepartments} pnStandards={pnStandards}/>}
        {tab==="excel"&&(isAdmin||isDeptMgr)&&<ExcelTab orders={filteredOrders} projects={filteredProjects} stages={stages} stageBlocks={stageBlocks} workLogs={filteredWorkLogs} users={visibleUsers} customTasks={visibleTasks} dailyPlans={visiblePlans} departments={visibleDepartments} pnStandards={pnStandards} updO={updO} updP={updP} updS={updS} importPnStds={importPnStds} importWorkLogs={importWorkLogs} mergeDuplicates={isAdmin?mergeDuplicateOrders:null} canImport={isAdmin}/>}
      </main>
      <FastScroll/>
      {showInstall&&<InstallBanner onInstall={handleInstall} onDismiss={()=>setShowInstall(false)} lm={lm}/>}
      {showPilotReset&&isAdmin&&<PilotResetModal users={allUsers} workLogs={workLogs} customTasks={customTasks} dailyPlans={dailyPlans} departments={departments} lightMode={lightMode} onClose={()=>setShowPilotReset(false)} onRun={runPilotReset}/>}
      {showAdmin&&isAdmin&&<AdminPanel projects={projects} stages={stages} orders={orders} onClose={()=>setShowAdmin(false)} lightMode={lightMode} departments={departments} updD={updD} onPilotReset={()=>setShowPilotReset(true)}/>}
      {showAlerts&&<AlertsPanel orders={filteredOrders} stages={stages} workLogs={filteredWorkLogs} users={visibleUsers} onClose={()=>setShowAlerts(false)} dismissedAlerts={dismissedAlerts} onDismissAll={ids=>setDismissedAlerts(prev=>[...new Set([...prev,...ids])])}/>}
      {showLiveBoard&&(isAdmin||isDeptMgr)&&(canUseFeature("live_board")?<LiveFactoryBoard orders={filteredOrders} workLogs={filteredWorkLogs} stages={stages} customTasks={customTasks} users={visibleUsers} departments={visibleDepartments} onClose={()=>setShowLiveBoard(false)} lightMode={lightMode}/>:<Modal onClose={()=>setShowLiveBoard(false)}><UpgradePrompt feature="לוח חי"/></Modal>)}
      {showReport&&(isAdmin||isDeptMgr)&&(canUseFeature("pdf_reports")?<MonthlyReportModal orders={filteredOrders} workLogs={filteredWorkLogs} stages={stages} projects={filteredProjects} users={visibleUsers} onClose={()=>setShowReport(false)}/>:<Modal onClose={()=>setShowReport(false)}><UpgradePrompt feature="דוחות PDF"/></Modal>)}
      {showHistory&&(isAdmin||isDeptMgr)&&<HistoryPanel orders={filteredOrders} updO={updO} onClose={()=>setShowHistory(false)} workLogs={filteredWorkLogs} onDeleteLog={handleDeleteLog} onUndoWorkLog={handleUndoWorkLog} customTasks={customTasks} onDeleteTask={handleDeleteTask}/>}
    </AuthCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ToastProvider><App/></ToastProvider>);
// ── Dismiss boot splash once the app has mounted (with a graceful minimum) ──
(function(){
  const sp=document.getElementById("splash");if(!sp)return;
  // Just enough time for the logo animation to register without flashing —
  // this floor is *added* to real load time on fast devices, so it stays low;
  // slow devices blow past it anyway and are never delayed by it.
  const MIN_MS=500;
  const elapsed=Date.now()-(window.__splashStart||Date.now());
  const wait=Math.max(0,MIN_MS-elapsed);
  requestAnimationFrame(()=>setTimeout(()=>{
    sp.classList.add("hide");
    setTimeout(()=>{sp.parentNode&&sp.remove()},650);
  },wait));
})();
</script>
</body>
</html>

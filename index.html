          <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:11,color:"var(--c-dim)"}}>תקופה</label><SegBtn options={[["month","חודשי"],["quarter","רבעוני"],["year","שנתי"]]} value={period} onChange={setPeriod}/></div>
          {(anyFilter||selYear!=="all")&&<button onClick={()=>{setSelProj("all");setSelYear("all");setSelBranch("all");setSelStat("all")}} style={{background:"#374151",color:"#e2e8f0",border:"none",borderRadius:6,padding:"5px 10px",fontSize:12,fontFamily:"inherit"}}>✕ נקה</button>}
          {anyFilter&&<span style={{fontSize:11.5,color:"var(--c-dim)",paddingBottom:3}}>מוצגות <b style={{color:"var(--c-text)"}}>{fOrders.length.toLocaleString()}</b> מתוך {statCount.live.toLocaleString()} פק"ע — כל המספרים במסך מתייחסים אליהן בלבד</span>}
          {statCount.ph_cancelled>0&&selStat!=="ph_cancelled"&&<span style={{fontSize:11.5,color:"var(--c-dim)",paddingBottom:3}} title={ST_PHASE.cancelled.hint}>🚫 {statCount.ph_cancelled.toLocaleString()} פק"ע מבוטלות אינן נספרות</span>}
        </Card>
      </div>

      {/* ── שורת הסטטוסים ──────────────────────────────────────────────────
          One tile per phase of the ERP status dictionary, counted over exactly the
          פק"ע the rest of the screen is counting. This row is also the filter:
          clicking a tile narrows the whole dashboard to that phase, and clicking
          it again clears it. Cancelled orders are outside fOrders, so their tile
          appears only when they are the ones being shown. */}
      <Card style={{marginBottom:12,padding:"11px 13px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:9}}>
          <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
            <div style={{fontWeight:700,fontSize:14}}>📊 מצב הפק"ע לפי סטטוס</div>
            <span style={{fontSize:11,color:"var(--c-dim)"}}>הסטטוס כפי שהגיע מ-Priority · לחיצה מסננת את כל המסך</span>
          </div>
          <div style={{fontSize:11.5,color:"var(--c-dim)"}}>סה"כ <b style={{color:"var(--c-text)"}}>{fOrders.length.toLocaleString()}</b> פק"ע</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:9}}>
          {PHASE_ORDER.filter(k=>k!=="cancelled"||selStat==="ph_cancelled").map(k=>{
            const ph=ST_PHASE[k],key="ph_"+k,n=phaseCount.n[k],on=selStat===key;
            const pct=fOrders.length?Math.round(n/fOrders.length*100):0;
            return(
              <button key={key} title={ph.hint} onClick={()=>setSelStat(on?"all":key)}
                style={{textAlign:"start",background:on?ph.color+"1c":"var(--c-deep)",border:`1px solid ${on?ph.color+"88":"var(--c-border)"}`,
                  borderRadius:12,padding:"10px 12px",fontFamily:"inherit",cursor:"pointer",display:"flex",flexDirection:"column",gap:5}}>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  <span style={{fontSize:14}}>{ph.icon}</span>
                  <span style={{fontSize:11.5,fontWeight:600,color:on?ph.color:"var(--c-muted)"}}>{ph.label}</span>
                </div>
                <div style={{fontSize:20,fontWeight:800,color:ph.color,letterSpacing:"-.02em",lineHeight:1.1}}>{n.toLocaleString()}</div>
                <div style={{height:4,borderRadius:3,background:"var(--c-border)",overflow:"hidden"}}><div style={{width:pct+"%",height:"100%",background:ph.color,opacity:.85}}/></div>
                <div style={{fontSize:10,color:"var(--c-dim)"}}>{pct}% מהפק"ע · {phaseCount.units[k].toLocaleString()} יח'</div>
              </button>
            );
          })}
        </div>
        <div style={{fontSize:11.5,color:"var(--c-muted)",marginTop:9,lineHeight:1.7,background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:8,padding:"7px 10px"}}>
          ״פק"ע שטרם הסתיימו״ = <b style={{color:"var(--c-text)"}}>{ST_PHASE.pre.label} + {ST_PHASE.line.label} + {ST_PHASE.stuck.label}</b> — {openOrders.toLocaleString()} פק"ע.
          הסטטוסים <b style={{color:"var(--c-text)"}}>דווח אחרון · נסגרה · פקע COC</b> נחשבים ״{ST_PHASE.done.label}״ ואינם נספרים שם.
          {noUnitOrders>0&&<> ל-<b style={{color:"var(--c-text)"}}>{noUnitOrders.toLocaleString()}</b> פק"ע אין סידוריים ואין כמות, ולכן אי אפשר לדווח עליהן התקדמות.</>}
        </div>
      </Card>

      {/* KPIs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:9,marginBottom:14}}>
        <KpiBox i="📋" v={openOrders.toLocaleString()} label='פק"ע שטרם הסתיימו' c="#f59e0b" sub={`מתוך ${fOrders.length.toLocaleString()} · ${phaseCount.n.done.toLocaleString()} כבר הסתיימו`}/>
        <KpiBox i="🔢" v={totalSerials.toLocaleString()} label='סה"כ יחידות' c="#60a5fa" sub={`${completedSerials.toLocaleString()} הושלמו`}/>
        <KpiBox i="🚨" v={overdue.length.toLocaleString()} label='פק"ע באיחור' c={overdue.length?"#ef4444":"#10b981"} sub='מול תאריך סיום ייצור מהפריוריטי'/>
        <KpiBox i="🎯" v={onTimePct!=null?onTimePct+"%":"—"} label="עמידה בלוחות זמנים" c={onTimePct==null?"#8b95a8":onTimePct>=85?"#10b981":onTimePct>=60?"#f59e0b":"#ef4444"} sub={datedOrders.length?`${onTimeCount}/${datedOrders.length} פק"ע בזמן`:null}/>
        <KpiBox i="💰" v={fmtMoney(actualRev)} label="הכנסה ממומשת" c="#a78bfa"/>
        <KpiBox i="🔮" v={fmtMoney(forecastRev)} label="צפי הכנסות" c="#06b6d4"/>
        <KpiBox i="⏱️" v={fmtTime(totalWorkMins)} label="שעות עבודה" c="#3b82f6" sub={completedSerials>0?`${fmtTime(Math.round(avgPerUnit))} ליחידה`:null}/>
        <KpiBox i="💵" v={fmtMoney(totalWorkCost)} label="עלות עבודה" c="#f97316"/>
        <KpiBox i="🔧" v={openDefects} label="תקלות פתוחות" c="#ef4444"/>
        <KpiBox i="⚠️" v={openShortages} label="חוסרים פתוחים" c="#dc2626"/>
      </div>

      {/* Factory diagram moved to the live factory board (מסך מפעל חי) */}

      {/* Operational insights */}
      {/* פק"ע באיחור — the whole list, not the first five, and it says out loud
          what "late" is measured against. Priority's ת. סיום יצור is the date the
          order carries; nothing else in the app is a delivery commitment. */}
      {(overdue.length>0)&&(
        <Card style={{marginBottom:12,border:"1px solid #ef444433"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:4}}>
            <div style={{fontWeight:700,fontSize:13,color:"#ef4444"}}>🚨 פק"ע באיחור ({overdue.length.toLocaleString()})</div>
            <div style={{fontSize:11.5,color:"var(--c-dim)"}}>{overdueUnits.toLocaleString()} יחידות · האיחור הגדול ביותר {overdue[0].days} ימים</div>
          </div>
          <div style={{fontSize:11.5,color:"var(--c-muted)",marginBottom:9,lineHeight:1.7,background:"var(--c-deep)",border:"1px solid var(--c-border)",borderRadius:8,padding:"7px 10px"}}>
            האיחור נמדד מול <b style={{color:"var(--c-text)"}}>תאריך סיום ייצור</b> — עמודת <b style={{color:"var(--c-text)"}}>״ת. סיום יצור״</b> מהפריוריטי, שנשמרת על כל פק"ע כיעד האספקה.
            נספרת כאן כל פק"ע שהתאריך שלה עבר ושעדיין לא כל היחידות שלה סיימו את המסלול — גם פק"ע שמנוהלת לפי כמות וללא סידוריים. פק"ע שהסתיימה (דווח אחרון / נסגרה / COC) או שבוטלה אינה נספרת.
          </div>
          {(showAllLate?overdue:overdue.slice(0,8)).map(({o,days})=>{
            const br2=branchCode(o.branch),erp2=orderErpInfo(o),ph2=ST_PHASE[orderPhase(o)]||ST_PHASE.line;
            return(
            <div key={o.id} style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 12px",marginBottom:4,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,border:"1px solid #ef444422",flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",minWidth:0}}>
                <span style={{fontWeight:700,color:"#60a5fa"}}>{o.woNumber}</span>
                <Badge status={o.status||"open"}/>
                {erp2&&erp2.raw&&<span title={erp2.desc} style={{fontSize:10.5,background:ph2.color+"14",color:ph2.color,border:`1px dashed ${ph2.color}55`,padding:"1px 7px",borderRadius:20,whiteSpace:"nowrap"}}>{ph2.icon} {erp2.raw}</span>}
                {br2&&<span style={{fontSize:10.5,background:branchColor(br2)+"1f",color:branchColor(br2),border:`1px solid ${branchColor(br2)}44`,padding:"1px 7px",borderRadius:20,whiteSpace:"nowrap"}}>🏢 {branchLabel(br2)}</span>}
                <span style={{fontSize:11,color:"var(--c-dim)"}}>{o.description}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10,whiteSpace:"nowrap"}}>
                <span style={{fontSize:11,color:"var(--c-dim)"}}>סיום ייצור: {fmt(o.targetDate)}</span>
                <span style={{color:"#ef4444",fontWeight:700,fontSize:12}}>+{days} ימים</span>
              </div>
            </div>
          )})}
          {overdue.length>8&&(
            <button onClick={()=>setShowAllLate(p=>!p)} style={{background:"none",border:"none",color:"#60a5fa",fontSize:12,fontWeight:700,fontFamily:"inherit",padding:"6px 0 0",cursor:"pointer"}}>
              {showAllLate?"▲ הצג פחות":`▼ הצג את כל ${overdue.length.toLocaleString()} הפק"ע באיחור`}
            </button>
          )}
        </Card>
      )}

      {/* Org structure — who reports to whom (detailed reporting lines) */}
      <OrgStructure users={users} departments={departments||[]} workLogs={workLogs} customTasks={customTasks||[]}/>

      {/* Worker Productivity */}
      <Card style={{marginBottom:14}}>
        <div style={{fontWeight:700,fontSize:15,marginBottom:12}}>👥 הספק עובדים</div>
        {workerStats.length===0?<EmptyState icon="👥" title="אין נתוני עובדים" subtitle="נתונים יופיעו כאן אחרי שעובדים ירשמו עבודה"/>:(
          <div style={{overflowX:"auto"}}><table><thead><tr><th>עובד</th><th>שיוך</th><th>יחידות</th><th>שעות</th><th>יח'/שעה</th><th>עלות</th><th>הכנסה</th><th>רווח</th></tr></thead><tbody>
            {workerStats.map(w=>{
              const dept=(departments||[]).find(d=>d.id===w.departmentId);
              const mgr=users.find(m=>m.id===w.managerId);
              return(<tr key={w.id}><td style={{fontWeight:600}}>{w.name}<div style={{fontSize:10,color:ROLES[w.role]?.color||"var(--c-dim)"}}>{ROLES[w.role]?.label||""}</div></td>
              <td style={{fontSize:11.5}}>{dept?<span style={{color:dept.color,fontWeight:600}}>{dept.name}</span>:<span style={{color:"var(--c-dim)"}}>—</span>}{mgr&&<div style={{fontSize:10.5,color:"var(--c-muted)"}}>תחת {mgr.name}</div>}</td>

            })}
          </tbody></table></div>
        )}
      </Card>

      <div style={{display:"grid",gridTemplateColumns:"minmax(0,1.6fr) minmax(0,1fr)",gap:12,marginBottom:12}} className="chart-grid">
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <div style={{fontWeight:700,fontSize:14}}>{barMetric==="rev"?"💰 הכנסות":"📦 תפוקה (יחידות)"} לפי {period==="month"?"חודש":period==="quarter"?"רבעון":"שנה"}</div>
              <ChartInfo title="הכנסות / תפוקה לפי תקופה"
                shows="עמודות שמציגות כמה הכנסות (₪) או כמה יחידות הופקו בכל תקופה — חודש, רבעון או שנה. אפשר להחליף בין 'הכנסות' ל'תפוקה' בכפתורים שלמעלה, ובין סוגי התקופות בראש המסך."
                data={["הכנסות — סכום מחיר היחידה (unitPrice) של כל יחידה שהושלמה במלואה באותה תקופה.","תפוקה — מספר היחידות שהושלמו במלואן באותה תקופה."]}
                how={["המערכת עוברת על כל רישומי העבודה ומשייכת כל יחידה לתקופה לפי תאריך סיום העבודה עליה.","הכנסה ויחידה נספרות פעם אחת בלבד — ברגע שכל השלבים של אותה יחידה הושלמו.","מוצגות עד 10 התקופות האחרונות, מסודרות כרונולוגית."]}
                tip="עמודה גבוהה = תקופה חזקה. השוו בין עמודות סמוכות כדי לזהות מגמת צמיחה או ירידה."/>
            </div>
            <SegBtn options={[["rev","הכנסות"],["qty","תפוקה"]]} value={barMetric} onChange={setBarMetric}/>
          </div>
          <BarChart data={pKeys.map(k=>({label:k,value:barMetric==="rev"?revByPeriod[k].rev:revByPeriod[k].qty}))} color={barMetric==="rev"?"#a78bfa":"#06b6d4"} formatVal={v=>barMetric==="rev"?fmtMoney(v):v.toLocaleString()+" יח'"} height={130}/>
        </Card>
        <Card style={{display:"flex",flexDirection:"column"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{display:"flex",alignItems:"center",gap:7}}><div style={{fontWeight:700,fontSize:14}}>📊 התפלגות</div><ChartInfo title="התפלגות"
            shows="טבעת (Donut) שמפלגת את הנתונים לפי הבחירה בתפריט: סטטוס יחידות, פרויקטים או שלבי ייצור. כל פלח הוא קטגוריה."
            data={["סטטוס יחידות — כמה יחידות הושלמו לעומת כמה עדיין בתהליך.",'שלב בתהליך — כמה פק"ע טרם התחילו, כמה בתהליך ייצור, כמה עצורות וכמה הסתיימו.','סניפים — כמה פק"ע בכל חטיבה עסקית.',"פרויקטים — כמה יחידות הושלמו בכל פרויקט.","שלבים — כמה פעולות עבודה בוצעו בכל שלב ייצור."]}
            how="לכל קטגוריה מסכמים את מספר היחידות או הפעולות שלה, וגודל הפלח בטבעת משקף את חלקה היחסי מתוך הסך הכולל."
            tip="פלח גדול = הקטגוריה הדומיננטית. כך רואים במבט אחד היכן מרוכזת רוב הפעילות."/></div><select value={donutSlice} onChange={e=>setDonutSlice(e.target.value)} style={{padding:"3px 6px",fontSize:11,width:"auto"}}><option value="status">סטטוס יחידות</option><option value="phase">שלב בתהליך</option><option value="branch">סניפים</option><option value="project">פרויקטים</option><option value="stage">שלבים</option></select></div>
          <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><DonutChart data={donutData} size={170}/></div>
        </Card>

            data={["הכנסות — סכום מחיר היחידות שהושלמו בכל תקופה.","הוצאות — עלות שכר העבודה בכל תקופה (זמן עבודה × תעריף שעתי של העובד).","רווח — ההפרש בין הכנסות להוצאות."]}
            how={["ההוצאה מחושבת על כל רישום עבודה: משך בדקות × (תעריף שעתי ÷ 60).","ההכנסה נספרת רק כשהיחידה הושלמה במלואה, פעם אחת ליחידה."]}
            tip="כשהקו הירוק מעל הכחול — יש רווח. התקרבות או הצטלבות של הקווים מסמנת שחיקה ברווחיות."/>
        </div>

          series={[
            {label:"הכנסות",color:"#10b981",data:pKeys.map(k=>Math.round(revByPeriod[k].rev)),formatVal:v=>fmtMoney(v)},

              data="הזמן הממוצע לפעולה אחת בכל שלב (מוצג כשעות/דקות), ולצדו מספר הפעולות שנמדדו בשלב."
              how="לכל שלב מסכמים את משך כל הפעולות שבוצעו בו ומחלקים במספר הפעולות. מוצגים עד 8 השלבים האיטיים ביותר."

// ═══ ORDERS (Work Orders / פקעות) ════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
function OrderForm({initial,projects,stages,stageBlocks,branchOpts=[],departments=[],onSave,onClose}){
  const {toast}=useToast();
  const [f,setF]=useState({
    woNumber:initial?.woNumber||"",description:initial?.description||"",pn:initial?.pn||"",
    qty:initial?.qty||"",unitPrice:initial?.unitPrice||"",projectId:initial?.projectId||"",
    branch:branchCode(initial?.branch),
    receivedDate:initial?.receivedDate||todays(),targetDate:initial?.targetDate||"",
    stageIds:initial?.stageIds||stages.map(s=>s.id),
    blockId:initial?.blockId||""
  });
  const [otherBranch,setOtherBranch]=useState(false);
  const [genSerials,setGenSerials]=useState(!initial);
  const [snPrefix,setSnPrefix]=useState(initial?.pn||"");
  const [snStart,setSnStart]=useState(1);
  const s=(k,v)=>{setF(p=>({...p,[k]:v}));if(k==="pn"&&!initial)setSnPrefix(v)};
  const toggleStage=sid=>setF(p=>({...p,stageIds:p.stageIds.includes(sid)?p.stageIds.filter(i=>i!==sid):[...p.stageIds,sid],blockId:""}));
  const selectBlock=blockId=>{
    if(!blockId){setF(p=>({...p,blockId:"",stageIds:stages.map(s2=>s2.id)}));return}
    const block=(stageBlocks||[]).find(b=>b.id===blockId);
    if(!block)return;
    // Map block stages to global stage IDs by name match
    const ids=block.stages.map(bs=>{const match=stages.find(s2=>s2.name===bs.name);return match?.id}).filter(Boolean);
    setF(p=>({...p,blockId,stageIds:ids}));
  };
  const handleSave=()=>{
    if(!f.woNumber||!f.qty)return toast('יש למלא מספר פק"ע וכמות',"warning");
    let serials=initial?.serials||[];
    if(genSerials&&!initial){
      const prefix=snPrefix||f.pn||f.woNumber;
      const count=Number(f.qty)||0;
      serials=[];
      for(let i=0;i<count;i++){
        serials.push({id:uid(),sn:`${prefix}-${String(snStart+i).padStart(4,"0")}`,createdAt:nowISO()});
      }
    }
    // The array order is the route, so an order built by ticking boxes is stored
    // in the configured stage order rather than in the order they were ticked.
    const rank=new Map(stages.map((st,i)=>[st.id,i]));
    const stageIds=[...(f.stageIds||[])].sort((a,b)=>(rank.get(a)??0)-(rank.get(b)??0));
    onSave({...f,stageIds,_serials:serials});
  };
  return(
    <div>
      <h3 style={{margin:"0 0 16px",fontSize:18}}>{initial?'עריכת פק"ע':'פק"ע חדשה'}</h3>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
        <Field label='מספר פק"ע *' value={f.woNumber} onChange={v=>s("woNumber",v)}/>
        <Field label="P/N (מק״ט)" value={f.pn} onChange={v=>s("pn",v)}/>
        <Field label="תיאור" value={f.description} onChange={v=>s("description",v)}/>
        <Field label="כמות יחידות *" type="number" value={f.qty} onChange={v=>s("qty",v)}/>
        <Field label="מחיר ליחידה (₪)" type="number" value={f.unitPrice} onChange={v=>s("unitPrice",v)}/>
        <div style={{display:"flex",flexDirection:"column",gap:4}}><label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>פרויקט</label><select value={f.projectId} onChange={e=>s("projectId",e.target.value)}><option value="">-- בחר פרויקט --</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>סניף (חטיבה עסקית)</label>
          <select value={otherBranch?"__other":f.branch} onChange={e=>{
            if(e.target.value==="__other"){setOtherBranch(true);s("branch","")}
            else{setOtherBranch(false);s("branch",e.target.value)}
          }}>
            <option value="">— ללא סניף —</option>
            {[...new Set([...branchOpts,...(f.branch?[f.branch]:[])])].map(c=><option key={c} value={c}>{branchLabel(c)}</option>)}
            <option value="__other">➕ מספר סניף אחר…</option>
          </select>
          {otherBranch&&<input value={f.branch} onChange={e=>s("branch",e.target.value.trim())} placeholder="מספר סניף" style={{marginTop:4}}/>}
          {f.branch&&deptsForBranch(departments,f.branch).length>0&&
            <div style={{fontSize:10.5,color:"var(--c-dim)",marginTop:3}}>🏢 {deptsForBranch(departments,f.branch).map(d=>d.name).join(" · ")}</div>}
        </div>
        <Field label="תאריך קבלה" type="date" value={f.receivedDate} onChange={v=>s("receivedDate",v)}/>
        <Field label="יעד אספקה" type="date" value={f.targetDate} onChange={v=>s("targetDate",v)}/>
      </div>
      {/* Serial number generation */}
      {!initial&&(
        <div style={{marginTop:14,background:"var(--c-deep)",borderRadius:10,padding:14,border:"1px solid var(--c-border)"}}>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:genSerials?10:0}}>
            <input type="checkbox" checked={genSerials} onChange={e=>setGenSerials(e.target.checked)}/>
            🔢 צור מספרים סידוריים אוטומטית
          </label>
          {genSerials&&(
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <Field label="קידומת S/N" value={snPrefix} onChange={setSnPrefix} placeholder={f.pn||f.woNumber} style={{minWidth:120}}/>
              <Field label="מספר התחלתי" type="number" value={snStart} onChange={v=>setSnStart(Number(v))} style={{minWidth:80}}/>
              <div style={{fontSize:12,color:"var(--c-muted)",paddingBottom:8}}>
                {f.qty?`ייווצרו ${f.qty} סידוריים: ${snPrefix||f.pn||f.woNumber}-${String(snStart).padStart(4,"0")} עד ${snPrefix||f.pn||f.woNumber}-${String(snStart+Number(f.qty)-1).padStart(4,"0")}`:"הזן כמות"}
              </div>
            </div>
          )}
        </div>
      )}
      <div style={{marginTop:14}}>
        <label style={{fontSize:12,color:"var(--c-dim)",fontWeight:600,display:"block",marginBottom:6}}>שלבי עבודה לפק"ע זו:</label>
        {(stageBlocks||[]).length>0&&(
          <div style={{marginBottom:10}}>
            <label style={{fontSize:11,color:"#8b5cf6",fontWeight:600,display:"block",marginBottom:4}}>📦 בחר בלוק מוכן:</label>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <button onClick={()=>selectBlock("")} style={{background:!f.blockId?"var(--c-accent)22":"var(--c-deep)",border:`1px solid ${!f.blockId?"var(--c-accent)":"var(--c-border)"}`,borderRadius:8,padding:"5px 10px",fontSize:12,color:!f.blockId?"var(--c-accent)":"var(--c-muted)",fontFamily:"inherit",cursor:"pointer"}}>ללא בלוק</button>
              {(stageBlocks||[]).map(b=>(
                <button key={b.id} onClick={()=>selectBlock(b.id)} style={{background:f.blockId===b.id?"#8b5cf622":"var(--c-deep)",border:`1px solid ${f.blockId===b.id?"#8b5cf6":"var(--c-border)"}`,borderRadius:8,padding:"5px 10px",fontSize:12,color:f.blockId===b.id?"#8b5cf6":"var(--c-muted)",fontFamily:"inherit",cursor:"pointer"}}>
                  📦 {b.name} <span style={{fontSize:10,color:"var(--c-dim)"}}>({b.stages.length} שלבים, ₪{b.stages.reduce((s2,st)=>s2+(st.price||0),0)})</span>
                </button>
              ))}
            </div>
          </div>
        )}
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {stages.map(st=>(
            <label key={st.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",background:f.stageIds.includes(st.id)?st.color+"22":"var(--c-deep)",border:`1px solid ${f.stageIds.includes(st.id)?st.color+"66":"var(--c-border)"}`,borderRadius:8,padding:"6px 10px",color:f.stageIds.includes(st.id)?st.color:"var(--c-muted)"}}>
              <input type="checkbox" checked={f.stageIds.includes(st.id)} onChange={()=>toggleStage(st.id)} style={{width:"auto"}}/>
              {st.name}{st.roleId&&ROLES[st.roleId]?` · ${ROLES[st.roleId].icon} ${ROLES[st.roleId].label}`:""}{st.minutes>0?` · ⏱️${st.minutes}ד'`:""}
            </label>
          ))}
        </div>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:16}}>
        <Btn onClick={onClose}>ביטול</Btn>
        <Btn color="#10b981" onClick={handleSave}>שמור</Btn>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ QUANTITY SIGN-OFF (חתימה לפי כמות) ═════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// For a פק"ע that is not managed serially. The serial grid asks "did unit #7 pass
// this stage" and there is no unit #7 to ask about; this asks the only question
// that has an answer — "how many passed" — and stores it as a work log with a
// count and no serial (see isQtyLog). From there every progress bar, unit count
// and remaining-work estimate reads it exactly as it reads serial progress.
//
// A signature is capped at what is left, so a stage can never show more units than
// the פק"ע has, and each one can be taken back on its own from the list below it.
//
// `onStartRun` — given only on the worker's own screen — adds the other way to
// report the same thing: instead of signing after the fact, start a timer on a
// batch and let it be measured (see isQtyRun). Both write the identical record;
// the timed one just knows how long it took.
function QtySignOff({order,stages,workLogs,onSignOff,onDeleteLog,compact,onStartRun,runBlocked}){
  const {canEdit,currentUser}=useAuth();
  // Who signs what. Managers and editors sign anywhere. A worker signs the stages
  // they are allowed to work on — the very same permission that decides which
  // units reach their queue in ״העבודה שלי״ — so a quantity is reported by the
  // person who actually did that stage, on their own user, and nobody can book
  // work on a stage that was never theirs.
  const isMgr=canEdit||isLeadRole(currentUser?.role);
  const myStageSet=useMemo(()=>currentUser?.stageAccess==="all"?null
    :new Set(Array.isArray(currentUser?.stageAccess)?currentUser.stageAccess:[]),[currentUser]);
  const canSignStage=sid=>isMgr||!myStageSet||myStageSet.has(sid);
  const oStages=orderRoute(order,stages);
  const canSign=oStages.some(st=>canSignStage(st.id));
  const qty=Number(order.qty)||0;
  const qtyIdx=useQtyIndex(workLogs);
  const [amount,setAmount]=useState({});          // stageId → units about to be signed
  const [minutes,setMinutes]=useState({});        // stageId → optional measured time
  const [openHist,setOpenHist]=useState("");
  const signedOf=sid=>Math.min(qty,qtySigned(qtyIdx,workLogs,order.id,sid));
  // Units of this stage a timer is running on right now — not signed yet, but
  // spoken for, so they are not offered to be started a second time.
  const qtyRunIdx=useQtyRunIndex(workLogs);
  const runningOf=sid=>qtyRunning(qtyRunIdx,workLogs,order.id,sid);
  const runsOf=sid=>(workLogs||[]).filter(w=>isQtyRun(w)&&w.orderId===order.id&&w.stageId===sid);
  const histOf=sid=>(workLogs||[]).filter(w=>isQtyLog(w)&&w.orderId===order.id&&w.stageId===sid)
    .sort((a,b)=>String(b.endTime||b.startTime||"").localeCompare(String(a.endTime||a.startTime||"")));
  const totalSigned=oStages.reduce((n,st)=>n+signedOf(st.id),0);
  const totalNeeded=qty*oStages.length;
  const fullUnits=oStages.length?Math.min(...oStages.map(st=>signedOf(st.id))):0;

  const sign=(st,n)=>{
    const left=qty-signedOf(st.id);
    const count=Math.min(Math.floor(Number(n)||0),left);
    if(!(count>0))return;
    const min=Math.max(0,Number(minutes[st.id])||0);
    onSignOff({id:uid(),userId:currentUser.id,userName:currentUser.name,
      // No serial: this is the whole point — the count is the unit.
      serialId:null,serialSn:null,stageId:st.id,orderId:order.id,
      startTime:nowISO(),endTime:nowISO(),completed:true,
      // Zero unless someone actually measured the batch. A made-up duration would
      // land in זמן בפועל and poison every standard-time comparison in the app.
      durationMin:min,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[],
      bulk:true,bulkGroupId:null,bulkCount:count});
    setAmount(p=>({...p,[st.id]:""}));
    setMinutes(p=>({...p,[st.id]:""}));
  };
  // Open a timed run instead of signing: the count is capped at what is neither
  // signed nor already running, so two workers cannot start the same units.
  const startRun=(st,n)=>{
    if(!onStartRun)return;
    const free=Math.max(0,qty-signedOf(st.id)-runningOf(st.id));
    const count=Math.min(Math.floor(Number(n)||0),free);
    if(!(count>0))return;
    onStartRun(st,count);
    setAmount(p=>({...p,[st.id]:""}));
    setMinutes(p=>({...p,[st.id]:""}));
  };
  const canUndo=w=>!!onDeleteLog&&(isMgr||w.userId===currentUser?.id);
  const undo=w=>{
    if(!onDeleteLog)return;
    if(!confirm(`לבטל חתימה על ${w.bulkCount} יחידות${w.userName?` (${w.userName})`:""}?`))return;
    onDeleteLog([w.id]);
  };

  if(!qty)return(
    <div style={{fontSize:12.5,color:"var(--c-muted)",background:"#f59e0b12",border:"1px solid #f59e0b44",borderRadius:9,padding:"10px 13px"}}>
      <b style={{color:"#f59e0b"}}>אין כמות בפק"ע.</b> כדי לעקוב לפי כמות יש להזין כמות יחידות בעריכת הפק"ע.
    </div>
  );
  return(
    <div>
      {!compact&&(<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:10}}>
          <h3 style={{margin:0,fontSize:15}}>✍️ חתימה לפי כמות</h3>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",fontSize:12,color:"var(--c-muted)"}}>
            <span>יחידות שסיימו את כל המסלול: <b style={{color:fullUnits>=qty&&qty>0?"#10b981":"var(--c-text)"}}>{fullUnits}/{qty}</b></span>
            {totalNeeded>0&&<span>דיווחי שלבים: <b style={{color:"#3b82f6"}}>{totalSigned}/{totalNeeded}</b></span>}
          </div>
        </div>
        <div style={{fontSize:12,color:"var(--c-dim)",lineHeight:1.7,marginBottom:12}}>
          לפק"ע הזו אין מספרים סידוריים, ולכן העבודה מדווחת בכמויות: לכל שלב מדווחים כמה יחידות עברו אותו.
          יש שתי דרכים, ושתיהן נספרות אותו הדבר: <b style={{color:"#f59e0b"}}>▶️ התחל עבודה</b> על כמות — נפתח טיימר עם הפסקה וסיום בדיוק כמו ביחידה סיריאלית, והזמן שנמדד נכנס לחישובי זמן תקן;
          או <b style={{color:"#10b981"}}>✍️ חתום</b> — חתימה מיידית על עבודה שכבר בוצעה. סרגלי ההתקדמות, יחידות שהושלמו והצפי לסיום מתעדכנים משתיהן, וכל דיווח נשמר עם השם והשעה וניתן לביטול.
        </div>
      </>)}
      {compact&&(
        <div style={{fontSize:11.5,color:"var(--c-dim)",marginBottom:8}}>
          יחידות שסיימו את כל המסלול: <b style={{color:fullUnits>=qty&&qty>0?"#10b981":"var(--c-text)"}}>{fullUnits}/{qty}</b>
          {totalNeeded>0&&<span> · דיווחי שלבים: <b style={{color:"#3b82f6"}}>{totalSigned}/{totalNeeded}</b></span>}
        </div>
      )}
      {!oStages.length&&(
        <div style={{fontSize:12.5,color:"#f59e0b",background:"#f59e0b12",border:"1px solid #f59e0b44",borderRadius:9,padding:"10px 13px"}}>
          לפק"ע לא משויכים שלבים — הוסיפו שלבים בעריכת הפק"ע כדי לחתום עליהם.
        </div>
      )}
      {oStages.length>0&&(
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>שלב</th><th>נחתם</th><th>נותר</th><th style={{minWidth:110}}>התקדמות</th>{canSign&&<th style={{minWidth:210}}>חתימה</th>}<th></th></tr></thead>
            <tbody>
              {oStages.map(st=>{
                const done=signedOf(st.id),left=Math.max(0,qty-done);
                const pct=qty?Math.round(done/qty*100):0;
                const hist=histOf(st.id);
                const running=runningOf(st.id);          // units with a timer on them now
                const free=Math.max(0,left-running);     // what is still free to start
                return(
                  <React.Fragment key={st.id}>
                    <tr>
                      <td style={{fontWeight:700,color:st.color}}>
                        {st.name}
                        {running>0&&<div style={{fontSize:10.5,fontWeight:600,color:"#f59e0b",marginTop:2}}
                          title={runsOf(st.id).map(w=>`${w.userName||"—"} · ${w.bulkCount} יח'`).join(" · ")}>⏱️ {running} יח' בעבודה כרגע</div>}
                      </td>
                      <td style={{fontWeight:700,color:done?"#10b981":"var(--c-dim)"}}>{done}</td>
                      <td style={{color:left?"#f59e0b":"var(--c-dim)"}}>{left}</td>
                      <td><div style={{minWidth:100}}><PBar pct={pct} h={7}/></div></td>
                      {canSign&&(
                        <td>
                          {!canSignStage(st.id)?(
                            <span title="השלב הזה אינו בהרשאות שלך — הדיווח עליו נעשה ע״י מי שמורשה לו" style={{fontSize:12,color:"var(--c-dim)"}}>🔒 לא בהרשאות שלך</span>
                          ):left>0?(
                            <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
                              <input type="number" min="1" max={left} value={amount[st.id]??""} placeholder={String(onStartRun?(free||left):left)}
                                onChange={e=>setAmount(p=>({...p,[st.id]:e.target.value}))}
                                style={{width:70,padding:"5px 7px",fontSize:12}} title={`עד ${left} יחידות`}/>
                              {/* Start the timer on that many units — the same עבודה a serial unit
                                  gets. Offered before the signature, because a measured report is
                                  worth more than one typed in afterwards. */}
                              {onStartRun&&(free>0
                                ?<Btn small color="#f59e0b" disabled={!!runBlocked} onClick={()=>startRun(st,amount[st.id]||free)}
                                   title={runBlocked||`התחלת עבודה על ${amount[st.id]||free} יחידות — ייפתח טיימר עם הפסקה וסיום, בדיוק כמו ביחידה סיריאלית`}>▶️ התחל עבודה</Btn>
                                :<span style={{fontSize:11,color:"#f59e0b"}} title="כל היחידות שנותרו בשלב הזה כבר בעבודה">⏱️ הכל בעבודה</span>)}
                              <input type="number" min="0" value={minutes[st.id]??""} placeholder="דק' (רשות)"
                                onChange={e=>setMinutes(p=>({...p,[st.id]:e.target.value}))}
                                style={{width:96,padding:"5px 7px",fontSize:12}} title="זמן העבודה בפועל על האצווה — לא חובה. אם יוזן, ייכנס לחישובי זמן בפועל מול התקן"/>
                              <Btn small color="#10b981" onClick={()=>sign(st,amount[st.id]||left)} title="חתימה מיידית, בלי טיימר — לעבודה שכבר בוצעה">✍️ חתום</Btn>
                              {(!amount[st.id]||Number(amount[st.id])>=left)&&left>1&&<span style={{fontSize:11,color:"var(--c-dim)"}}>הכל ({left})</span>}
                            </div>
                          ):<span style={{fontSize:12,color:"#10b981",fontWeight:700}}>✅ הושלם</span>}
                        </td>
                      )}
                      <td style={{textAlign:"center"}}>
                        {hist.length>0&&<button onClick={()=>setOpenHist(h=>h===st.id?"":st.id)}
                          style={{background:"none",border:"1px solid var(--c-border2)",borderRadius:6,padding:"2px 8px",fontSize:11,color:"var(--c-dim)",cursor:"pointer",fontFamily:"inherit"}}
                          title="חתימות שבוצעו על שלב זה">🕘 {hist.length}</button>}
                      </td>
                    </tr>
                    {openHist===st.id&&hist.map(w=>(
                      <tr key={w.id} style={{background:"var(--c-deep)"}}>
                        <td colSpan={canSign?6:5} style={{fontSize:11.5,color:"var(--c-muted)"}}>
                          <span style={{color:"#10b981",fontWeight:700}}>+{w.bulkCount}</span> יחידות · {w.userName||"—"} · {w.endTime?new Date(w.endTime).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}
                          {Number(w.durationMin)>0?` · ${fmtTime(w.durationMin)}`:""}
                          {canUndo(w)&&<button onClick={()=>undo(w)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:11.5,fontFamily:"inherit",marginRight:8}}>🗑️ בטל</button>}
                        </td>
                      </tr>
                    ))}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
          {!canSign&&<div style={{fontSize:11.5,color:"var(--c-dim)",marginTop:8}}>לצפייה בלבד — אף אחד משלבי הפק"ע הזו אינו בהרשאות שלך. חתימה לפי כמות מבוצעת ע"י מנהל מחלקה, ראש צוות, עורך, או עובד שהשלב בהרשאותיו.</div>}
        </div>
      )}
    </div>
  );
}

function SerialsManager({order,stages,onUpdate,workLogs,onSignOff}){
  const {canEdit,currentUser}=useAuth();
  const isAdmin=currentUser?.role==="admin";
  const [addCount,setAddCount]=useState(1);
  const [prefix,setPrefix]=useState(order.pn||order.woNumber);
  const [startNum,setStartNum]=useState((order.serials||[]).length+1);
  const serials=order.serials||[];

  const makeSerials=(n,from)=>{
    const out=[];
    for(let i=0;i<n;i++)out.push({id:uid(),sn:`${prefix}-${String(from+i).padStart(4,"0")}`,createdAt:nowISO()});
    return out;
  };
  const addSerials=()=>{
    onUpdate({...order,serials:[...serials,...makeSerials(addCount,startNum)]});
    setStartNum(startNum+addCount);
  };
  // The common case behind every "הושלמה · 0/0" row: Priority sent the פק"ע
  // without its serials sheet, so there is nothing to report work against. One
  // click issues the units the פק"ע is actually for.
  const fillFromQty=()=>{
    const n=Number(order.qty)||0;
    if(!(n>0))return;
    if(!confirm(`ליצור ${n} סידוריים לפי הכמות בפק"ע?\nאלה מספרים מקומיים — ייבוא עתידי עם גיליון ״סידוריים״ מ-Priority יחליף אותם.`))return;
    onUpdate({...order,serials:makeSerials(n,1)});
    setStartNum(n+1);
  };

  const removeSn=id=>{
    if(!confirm("למחוק יחידה זו?"))return;
    onUpdate({...order,serials:serials.filter(s=>s.id!==id)});
  };

  // The grid asks for one cell per unit per stage — a hundred units on a
  // twenty-stage route is two thousand questions per render, and each of them
  // used to walk the whole log list twice. One pass up front answers all of them.
  const cellLogs=useMemo(()=>{
    const done=new Map(),active=new Map();
    (workLogs||[]).forEach(w=>{
      if(!w.serialId||!w.stageId)return;
      const k=logKey(w.serialId,w.stageId);
      if(w.completed){if(!done.has(k))done.set(k,w)}
      else if(!active.has(k))active.set(k,w);
    });
    return{done,active};
  },[workLogs]);
  const getStageStatus=(serialId,stageId)=>{
    const k=logKey(serialId,stageId);
    const log=cellLogs.done.get(k);
    if(log)return{done:true,user:log.userName,time:log.endTime,duration:log.durationMin};
    const active=cellLogs.active.get(k);
    if(active)return{active:true,user:active.userName,startTime:active.startTime};
    return{pending:true};
  };

  const adminSignOff=(serialId,stageId)=>{
    if(!isAdmin)return;
    const serial=serials.find(s=>s.id===serialId);
    if(!serial)return;
    const stage=stages.find(s=>s.id===stageId);
    if(onSignOff)onSignOff({id:uid(),userId:currentUser.id,userName:currentUser.name,serialId,serialSn:serial.sn,stageId,orderId:order.id,startTime:nowISO(),endTime:nowISO(),completed:true,durationMin:0,paused:false,pauseStart:null,totalPauseMin:0,pauseLog:[]});
  };

  const oStages=orderRoute(order,stages);

  // A פק"ע of five hundred units on a twenty-stage route is ten thousand table
  // cells. Rather than build them all and then let the browser struggle, the grid
  // shows a screenful at a time and grows on demand — with a search and a status
  // filter so the unit you actually want is one step away, not a scroll away.
  const unitState=s=>{
    if(oStages.every(st=>getStageStatus(s.id,st.id).done))return"done";
    if(oStages.some(st=>getStageStatus(s.id,st.id).active))return"active";
    return"pending";
  };
  const [snQ,setSnQ]=useState("");
  const [snFilter,setSnFilter]=useState("all");
  const [shown,setShown]=useState(SN_PAGE);
  const visSerials=useMemo(()=>{
    const q=snQ.trim().toLowerCase();
    return serials.filter(s=>(!q||String(s.sn||"").toLowerCase().includes(q))&&(snFilter==="all"||unitState(s)===snFilter));
  },[serials,snQ,snFilter,cellLogs,oStages]);
  useEffect(()=>{setShown(SN_PAGE)},[snQ,snFilter,order.id]);
  const page=visSerials.slice(0,shown);

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:10,flexWrap:"wrap"}}>
        <h3 style={{margin:0,fontSize:15}}>🔢 מספרים סידוריים ({serials.length})</h3>
        {serials.length>SN_PAGE&&(
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <input value={snQ} onChange={e=>setSnQ(e.target.value)} placeholder="חיפוש S/N..." style={{padding:"6px 8px",fontSize:12,width:150}}/>
            <SegBtn options={[["all","הכל"],["pending","ממתין"],["active","בתהליך"],["done","סופק"]]} value={snFilter} onChange={setSnFilter}/>
          </div>
        )}
      </div>
      {canEdit&&serials.length===0&&Number(order.qty)>0&&(
        <div style={{background:"#f59e0b12",border:"1px solid #f59e0b44",borderRadius:8,padding:"11px 13px",marginBottom:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontSize:12.5,color:"var(--c-muted)",lineHeight:1.6,flex:"1 1 240px"}}>
            <b style={{color:"#f59e0b"}}>לפק"ע אין מספרים סידוריים.</b> אם היא מנוהלת סיריאלית — צרו אותם כאן כדי לדווח יחידה-יחידה. אם לא, אין צורך: חתמו ״לפי כמות״ בכרטיס שמעל, וההתקדמות תיספר משם.
          </div>
          <Btn color="#f59e0b" onClick={fillFromQty}>🔢 צור {Number(order.qty)} סידוריים לפי הכמות</Btn>
        </div>
      )}
      {canEdit&&(
        <div style={{background:"var(--c-deep)",borderRadius:8,padding:12,marginBottom:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <Field label="קידומת" value={prefix} onChange={setPrefix} style={{minWidth:100}}/>
          <Field label="מספר התחלתי" type="number" value={startNum} onChange={v=>setStartNum(Number(v))} style={{minWidth:80}}/>
          <Field label="כמות להוספה" type="number" value={addCount} onChange={v=>setAddCount(Math.max(1,Number(v)))} style={{minWidth:80}}/>
          <Btn color="var(--c-accent)" onClick={addSerials}>+ הוסף {addCount} יחידות</Btn>
        </div>
      )}
      {serials.length===0?<div style={{color:"var(--c-dim)",textAlign:"center",padding:20}}>לא הוזנו מספרים סידוריים</div>:(
        <div style={{overflowX:"auto"}}>
          <table>
            <thead><tr><th>S/N</th>{oStages.map(st=><th key={st.id} style={{color:st.color}}>{st.name}</th>)}<th>סטטוס</th>{canEdit&&<th></th>}</tr></thead>
            <tbody>
              {page.map(s=>{
                const allDone=oStages.every(st=>getStageStatus(s.id,st.id).done);
                const anyActive=oStages.some(st=>getStageStatus(s.id,st.id).active);
                return(
                  <tr key={s.id}>
                    <td style={{fontWeight:700,fontSize:12,color:"#7eb8ff"}}>{s.sn}</td>
                    {oStages.map(st=>{
                      const status=getStageStatus(s.id,st.id);
                      if(status.done)return<td key={st.id} style={{textAlign:"center"}}><span title={`${status.user} — ${fmtTime(status.duration)}`} style={{color:"#10b981",fontSize:16}}>✅</span></td>;
                      if(status.active)return<td key={st.id} style={{textAlign:"center"}}><span style={{animation:"pulse 1.5s infinite",color:"#f59e0b",fontSize:13}}>🔄 {status.user}</span></td>;
                      return<td key={st.id} style={{textAlign:"center"}}>{isAdmin?<button onClick={()=>adminSignOff(s.id,st.id)} style={{background:"none",border:"1px dashed var(--c-border2)",borderRadius:6,padding:"2px 8px",fontSize:11,color:"var(--c-dim)",cursor:"pointer",fontFamily:"inherit"}} title="חתום כמנהל">✍️</button>:<span style={{color:"var(--c-dim)"}}>—</span>}</td>;
                    })}
                    <td style={{textAlign:"center"}}>{allDone?<span style={{color:"#10b981",fontWeight:700,fontSize:12}}>📦 סופק</span>:anyActive?<span style={{color:"#f59e0b",fontSize:12}}>🔄 בתהליך</span>:<span style={{color:"var(--c-dim)",fontSize:12}}>ממתין</span>}</td>
                    {canEdit&&<td><IBtn onClick={()=>removeSn(s.id)}>🗑️</IBtn></td>}
                  </tr>
                );
              })}
            </tbody>
          </table>
          {shown<visSerials.length&&(
            <div style={{display:"flex",gap:8,alignItems:"center",justifyContent:"center",padding:"12px 0 2px"}}>
              <Btn small onClick={()=>setShown(n=>n+SN_PAGE)}>הצג {Math.min(SN_PAGE,visSerials.length-shown)} נוספים</Btn>
              <Btn small color="var(--c-accent)" onClick={()=>setShown(visSerials.length)}>הצג את כל {visSerials.length}</Btn>
              <span style={{fontSize:11.5,color:"var(--c-dim)"}}>מוצגות {page.length} מתוך {visSerials.length}</span>
            </div>
          )}
          {!visSerials.length&&<div style={{color:"var(--c-dim)",textAlign:"center",padding:16,fontSize:12.5}}>אין יחידה שעונה על הסינון</div>}
        </div>
      )}
    </div>
  );
}

function DefectsSection({order,onUpdate}){
  const {canEdit}=useAuth();
  const [showDef,setShowDef]=useState(false);
  const [deff,setDeff]=useState({title:"",serialId:"",type:"quality",severity:"medium",description:"",responsible:"",discoveredDate:todays(),status:"open"});
  const sevColor={low:"#10b981",medium:"#f59e0b",high:"#ef4444",critical:"#dc2626"};
  const sevLabel={low:"🟢 נמוכה",medium:"🟡 בינונית",high:"🟠 גבוהה",critical:"🔴 קריטית"};
  const typeLabel={quality:"איכות",process:"תהליך",material:"חומר גלם",equipment:"ציוד",human:"גורם אנושי",other:"אחר"};
  const addDef=()=>{if(!deff.title)return;onUpdate({...order,defects:[...(order.defects||[]),{id:uid(),...deff}]});setDeff({title:"",serialId:"",type:"quality",severity:"medium",description:"",responsible:"",discoveredDate:todays(),status:"open"});setShowDef(false)};
  const closeDef=id=>onUpdate({...order,defects:(order.defects||[]).map(d=>d.id===id?{...d,status:"closed",closedDate:todays()}:d)});
  const remDef=id=>onUpdate({...order,defects:(order.defects||[]).filter(d=>d.id!==id)});
  return(
    <Card style={{border:"1px solid #f9731633"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h3 style={{margin:0,fontSize:15,color:"#fb923c"}}>🔧 תקלות ({(order.defects||[]).filter(d=>d.status!=="closed").length} פתוחות)</h3>
        {canEdit&&<Btn color="#f97316" onClick={()=>setShowDef(p=>!p)} small>+ הוסף</Btn>}
      </div>
      {showDef&&(
        <div style={{background:"var(--c-deep)",borderRadius:8,padding:12,marginBottom:10,border:"1px solid #f9731633"}}>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
            <Field label="כותרת תקלה *" value={deff.title} onChange={v=>setDeff(p=>({...p,title:v}))} style={{minWidth:160}}/>
            <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:120}}>
              <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>S/N</label>
              <select value={deff.serialId} onChange={e=>setDeff(p=>({...p,serialId:e.target.value}))}>
                <option value="">-- כללי --</option>
                {(order.serials||[]).map(s=><option key={s.id} value={s.id}>{s.sn}</option>)}
              </select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:100}}>
              <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>סוג</label>
              <select value={deff.type} onChange={e=>setDeff(p=>({...p,type:e.target.value}))}>{Object.entries(typeLabel).map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:100}}>
              <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>חומרה</label>
              <select value={deff.severity} onChange={e=>setDeff(p=>({...p,severity:e.target.value}))}><option value="low">נמוכה</option><option value="medium">בינונית</option><option value="high">גבוהה</option><option value="critical">קריטית</option></select>
            </div>
            <Field label="אחראי" value={deff.responsible} onChange={v=>setDeff(p=>({...p,responsible:v}))}/>
            <Field label="תיאור" value={deff.description} onChange={v=>setDeff(p=>({...p,description:v}))} style={{minWidth:200}}/>
            <Btn color="#f97316" onClick={addDef}>שמור</Btn>
            <Btn onClick={()=>setShowDef(false)}>ביטול</Btn>
          </div>
        </div>
      )}
      {(order.defects||[]).length===0?<EmptyState icon="✅" title="אין תקלות" subtitle="לא דווחו תקלות להזמנה זו"/>:(
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {(order.defects||[]).map(d=>{const sc=sevColor[d.severity];const serial=(order.serials||[]).find(s=>s.id===d.serialId);return(
            <div key={d.id} style={{background:"var(--c-deep)",borderRadius:8,padding:"10px 14px",border:`1px solid ${d.status==="closed"?"#10b98133":sc+"44"}`,opacity:d.status==="closed"?.6:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,fontSize:13}}>{d.title}</span>
                    <span style={{fontSize:11,background:sc+"22",color:sc,padding:"2px 8px",borderRadius:12,border:`1px solid ${sc}44`}}>{sevLabel[d.severity]}</span>
                    <span style={{fontSize:11,background:"var(--c-card)",color:"#7eb8ff",padding:"2px 8px",borderRadius:12}}>{typeLabel[d.type]||d.type}</span>
                    {serial&&<span style={{fontSize:11,background:"#152240",color:"#7eb8ff",padding:"2px 8px",borderRadius:12}}>S/N: {serial.sn}</span>}
                    {d.status==="closed"&&<span style={{fontSize:11,background:"#052e16",color:"#6ee7b7",padding:"2px 8px",borderRadius:12}}>✅ נסגרה</span>}
                  </div>
                  {d.description&&<div style={{fontSize:12,color:"var(--c-muted)",marginBottom:3}}>{d.description}</div>}
                  <div style={{fontSize:11,color:"var(--c-dim)",display:"flex",gap:10,flexWrap:"wrap"}}>
                    {d.discoveredDate&&<span>גולתה: {fmt(d.discoveredDate)}</span>}
                    {d.responsible&&<span style={{color:"#a78bfa"}}>אחראי: {d.responsible}</span>}
                  </div>
                </div>
                {canEdit&&<div style={{display:"flex",gap:4}}>{d.status!=="closed"&&<IBtn onClick={()=>closeDef(d.id)} title="סגור">✅</IBtn>}<IBtn onClick={()=>remDef(d.id)}>🗑️</IBtn></div>}
              </div>
            </div>
          )})}
        </div>
      )}
    </Card>
  );
}

// ── Shortages inside an Order (add/manage) ────────────────────────
function ShortagesInOrder({order,onUpdate}){
  const {canEdit}=useAuth();
  const [show,setShow]=useState(false);
  const [f,setF]=useState({item:"",sku:"",missing:"",reason:"",responsible:"",orderedDate:todays(),note:""});
  const [partialModal,setPartialModal]=useState(null);
  const [partialQty,setPartialQty]=useState("");
  const shortages=order.shortages||[];
  const addSh=()=>{if(!f.item)return;onUpdate({...order,shortages:[...shortages,{id:uid(),...f,received:false,receivedDate:null,receivedQty:0}]});setF({item:"",sku:"",missing:"",reason:"",responsible:"",orderedDate:todays(),note:""});setShow(false)};
  const markRec=id=>onUpdate({...order,shortages:shortages.map(s=>s.id===id?{...s,received:true,receivedDate:todays(),receivedQty:Number(s.missing||0)}:s)});
  const markRecPartial=(id,qty)=>{onUpdate({...order,shortages:shortages.map(s=>{if(s.id!==id)return s;const nq=Number(s.receivedQty||0)+Number(qty),tot=Number(s.missing||0);return{...s,receivedQty:nq,received:tot>0&&nq>=tot,receivedDate:todays()}})});setPartialModal(null);setPartialQty("")};
  const remSh=id=>onUpdate({...order,shortages:shortages.filter(s=>s.id!==id)});
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h3 style={{margin:0,fontSize:15,color:"#f87171"}}>⚠️ חוסרים ({shortages.filter(s=>!s.received).length})</h3>
        {canEdit&&<Btn color="#ef4444" small onClick={()=>setShow(p=>!p)}>+ הוסף חוסר</Btn>}
      </div>
      {show&&(
        <div style={{background:"var(--c-deep)",borderRadius:8,padding:12,marginBottom:10,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <Field label="פריט חסר *" value={f.item} onChange={v=>setF(p=>({...p,item:v}))} style={{minWidth:160}}/>
          <Field label='מק"ט' value={f.sku} onChange={v=>setF(p=>({...p,sku:v}))}/>
          <Field label="כמות" type="number" value={f.missing} onChange={v=>setF(p=>({...p,missing:v}))}/>
          <Field label="סיבה" value={f.reason} onChange={v=>setF(p=>({...p,reason:v}))}/>
          <Field label="אחראי" value={f.responsible} onChange={v=>setF(p=>({...p,responsible:v}))}/>
          <Field label="תאריך הזמנה" type="date" value={f.orderedDate} onChange={v=>setF(p=>({...p,orderedDate:v}))}/>
          <Field label="הערה" value={f.note} onChange={v=>setF(p=>({...p,note:v}))}/>
          <Btn color="#ef4444" onClick={addSh} small>שמור</Btn>
          <Btn onClick={()=>setShow(false)} small>ביטול</Btn>
        </div>
      )}
      {shortages.length===0?<EmptyState icon="✅" title="אין חוסרים" subtitle="כל החומרים זמינים"/>:(
        <div style={{overflowX:"auto"}}><table><thead><tr><th>פריט</th><th>מק"ט</th><th>כמות</th><th>התקבל</th><th>אחראי</th><th>סטטוס</th>{canEdit&&<th></th>}</tr></thead><tbody>
          {shortages.map(s=>{const rq=Number(s.receivedQty||0),tot=Number(s.missing||0),isPar=rq>0&&!s.received;return(
            <tr key={s.id} style={{opacity:s.received?.6:1}}>
              <td style={{fontWeight:600}}>{s.item}</td>
              <td style={{color:"#7eb8ff",fontSize:12}}>{s.sku||"—"}</td>
              <td>{tot||"—"}</td>
              <td style={{color:s.received?"#10b981":isPar?"#f59e0b":"var(--c-dim)",fontWeight:600}}>{s.received?tot:isPar?`${rq}/${tot}`:"—"}</td>
              <td style={{color:"#a78bfa",fontSize:12}}>{s.responsible||"—"}</td>
              <td>{s.received?<span style={{color:"#10b981",fontSize:12}}>✅</span>:isPar?<span style={{color:"#f59e0b",fontSize:12}}>📦</span>:<span style={{color:"#ef4444",fontSize:12}}>❌</span>}</td>
              {canEdit&&<td><div style={{display:"flex",gap:2}}>
                {!s.received&&<><IBtn onClick={()=>{setPartialModal(s.id);setPartialQty("")}} title="קבלה חלקית">📦</IBtn><IBtn onClick={()=>markRec(s.id)} title="התקבל">✅</IBtn></>}
                <IBtn onClick={()=>remSh(s.id)}>🗑️</IBtn>
              </div></td>}
            </tr>
          )})}
        </tbody></table></div>
      )}
      {partialModal&&(<div onClick={()=>setPartialModal(null)} style={{position:"fixed",inset:0,background:"#000c",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div onClick={e=>e.stopPropagation()} style={{background:"var(--c-card)",borderRadius:12,padding:24,minWidth:280,border:"1px solid var(--c-border2)"}}><div style={{fontWeight:700,fontSize:16,marginBottom:12,color:"#f59e0b"}}>📦 קבלה חלקית</div><Field label="כמות שהתקבלה" type="number" value={partialQty} onChange={setPartialQty}/><div style={{display:"flex",gap:8,marginTop:14}}><Btn color="#f59e0b" onClick={()=>partialQty&&markRecPartial(partialModal,partialQty)}>שמור</Btn><Btn onClick={()=>setPartialModal(null)}>ביטול</Btn></div></div></div>)}
    </div>
  );
}

function OrderDetail({order,projects,stages,stageBlocks,departments=[],onClose,onUpdate,workLogs,onWorkLog,onDeleteLog,workdayHours=8,pnStandards}){
  const {canEdit,currentUser}=useAuth();
  const isAdmin=currentUser?.role==="admin";
  const proj=projects.find(p=>p.id===order.projectId);
  const serials=order.serials||[];
  const oStages=orderRoute(order,stages);
  const doneIdx=useDoneIndex(workLogs);
  const qtyIdx=useQtyIndex(workLogs);
  // Serially, or — with no serials — from the quantity signatures.
  const byQty=isQtyOrder(order);
  const units=orderUnits(order);
  const br=branchCode(order.branch);
  const brDepts=deptsForBranch(departments,br);
  const totalCompleted=orderDoneCount(order,oStages,workLogs,doneIdx,qtyIdx);
  const pct=units?Math.round(totalCompleted/units*100):0;
  const passes=orderStagePasses(order,oStages,workLogs,doneIdx,qtyIdx);
  const reportState=REPORT_STATE[orderReportState(order,oStages,workLogs,doneIdx,qtyIdx)];
  // What the ERP itself said about this פק"ע — the wording the four app statuses
  // fold away. On a תקועה it is the reason it is stuck.
  const erp=orderErpInfo(order);
  const phase=orderPhase(order),ph=ST_PHASE[phase]||ST_PHASE.line;
  // A פק"ע that came back תקועה with nothing beside it leaves the manager with a
  // red badge and no reason. The status itself is the ERP's to write; the note is
  // the floor's, and it survives the next import untouched.
  const [editNote,setEditNote]=useState(false);
  const [noteDraft,setNoteDraft]=useState("");
  const perUnitMin=orderPerUnitMin(order,stages,stageBlocks);
  const remainMin=orderRemainingMin(order,stages,stageBlocks,workLogs,doneIdx,qtyIdx);
  // Quantity signatures on a פק"ע that has since been given serial numbers: the
  // progress above is counted from the serials now, so say where the rest went.
  const strandedQty=useMemo(()=>serials.length
    ?oStages.reduce((n,st)=>n+qtySigned(qtyIdx,workLogs,order.id,st.id),0):0,[serials.length,oStages,qtyIdx,workLogs,order.id]);
  // The standard defined for this מק"ט (זמן תקן) — the planning figure, next to
  // the price-list time and the time this order's units actually took.
  const stdPerUnit=stdTotalFor(pnStdIndex(pnStandards),order.pn,order.stageIds||[]);
  const actPerUnit=useMemo(()=>{
    const byStage=new Map();
    (workLogs||[]).forEach(w=>{
      if(w.orderId!==order.id||!w.completed)return;
      const m=Number(w.durationMin||0);if(!(m>0))return;
      const units=w.bulk&&Number(w.bulkCount)>1?Number(w.bulkCount):1;
      const a=byStage.get(w.stageId)||{sum:0,n:0};a.sum+=m/units;a.n++;byStage.set(w.stageId,a);
    });
    let t=0;byStage.forEach(a=>{t+=a.sum/a.n});
    return t;
  },[workLogs,order.id]);
  const [editDates,setEditDates]=useState(false);
  const [dates,setDates]=useState({receivedDate:order.receivedDate||"",targetDate:order.targetDate||"",deliveryDate:order.deliveryDate||"",deliveryStatus:order.deliveryStatus||"pending",deliveryNotes:order.deliveryNotes||""});
  const saveDates=()=>{onUpdate({...order,...dates});setEditDates(false)};
  const deliveredCount=Number(order.deliveredQty||0);

  return(
    <div className="fade-in">
      <Btn onClick={onClose} style={{marginBottom:12}}>← חזרה</Btn>
      <Card style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div>
            <h2 style={{margin:"0 0 3px",color:"#60a5fa"}}>{order.woNumber}</h2>
            {order.pn&&<div style={{color:"#a78bfa",fontSize:13}}>P/N: {order.pn}</div>}
            {order.description&&<div style={{color:"var(--c-muted)"}}>{order.description}</div>}
            <div style={{marginTop:3,fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{color:proj?"#7eb8ff":"var(--c-dim)"}}>{proj?`📂 ${proj.name}`:"📂 ללא פרויקט"}</span>
              {br
                ?<span title={`חטיבה עסקית — מספר הסניף מגיע מה-ERP${brDepts.length?"":" · לא שויכה מחלקה למספר הזה"}`} style={{fontSize:12,background:branchColor(br)+"1f",color:branchColor(br),border:`1px solid ${branchColor(br)}44`,padding:"2px 9px",borderRadius:20}}>🏢 {branchLabel(br)}{brDepts.length?` · ${brDepts.map(d=>d.name).join(" · ")}`:""}</span>
                :<span style={{fontSize:12,color:"var(--c-dim)"}}>🏢 ללא סניף</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <span title={`סטטוס מה-ERP: ${SL[order.status||"open"]}`}><Badge status={order.status||"open"} large/></span>
            <span title={ph.hint} style={{fontSize:12,background:ph.color+"14",color:ph.color,border:`1px solid ${ph.color}44`,padding:"3px 10px",borderRadius:20,fontWeight:700,whiteSpace:"nowrap"}}>{ph.icon} {ph.label}</span>
            <span style={{fontSize:14,fontWeight:700,color:"#10b981"}}>{totalCompleted}/{units} הושלמו{byQty?" (לפי כמות)":""}</span>
          </div>
        </div>
        {/* ── מה ה-ERP אמר ─────────────────────────────────────────────────
            A stuck פק"ע is stuck *for a reason*, and Priority writes that reason
            into the status itself — "בעית ח״ג חסר", "הוקפאה", "בעיה הנדסית". The
            import folds all of them onto one red "תקועה" badge, so the reason was
            the first thing lost. It is kept on the order now and printed here,
            with whatever free-text note the file carried beside it. */}
        {canEdit&&!erp&&phase==="stuck"&&!editNote&&(
          <div style={{marginTop:12}}>
            <Btn small color="#ef4444" onClick={()=>{setNoteDraft(order.erpNote||"");setEditNote(true)}}>⛔ רשום סיבת תקיעה</Btn>
          </div>
        )}
        {editNote&&(
          <div style={{background:"#ef444410",border:"1px solid #ef444444",borderRadius:9,padding:"10px 12px",marginTop:12}}>
            <label style={{fontSize:11.5,color:"var(--c-dim)",display:"block",marginBottom:4}}>סיבת התקיעה / הערת סטטוס — נשמרת על הפק"ע ולא נמחקת בייבוא הבא</label>
            <input value={noteDraft} onChange={e=>setNoteDraft(e.target.value)} placeholder='למשל: ממתין לחומר גלם מספק — הוזמן ב-12/8' style={{marginBottom:8}}/>
            <div style={{display:"flex",gap:7}}>
              <Btn small color="#10b981" onClick={()=>{onUpdate({...order,erpNote:noteDraft.trim()});setEditNote(false)}}>שמור</Btn>
              <Btn small onClick={()=>setEditNote(false)}>ביטול</Btn>
            </div>
          </div>
        )}
        {erp&&(erp.raw||erp.note)&&(
          <div style={{background:ph.color+"10",border:`1px solid ${ph.color}44`,borderRadius:9,padding:"10px 12px",marginTop:12,fontSize:12.5,lineHeight:1.7}}>
            <div style={{fontWeight:700,color:ph.color,marginBottom:2}}>
              {phase==="stuck"?"⛔ סיבת התקיעה":phase==="pre"?'🚧 טרם נכנסה לקו הייצור':`${ph.icon} סטטוס מה-ERP`}
              {erp.raw&&<span style={{color:"var(--c-text)"}}> — {erp.raw}</span>}
              {erp.guessed&&<span title="הסטטוס אינו ברשימת הסטטוסים המוכרים — הוא שויך לפי הניסוח" style={{color:"#f59e0b",marginRight:5}}>❓</span>}
            </div>
            {erp.desc&&<div style={{color:"var(--c-muted)"}}>{erp.desc}</div>}
            {erp.note&&<div style={{color:"var(--c-text)",marginTop:4}}>📝 <b>מהקובץ:</b> {erp.note}</div>}
            <div style={{color:"var(--c-dim)",fontSize:11.5,marginTop:4}}>
              {erp.raw?'הטקסט הזה הוא מה שהיה בעמודת ״סטטוס פק"ע״ בקובץ ה-Priority בייבוא האחרון.':"ההערה נרשמה באפליקציה."}
              {canEdit&&!editNote&&<button onClick={()=>{setNoteDraft(order.erpNote||"");setEditNote(true)}} style={{background:"none",border:"none",color:"#60a5fa",fontSize:11.5,fontWeight:700,fontFamily:"inherit",cursor:"pointer",padding:"0 6px"}}>✏️ {erp.note?"ערוך הערה":"הוסף הערה"}</button>}
            </div>
          </div>
        )}
        {reportState&&(
          <div style={{background:reportState.color+"12",border:`1px solid ${reportState.color}44`,borderRadius:9,padding:"9px 12px",marginBottom:12,fontSize:12.5,lineHeight:1.7}}>
            <b style={{color:reportState.color}}>{reportState.icon} {reportState.label}</b>
            <span style={{color:"var(--c-muted)"}}> — הסטטוס <b>{SL[order.status||"open"]}</b> הגיע מה-ERP; ההתקדמות נספרת מדיווחי עבודה באפליקציה בלבד.</span>
            <div style={{color:"var(--c-dim)",marginTop:3}}>{reportState.hint}</div>
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8,marginTop:10}}>
          {(()=>{const isW=currentUser?.role==="worker";const items=[[byQty?"כמות (לפי כמות)":"כמות",units],["הושלמו",totalCompleted],["תאריך קבלה",fmt(order.receivedDate)],["יעד אספקה",fmt(order.targetDate)]];if(!isW){items.splice(2,0,["מחיר ליחידה",fmtMoney(order.unitPrice)],["הכנסה ממומשת",fmtMoney(totalCompleted*Number(order.unitPrice||0))]);} return items.map(([l,v])=>(
            <div key={l} style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)",marginBottom:2}}>{l}</div><div style={{fontWeight:700,fontSize:12,wordBreak:"break-word"}}>{v}</div></div>
          ))})()}
        </div>
        <div style={{marginTop:12}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--c-muted)",marginBottom:3}}><span>יחידות שסיימו את כל המסלול{byQty?" (חתימה לפי כמות)":""}</span><span>{pct}%</span></div>
          <PBar pct={pct} h={10}/>
          {passes.total>0&&(
            <div style={{marginTop:8}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--c-dim)",marginBottom:3}}>
                <span title="כל שלב בכל יחידה שדווח כבוצע">דיווחי שלבים — {passes.done} מתוך {passes.total}</span>
                <span>{Math.round(passes.done/passes.total*100)}%</span>
              </div>
              <PBar pct={Math.round(passes.done/passes.total*100)} h={6}/>
            </div>
          )}
        </div>
        {(perUnitMin>0||stdPerUnit>0||actPerUnit>0)&&(
          <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:12,fontSize:12,color:"var(--c-muted)"}}>
            {stdPerUnit>0&&<span>🎯 זמן תקן ליחידה: <b style={{color:TIME_CAT.std.text}}>{fmtTime(stdPerUnit)}</b></span>}
            {actPerUnit>0&&<span>⏱️ זמן בפועל ליחידה: <b style={{color:TIME_CAT.act.text}}>{fmtTime(actPerUnit)}</b>{stdPerUnit>0&&<span style={{color:gapColor(actPerUnit-stdPerUnit),fontWeight:700,marginRight:5}}>({fmtSigned(actPerUnit-stdPerUnit)} מול התקן)</span>}</span>}
            {perUnitMin>0&&<span>🏷️ זמן מכירה ליחידה: <b style={{color:TIME_CAT.sale.text}}>{fmtTime(perUnitMin)}</b></span>}
            {perUnitMin>0&&<span>📦 צפי לכלל הפק"ע: <b style={{color:"#a78bfa"}}>{fmtWorkEstimate(perUnitMin*units,workdayHours)}</b></span>}
            {stdPerUnit>0&&<span>🎯 צפי לפי תקן: <b style={{color:TIME_CAT.std.text}}>{fmtWorkEstimate(stdPerUnit*units,workdayHours)}</b></span>}
            {perUnitMin>0&&pct<100&&<span>⏳ צפי לסיום הנותר: <b style={{color:"#06b6d4"}}>{fmtWorkEstimate(remainMin,workdayHours)}</b></span>}
            <span style={{color:"var(--c-dim)"}}>(לפי יום עבודה של {workdayHours} שע')</span>
          </div>
        )}
      </Card>

      {/* Delivery & Dates Management (admin only) */}
      {isAdmin&&(
        <Card style={{marginBottom:14,border:"1px solid #06b6d433"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <h3 style={{margin:0,fontSize:15,color:"#06b6d4"}}>📦 אספקה ותאריכים</h3>
            <Btn color="#06b6d4" small onClick={()=>setEditDates(p=>!p)}>{editDates?"סגור":"✏️ ערוך"}</Btn>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8,marginBottom:editDates?12:0}}>
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>סטטוס אספקה</div><div style={{fontWeight:700,fontSize:12,color:order.deliveryStatus==="delivered"?"#10b981":order.deliveryStatus==="partial"?"#f59e0b":"var(--c-muted)"}}>{order.deliveryStatus==="delivered"?"✅ סופק":order.deliveryStatus==="partial"?`📦 חלקי (${deliveredCount}/${serials.length})`:"⏳ ממתין"}</div></div>
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>תאריך אספקה</div><div style={{fontWeight:700,fontSize:12}}>{order.deliveryDate?fmt(order.deliveryDate):"—"}</div></div>
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>תאריך קבלה</div><div style={{fontWeight:700,fontSize:12}}>{fmt(order.receivedDate)}</div></div>
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:"8px 10px"}}><div style={{fontSize:10,color:"var(--c-dim)"}}>יעד</div><div style={{fontWeight:700,fontSize:12,color:order.targetDate&&new Date(order.targetDate)<new Date()?"#ef4444":"var(--c-text)"}}>{fmt(order.targetDate)}</div></div>
          </div>
          {order.deliveryNotes&&<div style={{fontSize:12,color:"var(--c-muted)",marginTop:6}}>📝 {order.deliveryNotes}</div>}
          {editDates&&(
            <div style={{background:"var(--c-deep)",borderRadius:8,padding:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div style={{display:"flex",flexDirection:"column",gap:4,minWidth:120}}>
                <label style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}}>סטטוס אספקה</label>
                <select value={dates.deliveryStatus} onChange={e=>setDates(p=>({...p,deliveryStatus:e.target.value}))}>
                  <option value="pending">⏳ ממתין</option>
                  <option value="partial">📦 חלקי</option>
                  <option value="delivered">✅ סופק</option>
                </select>
              </div>
              {dates.deliveryStatus==="partial"&&<Field label="כמות שסופקה" type="number" value={order.deliveredQty||""} onChange={v=>onUpdate({...order,deliveredQty:Number(v)})} style={{minWidth:80}}/>}
              <Field label="תאריך קבלה" type="date" value={dates.receivedDate} onChange={v=>setDates(p=>({...p,receivedDate:v}))} style={{minWidth:120}}/>
              <Field label="יעד אספקה" type="date" value={dates.targetDate} onChange={v=>setDates(p=>({...p,targetDate:v}))} style={{minWidth:120}}/>
              <Field label="תאריך אספקה" type="date" value={dates.deliveryDate} onChange={v=>setDates(p=>({...p,deliveryDate:v}))} style={{minWidth:120}}/>
              <Field label="הערות אספקה" value={dates.deliveryNotes} onChange={v=>setDates(p=>({...p,deliveryNotes:v}))} style={{minWidth:200}}/>
              <Btn color="#06b6d4" onClick={saveDates} small>💾 שמור</Btn>
            </div>
          )}
        </Card>
      )}

      {/* Quantity sign-off — for a פק"ע that is not managed serially */}
      {!serials.length&&(
        <Card style={{marginBottom:14,border:"1px solid #10b98133"}}>
          <QtySignOff order={order} stages={stages} workLogs={workLogs} onSignOff={onWorkLog} onDeleteLog={onDeleteLog}/>
        </Card>
      )}

      {/* Serials Manager */}
      <Card style={{marginBottom:14}}>
        {strandedQty>0&&(
          <div style={{background:"#f59e0b12",border:"1px solid #f59e0b44",borderRadius:8,padding:"9px 12px",marginBottom:12,fontSize:12.5,color:"var(--c-muted)",lineHeight:1.7}}>
            <b style={{color:"#f59e0b"}}>לפק"ע הזו יש גם חתימות לפי כמות ({strandedQty} דיווחי שלב).</b> מרגע שיש מספרים סידוריים, ההתקדמות נספרת מהם בלבד — החתימות נשמרות ביומן העבודה אך אינן נספרות. מחיקת כל הסידוריים תחזיר את המעקב לפי כמות.
          </div>
        )}
        <SerialsManager order={order} stages={stages} onUpdate={onUpdate} workLogs={workLogs} onSignOff={onWorkLog}/>
      </Card>

      {/* Shortages inside order */}
      <Card style={{marginBottom:14,border:"1px solid #ef444433"}}>
        <ShortagesInOrder order={order} onUpdate={onUpdate}/>
      </Card>

      {/* Defects */}
      <DefectsSection order={order} onUpdate={onUpdate}/>
    </div>
  );
}

function Orders({orders,projects,stages,stageBlocks,updO,workLogs,onWorkLog,onDeleteLog,departments=[],workdayHours=8,setWorkdayHours,pnStandards}){
  const {canEdit,currentUser}=useAuth();
  const [showForm,setShowForm]=useState(false);
  const [editing,setEditing]=useState(null);
  const [detail,setDetail]=useState(null);
  const [search,setSearch]=useState("");
  const [filterProj,setFilterProj]=useState("all");
  const [filterBranch,setFilterBranch]=useState("all");
  const [filterStat,setFilterStat]=useState("all");
  const [sort,setSort]=useState("wo");
  // One lookup table for "did this unit finish this stage", shared by every row
  // below — see buildDoneIndex.
  const doneIdx=useDoneIndex(workLogs);
  // The same, for the פק"ע that are signed by quantity instead of unit by unit.
  const qtyIdx=useQtyIndex(workLogs);
  // The branch numbers to offer, and how many פק"ע each one holds — so the filter
  // says what it will show before it is used.
  const branchOpts=useMemo(()=>branchList(orders,departments),[orders,departments]);
  const branchCount=useMemo(()=>{
    const m={none:0};
    orders.forEach(o=>{const c=branchCode(o.branch);if(c)m[c]=(m[c]||0)+1;else m.none++});
    return m;
  },[orders]);

  const filtered=useMemo(()=>{
    const q=search.trim().toLowerCase();
    const list=orders.filter(o=>{
      // "לא להציג" is part of what מבוטלת means, so it is held out of the list
      // unless its own chip is the one selected.
      if(filterStat!=="ph_cancelled"&&isCancelled(o))return false;
      if(filterProj!=="all"&&o.projectId!==filterProj)return false;
      // Branch = the business division the פק"ע belongs to, straight from the ERP.
      if(filterBranch!=="all"){
        const c=branchCode(o.branch);
        if(filterBranch==="none"?!!c:c!==filterBranch)return false;
      }
      // "ללא יחידות" and "פער מול הסטטוס" cut across the four ERP statuses rather
      // than sitting beside them — they answer "can this פק"ע be reported on at
      // all", which is the question the status cannot.
      if(filterStat==="nounits"||filterStat==="gap"){
        if(orderReportState(o,orderRoute(o,stages),workLogs,doneIdx,qtyIdx)!==filterStat)return false;
      // Where the פק"ע stands relative to the line, which the four statuses cannot
      // say: "פתוחה" and "שוחררה" are both open and both mean nobody has started.
      }else if(filterStat.startsWith("ph_")){
        if(orderPhase(o)!==filterStat.slice(3))return false;
      }else if(filterStat!=="all"&&(o.status||"open")!==filterStat)return false;
      if(q&&!o.woNumber?.toLowerCase().includes(q)&&!o.description?.toLowerCase().includes(q)&&!o.pn?.toLowerCase().includes(q))return false;
      return true;
    });
    // Sorting a few thousand rows is one pass here, against a re-sort on every
    // scroll frame if it were done inside the row loop.
    const cmp={
      wo:(a,b)=>String(a.woNumber||"").localeCompare(String(b.woNumber||""),"he",{numeric:true}),
      target:(a,b)=>String(a.targetDate||"9999").localeCompare(String(b.targetDate||"9999")),
      status:(a,b)=>ST_ORDER.indexOf(a.status||"open")-ST_ORDER.indexOf(b.status||"open"),
      qty:(a,b)=>(Number(b.qty)||0)-(Number(a.qty)||0)
    }[sort];
    return cmp?list.slice().sort(cmp):list;
  },[orders,filterProj,filterBranch,filterStat,search,sort,stages,workLogs,doneIdx,qtyIdx]);

  // How many פק"ע sit in each status, so the filter chips say what they will show
  // — and so a run of "everything is open" is visible before anyone goes looking.
  const statCount=useMemo(()=>{
    const c={all:0,open:0,partial:0,complete:0,blocked:0,nounits:0,gap:0,ph_pre:0,ph_line:0,ph_stuck:0,ph_done:0,ph_cancelled:0};
    orders.forEach(o=>{
      const ph=orderPhase(o);
      c["ph_"+ph]++;
      // A hidden פק"ע is counted on its own chip only — otherwise every other
      // number on the bar would promise rows the list will not show.
      if(ph==="cancelled")return;
      c.all++;
      const k=o.status||"open";if(c[k]!==undefined)c[k]++;
      const rs=orderReportState(o,orderRoute(o,stages),workLogs,doneIdx,qtyIdx);
      if(c[rs]!==undefined)c[rs]++;
    });
    return c;
  },[orders,stages,workLogs,doneIdx,qtyIdx]);

  // Looking a project up by id per row is a scan of the project list per row;
  // once into a Map it is a hash lookup.
  const projMap=useMemo(()=>new Map(projects.map(p=>[p.id,p])),[projects]);

  const del=id=>{
    const victim=orders.find(o=>o.id===id);
    if(!confirm('למחוק פק"ע זו?\nאפשר יהיה לאחזר את המחיקה מיומן הפעילות.'))return;
    updO(prev=>prev.filter(o=>o.id!==id));
    if(detail?.id===id)setDetail(null);
    SB.del("orders",{id}).catch(()=>{});
    if(victim)UNDO.record({user:currentUser,action:'מחיקת פק"ע',target:victim.woNumber,
      details:victim.description||"",changes:[{coll:"orders",before:[victim],after:[]}]});
  };
  const handleUpd=(upd)=>{updO(prev=>prev.map(o=>o.id===upd.id?upd:o));setDetail(upd)};

  // Always get fresh order from state
  const detailOrder=detail?orders.find(o=>o.id===detail.id)||detail:null;

  if(detailOrder)return<OrderDetail order={detailOrder} projects={projects} stages={stages} stageBlocks={stageBlocks} departments={departments} onClose={()=>setDetail(null)} onUpdate={handleUpd} workLogs={workLogs} onWorkLog={onWorkLog} onDeleteLog={onDeleteLog} workdayHours={workdayHours} pnStandards={pnStandards}/>;

  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:10}}>
        <h2 style={{margin:0}}>📋 פקודות עבודה</h2>
        {canEdit&&<Btn color="var(--c-accent)" onClick={()=>{setEditing(null);setShowForm(true)}}>+ פק"ע חדשה</Btn>}
      </div>
      <Card style={{padding:"12px 14px",marginBottom:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{display:"flex",flexDirection:"column",gap:3,flex:"1 1 150px"}}><label style={{fontSize:11,color:"var(--c-dim)"}}>חיפוש</label><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="חיפוש לפי מספר / תיאור / P/N..."/></div>
        <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:11,color:"var(--c-dim)"}}>פרויקט</label><select value={filterProj} onChange={e=>setFilterProj(e.target.value)} style={{padding:"7px 8px",fontSize:12}}><option value="all">כל הפרויקטים</option>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:11,color:"var(--c-dim)"}}>סניף (חטיבה)</label><select value={filterBranch} onChange={e=>setFilterBranch(e.target.value)} style={{padding:"7px 8px",fontSize:12,minWidth:130}} title='מספר הסניף מגיע מה-ERP ומייצג את החטיבה העסקית'>
          <option value="all">כל הסניפים</option>
          {branchOpts.map(c=><option key={c} value={c}>{branchLabel(c)}{branchCount[c]?` · ${branchCount[c]}`:""}</option>)}
          {branchCount.none>0&&<option value="none">ללא סניף · {branchCount.none}</option>}
        </select></div>
        <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:11,color:"var(--c-dim)"}}>מיון</label><select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:"7px 8px",fontSize:12}}>
          <option value="wo">מספר פק"ע</option><option value="target">יעד אספקה</option><option value="status">סטטוס</option><option value="qty">כמות</option>
        </select></div>
        {setWorkdayHours&&<div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:11,color:"var(--c-dim)"}}>יום עבודה (שע' נטו)</label><input type="number" min="1" step="0.5" value={workdayHours} onChange={e=>setWorkdayHours(e.target.value)} style={{padding:"7px 8px",fontSize:12,width:90}} title="משמש לחישוב צפי הסיום"/></div>}
        <div style={{fontSize:12,color:"var(--c-dim)",paddingBottom:4}}>{filtered.length} פק"ע</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",width:"100%",alignItems:"center"}}>
          <span style={{fontSize:11,color:"var(--c-dim)",fontWeight:600}} title='הסטטוס כפי שהגיע מה-ERP בייבוא'>סטטוס:</span>
          {[["all",'הכל',statCount.all,"#8b95a8",""],
            ...ST_ORDER.map(k=>[k,SL[k],statCount[k],SC[k],"הסטטוס כפי שהגיע מה-ERP בייבוא"]),
            ["nounits",`${REPORT_STATE.nounits.icon} ${REPORT_STATE.nounits.label}`,statCount.nounits,REPORT_STATE.nounits.color,REPORT_STATE.nounits.hint],
            ["gap",`${REPORT_STATE.gap.icon} ${REPORT_STATE.gap.label}`,statCount.gap,REPORT_STATE.gap.color,REPORT_STATE.gap.hint],
          ].map(([k,l,n,c,t])=>(
            <button key={k} title={t} onClick={()=>setFilterStat(k)} style={{background:filterStat===k?c+"26":"var(--c-deep)",
              border:`1px solid ${filterStat===k?c+"88":"var(--c-border)"}`,color:filterStat===k?c:"var(--c-muted)",
              borderRadius:16,padding:"3px 11px",fontSize:11.5,fontWeight:600,fontFamily:"inherit",cursor:"pointer"}}>{l} · {n}</button>
          ))}
        </div>
        {/* Where the פק"ע stands relative to the line. "פתוחה" and "שוחררה" are
            both open and both mean nobody has started — separating them from the

// ═══ ADMIN PANEL ════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════
// ── Branch numbers of a department ────────────────────────────────────────
// A department can hold more than one branch number — a team that runs both
// אזרחי and משולבות work is the ordinary case, not the exception — so this is a
// multi-select. Numbers outside the catalogue are accepted as typed: the
// catalogue names the divisions the app knows, it does not limit them.
function BranchPicker({value=[],onChange,options=[],inp,border,muted}){
  const sel=sortBranches(value);
  const [extra,setExtra]=useState("");
  const opts=sortBranches([...options,...sel]);
  const toggle=c=>onChange(sortBranches(sel.includes(c)?sel.filter(x=>x!==c):[...sel,c]));
  const add=()=>{const c=branchCode(extra);if(c&&!sel.includes(c))onChange(sortBranches([...sel,c]));setExtra("")};
  return(
    <div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {opts.map(c=>{
          const on=sel.includes(c),col=branchColor(c);
          return(
            <button key={c} type="button" onClick={()=>toggle(c)}
              style={{background:on?col+"22":"transparent",border:`1px solid ${on?col:border||"var(--c-border)"}`,
                color:on?col:muted||"var(--c-muted)",borderRadius:14,padding:"4px 11px",fontSize:12,
                fontWeight:on?700:500,fontFamily:"inherit",cursor:"pointer"}}>
              {on?"✓ ":""}{branchLabel(c)}
            </button>
          );
        })}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",marginTop:7}}>
        <input value={extra} onChange={e=>setExtra(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();add()}}}
          placeholder="מספר סניף אחר" style={{...(inp||{}),width:130,fontSize:12,padding:"5px 8px"}}/>
        <Btn small onClick={add}>➕ הוסף</Btn>
      </div>
    </div>
  );
}

// ── גישה לסניפים של משתמש ────────────────────────────────────────────────
// Two grants side by side, and which is which has to be obvious: the numbers the
// person has because of the department they are in — shown, not editable, because
// they are edited on the department and moving the person moves them — and the
// numbers granted to this one person on top. The line at the bottom answers the
// only question an admin actually has here, which is how much of the plant this
// adds up to.
function BranchAccessBox({user,departments,orders,options,onChange,inp,border,muted,text,lm}){
  const inh=inheritedBranches(user,departments);
  const all=user.branchAccess==="all";
  const extra=Array.isArray(user.branchAccess)?user.branchAccess:[];
  const scope=userBranchScope(user,departments);
  const total=(orders||[]).length;
  const seen=scope?(orders||[]).filter(o=>branchScopeAllows(scope,o)).length:total;
  return(
    <div style={{border:`1px solid ${lm?"#c8cdd6":"#283650"}`,borderRadius:6,background:lm?"#f7f8fa":"#0a0e1a",padding:8}}>
      <div style={{fontSize:11,color:muted,marginBottom:7,lineHeight:2}}>
        {inh.length
          ?<>מהמחלקה: {inh.map(c=>(
            <span key={c} style={{background:branchColor(c)+"1f",color:branchColor(c),border:`1px solid ${branchColor(c)}44`,borderRadius:12,padding:"2px 8px",marginLeft:4,fontWeight:700,whiteSpace:"nowrap"}}>🏢 {branchLabel(c)}</span>
          ))}</>
          :'למחלקה של המשתמש לא שויך מספר סניף — בלי הרשאה ידנית כאן הוא רואה את כל הפק"ע'}
      </div>
      <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:text,marginBottom:7}}>
        <input type="checkbox" style={{width:"auto"}} checked={all} onChange={e=>onChange({branchAccess:e.target.checked?"all":[]})}/>
        <b>כל הסניפים</b><span style={{fontSize:11,color:muted}}>— בלי קשר למחלקה</span>
      </label>
      {!all&&(<>
        <div style={{fontSize:11,color:muted,marginBottom:5}}>סניפים נוספים למשתמש הזה בלבד:</div>
        {/* The department's own numbers are not offered again here — picking one
            would change nothing, and seeing it unticked reads as "not allowed"
            when it already is. */}
        <BranchPicker value={extra} onChange={v=>onChange({branchAccess:v})} options={(options||[]).filter(c=>!inh.includes(c))} inp={inp} border={border} muted={muted}/>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:text,marginTop:8}}>
          <input type="checkbox" style={{width:"auto"}} checked={user.branchNone===true} onChange={e=>onChange({branchNone:e.target.checked})}/>
          גם פק"ע ללא מספר סניף
        </label>
      </>)}
      <div style={{fontSize:10.5,color:muted,marginTop:8,paddingTop:7,borderTop:`1px solid ${border}`,lineHeight:1.7}}>
        {user.role==="admin"
          ?'🛡️ מנהל מערכת — רואה תמיד את כל הסניפים'
          :scope
          ?<>רואה <b style={{color:text}}>{seen}</b> מתוך {total} פק"ע · {branchScopeLabel(user,departments)}</>
          :<>אין הגבלת סניף — רואה את כל {total} הפק"ע</>}
      </div>
    </div>
  );
}

function AdminPanel({projects,stages,orders=[],onClose,lightMode,departments,updD,onPilotReset}){
  const {toast}=useToast();
  const {currentUser}=useAuth();
  const [users,setUsersLocal]=useState(getUsers());
  const [tab,setTab]=useState("users");
  const [auditLog]=useState(getAuditLog());
  // The reversible half of the log — kept in its own state so a revert re-renders.
  const [journal,setJournal]=useState(()=>UNDO.list());
  const [reverting,setReverting]=useState("");
  // Another panel restoring users has to reach this list too.
  useEffect(()=>{
    const h=()=>setUsersLocal(getUsers());
    window.addEventListener("pml:users",h);
    return()=>window.removeEventListener("pml:users",h);
  },[]);
  const undoScope=e=>(e.changes||[]).map(c=>{
    const bits=[];
    if(c.before.length)bits.push(`${c.before.length} לשחזור`);
    const created=c.after.filter(id=>!c.before.some(r=>r.id===id)).length;
    if(created)bits.push(`${created} להסרה`);
    return `${UNDO_COLL[c.coll]?.label||c.coll} (${bits.join(" · ")||"—"})`;
  }).join(" · ");
  const revertEntry=async(e)=>{
    if(!confirm(`לאחזר את המצב שלפני "${e.action}"${e.target?` — ${e.target}`:""}?\n${undoScope(e)}`))return;
    setReverting(e.id);
    try{
      const what=await UNDO.revert(e.id);
      setJournal(UNDO.list());
      setUsersLocal(getUsers());
      toast(`אוחזר: ${what||e.action}`,"success",5000);
    }catch(err){toast(err.message||String(err),"error",6000)}
    setReverting("");
  };
  const [editUser,setEditUser]=useState(null);
  const [addMode,setAddMode]=useState(false);
  const [revealPw,setRevealPw]=useState({}); // userId -> bool (show password in list)
  const [editShowPw,setEditShowPw]=useState(false);
  const [newUser,setNewUser]=useState({username:"",password:"",name:"",role:"worker",projectAccess:"all",stageAccess:"all",branchAccess:[],branchNone:false,canEdit:false,canView:true,active:true,hourlyRate:0,saleRate:0,departmentId:"",managerId:""});
  // Departments form
  const [deptName,setDeptName]=useState("");
  const [deptColor,setDeptColor]=useState("#3b82f6");
  const [deptManager,setDeptManager]=useState("");
  const [newDeptBranches,setNewDeptBranches]=useState([]);
  // Every branch number in play: the catalogue, the ones the ERP actually sent,
  // and the ones other departments already hold.
  const branchOpts=useMemo(()=>branchList(orders,departments),[orders,departments]);
  const [editDept,setEditDept]=useState(null);
  const leadOptions=users.filter(u=>u.active!==false&&(isLeadRole(u.role)||u.role==="admin"));
  const addDept=()=>{
    if(!deptName.trim())return toast("יש להזין שם מחלקה","warning");
    const d={id:uid(),name:deptName.trim(),color:deptColor,managerId:deptManager,branches:sortBranches(newDeptBranches)};
    updD(prev=>[...prev,d]);
    UNDO.record({user:currentUser,action:"הוספת מחלקה",target:d.name,
      details:d.branches.length?`סניפים: ${d.branches.join(", ")}`:"",
      changes:[{coll:"departments",before:[],after:[d.id]}]});
    setDeptName("");setDeptManager("");setNewDeptBranches([]);
  };
  const delDept=(d)=>{
    const members=users.filter(u=>u.departmentId===d.id);
    if(members.length>0)return toast(`לא ניתן למחוק — ${members.length} עובדים משויכים למחלקה`,"warning");
    if(!confirm(`למחוק את מחלקת "${d.name}"?`))return;
    updD(prev=>prev.filter(x=>x.id!==d.id));
    SB.del("departments",{id:d.id}).catch(()=>{});
    UNDO.record({user:currentUser,action:"מחיקת מחלקה",target:d.name,
      changes:[{coll:"departments",before:[d],after:[]}]});
  };
  const setDeptMgr=(deptId,mgrId)=>{
    const before=departments.find(d=>d.id===deptId);
    updD(prev=>prev.map(d=>d.id===deptId?{...d,managerId:mgrId}:d));
    if(before)UNDO.record({user:currentUser,action:"שינוי מנהל מחלקה",target:before.name,
      details:users.find(u=>u.id===mgrId)?.name||"ללא מנהל",
      changes:[{coll:"departments",before:[before],after:[deptId]}]});
  };
  const saveDept=()=>{
    if(!editDept||!editDept.name.trim())return toast("יש להזין שם מחלקה","warning");
    const before=departments.find(d=>d.id===editDept.id);
    updD(prev=>prev.map(d=>d.id===editDept.id?{...d,name:editDept.name.trim(),color:editDept.color,branches:sortBranches(editDept.branches||[])}:d));
    UNDO.record({user:currentUser,action:"עריכת מחלקה",target:editDept.name.trim(),
      details:sortBranches(editDept.branches||[]).length?`סניפים: ${sortBranches(editDept.branches||[]).join(", ")}`:"",
      changes:before?[{coll:"departments",before:[before],after:[before.id]}]:[]});
    setEditDept(null);
  };
  const lm=lightMode;
  const card=lm?"#ffffff":"#131829";
  const border=lm?"#dde1e8":"#1e2a42";
  const text=lm?"#1a1f2e":"#e2e8f0";
  const muted=lm?"#5a6478":"#8b95a8";
  const inp={background:lm?"#f7f8fa":"#0a0e1a",border:`1px solid ${lm?"#c8cdd6":"#283650"}`,color:text,borderRadius:6,padding:"7px 10px",paddingRight:"30px",fontSize:13,width:"100%",outline:"none",fontFamily:"inherit"};

  const addUser=async()=>{
    if(!newUser.username||!newUser.password||!newUser.name)return toast("כל השדות הם חובה","warning");
    if(users.find(u=>u.username===newUser.username))return toast("שם משתמש קיים","warning");
    const pwErrors=validatePassword(newUser.password);
    if(pwErrors.length>0)return toast("הסיסמה חייבת לכלול: "+pwErrors.join(", "),"warning",5000);
    const hash=await sha256(newUser.password);
    const u={...newUser,id:uid(),password_hash:hash,passwordPlain:newUser.password,password:undefined};
    delete u.password;
    const updated=[...users,u];
    saveUsers(updated);setUsersLocal(updated);
    UNDO.record({user:currentUser,action:"הוספת משתמש",target:newUser.username,details:newUser.name,
      changes:[{coll:"users",before:[],after:[u.id]}]});
    setNewUser({username:"",password:"",name:"",role:"worker",projectAccess:"all",stageAccess:"all",branchAccess:[],branchNone:false,canEdit:false,canView:true,active:true,hourlyRate:0,saleRate:0,departmentId:"",managerId:""});
    setAddMode(false);
  };
  const saveUser=async()=>{
    if(!editUser.username||!editUser.name)return toast("שם משתמש ושם מלא חובה","warning");
    let u={...editUser};
    // If password field was changed (not empty and not a hash), re-hash it
    if(u.password&&u.password.length<60){
      u.password_hash=await sha256(u.password);
      u.passwordPlain=u.password;
      delete u.password;
    }
    const before=users.find(usr=>usr.id===u.id);
    const updated=users.map(usr=>usr.id===u.id?u:usr);
    saveUsers(updated);setUsersLocal(updated);
    UNDO.record({user:currentUser,action:"עדכון משתמש",target:editUser.username,details:editUser.name,
      changes:before?[{coll:"users",before:[before],after:[u.id]}]:[]});
    setEditUser(null);
  };
  const toggleActive=id=>{
    const before=users.find(u=>u.id===id);
    const updated=users.map(u=>u.id===id?{...u,active:!u.active}:u);
    saveUsers(updated);setUsersLocal(updated);
    if(before)UNDO.record({user:currentUser,action:before.active===false?"הפעלת משתמש":"השבתת משתמש",
      target:before.name||before.username,
      changes:[{coll:"users",before:[before],after:[id]}]});
  };
  const deleteUser=async(id)=>{
    const victim=users.find(u=>u.id===id);
    if(!victim)return;
    if(victim.id===currentUser?.id)return toast("אי אפשר למחוק את המשתמש שאיתו אתה מחובר","warning");
    if(!confirm(`למחוק את "${victim.name||victim.username}" לצמיתות?\nאפשר יהיה לאחזר את המחיקה מיומן הפעילות.`))return;
    const updated=users.filter(u=>u.id!==id);
    saveUsers(updated);setUsersLocal(updated);
    // saveUsers only writes the users that are left — without this the row stays
    // on the server and walks back in on the next load.
    try{await SB.delIds("app_users",[id])}catch(e){toast("המחיקה לא הגיעה לשרת: "+sbErrMsg(e),"error",6000)}
    UNDO.record({user:currentUser,action:"מחיקת משתמש",target:victim.name||victim.username,
      details:roleLabel(victim.role),
      changes:[{coll:"users",before:[victim],after:[]}]});
  };

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"#000000cc",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:10,overflowY:"auto"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:card,borderRadius:16,maxWidth:800,width:"100%",maxHeight:"92vh",overflowY:"auto",border:`1px solid ${border}`}}>
        <div style={{padding:"18px 24px",borderBottom:`1px solid ${border}`,display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:card,zIndex:1,borderRadius:"16px 16px 0 0"}}>
          <div style={{fontWeight:700,fontSize:18}}>🛡️ ניהול מערכת</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,color:muted}}>✕</button>
        </div>
        <div style={{padding:"0 24px 24px"}}>
          <div style={{display:"flex",gap:6,margin:"14px 0",flexWrap:"wrap"}}>
            {[["users","👥 משתמשים"],["departments","🏢 מחלקות"],["audit","↩️ יומן ואחזור"],["companies","🏭 חברות"]].map(([k,l])=>(
              <button key={k} onClick={()=>setTab(k)} style={{background:tab===k?"var(--c-accent)":"transparent",border:`1px solid ${tab===k?"var(--c-accent)":border}`,color:tab===k?"#fff":muted,borderRadius:8,padding:"7px 14px",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>{l}</button>
            ))}
          </div>

          {tab==="users"&&(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <div style={{fontSize:14,fontWeight:700,color:text}}>משתמשים ({users.length})</div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                  {onPilotReset&&<Btn color="#ef4444" small onClick={()=>{onClose();onPilotReset()}} title="מחיקת עובדי הדמו והנתונים שלהם לפני תחילת פיילוט">🧹 ניקוי לפיילוט</Btn>}
                  <Btn color="var(--c-accent)" small onClick={()=>setAddMode(true)}>+ הוסף משתמש</Btn>
                </div>
              </div>
              {addMode&&(
                <div style={{background:lm?"#f7f8fa":"#0d1120",borderRadius:10,padding:16,marginBottom:12,border:`1px solid ${border}`}}>
                  <div style={{fontWeight:700,marginBottom:10,color:text}}>משתמש חדש</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10,marginBottom:10}}>
                    {[["שם מלא","name","text"],["שם משתמש","username","text"],["סיסמה","password","password"],["תעריף עלות ₪/שעה","hourlyRate","number"],["תעריף מכירה ₪/שעה","saleRate","number"]].map(([l,k,t])=>(
                      <div key={k}><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>{l}</label><input style={inp} type={t} name={"nu_"+k} autoComplete={t==="password"?"new-password":"off"} value={newUser[k]||""} onChange={e=>setNewUser(p=>({...p,[k]:t==="number"?Number(e.target.value):e.target.value}))}/></div>
                    ))}
                    <div><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>תפקיד</label>
                      <select style={inp} value={newUser.role} onChange={e=>setNewUser(p=>({...p,role:e.target.value,canEdit:["admin","editor","dept_manager"].includes(e.target.value)}))}>
                        {Object.entries(ROLES).map(([k,r])=><option key={k} value={k}>{r.icon} {r.label}</option>)}
                      </select>
                    </div>
                    <div><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>מחלקה</label>
                      <select style={inp} value={newUser.departmentId||""} onChange={e=>setNewUser(p=>({...p,departmentId:e.target.value,managerId:""}))}>
                        <option value="">— ללא מחלקה —</option>
                        {(departments||[]).map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
                      </select>
                    </div>
                    <div><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>מנהל ישיר (ראש צוות)</label>
                      <select style={inp} value={newUser.managerId||""} onChange={e=>setNewUser(p=>({...p,managerId:e.target.value}))}>
                        <option value="">— ללא —</option>
                        {leadsForDept(users,departments,newUser.departmentId).map(u=><option key={u.id} value={u.id}>{ROLES[u.role]?.icon} {u.name}</option>)}
                      </select>
                      {newUser.departmentId&&leadsForDept(users,departments,newUser.departmentId).length===0&&<div style={{fontSize:10,color:"#f59e0b",marginTop:3}}>אין מנהלים/ראשי צוות במחלקה זו</div>}
                    </div>
                  </div>
                  {isLeadRole(newUser.role)&&<div style={{background:"#a78bfa15",border:"1px solid #a78bfa33",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#a78bfa",marginBottom:10}}>⭐ משתמש זה יוכל לראות את כל העובדים שישויכו אליו, להקצות להם משימות ולעקוב אחרי הביצועים שלהם</div>}
                  {/* Project Access */}
                  <div style={{marginBottom:10}}>
                    <label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>גישה לפרויקטים</label>
                    <div style={{border:`1px solid ${lm?"#c8cdd6":"#283650"}`,borderRadius:6,background:lm?"#f7f8fa":"#0a0e1a",padding:8}}>
                      <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:text,marginBottom:6}}>
                        <input type="checkbox" style={{width:"auto"}} checked={newUser.projectAccess==="all"} onChange={e=>setNewUser(p=>({...p,projectAccess:e.target.checked?"all":[]}))}/>
                        <b>כל הפרויקטים</b>
                      </label>
                      {newUser.projectAccess!=="all"&&projects.map(proj=>(
                        <label key={proj.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:text,padding:"2px 0"}}>
                          <input type="checkbox" style={{width:"auto"}} checked={Array.isArray(newUser.projectAccess)&&newUser.projectAccess.includes(proj.id)} onChange={e=>{const cur=Array.isArray(newUser.projectAccess)?newUser.projectAccess:[];setNewUser(p=>({...p,projectAccess:e.target.checked?[...cur,proj.id]:cur.filter(id=>id!==proj.id)}))}}/>
                          {proj.name}
                        </label>
                      ))}
                    </div>
                  </div>
                  {/* Stage Access */}
                  <div style={{marginBottom:10}}>
                    <label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>גישה לשלבים</label>
                    <div style={{border:`1px solid ${lm?"#c8cdd6":"#283650"}`,borderRadius:6,background:lm?"#f7f8fa":"#0a0e1a",padding:8}}>
                      <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:text,marginBottom:6}}>
                        <input type="checkbox" style={{width:"auto"}} checked={newUser.stageAccess==="all"} onChange={e=>setNewUser(p=>({...p,stageAccess:e.target.checked?"all":[]}))}/>
                        <b>כל השלבים</b>
                      </label>
                      {newUser.stageAccess!=="all"&&stages.map(st=>(
                        <label key={st.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:st.color,padding:"2px 0"}}>
                          <input type="checkbox" style={{width:"auto"}} checked={Array.isArray(newUser.stageAccess)&&newUser.stageAccess.includes(st.id)} onChange={e=>{const cur=Array.isArray(newUser.stageAccess)?newUser.stageAccess:[];setNewUser(p=>({...p,stageAccess:e.target.checked?[...cur,st.id]:cur.filter(id=>id!==st.id)}))}}/>
                          {st.name}
                        </label>
                      ))}
                    </div>
                  </div>
                  {/* Branch (division) access — see userBranchScope */}
                  <div style={{marginBottom:10}}>
                    <label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>גישה לסניפים (חטיבות)</label>
                    <BranchAccessBox user={newUser} departments={departments} orders={orders} options={branchOpts}
                      onChange={patch=>setNewUser(p=>({...p,...patch}))} inp={inp} border={border} muted={muted} text={text} lm={lm}/>
                  </div>
                  <div style={{display:"flex",gap:8}}><Btn color="#10b981" onClick={addUser}>✅ הוסף</Btn><Btn onClick={()=>setAddMode(false)}>ביטול</Btn></div>
                </div>
              )}
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {users.map(u=>(
                  <div key={u.id} style={{background:lm?"#f7f8fa":"#0d1120",borderRadius:8,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",opacity:u.active===false?.5:1,border:`1px solid ${border}`}}>
                    <div>
                      <div style={{fontWeight:600,color:text}}>{u.name} <span style={{fontSize:11,color:muted}}>({u.username})</span></div>
                      <div style={{fontSize:11,color:muted,display:"flex",gap:8,flexWrap:"wrap",marginTop:2}}>
                        <span style={{color:ROLES[u.role]?.color||muted,fontWeight:600}}>{roleLabel(u.role)}</span>
                        {u.departmentId&&(departments||[]).find(d=>d.id===u.departmentId)&&<span style={{color:(departments||[]).find(d=>d.id===u.departmentId)?.color}}>🏢 {(departments||[]).find(d=>d.id===u.departmentId)?.name}</span>}
                        {u.managerId&&users.find(m=>m.id===u.managerId)&&<span>⭐ תחת: {users.find(m=>m.id===u.managerId)?.name}</span>}
                        {u.hourlyRate>0&&<span title="עלות (שכר)">💰 עלות {fmtMoney(u.hourlyRate)}/שע'</span>}
                        {u.saleRate>0&&<span title="מחיר מכירה" style={{color:"#10b981"}}>🏷️ מכירה {fmtMoney(u.saleRate)}/שע'</span>}
                        <span style={{display:"inline-flex",alignItems:"center",gap:4}}>🔑 {revealPw[u.id]?(u.passwordPlain?<b style={{color:"#f59e0b",fontFamily:"monospace"}}>{u.passwordPlain}</b>:<span style={{color:"#ef4444"}}>לא זמין — אפס סיסמה</span>):"••••••"}
                          <button onClick={()=>setRevealPw(p=>({...p,[u.id]:!p[u.id]}))} title={revealPw[u.id]?"הסתר סיסמה":"הצג סיסמה"} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,padding:0,lineHeight:1}}>{revealPw[u.id]?"🙈":"👁️"}</button>
                        </span>
                        <span>פרויקטים: {u.projectAccess==="all"?"הכל":Array.isArray(u.projectAccess)?u.projectAccess.length:"1"}</span>
                        <span>שלבים: {u.stageAccess==="all"?"הכל":Array.isArray(u.stageAccess)?u.stageAccess.length:"1"}</span>
                        <span title='אילו פק"ע המשתמש רואה — לפי מספר הסניף של המחלקה שלו ותוספות ידניות'>🏢 סניפים: {u.role==="admin"?"הכל":branchScopeLabel(u,departments)}</span>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:4}}>
                      <IBtn onClick={()=>{setEditUser({...u});setEditShowPw(false)}} title="ערוך">✏️</IBtn>
                      {u.role!=="admin"&&<IBtn onClick={()=>toggleActive(u.id)} title={u.active!==false?"השבת":"הפעל"}>{u.active!==false?"🚫":"✅"}</IBtn>}
                      {u.role!=="admin"&&u.id!==currentUser.id&&<IBtn onClick={()=>deleteUser(u.id)} title="מחק לצמיתות">🗑️</IBtn>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab==="departments"&&(
            <div>
              <div style={{fontSize:13,color:muted,marginBottom:12,lineHeight:1.6}}>חלק את העובדים למחלקות וקבע מנהל לכל מחלקה. עובדים משויכים למחלקה ולמנהל ישיר דרך כרטיס המשתמש (לשונית "משתמשים").</div>
              <div style={{fontSize:12.5,color:muted,marginBottom:12,lineHeight:1.7,background:lm?"#f7f8fa":"#0d1120",border:`1px solid ${border}`,borderRadius:9,padding:"9px 12px"}}>
                🏢 <b style={{color:text}}>מספרי סניף</b> — מספר הסניף מגיע מקובץ ה-Priority ומייצג חטיבה עסקית ({BRANCHES.map(b=>`${b.code} ${b.name}`).join(" · ")}).
                שיוך מספר סניף למחלקה קושר בין הפק"ע לבין הצוות שמבצע אותן: המספר מוצג לצד כל פק"ע יחד עם שם המחלקה, וניתן לסנן לפיו במסך פקודות העבודה.
                למחלקה אפשר לשייך יותר ממספר סניף אחד, ואפשר להוסיף מספר שאינו ברשימה.
              </div>
              <div style={{background:lm?"#f7f8fa":"#0d1120",borderRadius:10,padding:14,marginBottom:14,border:`1px solid ${border}`}}>
                <div style={{fontWeight:700,marginBottom:10,color:text,fontSize:13}}>➕ מחלקה חדשה</div>
                <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
                  <div style={{flex:"1 1 160px"}}><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>שם המחלקה</label><input style={inp} value={deptName} onChange={e=>setDeptName(e.target.value)} placeholder='למשל: הרכבה, בדיקות, אריזה'/></div>
                  <div style={{flex:"1 1 160px"}}><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>מנהל מחלקה</label>
                    <select style={inp} value={deptManager} onChange={e=>setDeptManager(e.target.value)}>
                      <option value="">— ללא —</option>
                      {leadOptions.map(u=><option key={u.id} value={u.id}>{ROLES[u.role]?.icon} {u.name}</option>)}
                    </select>
                  </div>
                  <div><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>צבע</label><input type="color" value={deptColor} onChange={e=>setDeptColor(e.target.value)} style={{width:38,height:36,padding:2,border:`1px solid ${border}`,borderRadius:6,background:"transparent"}}/></div>
                  <Btn color="#10b981" onClick={addDept}>✅ הוסף</Btn>
                </div>
                <div style={{marginTop:12}}>
                  <label style={{fontSize:11,color:muted,display:"block",marginBottom:5}}>מספרי סניף (חטיבות) — אפשר לבחור יותר מאחד</label>
                  <BranchPicker value={newDeptBranches} onChange={setNewDeptBranches} options={branchOpts} inp={inp} border={border} muted={muted}/>
                  <div style={{fontSize:10.5,color:muted,marginTop:6,lineHeight:1.7}}>
                    👁️ המספרים האלה הם גם הרשאת צפייה: מרגע ששויך סניף למחלקה, עובדי המחלקה רואים רק את הפק"ע של אותם סניפים.
                    אפשר להרחיב לעובד יחיד בעריכת המשתמש (״גישה לסניפים״). בלי שיוך — כולם רואים הכל, כמו קודם.
                  </div>
                </div>
              </div>
              {(departments||[]).length===0?<EmptyState icon="🏢" title="אין מחלקות עדיין" subtitle="צור מחלקה ראשונה כדי להתחיל לארגן את הצוות"/>:(
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {(departments||[]).map(d=>{
                    const members=users.filter(u=>u.departmentId===d.id&&u.active!==false);
                    return(
                      <div key={d.id} style={{background:lm?"#f7f8fa":"#0d1120",borderRadius:10,padding:"12px 14px",border:`1px solid ${d.color}33`}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                          <div style={{display:"flex",alignItems:"center",gap:9}}>
                            <span style={{width:11,height:11,borderRadius:3,background:d.color,display:"inline-block"}}/>
                            <span style={{fontWeight:700,color:text,fontSize:14}}>{d.name}</span>
                            <span style={{fontSize:11,background:d.color+"22",color:d.color,padding:"2px 9px",borderRadius:12,fontWeight:700}}>{members.length} עובדים</span>
                            {deptBranches(d).map(c=>(
                              <span key={c} title={`סניף ${c}${branchName(c)?" — "+branchName(c):""} · ${(orders||[]).filter(o=>branchCode(o.branch)===c).length} פק"ע`}
                                style={{fontSize:11,background:branchColor(c)+"1f",color:branchColor(c),border:`1px solid ${branchColor(c)}44`,padding:"2px 9px",borderRadius:12,fontWeight:700}}>🏢 {branchLabel(c)}</span>
                            ))}
                            {!deptBranches(d).length&&<span style={{fontSize:11,color:muted}}>ללא מספר סניף</span>}
                            {deptBranches(d).length>0&&(
                              <span title='עובדי המחלקה רואים רק את הפק"ע של הסניפים האלה — אלא אם הורחבה להם ההרשאה אישית'
                                style={{fontSize:10.5,color:muted}}>👁️ {(orders||[]).filter(o=>deptBranches(d).includes(branchCode(o.branch))).length} מתוך {(orders||[]).length} פק"ע</span>
                            )}
                          </div>
                          <div style={{display:"flex",gap:8,alignItems:"center"}}>
                            <select style={{...inp,width:"auto",minWidth:150,padding:"5px 10px",paddingRight:"28px",fontSize:12}} value={d.managerId||""} onChange={e=>setDeptMgr(d.id,e.target.value)}>
                              <option value="">— ללא מנהל —</option>
                              {leadOptions.map(u=><option key={u.id} value={u.id}>{ROLES[u.role]?.icon} {u.name}</option>)}
                            </select>
                            <IBtn onClick={()=>setEditDept({...d})} title="ערוך מחלקה">✏️</IBtn>
                            <IBtn onClick={()=>delDept(d)} title="מחק מחלקה">🗑️</IBtn>
                          </div>
                        </div>
                        {members.length>0&&(
                          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:9}}>
                            {members.map(m=><span key={m.id} style={{fontSize:11,background:lm?"#fff":"#131829",border:`1px solid ${border}`,color:text,padding:"3px 10px",borderRadius:14}}>{ROLES[m.role]?.icon} {m.name}</span>)}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {tab==="audit"&&(
            <div>
              <div style={{fontWeight:700,marginBottom:4,color:text}}>↩️ פעולות הניתנות לאחזור ({journal.length})</div>
              <div style={{fontSize:11.5,color:muted,marginBottom:10}}>כל פעולה של מנהל נשמרת עם המצב שקדם לה, כך שאפשר להחזיר אותה — כולל מחיקת משתמשים, מחלקות, פק"ע וייבוא.</div>
              {journal.length===0?<EmptyState icon="📝" title="אין פעולות לאחזור" subtitle="פעולות ניהול יתועדו כאן עם אפשרות להחזיר אותן"/>:(
                <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:18}}>
                  {journal.map(e=>(
                    <div key={e.id} style={{background:lm?"#f7f8fa":"#0d1120",borderRadius:6,padding:"8px 10px",fontSize:12,border:`1px solid ${e.reverted?"#ef444444":lm?"#f59e0b66":"#f59e0b44"}`,opacity:e.reverted?.55:1}}>
                      <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
                        <span><b style={{color:"#60a5fa"}}>{e.name||e.username}</b> — {e.action}{e.target?` — ${e.target}`:""}{e.reverted&&<span style={{color:"#ef4444",marginRight:6}}> (אוחזר)</span>}</span>

                          <span style={{color:muted,fontSize:11}}>{e.timestamp?new Date(e.timestamp).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}</span>
                        </div>

                      <div style={{color:muted,marginTop:2}}>

                      </div>
                    </div>
                  ))}
                </div>

              <div style={{fontWeight:700,marginBottom:10,color:text}}>📋 יומן פעילות ({auditLog.length})</div>
              {auditLog.length===0?<EmptyState icon="📝" title="אין פעילות" subtitle="פעולות רגישות יתועדו כאן"/>:(
                <div style={{display:"flex",flexDirection:"column",gap:4}}>

                        <span style={{color:muted,fontSize:11}}>{e.timestamp?new Date(e.timestamp).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}</span>

        </div>

      {/* Edit User Modal */}
      {editUser&&(
        <div onClick={e=>{e.stopPropagation();setEditUser(null)}} style={{position:"fixed",inset:0,background:"#000000cc",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10,marginBottom:12}}>
              {[["שם מלא","name","text"],["שם משתמש","username","text"],["תעריף עלות ₪/שעה","hourlyRate","number"],["תעריף מכירה ₪/שעה","saleRate","number"]].map(([l,k,t])=>(
                <div key={k}><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>{l}</label><input style={inp} type={t} name={"eu_"+k} autoComplete="off" value={editUser[k]||""} onChange={e=>setEditUser(p=>({...p,[k]:t==="number"?Number(e.target.value):e.target.value}))}/></div>
              ))}
              <div><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>סיסמה (ריק = ללא שינוי)</label>
                <div style={{position:"relative"}}>
                  <input style={inp} type={editShowPw?"text":"password"} name="eu_password" autoComplete="new-password" value={editUser.password||""} placeholder={editShowPw?(editUser.passwordPlain||"לא זמין"):"••••••"} onChange={e=>setEditUser(p=>({...p,password:e.target.value}))}/>
                  <button onClick={()=>setEditShowPw(s=>!s)} title={editShowPw?"הסתר":"הצג"} style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",fontSize:15,cursor:"pointer",lineHeight:1}}>{editShowPw?"🙈":"👁️"}</button>
                </div>
                {editShowPw&&<div style={{fontSize:10,color:editUser.passwordPlain?"#f59e0b":"#ef4444",marginTop:3}}>{editUser.passwordPlain?`נוכחית: ${editUser.passwordPlain}`:"הסיסמה הנוכחית לא נשמרה כטקסט — הקלד סיסמה חדשה"}</div>}
              </div>
              <div><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>תפקיד</label>
                <select style={inp} value={editUser.role} onChange={e=>setEditUser(p=>({...p,role:e.target.value,canEdit:["admin","editor","dept_manager"].includes(e.target.value)}))}>

              <div><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>מחלקה</label>

              </div>
              <div><label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>מנהל ישיר (ראש צוות)</label>

                  <option value="">— ללא —</option>
                  {leadsForDept(users,departments,editUser.departmentId).filter(u=>u.id!==editUser.id).map(u=><option key={u.id} value={u.id}>{ROLES[u.role]?.icon} {u.name}</option>)}
                </select>
                {editUser.departmentId&&leadsForDept(users,departments,editUser.departmentId).filter(u=>u.id!==editUser.id).length===0&&<div style={{fontSize:10,color:"#f59e0b",marginTop:3}}>אין מנהלים/ראשי צוות במחלקה זו</div>}
              </div>
            </div>
            {/* Project Access */}

                  <input type="checkbox" style={{width:"auto"}} checked={(editUser.projectAccess||"all")==="all"} onChange={e=>setEditUser(p=>({...p,projectAccess:e.target.checked?"all":[]}))}/>

                </label>
                {(editUser.projectAccess||"all")!=="all"&&projects.map(proj=>{const pa=editUser.projectAccess;const sel=Array.isArray(pa)&&pa.includes(proj.id);return(

                    <input type="checkbox" style={{width:"auto"}} checked={sel} onChange={e=>{const cur=Array.isArray(pa)?pa:[];setEditUser(p=>({...p,projectAccess:e.target.checked?[...cur,proj.id]:cur.filter(id=>id!==proj.id)}))}}/>
                    {proj.name}
                  </label>
                )})}
              </div>
            </div>
            {/* Stage Access */}
            <div style={{marginBottom:12}}>
              <label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>גישה לשלבים</label>
              <div style={{border:`1px solid ${lm?"#c8cdd6":"#283650"}`,borderRadius:6,background:lm?"#f7f8fa":"#0a0e1a",padding:8}}>
                <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:text,marginBottom:6}}>
                  <input type="checkbox" style={{width:"auto"}} checked={(editUser.stageAccess||"all")==="all"} onChange={e=>setEditUser(p=>({...p,stageAccess:e.target.checked?"all":[]}))}/>
                  <b>כל השלבים</b>
                </label>
                {(editUser.stageAccess||"all")!=="all"&&stages.map(st=>{const sa=editUser.stageAccess;const sel=Array.isArray(sa)&&sa.includes(st.id);return(
                  <label key={st.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer",color:st.color,padding:"2px 0"}}>
                    <input type="checkbox" style={{width:"auto"}} checked={sel} onChange={e=>{const cur=Array.isArray(sa)?sa:[];setEditUser(p=>({...p,stageAccess:e.target.checked?[...cur,st.id]:cur.filter(id=>id!==st.id)}))}}/>
                    {st.name}
                  </label>
                )})}
              </div>
            </div>
            {/* Branch (division) access — see userBranchScope */}
            <div style={{marginBottom:12}}>
              <label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>גישה לסניפים (חטיבות)</label>
              <BranchAccessBox user={editUser} departments={departments} orders={orders} options={branchOpts}
                onChange={patch=>setEditUser(p=>({...p,...patch}))} inp={inp} border={border} muted={muted} text={text} lm={lm}/>
            </div>
            <div style={{display:"flex",gap:8}}><Btn color="#10b981" onClick={saveUser}>✅ שמור</Btn><Btn onClick={()=>setEditUser(null)}>ביטול</Btn></div>
          </div>
        </div>
      )}

      {/* Edit Department Modal */}
      {editDept&&(
        <div onClick={e=>{e.stopPropagation();setEditDept(null)}} style={{position:"fixed",inset:0,background:"#000000cc",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div onClick={e=>e.stopPropagation()} style={{background:card,borderRadius:16,padding:28,maxWidth:420,width:"100%",border:`1px solid ${border}`}}>
            <div style={{fontWeight:700,fontSize:17,color:"var(--c-accent)",marginBottom:18}}>✏️ עריכת מחלקה</div>
            <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:16}}>
              <div>
                <label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>שם המחלקה</label>
                <input style={inp} value={editDept.name} onChange={e=>setEditDept(p=>({...p,name:e.target.value}))} placeholder="שם המחלקה"/>
              </div>
              <div>
                <label style={{fontSize:11,color:muted,display:"block",marginBottom:5}}>מספרי סניף (חטיבות)</label>
                <BranchPicker value={editDept.branches||[]} onChange={v=>setEditDept(p=>({...p,branches:v}))} options={branchOpts} inp={inp} border={border} muted={muted}/>
                <div style={{fontSize:10.5,color:muted,marginTop:5}}>
                  {sortBranches(editDept.branches||[]).length
                    ?`${(orders||[]).filter(o=>sortBranches(editDept.branches||[]).includes(branchCode(o.branch))).length} פק"ע משויכות למספרים האלה`
                    :'לא שויך מספר סניף — הפק"ע של המחלקה לא יזוהו לפי חטיבה'}
                </div>
              </div>
              <div>
                <label style={{fontSize:11,color:muted,display:"block",marginBottom:3}}>צבע</label>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <input type="color" value={editDept.color} onChange={e=>setEditDept(p=>({...p,color:e.target.value}))} style={{width:44,height:40,padding:2,border:`1px solid ${border}`,borderRadius:6,background:"transparent",cursor:"pointer"}}/>
                  <span style={{fontSize:12,color:muted}}>{editDept.color}</span>
                  <span style={{fontSize:13,fontWeight:700,color:editDept.color,padding:"3px 12px",borderRadius:8,background:editDept.color+"22",border:`1px solid ${editDept.color}44`}}>{editDept.name||"תצוגה מקדימה"}</span>
                </div>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn color="#10b981" onClick={saveDept}>✅ שמור</Btn>
              <Btn onClick={()=>setEditDept(null)}>ביטול</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// ═══ STANDARD TIMES (זמן תקן · זמן בפועל · זמן מכירה) ══════════════════
// ══════════════════════════════════════════════════════════════════════════
// Three bars per row — the standard defined up-front for the מק"ט, the time the
// floor actually takes, and the time the price list sells — so both the gap
// against the standard and the gap against the price are visible at a glance.
function TimeBars({rows,onRowClick}){
  if(!rows||!rows.length)return<EmptyState icon="📊" title="אין דגימות" subtitle="הזמן בפועל מחושב מרישומי עבודה שהסתיימו"/>;
  const max=Math.max(...rows.flatMap(r=>[r.std||0,r.act||0,r.sale||0]),1);
  const bar=(cat,val,k)=>(
    <div key={k} style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
      <span style={{fontSize:10,color:"var(--c-dim)",width:38,flexShrink:0}}>{cat.short}</span>
      <div style={{flex:1,height:9,background:"var(--c-border)",borderRadius:5,overflow:"hidden"}}>
        {val>0&&<div style={{width:`${Math.max(1.5,(val/max)*100)}%`,height:"100%",borderRadius:5,background:`linear-gradient(270deg,${cat.color},${cat.color}88)`,transition:"width .5s ease"}}/>}
      </div>
      <span style={{fontSize:11,fontWeight:700,color:val>0?cat.text:"var(--c-dim)",width:62,textAlign:"left",flexShrink:0}}>{val>0?fmtMinP(val):"לא הוגדר"}</span>
    </div>
  );
  return(
    <div style={{display:"flex",flexDirection:"column",gap:13}}>
      {rows.map((r,i)=>{
        const sGap=r.stdGap!==undefined?r.stdGap:(r.std>0?r.act-r.std:null);
        const pGap=r.saleGap!==undefined?r.saleGap:(r.sale>0?r.act-r.sale:null);
        return(
          <div key={i} onClick={()=>onRowClick&&onRowClick(r)} style={{cursor:onRowClick?"pointer":"default"}}>

                {sGap!=null&&<span title="פער הזמן בפועל מול זמן התקן שהוגדר" style={{fontSize:11,fontWeight:700,color:gapColor(sGap),whiteSpace:"nowrap"}}>מול תקן {fmtSigned(sGap)}</span>}
                {pGap!=null&&<span title="פער הזמן בפועל מול זמן המכירה שבמחירון" style={{fontSize:10.5,fontWeight:700,color:"var(--c-dim)",whiteSpace:"nowrap"}}>מול מכירה {fmtSigned(pGap)}</span>}
              </span>
            </div>
            {bar(TIME_CAT.std,r.std,"s")}
            {bar(TIME_CAT.act,r.act,"a")}
            {bar(TIME_CAT.sale,r.sale,"p")}
          </div>
        );
      })}
      <div style={{display:"flex",gap:14,justifyContent:"flex-end",flexWrap:"wrap",fontSize:10.5,color:"var(--c-dim)",paddingTop:4,borderTop:"1px solid var(--c-table-border)"}}>
        <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:14,height:4,borderRadius:2,background:TIME_CAT.std.color}}/>זמן תקן (מוגדר מראש)</span>

        <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:14,height:4,borderRadius:2,background:TIME_CAT.sale.color}}/>זמן מכירה (מחירון)</span>
      </div>
    </div>
  );
}
// Spread of the individual samples: the full min–max range, the ±1σ band inside
// it, and the mean. A wide band means the same job takes very different times
// depending on who runs it. The green tick is the standard, the purple the price.
function SpreadBar({lo,hi,mean,sd,scaleMin,scaleMax,sale,std}){
  const span=Math.max(scaleMax-scaleMin,0.001);
  const pos=v=>Math.min(100,Math.max(0,((v-scaleMin)/span)*100));
  const s1=Math.max(scaleMin,mean-sd),s2=Math.min(scaleMax,mean+sd);
  return(
    <div style={{position:"relative",height:16,margin:"3px 0"}}>
      <div style={{position:"absolute",top:7,right:`${pos(lo)}%`,width:`${Math.max(0.6,pos(hi)-pos(lo))}%`,height:2,background:"var(--c-border2)",borderRadius:1}}/>
      {sd>0&&<div style={{position:"absolute",top:3,right:`${pos(s1)}%`,width:`${Math.max(0.6,pos(s2)-pos(s1))}%`,height:10,background:"#3b82f633",border:"1px solid #3b82f666",borderRadius:3}}/>}
      <div style={{position:"absolute",top:1,right:`calc(${pos(mean)}% - 1.5px)`,width:3,height:14,background:TIME_CAT.act.text,borderRadius:2}}/>
      {std>0&&<div title="זמן תקן" style={{position:"absolute",top:0,right:`calc(${pos(std)}% - 1px)`,width:2,height:16,background:TIME_CAT.std.color,borderRadius:1}}/>}
      {sale>0&&<div title="זמן מכירה" style={{position:"absolute",top:0,right:`calc(${pos(sale)}% - 1px)`,width:2,height:16,background:TIME_CAT.sale.color,borderRadius:1}}/>}
    </div>
  );
}

// The standard is entered by stage, so it can be compared against the measured
// time stage by stage. The measured average and the price-list minutes are shown
// next to every field, and can be copied into it with one click.
function StdDefRow({row,canEdit,onSave,onDelete}){
  const [edit,setEdit]=useState(false);
  const [vals,setVals]=useState({});
  const [note,setNote]=useState("");
  const ids=row.stageIds;
  const open=()=>{
    const v={};ids.forEach(id=>{v[id]=row.std[id]>0?String(row.std[id]):""});
    if(!ids.length)v.__total=row.total>0?String(row.total):"";
    setVals(v);setNote(row.note||"");setEdit(true);
  };
  const editTotal=ids.length?ids.reduce((s,id)=>s+(Number(vals[id])||0),0):(Number(vals.__total)||0);
  const fill=src=>{
    const v={};
    ids.forEach(id=>{const m=src==="act"?(row.actual.get(id)?.mean||0):(row.sale.get(id)||0);v[id]=m>0?String(Math.round(m*10)/10):""});
    setVals(v);
  };
  // The gap is only fair over the stages that actually carry a standard
  const gap=row.stdIds.length&&row.actOnStd>0?row.actOnStd-row.stdOnStd:null;
  const inp={width:74,padding:"4px 7px",fontSize:12,textAlign:"center"};

                    <tr key={id}>
                      <td style={{textAlign:"right"}}><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:7,height:7,borderRadius:2,background:st?.color||"#64748b"}}/><span style={{fontWeight:600,fontSize:12}}>{st?.name||id}</span></span></td>

                          onClick={()=>a&&setVals(p=>({...p,[id]:String(Math.round(a.mean*10)/10)}))}>{a?fmtMinP(a.mean):"—"}</td>
                      <td style={{fontSize:11.5,color:"var(--c-dim)"}}>{a?a.n:0}</td>

          </div>
        </>):(
          <div style={{display:"flex",alignItems:"flex-end",gap:8,flexWrap:"wrap"}}>
            <div style={{fontSize:11.5,color:"var(--c-dim)",flex:1,minWidth:180}}>למק״ט זה אין שלבים מוגדרים — ניתן להזין זמן תקן כולל ליחידה</div>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <input type="number" min="0" step="0.5" value={vals.__total??""} placeholder="דק'" onChange={e=>setVals(p=>({...p,__total:e.target.value}))} style={inp}/>
              <span style={{fontSize:11,color:"var(--c-dim)"}}>דק' ליחידה</span>
            </div>
          </div>
        )}
        <div style={{marginTop:9}}>
          <Field label="הערה (למשל: מקור התקן, תאריך מדידה)" value={note} onChange={setNote} placeholder="אופציונלי"/>
        </div>
      </>)}
      {!edit&&row.stdPartial&&(
        <div style={{fontSize:10,color:"#f59e0b",marginTop:6}}>⚠ הוגדר תקן ל-{row.stdIds.length} מתוך {row.stageIds.length} שלבי המק״ט — הפער חושב רק עליהם</div>
      )}
      {!edit&&row.total>0&&(row.note||row.updatedBy||row.updatedAt)&&(
        <div style={{fontSize:10.5,color:"var(--c-dim)",marginTop:7,display:"flex",gap:10,flexWrap:"wrap"}}>
          {row.note&&<span>📝 {row.note}</span>}
          {row.updatedBy&&<span>עודכן ע"י {row.updatedBy}</span>}
          {row.updatedAt&&<span>{String(row.updatedAt).slice(0,10)}</span>}
        </div>
      )}
    </div>
  );
}

function StandardTimes({orders,stages,stageBlocks,workLogs,users,projects,pnStandards,onSavePnStd,onDeletePnStd}){
  const {canEdit}=useAuth();
  const [view,setView]=useState("pn");
  const [pnF,setPnF]=useState("");
  const [stF,setStF]=useState("");
  const [projF,setProjF]=useState("");
  const [period,setPeriod]=useState("all");
  const [openPn,setOpenPn]=useState(null);
  const [minN,setMinN]=useState(1);
  const [defSearch,setDefSearch]=useState("");
  const [defFilter,setDefFilter]=useState("all");

  const stdIdx=useMemo(()=>pnStdIndex(pnStandards),[pnStandards]);
  const all=useMemo(()=>timeSamples(workLogs,orders,stages,stageBlocks,stdIdx),[workLogs,orders,stages,stageBlocks,stdIdx]);
  const pnOptions=useMemo(()=>[...new Set(all.map(s=>s.pn))].sort((a,b)=>a.localeCompare(b,"he")),[all]);
  const samples=useMemo(()=>{
    const from=period==="all"?null:new Date(Date.now()-Number(period)*864e5).toISOString().slice(0,10);
    return all.filter(s=>(!pnF||s.pn===pnF)&&(!stF||s.stageId===stF)&&(!projF||s.projectId===projF)&&(!from||(s.date&&s.date>=from)));
  },[all,pnF,stF,projF,period]);

  // The full route of each מק"ט as the price list defines it: how many stages it
  // has and how many minutes they are sold for. Kept separate from what was
  // actually measured, so a partially-measured מק"ט never looks fully known.
  const routeInfo=useMemo(()=>{
    const m=new Map();
    (orders||[]).forEach(o=>{
      const pn=(o.pn||"").trim()||o.woNumber||"—";
      let e=m.get(pn);
      if(!e){e={stageIds:new Set(),saleSum:0,saleN:0};m.set(pn,e)}
      (o.stageIds||[]).forEach(sid=>e.stageIds.add(sid));
      const per=orderPerUnitMin(o,stages,stageBlocks);
      if(per>0){e.saleSum+=per;e.saleN++}
    });
    // Orders of the same מק"ט may sit on different blocks — average their routes.
    m.forEach(e=>{e.count=e.stageIds.size;e.sale=e.saleN?e.saleSum/e.saleN:0});
    return m;
  },[orders,stages,stageBlocks]);

  // Per מק"ט → per stage statistics, plus the totals across the whole route.
  const pnRows=useMemo(()=>{
    const byPn=new Map();
    samples.forEach(s=>{
      let g=byPn.get(s.pn);
      if(!g){g={pn:s.pn,stages:new Map(),workers:new Map()};byPn.set(s.pn,g)}
      let sg=g.stages.get(s.stageId);
      if(!sg){sg={stageId:s.stageId,name:s.stageName,color:s.stageColor,order:s.stageOrder,vals:[],sale:0,std:0};g.stages.set(s.stageId,sg)}
      sg.vals.push(s.min);
      if(s.sale>0)sg.sale=s.sale;
      if(s.std>0)sg.std=s.std;
      let wk=g.workers.get(s.userId);
      if(!wk){wk={userId:s.userId,userName:s.userName,items:[]};g.workers.set(s.userId,wk)}
      wk.items.push(s);
    });
    return[...byPn.values()].map(g=>{
      const sts=[...g.stages.values()].map(sg=>({...sg,...statsOf(sg.vals)})).sort((a,b)=>a.order-b.order);
      const act=sts.reduce((s,x)=>s+x.mean,0);           // total measured time for one unit
      const n=sts.reduce((s,x)=>s+x.n,0);
      // Stage variances are combined (independent stages) into a route-level σ.
      const sd=Math.sqrt(sts.reduce((s,x)=>s+x.sd*x.sd,0));
      // A gap is only fair on stages that were both measured *and* have a reference —
      // otherwise a stage with no price (or no standard) would look like free work.
      const priced=sts.filter(x=>x.sale>0);
      const cmpAct=priced.reduce((s,x)=>s+x.mean,0),cmpSale=priced.reduce((s,x)=>s+x.sale,0);
      const withStd=sts.filter(x=>x.std>0);
      const sAct=withStd.reduce((s,x)=>s+x.mean,0),sStd=withStd.reduce((s,x)=>s+x.std,0);
      const route=routeInfo.get(g.pn)||{count:sts.length,sale:0};
      const routeIds=route.stageIds?[...route.stageIds]:sts.map(x=>x.stageId);
      const stdRoute=stdTotalFor(stdIdx,g.pn,routeIds);
      const meanByStage=new Map(sts.map(x=>[x.stageId,x.mean]));
      const workers=[...g.workers.values()].map(w=>{
        // Index vs. the מק"ט's own measured average: 100% = exactly the group average.
        const exp=w.items.reduce((s,it)=>s+(meanByStage.get(it.stageId)||0),0);
        const actw=w.items.reduce((s,it)=>s+it.min,0);
        const std=w.items.filter(it=>it.std>0);
        const wStd=std.reduce((s,it)=>s+it.std,0),wAct=std.reduce((s,it)=>s+it.min,0);
        return{userId:w.userId,userName:w.userName,n:w.items.length,index:actw>0?exp/actw*100:0,
          adh:wAct>0?wStd/wAct*100:null};
      }).sort((a,b)=>b.index-a.index);
      const allVals=sts.flatMap(x=>x.vals).concat(priced.map(x=>x.sale)).concat(withStd.map(x=>x.std));
      return{
        pn:g.pn,stages:sts,workers,act,n,sd,
        sale:route.sale||cmpSale,                        // price-list time for the whole route
        stdRoute,                                        // pre-defined standard for the whole route
        cmpAct,cmpSale,
        gap:priced.length?cmpAct-cmpSale:null,
        eff:priced.length&&cmpAct>0?cmpSale/cmpAct*100:null,
        stdGap:withStd.length?sAct-sStd:null,
        adh:withStd.length&&sAct>0?sStd/sAct*100:null,
        stdCount:withStd.length,
        stdPartial:withStd.length>0&&withStd.length<sts.length,
        partial:priced.length>0&&priced.length<sts.length,
        pricedCount:priced.length,
        cv:act>0?sd/act*100:0,
        minN:sts.length?Math.min(...sts.map(x=>x.n)):0,
        routeCount:Math.max(route.count||0,sts.length),
        scaleMin:0,scaleMax:Math.max(...allVals,1)
      };
    }).filter(r=>r.n>=minN).sort((a,b)=>{
      // Biggest overrun first — against the standard when there is one, otherwise the price
      const av=a.stdGap!=null?a.stdGap:(a.gap!=null?a.gap:-Infinity);
      const bv=b.stdGap!=null?b.stdGap:(b.gap!=null?b.gap:-Infinity);
      return bv-av;
    });
  },[samples,routeInfo,minN,stdIdx]);

  // Same statistics rolled up per stage across every מק"ט in the filter.
  const stageRows=useMemo(()=>{
    const by=new Map();
    samples.forEach(s=>{
      let g=by.get(s.stageId);
      if(!g){g={stageId:s.stageId,name:s.stageName,color:s.stageColor,order:s.stageOrder,vals:[],sales:[],stds:[],pns:new Set()};by.set(s.stageId,g)}
      g.vals.push(s.min);g.pns.add(s.pn);
      if(s.sale>0)g.sales.push(s.sale);
      if(s.std>0)g.stds.push(s.std);
    });
    return[...by.values()].map(g=>{
      const k=statsOf(g.vals);
      const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
      const sale=avg(g.sales),std=avg(g.stds);
      return{...g,...k,sale,std,
        gap:sale>0?k.mean-sale:null,eff:sale>0&&k.mean>0?sale/k.mean*100:null,
        stdGap:std>0?k.mean-std:null,adh:std>0&&k.mean>0?std/k.mean*100:null,
        stdN:g.stds.length,pnCount:g.pns.size};
    }).sort((a,b)=>a.order-b.order);
  },[samples]);

  // Worker performance. Three independent yardsticks so a worker is never judged
  // by one number alone:
  //   עמידה בתקן — the pre-defined standard ÷ actual time (needs a standard)
  //   ניצול      — allocated (sale) time ÷ actual time (needs a price list)
  //   מדד        — the same worker against the *measured* average of the exact
  //                מק"ט+שלב combinations they worked on (always available, and fair,
  //                because it compares each worker only to the identical jobs)
  const workerRows=useMemo(()=>{
    const key=s=>s.pn+"|"+s.stageId;
    const groupMean=new Map();
    const acc=new Map();
    samples.forEach(s=>{const k=key(s);const a=acc.get(k)||{sum:0,n:0};a.sum+=s.min;a.n++;acc.set(k,a)});
    acc.forEach((a,k)=>groupMean.set(k,a.sum/a.n));
    const by=new Map();
    samples.forEach(s=>{
      let g=by.get(s.userId);
      if(!g){g={userId:s.userId,userName:s.userName,vals:[],act:0,sale:0,saleN:0,std:0,stdN:0,stdCount:0,exp:0,expAct:0,stages:new Set(),pns:new Set(),ratios:[]};by.set(s.userId,g)}
      g.vals.push(s.min);g.act+=s.min;g.stages.add(s.stageId);g.pns.add(s.pn);
      if(s.sale>0){g.sale+=s.sale;g.saleN+=s.min}
      if(s.std>0){g.std+=s.std;g.stdN+=s.min;g.stdCount++}
      const gm=groupMean.get(key(s));
      if(gm>0){g.exp+=gm;g.expAct+=s.min;g.ratios.push(gm/s.min*100)}
    });
    const u=new Map((users||[]).map(x=>[x.id,x]));
    return[...by.values()].map(g=>{
      const st=statsOf(g.ratios);
      return{
        userId:g.userId,userName:g.userName,n:g.vals.length,
        avgMin:g.act/g.vals.length,totalMin:g.act,
        eff:g.saleN>0?g.sale/g.saleN*100:null,
        adh:g.stdN>0?g.std/g.stdN*100:null,
        stdGap:g.stdCount>0?g.stdN-g.std:null,
        stdSamples:g.stdCount,
        index:g.expAct>0?g.exp/g.expAct*100:0,
        consistency:st.cv,                    // spread of the worker's own results
        stageCount:g.stages.size,pnCount:g.pns.size,
        role:u.get(g.userId)?.role||"",active:u.get(g.userId)?.active!==false
      };
    }).sort((a,b)=>b.index-a.index);
  },[samples,users]);

  // Headline numbers: plain averages over the מק"טים in view. Each comparison is
  // averaged only over the מק"טים that actually carry the matching reference.
  const tot=useMemo(()=>{
    const withPrice=pnRows.filter(r=>r.gap!=null);
    const cmpAct=withPrice.reduce((s,r)=>s+r.cmpAct,0),cmpSale=withPrice.reduce((s,r)=>s+r.cmpSale,0);
    const priced=pnRows.filter(r=>r.sale>0);
    const withStd=pnRows.filter(r=>r.stdGap!=null);
    const sGapSum=withStd.reduce((s,r)=>s+r.stdGap,0);
    const stdDefined=pnRows.filter(r=>r.stdRoute>0);
    const sAct=withStd.reduce((s,r)=>s+r.cmpAct,0);
    return{
      n:samples.length,pnCount:pnRows.length,
      act:pnRows.length?pnRows.reduce((s,r)=>s+r.act,0)/pnRows.length:0,
      std:stdDefined.length?stdDefined.reduce((s,r)=>s+r.stdRoute,0)/stdDefined.length:0,
      sale:priced.length?priced.reduce((s,r)=>s+r.sale,0)/priced.length:0,
      gap:withPrice.length?(cmpAct-cmpSale)/withPrice.length:null,
      eff:cmpAct>0?cmpSale/cmpAct*100:null,
      stdGap:withStd.length?sGapSum/withStd.length:null,
      adh:withStd.length?(()=>{const a=withStd.reduce((s,r)=>s+(r.adh!=null?r.adh:0),0);return a/withStd.length})():null,
      stdCount:stdDefined.length,noStd:pnRows.length-stdDefined.length,
      noSale:pnRows.length-priced.length
    };
  },[pnRows,samples]);

  // Every מק"ט the company knows about — from the orders, from the measurements
  // and from the standards themselves — with its route, its measured averages and
  // its price-list minutes, ready for the editor.
  const defRows=useMemo(()=>{
    const sMap=new Map((stages||[]).map(s=>[s.id,s]));
    const ordOf=id=>Number(sMap.get(id)?.order||99);
    const byPn=new Map();
    const touch=pn=>{let e=byPn.get(pn);if(!e){e={pn,desc:"",ids:new Set(),actual:new Map(),sale:new Map(),sampleN:0};byPn.set(pn,e)}return e};
    (orders||[]).forEach(o=>{
      const pn=(o.pn||"").trim()||o.woNumber||"—";
      const e=touch(pn);
      if(!e.desc&&o.description)e.desc=o.description;
      (o.stageIds||[]).forEach(sid=>{
        e.ids.add(sid);
        const m=stageMinutesFor(o,sMap.get(sid),stageBlocks);
        if(m>0&&!(e.sale.get(sid)>0))e.sale.set(sid,m);
      });
    });
    const acc=new Map();
    all.forEach(s=>{
      const e=touch(s.pn);e.ids.add(s.stageId);e.sampleN++;
      let am=acc.get(s.pn);if(!am){am=new Map();acc.set(s.pn,am)}
      const a=am.get(s.stageId)||{sum:0,n:0};a.sum+=s.min;a.n++;am.set(s.stageId,a);
      if(s.sale>0&&!(e.sale.get(s.stageId)>0))e.sale.set(s.stageId,s.sale);
    });
    acc.forEach((am,pn)=>{const e=byPn.get(pn);if(e)am.forEach((a,sid)=>e.actual.set(sid,{mean:a.sum/a.n,n:a.n}))});
    (pnStandards||[]).forEach(r=>{
      const k=pnKey(r.pn);if(!k)return;
      const e=touch(k);
      Object.entries(r.stageMin||{}).forEach(([sid,v])=>{if(Number(v)>0)e.ids.add(sid)});
    });
    return[...byPn.values()].map(e=>{
      const rec=stdIdx.get(e.pn);
      const ids=[...e.ids].sort((a,b)=>ordOf(a)-ordOf(b));
      const stdIds=ids.filter(id=>stdStageMin(rec,id)>0);
      return{
        pn:e.pn,desc:e.desc,stageIds:ids,stageMap:sMap,actual:e.actual,sale:e.sale,sampleN:e.sampleN,
        std:rec?.stageMin||{},note:rec?.note||"",updatedBy:rec?.updatedBy||"",updatedAt:rec?.updatedAt||"",
        total:stdTotalMin(rec,ids),
        stdIds,stdPartial:stdIds.length>0&&stdIds.length<ids.length,
        stdOnStd:stdIds.reduce((s,id)=>s+stdStageMin(rec,id),0),
        actOnStd:stdIds.reduce((s,id)=>s+(e.actual.get(id)?.mean||0),0),
        actTotal:ids.reduce((s,id)=>s+(e.actual.get(id)?.mean||0),0),
        saleTotal:ids.reduce((s,id)=>s+(e.sale.get(id)||0),0)
      };
    }).sort((a,b)=>a.pn.localeCompare(b.pn,"he"));
  },[orders,stages,stageBlocks,all,pnStandards,stdIdx]);

  const defShown=useMemo(()=>{
    const q=defSearch.trim().toLowerCase();
    return defRows.filter(r=>
      (!q||r.pn.toLowerCase().includes(q)||(r.desc||"").toLowerCase().includes(q))&&
      (defFilter==="all"||(defFilter==="with"?r.total>0:r.total<=0))
    );
  },[defRows,defSearch,defFilter]);
  const defStats=useMemo(()=>({total:defRows.length,with:defRows.filter(r=>r.total>0).length}),[defRows]);

  const sel={padding:"6px 9px",fontSize:12,width:"auto",minWidth:96};

  if(!all.length&&!defRows.length)return(
    <div className="fade-in">
      <h2 style={{margin:"0 0 14px",fontSize:18}}>⏱️ זמן תקן מול זמן בפועל</h2>
      <Card><EmptyState icon="⏱️" title="אין עדיין נתוני זמן" subtitle='הזמן בפועל נבנה מרישומי עבודה שהסתיימו, וזמן התקן מוגדר לכל מק״ט. ברגע שייווצרו פק"עות ויתחילו דיווחים, הנתונים יופיעו כאן.'/></Card>
    </div>
  );

  return(
    <div className="fade-in">
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
        <h2 style={{margin:0,fontSize:18}}>⏱️ זמן תקן מול זמן בפועל</h2>
        <ChartInfo title="זמן תקן, זמן בפועל וזמן מכירה"
          shows="השוואה בין שלושה זמנים לכל מק״ט, לכל שלב ולכל עובד: זמן התקן שהוגדר מראש, הזמן בפועל שנמדד מדיווחי העובדים, וזמן המכירה שהוקצה במחירון."
          data={["זמן תקן — הזמן שהוגדר מראש למק״ט, שלב אחר שלב. ניתן לעריכה בלשונית ״הגדרת זמני תקן״.","זמן בפועל — ממוצע הזמן ליחידה אחת, מחושב מכל רישומי העבודה שהסתיימו.","מספר הדגימות שעליהן מבוסס כל זמן בפועל — ככל שיש יותר דגימות, הוא אמין יותר.","זמן מכירה — הדקות שהוקצו לשלב בבלוק/מחירון.","הפערים בין שלושת הזמנים, סטיית התקן והשונות בין העובדים."]}
          how={["כל רישום עבודה שהסתיים הופך לדגימה אחת ליחידה. ברישום קבוצתי (Bulk) הזמן מחולק במספר היחידות בקבוצה.","הדגימות מקובצות לפי מק״ט ושלב; מחושבים ממוצע, חציון, סטיית תקן ומקדם שונות — אלה הזמן בפועל.","זמן התקן נלקח כמות שהוא מההגדרה של המק״ט, לפי שלב.","פער מול תקן = זמן בפועל פחות זמן תקן, ומחושב רק על שלבים שיש להם תקן מוגדר.","עמידה בתקן = זמן תקן חלקי זמן בפועל: 100% = בדיוק בתקן."]}
          tip="פער חיובי מול התקן = השלב לוקח יותר ממה שתוכנן. פער חיובי מול המכירה = שם נשחק הרווח. אם הזמן בפועל יציב אך רחוק מהתקן — כנראה שהתקן עצמו צריך עדכון."/>
      </div>
      <div style={{fontSize:12,color:"var(--c-dim)",marginBottom:12}}>זמן התקן מוגדר מראש לכל מק״ט · הזמן בפועל נבנה מדיווחי העובדים · זמן המכירה מגיע מהמחירון</div>

      {/* Filters */}
      {view!=="def"&&(
        <Card style={{marginBottom:12,padding:"10px 12px"}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:11.5,color:"var(--c-dim)",fontWeight:600}}>סינון:</span>
            <select value={pnF} onChange={e=>{setPnF(e.target.value);setOpenPn(null)}} style={sel}>
              <option value="">כל המק״טים</option>
              {pnOptions.map(p=><option key={p} value={p}>{p}</option>)}
            </select>
            <select value={stF} onChange={e=>setStF(e.target.value)} style={sel}>
              <option value="">כל השלבים</option>
              {[...stages].sort((a,b)=>a.order-b.order).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            {(projects||[]).length>0&&(
              <select value={projF} onChange={e=>setProjF(e.target.value)} style={sel}>
                <option value="">כל הפרויקטים</option>
                {projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            )}
            <select value={period} onChange={e=>setPeriod(e.target.value)} style={sel}>
              <option value="all">כל הזמן</option>
              <option value="30">30 יום אחרונים</option>
              <option value="90">90 יום אחרונים</option>
              <option value="180">180 יום אחרונים</option>
              <option value="365">שנה אחרונה</option>
            </select>
            <select value={minN} onChange={e=>setMinN(Number(e.target.value))} style={sel}>
              <option value={1}>כל הדגימות</option>

                        <td><span style={{fontWeight:700,fontSize:12.5,color:effColor(w.index)}}>{w.index.toFixed(0)}%</span></td>
                        <td style={{fontSize:12,fontWeight:700,color:w.eff==null?"var(--c-dim)":effColor(w.eff)}}>{w.eff==null?"—":w.eff.toFixed(0)+"%"}</td>
                        <td><span style={{fontSize:11,color:ci.color,fontWeight:700}}>{w.consistency.toFixed(0)}%</span><div style={{fontSize:9.5,color:"var(--c-dim)"}}>{ci.label}</div></td>
                        <td>{rateable?<span style={{fontSize:10.5,background:effColor(w.adh!=null?w.adh:w.index)+"22",color:effColor(w.adh!=null?w.adh:w.index),padding:"2px 8px",borderRadius:10,fontWeight:700,whiteSpace:"nowrap"}}>{effLabel(w.adh!=null?w.adh:w.index)}</span>:<span style={{fontSize:10.5,color:"var(--c-dim)"}}>—</span>}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Card>
        </>);
      })()}

      {view==="def"&&(<>
        <Card style={{marginBottom:12,padding:"10px 12px"}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:11.5,color:"var(--c-dim)",fontWeight:600}}>חיפוש:</span>
            <input value={defSearch} onChange={e=>setDefSearch(e.target.value)} placeholder='מק״ט או תיאור' style={{padding:"6px 9px",fontSize:12,width:"auto",minWidth:170}}/>
            <select value={defFilter} onChange={e=>setDefFilter(e.target.value)} style={sel}>
              <option value="all">כל המק״טים ({defStats.total})</option>
              <option value="with">עם זמן תקן ({defStats.with})</option>
              <option value="without">ללא זמן תקן ({defStats.total-defStats.with})</option>
            </select>
            {(defSearch||defFilter!=="all")&&<Btn small onClick={()=>{setDefSearch("");setDefFilter("all")}}>נקה</Btn>}
            <span style={{marginRight:"auto",fontSize:11.5,color:"var(--c-dim)"}}>הוגדר תקן ל-{defStats.with} מתוך {defStats.total} מק״טים</span>
          </div>
        </Card>

        <Card>
          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4}}>
            <div style={{fontWeight:700,fontSize:14}}>⚙️ הגדרת זמן תקן לכל מק״ט</div>
            <ChartInfo title="הגדרת זמן תקן"
              shows="רשימת כל המק״טים במערכת, עם זמן התקן שהוגדר לכל אחד — שלב אחר שלב — לצד הזמן בפועל שנמדד וזמן המכירה שבמחירון."
              data="זמן התקן נשמר לכל מק״ט בנפרד ומשמש כבסיס להשוואה בכל הגרפים והטבלאות בלשונית זו."
              how={["לחיצה על ״הגדר תקן״ פותחת שדה לכל שלב במסלול המק״ט.","ניתן למלא ידנית, או להעתיק בלחיצה מהזמן בפועל / מהמחירון.","סכום השלבים הוא זמן התקן ליחידה שלמה."]}
              tip="דרך מקובלת לקבוע תקן ראשוני: להתחיל מהזמן בפועל של עובד מיומן, ואז להדק אותו בהדרגה. תקן שאיש אינו עומד בו רק מייצר רעש."/>
          </div>
          <div style={{fontSize:11.5,color:"var(--c-dim)",marginBottom:12}}>
            {canEdit?"זמן התקן נשמר לכל מק״ט ומתעדכן מיד בכל הגרפים והטבלאות":"לצפייה בלבד — נדרשת הרשאת עריכה כדי לשנות זמני תקן"}
          </div>
          {defShown.length===0?<EmptyState icon="🔍" title="אין מק״טים תואמים" subtitle="נסה לשנות את החיפוש או הסינון"/>:(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {defShown.map(r=><StdDefRow key={r.pn} row={r} canEdit={canEdit} onSave={onSavePnStd} onDelete={onDeletePnStd}/>)}
            </div>
          )}
        </Card>
      </>)}
    </div>
  );
}
